 "t": "巨阳病衰，"}, {"f": "audio/72/school-sch-nj-74__3.mp3", "t": "头痛少愈。"}, {"f": "audio/72/school-sch-nj-74__4.mp3", "t": "八日，"}, {"f": "audio/72/school-sch-nj-74__5.mp3", "t": "阳明病衰，"}, {"f": "audio/72/school-sch-nj-74__6.mp3", "t": "身热少愈。"}, {"f": "audio/72/school-sch-nj-74__7.mp3", "t": "九日，"}, {"f": "audio/72/school-sch-nj-74__8.mp3", "t": "少阳病衰，"}, {"f": "audio/72/school-sch-nj-74__9.mp3", "t": "耳聋微闻。"}, {"f": "audio/72/school-sch-nj-74__10.mp3", "t": "十日，"}, {"f": "audio/72/school-sch-nj-74__11.mp3", "t": "太阴病衰，"}, {"f": "audio/72/school-sch-nj-74__12.mp3", "t": "腹减如故，"}, {"f": "audio/72/school-sch-nj-74__13.mp3", "t": "则思饮食。"}, {"f": "audio/72/school-sch-nj-74__14.mp3", "t": "十一日，"}, {"f": "audio/72/school-sch-nj-74__15.mp3", "t": "少阴病衰，"}, {"f": "audio/72/school-sch-nj-74__16.mp3", "t": "渴止，"}, {"f": "audio/72/school-sch-nj-74__17.mp3", "t": "满，"}, {"f": "audio/72/school-sch-nj-74__18.mp3", "t": "舌干已而嚏。"}, {"f": "audio/72/school-sch-nj-74__19.mp3", "t": "十二日，"}, {"f": "audio/72/school-sch-nj-74__20.mp3", "t": "厥阴病衰，"}, {"f": "audio/72/school-sch-nj-74__21.mp3", "t": "囊纵，"}, {"f": "audio/72/school-sch-nj-74__22.mp3", "t": "少腹微下，"}, {"f": "audio/72/school-sch-nj-74__23.mp3", "t": "大气皆去，"}, {"f": "audio/72/school-sch-nj-74__24.mp3", "t": "病日已矣。"}], "school-sch-nj-75": [{"f": "audio/e5/school-sch-nj-75__0.mp3", "t": "帝曰："}, {"f": "audio/e5/school-sch-nj-75__1.mp3", "t": "治之奈何？"}, {"f": "audio/e5/school-sch-nj-75__2.mp3", "t": "岐伯曰："}, {"f": "audio/e5/school-sch-nj-75__3.mp3", "t": "治之各通其藏脉，"}, {"f": "audio/e5/school-sch-nj-75__4.mp3", "t": "病日衰已矣。"}, {"f": "audio/e5/school-sch-nj-75__5.mp3", "t": "其未满三日者，"}, {"f": "audio/e5/school-sch-nj-75__6.mp3", "t": "可汗而已；"}, {"f": "audio/e5/school-sch-nj-75__7.mp3", "t": "其满三日者，"}, {"f": "audio/e5/school-sch-nj-75__8.mp3", "t": "可泄而已。"}], "school-sch-nj-76": [{"f": "audio/cf/school-sch-nj-76__0.mp3", "t": "帝曰："}, {"f": "audio/cf/school-sch-nj-76__1.mp3", "t": "热病已愈，"}, {"f": "audio/cf/school-sch-nj-76__2.mp3", "t": "时有所遗者，"}, {"f": "audio/cf/school-sch-nj-76__3.mp3", "t": "何也？"}, {"f": "audio/cf/school-sch-nj-76__4.mp3", "t": "岐伯曰："}, {"f": "audio/cf/school-sch-nj-76__5.mp3", "t": "诸遗者，"}, {"f": "audio/cf/school-sch-nj-76__6.mp3", "t": "热甚而强食之，"}, {"f": "audio/cf/school-sch-nj-76__7.mp3", "t": "故有所遗也。"}, {"f": "audio/cf/school-sch-nj-76__8.mp3", "t": "若此者，"}, {"f": "audio/cf/school-sch-nj-76__9.mp3", "t": "皆病已衰而热有所藏，"}, {"f": "audio/cf/school-sch-nj-76__10.mp3", "t": "因其谷气相薄，"}, {"f": "audio/cf/school-sch-nj-76__11.mp3", "t": "两热相合，"}, {"f": "audio/cf/school-sch-nj-76__12.mp3", "t": "故有所遗也。"}, {"f": "audio/cf/school-sch-nj-76__13.mp3", "t": "帝曰："}, {"f": "audio/cf/school-sch-nj-76__14.mp3", "t": "善。"}, {"f": "audio/cf/school-sch-nj-76__15.mp3", "t": "治遗奈何？"}, {"f": "audio/cf/school-sch-nj-76__16.mp3", "t": "岐伯曰："}, {"f": "audio/cf/school-sch-nj-76__17.mp3", "t": "视其虚实，"}, {"f": "audio/cf/school-sch-nj-76__18.mp3", "t": "调其逆从，"}, {"f": "audio/cf/school-sch-nj-76__19.mp3", "t": "可使必已矣。"}, {"f": "audio/cf/school-sch-nj-76__20.mp3", "t": "帝曰："}, {"f": "audio/cf/school-sch-nj-76__21.mp3", "t": "病热当何禁之？"}, {"f": "audio/cf/school-sch-nj-76__22.mp3", "t": "岐伯曰："}, {"f": "audio/cf/school-sch-nj-76__23.mp3", "t": "病热少愈，"}, {"f": "audio/cf/school-sch-nj-76__24.mp3", "t": "食肉则复，"}, {"f": "audio/cf/school-sch-nj-76__25.mp3", "t": "多食则遗，"}, {"f": "audio/cf/school-sch-nj-76__26.mp3", "t": "此其禁也。"}], "school-sch-nj-77": [{"f": "audio/23/school-sch-nj-77__0.mp3", "t": "帝曰："}, {"f": "audio/23/school-sch-nj-77__1.mp3", "t": "其病两感于寒者，"}, {"f": "audio/23/school-sch-nj-77__2.mp3", "t": "其脉应与其病形何如？"}, {"f": "audio/23/school-sch-nj-77__3.mp3", "t": "岐伯曰："}, {"f": "audio/23/school-sch-nj-77__4.mp3", "t": "两感于寒者，"}, {"f": "audio/23/school-sch-nj-77__5.mp3", "t": "病一日，"}, {"f": "audio/23/school-sch-nj-77__6.mp3", "t": "则巨阳与少阴俱病，"}, {"f": "audio/23/school-sch-nj-77__7.mp3", "t": "则头痛口干而烦满。"}, {"f": "audio/23/school-sch-nj-77__8.mp3", "t": "二日，"}, {"f": "audio/23/school-sch-nj-77__9.mp3", "t": "则阳明与太阴俱病，"}, {"f": "audio/23/school-sch-nj-77__10.mp3", "t": "则腹满身热，"}, {"f": "audio/23/school-sch-nj-77__11.mp3", "t": "不欲食，"}, {"f": "audio/23/school-sch-nj-77__12.mp3", "t": "谵言；"}, {"f": "audio/23/school-sch-nj-77__13.mp3", "t": "三日，"}, {"f": "audio/23/school-sch-nj-77__14.mp3", "t": "则少阳与厥阴俱病，"}, {"f": "audio/23/school-sch-nj-77__15.mp3", "t": "则耳聋囊缩而厥、"}, {"f": "audio/23/school-sch-nj-77__16.mp3", "t": "水浆不入、"}, {"f": "audio/23/school-sch-nj-77__17.mp3", "t": "不知人，"}, {"f": "audio/23/school-sch-nj-77__18.mp3", "t": "六日死。"}, {"f": "audio/23/school-sch-nj-77__19.mp3", "t": "帝曰："}, {"f": "audio/23/school-sch-nj-77__20.mp3", "t": "五藏已伤，"}, {"f": "audio/23/school-sch-nj-77__21.mp3", "t": "六府不通，"}, {"f": "audio/23/school-sch-nj-77__22.mp3", "t": "荣卫不行，"}, {"f": "audio/23/school-sch-nj-77__23.mp3", "t": "如是之后，"}, {"f": "audio/23/school-sch-nj-77__24.mp3", "t": "三日乃死，"}, {"f": "audio/23/school-sch-nj-77__25.mp3", "t": "何也？"}, {"f": "audio/23/school-sch-nj-77__26.mp3", "t": "岐伯曰："}, {"f": "audio/23/school-sch-nj-77__27.mp3", "t": "阳明者，"}, {"f": "audio/23/school-sch-nj-77__28.mp3", "t": "十二经脉之长也，"}, {"f": "audio/23/school-sch-nj-77__29.mp3", "t": "其血气盛，"}, {"f": "audio/23/school-sch-nj-77__30.mp3", "t": "故不知人。"}, {"f": "audio/23/school-sch-nj-77__31.mp3", "t": "三日，"}, {"f": "audio/23/school-sch-nj-77__32.mp3", "t": "其气乃尽，"}, {"f": "audio/23/school-sch-nj-77__33.mp3", "t": "故死矣。"}], "school-sch-nj-78": [{"f": "audio/3e/school-sch-nj-78__0.mp3", "t": "凡病伤寒而成温者，"}, {"f": "audio/3e/school-sch-nj-78__1.mp3", "t": "先夏至日者为病温，"}, {"f": "audio/3e/school-sch-nj-78__2.mp3", "t": "后夏至日者为病暑，"}, {"f": "audio/3e/school-sch-nj-78__3.mp3", "t": "暑当与汗皆出，"}, {"f": "audio/3e/school-sch-nj-78__4.mp3", "t": "勿止。"}], "school-sch-nj-79": [{"f": "audio/26/school-sch-nj-79__0.mp3", "t": "黄帝问曰："}, {"f": "audio/26/school-sch-nj-79__1.mp3", "t": "有病温者，"}, {"f": "audio/26/school-sch-nj-79__2.mp3", "t": "汗出辄复热，"}, {"f": "audio/26/school-sch-nj-79__3.mp3", "t": "而脉躁疾不为汗衰，"}, {"f": "audio/26/school-sch-nj-79__4.mp3", "t": "狂言不能食，"}, {"f": "audio/26/school-sch-nj-79__5.mp3", "t": "病名为何？"}, {"f": "audio/26/school-sch-nj-79__6.mp3", "t": "岐伯对曰："}, {"f": "audio/26/school-sch-nj-79__7.mp3", "t": "病名阴阳交，"}, {"f": "audio/26/school-sch-nj-79__8.mp3", "t": "交者，"}, {"f": "audio/26/school-sch-nj-79__9.mp3", "t": "死也。"}, {"f": "audio/26/school-sch-nj-79__10.mp3", "t": "帝曰："}, {"f": "audio/26/school-sch-nj-79__11.mp3", "t": "愿闻其说。"}, {"f": "audio/26/school-sch-nj-79__12.mp3", "t": "岐伯曰："}, {"f": "audio/26/school-sch-nj-79__13.mp3", "t": "人所以汗出者，"}, {"f": "audio/26/school-sch-nj-79__14.mp3", "t": "皆生于谷，"}, {"f": "audio/26/school-sch-nj-79__15.mp3", "t": "谷生于精，"}, {"f": "audio/26/school-sch-nj-79__16.mp3", "t": "今邪气交争于骨肉而得汗者，"}, {"f": "audio/26/school-sch-nj-79__17.mp3", "t": "是邪却而精胜也。"}, {"f": "audio/26/school-sch-nj-79__18.mp3", "t": "精胜，"}, {"f": "audio/26/school-sch-nj-79__19.mp3", "t": "则当能食而不复热。"}, {"f": "audio/26/school-sch-nj-79__20.mp3", "t": "复热者，"}, {"f": "audio/26/school-sch-nj-79__21.mp3", "t": "邪气也，"}, {"f": "audio/26/school-sch-nj-79__22.mp3", "t": "汗者，"}, {"f": "audio/26/school-sch-nj-79__23.mp3", "t": "精气也，"}, {"f": "audio/26/school-sch-nj-79__24.mp3", "t": "今汗出而辄复热者，"}, {"f": "audio/26/school-sch-nj-79__25.mp3", "t": "是邪胜也；"}, {"f": "audio/26/school-sch-nj-79__26.mp3", "t": "不能食者，"}, {"f": "audio/26/school-sch-nj-79__27.mp3", "t": "精无俾也；"}, {"f": "audio/26/school-sch-nj-79__28.mp3", "t": "病而留者，"}, {"f": "audio/26/school-sch-nj-79__29.mp3", "t": "其寿可立而倾也。"}, {"f": "audio/26/school-sch-nj-79__30.mp3", "t": "且夫《热论》曰："}, {"f": "audio/26/school-sch-nj-79__31.mp3", "t": "汗出而脉尚躁盛者死。"}, {"f": "audio/26/school-sch-nj-79__32.mp3", "t": "今脉不与汗相应，"}, {"f": "audio/26/school-sch-nj-79__33.mp3", "t": "此不胜其病也，"}, {"f": "audio/26/school-sch-nj-79__34.mp3", "t": "其死明矣。"}, {"f": "audio/26/school-sch-nj-79__35.mp3", "t": "狂言者，"}, {"f": "audio/26/school-sch-nj-79__36.mp3", "t": "是失志，"}, {"f": "audio/26/school-sch-nj-79__37.mp3", "t": "失志者死。"}, {"f": "audio/26/school-sch-nj-79__38.mp3", "t": "今见三死，"}, {"f": "audio/26/school-sch-nj-79__39.mp3", "t": "不见一生，"}, {"f": "audio/26/school-sch-nj-79__40.mp3", "t": "虽愈必死也。"}], "school-sch-nj-80": [{"f": "audio/3a/school-sch-nj-80__0.mp3", "t": "帝曰："}, {"f": "audio/3a/school-sch-nj-80__1.mp3", "t": "有病身热，"}, {"f": "audio/3a/school-sch-nj-80__2.mp3", "t": "汗出烦满，"}, {"f": "audio/3a/school-sch-nj-80__3.mp3", "t": "烦满不为汗解，"}, {"f": "audio/3a/school-sch-nj-80__4.mp3", "t": "此为何病？"}, {"f": "audio/3a/school-sch-nj-80__5.mp3", "t": "岐伯曰："}, {"f": "audio/3a/school-sch-nj-80__6.mp3", "t": "汗出而身热者，"}, {"f": "audio/3a/school-sch-nj-80__7.mp3", "t": "风也；"}, {"f": "audio/3a/school-sch-nj-80__8.mp3", "t": "汗出而烦满不解者，"}, {"f": "audio/3a/school-sch-nj-80__9.mp3", "t": "厥也。"}, {"f": "audio/3a/school-sch-nj-80__10.mp3", "t": "病名曰风厥。"}, {"f": "audio/3a/school-sch-nj-80__11.mp3", "t": "帝曰："}, {"f": "audio/3a/school-sch-nj-80__12.mp3", "t": "愿卒闻之。"}, {"f": "audio/3a/school-sch-nj-80__13.mp3", "t": "岐伯曰："}, {"f": "audio/3a/school-sch-nj-80__14.mp3", "t": "巨阳主气，"}, {"f": "audio/3a/school-sch-nj-80__15.mp3", "t": "故先受邪，"}, {"f": "audio/3a/school-sch-nj-80__16.mp3", "t": "少阴与其为表里也，"}, {"f": "audio/3a/school-sch-nj-80__17.mp3", "t": "得热则上从之，"}, {"f": "audio/3a/school-sch-nj-80__18.mp3", "t": "从之则厥也。"}, {"f": "audio/3a/school-sch-nj-80__19.mp3", "t": "帝曰："}, {"f": "audio/3a/school-sch-nj-80__20.mp3", "t": "治之奈何？"}, {"f": "audio/3a/school-sch-nj-80__21.mp3", "t": "岐伯曰："}, {"f": "audio/3a/school-sch-nj-80__22.mp3", "t": "表里刺之，"}, {"f": "audio/3a/school-sch-nj-80__23.mp3", "t": "饮之服汤。"}], "school-sch-nj-81": [{"f": "audio/d7/school-sch-nj-81__0.mp3", "t": "帝曰："}, {"f": "audio/d7/school-sch-nj-81__1.mp3", "t": "劳风为病何如？"}, {"f": "audio/d7/school-sch-nj-81__2.mp3", "t": "岐伯曰："}, {"f": "audio/d7/school-sch-nj-81__3.mp3", "t": "劳风法在肺下，"}, {"f": "audio/d7/school-sch-nj-81__4.mp3", "t": "其为病也，"}, {"f": "audio/d7/school-sch-nj-81__5.mp3", "t": "使人强上冥视，"}, {"f": "audio/d7/school-sch-nj-81__6.mp3", "t": "唾出若涕，"}, {"f": "audio/d7/school-sch-nj-81__7.mp3", "t": "恶风而振寒，"}, {"f": "audio/d7/school-sch-nj-81__8.mp3", "t": "此为劳风之病。"}, {"f": "audio/d7/school-sch-nj-81__9.mp3", "t": "帝曰："}, {"f": "audio/d7/school-sch-nj-81__10.mp3", "t": "治之奈何？"}, {"f": "audio/d7/school-sch-nj-81__11.mp3", "t": "岐伯曰："}, {"f": "audio/d7/school-sch-nj-81__12.mp3", "t": "以救俯仰。"}, {"f": "audio/d7/school-sch-nj-81__13.mp3", "t": "巨阳引，"}, {"f": "audio/d7/school-sch-nj-81__14.mp3", "t": "精者三日，"}, {"f": "audio/d7/school-sch-nj-81__15.mp3", "t": "中年者五日，"}, {"f": "audio/d7/school-sch-nj-81__16.mp3", "t": "不精者七日。"}, {"f": "audio/d7/school-sch-nj-81__17.mp3", "t": "咳出青黄涕，"}, {"f": "audio/d7/school-sch-nj-81__18.mp3", "t": "其状如脓，"}, {"f": "audio/d7/school-sch-nj-81__19.mp3", "t": "大如弹丸，"}, {"f": "audio/d7/school-sch-nj-81__20.mp3", "t": "从口中若鼻中出，"}, {"f": "audio/d7/school-sch-nj-81__21.mp3", "t": "不出则伤肺，"}, {"f": "audio/d7/school-sch-nj-81__22.mp3", "t": "伤肺则死也。"}], "school-sch-nj-82": [{"f": "audio/01/school-sch-nj-82__0.mp3", "t": "帝曰："}, {"f": "audio/01/school-sch-nj-82__1.mp3", "t": "有病肾风者，"}, {"f": "audio/01/school-sch-nj-82__2.mp3", "t": "面胕痝然，"}, {"f": "audio/01/school-sch-nj-82__3.mp3", "t": "害于言，"}, {"f": "audio/01/school-sch-nj-82__4.mp3", "t": "可刺不？"}, {"f": "audio/01/school-sch-nj-82__5.mp3", "t": "岐伯曰："}, {"f": "audio/01/school-sch-nj-82__6.mp3", "t": "虚不当刺，"}, {"f": "audio/01/school-sch-nj-82__7.mp3", "t": "不当刺而刺，"}, {"f": "audio/01/school-sch-nj-82__8.mp3", "t": "后五日，"}, {"f": "audio/01/school-sch-nj-82__9.mp3", "t": "其气必至。"}, {"f": "audio/01/school-sch-nj-82__10.mp3", "t": "帝曰："}, {"f": "audio/01/school-sch-nj-82__11.mp3", "t": "其至何如？"}, {"f": "audio/01/school-sch-nj-82__12.mp3", "t": "岐伯曰："}, {"f": "audio/01/school-sch-nj-82__13.mp3", "t": "至必少气时热，"}, {"f": "audio/01/school-sch-nj-82__14.mp3", "t": "时热从胸背上至头，"}, {"f": "audio/01/school-sch-nj-82__15.mp3", "t": "汗出手热，"}, {"f": "audio/01/school-sch-nj-82__16.mp3", "t": "口干苦渴，"}, {"f": "audio/01/school-sch-nj-82__17.mp3", "t": "小便黄，"}, {"f": "audio/01/school-sch-nj-82__18.mp3", "t": "目下肿，"}, {"f": "audio/01/school-sch-nj-82__19.mp3", "t": "腹中鸣，"}, {"f": "audio/01/school-sch-nj-82__20.mp3", "t": "身重难以行，"}, {"f": "audio/01/school-sch-nj-82__21.mp3", "t": "月事不来，"}, {"f": "audio/01/school-sch-nj-82__22.mp3", "t": "烦而不能食，"}, {"f": "audio/01/school-sch-nj-82__23.mp3", "t": "不能正偃，"}, {"f": "audio/01/school-sch-nj-82__24.mp3", "t": "正偃则咳，"}, {"f": "audio/01/school-sch-nj-82__25.mp3", "t": "病名曰风水，"}, {"f": "audio/01/school-sch-nj-82__26.mp3", "t": "论在《刺法》中。"}], "school-sch-nj-83": [{"f": "audio/f3/school-sch-nj-83__0.mp3", "t": "帝曰："}, {"f": "audio/f3/school-sch-nj-83__1.mp3", "t": "愿闻其说。"}, {"f": "audio/f3/school-sch-nj-83__2.mp3", "t": "岐伯曰："}, {"f": "audio/f3/school-sch-nj-83__3.mp3", "t": "邪之所凑，"}, {"f": "audio/f3/school-sch-nj-83__4.mp3", "t": "其气必虚。"}, {"f": "audio/f3/school-sch-nj-83__5.mp3", "t": "阴虚者，"}, {"f": "audio/f3/school-sch-nj-83__6.mp3", "t": "阳必凑之，"}, {"f": "audio/f3/school-sch-nj-83__7.mp3", "t": "故少气时热而汗出也。"}, {"f": "audio/f3/school-sch-nj-83__8.mp3", "t": "小便黄者，"}, {"f": "audio/f3/school-sch-nj-83__9.mp3", "t": "少腹中有热也。"}, {"f": "audio/f3/school-sch-nj-83__10.mp3", "t": "不能正偃者，"}, {"f": "audio/f3/school-sch-nj-83__11.mp3", "t": "胃中不和也。"}, {"f": "audio/f3/school-sch-nj-83__12.mp3", "t": "正偃则咳甚，"}, {"f": "audio/f3/school-sch-nj-83__13.mp3", "t": "上迫肺也。"}, {"f": "audio/f3/school-sch-nj-83__14.mp3", "t": "诸有水气者，"}, {"f": "audio/f3/school-sch-nj-83__15.mp3", "t": "微肿先见于目下也。"}, {"f": "audio/f3/school-sch-nj-83__16.mp3", "t": "帝曰："}, {"f": "audio/f3/school-sch-nj-83__17.mp3", "t": "何以言？"}, {"f": "audio/f3/school-sch-nj-83__18.mp3", "t": "岐伯曰："}, {"f": "audio/f3/school-sch-nj-83__19.mp3", "t": "水者，"}, {"f": "audio/f3/school-sch-nj-83__20.mp3", "t": "阴也，"}, {"f": "audio/f3/school-sch-nj-83__21.mp3", "t": "目下亦阴也，"}, {"f": "audio/f3/school-sch-nj-83__22.mp3", "t": "腹者至阴之所居，"}, {"f": "audio/f3/school-sch-nj-83__23.mp3", "t": "故水在腹者，"}, {"f": "audio/f3/school-sch-nj-83__24.mp3", "t": "必使目下肿也。"}, {"f": "audio/f3/school-sch-nj-83__25.mp3", "t": "真气上逆，"}, {"f": "audio/f3/school-sch-nj-83__26.mp3", "t": "故口苦舌干，"}, {"f": "audio/f3/school-sch-nj-83__27.mp3", "t": "卧不得正偃，"}, {"f": "audio/f3/school-sch-nj-83__28.mp3", "t": "正偃则咳出清水也。"}, {"f": "audio/f3/school-sch-nj-83__29.mp3", "t": "诸水病者，"}, {"f": "audio/f3/school-sch-nj-83__30.mp3", "t": "故不得卧，"}, {"f": "audio/f3/school-sch-nj-83__31.mp3", "t": "卧则惊，"}, {"f": "audio/f3/school-sch-nj-83__32.mp3", "t": "惊则咳甚也。"}, {"f": "audio/f3/school-sch-nj-83__33.mp3", "t": "腹中鸣者，"}, {"f": "audio/f3/school-sch-nj-83__34.mp3", "t": "病本于胃也。"}, {"f": "audio/f3/school-sch-nj-83__35.mp3", "t": "薄脾则烦，"}, {"f": "audio/f3/school-sch-nj-83__36.mp3", "t": "不能食。"}, {"f": "audio/f3/school-sch-nj-83__37.mp3", "t": "食不下者，"}, {"f": "audio/f3/school-sch-nj-83__38.mp3", "t": "胃脘膈也。"}, {"f": "audio/f3/school-sch-nj-83__39.mp3", "t": "身重难以行者，"}, {"f": "audio/f3/school-sch-nj-83__40.mp3", "t": "胃脉在足也。"}, {"f": "audio/f3/school-sch-nj-83__41.mp3", "t": "月事不来者，"}, {"f": "audio/f3/school-sch-nj-83__42.mp3", "t": "胞脉闭也。"}, {"f": "audio/f3/school-sch-nj-83__43.mp3", "t": "胞脉者，"}, {"f": "audio/f3/school-sch-nj-83__44.mp3", "t": "属心而络于胞中。"}, {"f": "audio/f3/school-sch-nj-83__45.mp3", "t": "今气上迫肺，"}, {"f": "audio/f3/school-sch-nj-83__46.mp3", "t": "心气不得下通，"}, {"f": "audio/f3/school-sch-nj-83__47.mp3", "t": "故月事不来也。"}, {"f": "audio/f3/school-sch-nj-83__48.mp3", "t": "帝曰："}, {"f": "audio/f3/school-sch-nj-83__49.mp3", "t": "善。"}], "school-sch-nj-84": [{"f": "audio/aa/school-sch-nj-84__0.mp3", "t": "黄帝问曰："}, {"f": "audio/aa/school-sch-nj-84__1.mp3", "t": "肺之令人咳，"}, {"f": "audio/aa/school-sch-nj-84__2.mp3", "t": "何也？"}, {"f": "audio/aa/school-sch-nj-84__3.mp3", "t": "岐伯对曰："}, {"f": "audio/aa/school-sch-nj-84__4.mp3", "t": "五藏六府皆令人咳，"}, {"f": "audio/aa/school-sch-nj-84__5.mp3", "t": "非独肺也。"}, {"f": "audio/aa/school-sch-nj-84__6.mp3", "t": "帝曰："}, {"f": "audio/aa/school-sch-nj-84__7.mp3", "t": "愿闻其状。"}, {"f": "audio/aa/school-sch-nj-84__8.mp3", "t": "岐伯曰："}, {"f": "audio/aa/school-sch-nj-84__9.mp3", "t": "皮毛者，"}, {"f": "audio/aa/school-sch-nj-84__10.mp3", "t": "肺之合也，"}, {"f": "audio/aa/school-sch-nj-84__11.mp3", "t": "皮毛先受邪气，"}, {"f": "audio/aa/school-sch-nj-84__12.mp3", "t": "邪气以从其合也。"}, {"f": "audio/aa/school-sch-nj-84__13.mp3", "t": "其寒饮食入胃，"}, {"f": "audio/aa/school-sch-nj-84__14.mp3", "t": "从肺脉上至于肺，"}, {"f": "audio/aa/school-sch-nj-84__15.mp3", "t": "则肺寒，"}, {"f": "audio/aa/school-sch-nj-84__16.mp3", "t": "肺寒则外内合邪，"}, {"f": "audio/aa/school-sch-nj-84__17.mp3", "t": "因而客之，"}, {"f": "audio/aa/school-sch-nj-84__18.mp3", "t": "则为肺咳。"}, {"f": "audio/aa/school-sch-nj-84__19.mp3", "t": "五藏各以其时受病，"}, {"f": "audio/aa/school-sch-nj-84__20.mp3", "t": "非其时各传以与之。"}, {"f": "audio/aa/school-sch-nj-84__21.mp3", "t": "人与天地相参，"}, {"f": "audio/aa/school-sch-nj-84__22.mp3", "t": "故五藏各以治时，"}, {"f": "audio/aa/school-sch-nj-84__23.mp3", "t": "感于寒则受病，"}, {"f": "audio/aa/school-sch-nj-84__24.mp3", "t": "微则为咳，"}, {"f": "audio/aa/school-sch-nj-84__25.mp3", "t": "甚则为泄、"}, {"f": "audio/aa/school-sch-nj-84__26.mp3", "t": "为痛。"}, {"f": "audio/aa/school-sch-nj-84__27.mp3", "t": "乘秋则肺先受邪，"}, {"f": "audio/aa/school-sch-nj-84__28.mp3", "t": "乘春则肝先受之，"}, {"f": "audio/aa/school-sch-nj-84__29.mp3", "t": "乘夏则心先受之，"}, {"f": "audio/aa/school-sch-nj-84__30.mp3", "t": "乘至阴则脾先受之，"}, {"f": "audio/aa/school-sch-nj-84__31.mp3", "t": "乘冬则肾先受之。"}], "school-sch-nj-85": [{"f": "audio/d4/school-sch-nj-85__0.mp3", "t": "帝曰："}, {"f": "audio/d4/school-sch-nj-85__1.mp3", "t": "何以异之？"}, {"f": "audio/d4/school-sch-nj-85__2.mp3", "t": "岐伯曰："}, {"f": "audio/d4/school-sch-nj-85__3.mp3", "t": "肺咳之状，"}, {"f": "audio/d4/school-sch-nj-85__4.mp3", "t": "咳而喘息有音，"}, {"f": "audio/d4/school-sch-nj-85__5.mp3", "t": "甚则唾血。"}, {"f": "audio/d4/school-sch-nj-85__6.mp3", "t": "心咳之状，"}, {"f": "audio/d4/school-sch-nj-85__7.mp3", "t": "咳则心痛，"}, {"f": "audio/d4/school-sch-nj-85__8.mp3", "t": "喉中介介如梗状，"}, {"f": "audio/d4/school-sch-nj-85__9.mp3", "t": "甚则咽肿喉痹。"}, {"f": "audio/d4/school-sch-nj-85__10.mp3", "t": "肝咳之状，"}, {"f": "audio/d4/school-sch-nj-85__11.mp3", "t": "咳则两胁下痛，"}, {"f": "audio/d4/school-sch-nj-85__12.mp3", "t": "甚则不可以转，"}, {"f": "audio/d4/school-sch-nj-85__13.mp3", "t": "转则两胠下满。"}, {"f": "audio/d4/school-sch-nj-85__14.mp3", "t": "脾咳之状，"}, {"f": "audio/d4/school-sch-nj-85__15.mp3", "t": "咳则右胁下痛，"}, {"f": "audio/d4/school-sch-nj-85__16.mp3", "t": "阴阴引肩背，"}, {"f": "audio/d4/school-sch-nj-85__17.mp3", "t": "甚则不可以动，"}, {"f": "audio/d4/school-sch-nj-85__18.mp3", "t": "动则咳剧。"}, {"f": "audio/d4/school-sch-nj-85__19.mp3", "t": "肾咳之状，"}, {"f": "audio/d4/school-sch-nj-85__20.mp3", "t": "咳则腰背相引而痛，"}, {"f": "audio/d4/school-sch-nj-85__21.mp3", "t": "甚则咳涎。"}], "school-sch-nj-86": [{"f": "audio/2e/school-sch-nj-86__0.mp3", "t": "帝曰："}, {"f": "audio/2e/school-sch-nj-86__1.mp3", "t": "六府之咳奈何？"}, {"f": "audio/2e/school-sch-nj-86__2.mp3", "t": "安所受病？"}, {"f": "audio/2e/school-sch-nj-86__3.mp3", "t": "岐伯曰："}, {"f": "audio/2e/school-sch-nj-86__4.mp3", "t": "五藏之久咳，"}, {"f": "audio/2e/school-sch-nj-86__5.mp3", "t": "乃移于六府。"}, {"f": "audio/2e/school-sch-nj-86__6.mp3", "t": "脾咳不已，"}, {"f": "audio/2e/school-sch-nj-86__7.mp3", "t": "则胃受之。"}, {"f": "audio/2e/school-sch-nj-86__8.mp3", "t": "胃咳之状，"}, {"f": "audio/2e/school-sch-nj-86__9.mp3", "t": "咳而呕，"}, {"f": "audio/2e/school-sch-nj-86__10.mp3", "t": "呕甚则长虫出。"}, {"f": "audio/2e/school-sch-nj-86__11.mp3", "t": "肝咳不已，"}, {"f": "audio/2e/school-sch-nj-86__12.mp3", "t": "则胆受之。"}, {"f": "audio/2e/school-sch-nj-86__13.mp3", "t": "胆咳之状，"}, {"f": "audio/2e/school-sch-nj-86__14.mp3", "t": "咳呕胆汁。"}, {"f": "audio/2e/school-sch-nj-86__15.mp3", "t": "肺咳不已，"}, {"f": "audio/2e/school-sch-nj-86__16.mp3", "t": "则大肠受之。"}, {"f": "audio/2e/school-sch-nj-86__17.mp3", "t": "大肠咳状，"}, {"f": "audio/2e/school-sch-nj-86__18.mp3", "t": "咳而遗矢。"}, {"f": "audio/2e/school-sch-nj-86__19.mp3", "t": "心咳不已，"}, {"f": "audio/2e/school-sch-nj-86__20.mp3", "t": "则小肠受之。"}, {"f": "audio/2e/school-sch-nj-86__21.mp3", "t": "小肠咳状，"}, {"f": "audio/2e/school-sch-nj-86__22.mp3", "t": "咳而失气，"}, {"f": "audio/2e/school-sch-nj-86__23.mp3", "t": "气与咳俱失。"}, {"f": "audio/2e/school-sch-nj-86__24.mp3", "t": "肾咳不已，"}, {"f": "audio/2e/school-sch-nj-86__25.mp3", "t": "则膀胱受之。"}, {"f": "audio/2e/school-sch-nj-86__26.mp3", "t": "膀胱咳状，"}, {"f": "audio/2e/school-sch-nj-86__27.mp3", "t": "咳而遗溺，"}, {"f": "audio/2e/school-sch-nj-86__28.mp3", "t": "久咳不已，"}, {"f": "audio/2e/school-sch-nj-86__29.mp3", "t": "则三焦受之，"}, {"f": "audio/2e/school-sch-nj-86__30.mp3", "t": "三焦咳状，"}, {"f": "audio/2e/school-sch-nj-86__31.mp3", "t": "咳而腹满，"}, {"f": "audio/2e/school-sch-nj-86__32.mp3", "t": "不欲食饮。"}, {"f": "audio/2e/school-sch-nj-86__33.mp3", "t": "此皆聚于胃，"}, {"f": "audio/2e/school-sch-nj-86__34.mp3", "t": "关于肺，"}, {"f": "audio/2e/school-sch-nj-86__35.mp3", "t": "使人多涕唾，"}, {"f": "audio/2e/school-sch-nj-86__36.mp3", "t": "而面浮肿气逆也。"}], "school-sch-nj-87": [{"f": "audio/15/school-sch-nj-87__0.mp3", "t": "帝曰："}, {"f": "audio/15/school-sch-nj-87__1.mp3", "t": "治之奈何？"}, {"f": "audio/15/school-sch-nj-87__2.mp3", "t": "岐伯曰："}, {"f": "audio/15/school-sch-nj-87__3.mp3", "t": "治藏者，"}, {"f": "audio/15/school-sch-nj-87__4.mp3", "t": "治其俞；"}, {"f": "audio/15/school-sch-nj-87__5.mp3", "t": "治府者，"}, {"f": "audio/15/school-sch-nj-87__6.mp3", "t": "治其合；"}, {"f": "audio/15/school-sch-nj-87__7.mp3", "t": "浮肿者，"}, {"f": "audio/15/school-sch-nj-87__8.mp3", "t": "治其经。"}, {"f": "audio/15/school-sch-nj-87__9.mp3", "t": "帝曰："}, {"f": "audio/15/school-sch-nj-87__10.mp3", "t": "善。"}], "school-sch-nj-88": [{"f": "audio/69/school-sch-nj-88__0.mp3", "t": "黄帝问曰："}, {"f": "audio/69/school-sch-nj-88__1.mp3", "t": "痹之安生？"}, {"f": "audio/69/school-sch-nj-88__2.mp3", "t": "岐伯对曰："}, {"f": "audio/69/school-sch-nj-88__3.mp3", "t": "风、"}, {"f": "audio/69/school-sch-nj-88__4.mp3", "t": "寒、"}, {"f": "audio/69/school-sch-nj-88__5.mp3", "t": "湿三气杂至，"}, {"f": "audio/69/school-sch-nj-88__6.mp3", "t": "合而为痹也。"}, {"f": "audio/69/school-sch-nj-88__7.mp3", "t": "其风气胜者，"}, {"f": "audio/69/school-sch-nj-88__8.mp3", "t": "为行痹；"}, {"f": "audio/69/school-sch-nj-88__9.mp3", "t": "寒气胜者，"}, {"f": "audio/69/school-sch-nj-88__10.mp3", "t": "为痛痹；"}, {"f": "audio/69/school-sch-nj-88__11.mp3", "t": "湿气胜者，"}, {"f": "audio/69/school-sch-nj-88__12.mp3", "t": "为着痹也。"}, {"f": "audio/69/school-sch-nj-88__13.mp3", "t": "帝曰："}, {"f": "audio/69/school-sch-nj-88__14.mp3", "t": "其有五者，"}, {"f": "audio/69/school-sch-nj-88__15.mp3", "t": "何也？"}, {"f": "audio/69/school-sch-nj-88__16.mp3", "t": "岐伯曰："}, {"f": "audio/69/school-sch-nj-88__17.mp3", "t": "以冬遇此者为骨痹，"}, {"f": "audio/69/school-sch-nj-88__18.mp3", "t": "以春遇此者为筋痹，"}, {"f": "audio/69/school-sch-nj-88__19.mp3", "t": "以夏遇此者为脉痹，"}, {"f": "audio/69/school-sch-nj-88__20.mp3", "t": "以至阴遇此者为肌痹，"}, {"f": "audio/69/school-sch-nj-88__21.mp3", "t": "以秋遇此者为皮痹。"}], "school-sch-nj-89": [{"f": "audio/6c/school-sch-nj-89__0.mp3", "t": "帝曰："}, {"f": "audio/6c/school-sch-nj-89__1.mp3", "t": "内舍五藏六府，"}, {"f": "audio/6c/school-sch-nj-89__2.mp3", "t": "何气使然？"}, {"f": "audio/6c/school-sch-nj-89__3.mp3", "t": "岐伯曰："}, {"f": "audio/6c/school-sch-nj-89__4.mp3", "t": "五藏皆有合，"}, {"f": "audio/6c/school-sch-nj-89__5.mp3", "t": "病久而不去者，"}, {"f": "audio/6c/school-sch-nj-89__6.mp3", "t": "内舍于其合也。"}, {"f": "audio/6c/school-sch-nj-89__7.mp3", "t": "故骨痹不已复感于邪，"}, {"f": "audio/6c/school-sch-nj-89__8.mp3", "t": "内舍于肾；"}, {"f": "audio/6c/school-sch-nj-89__9.mp3", "t": "筋痹不已，"}, {"f": "audio/6c/school-sch-nj-89__10.mp3", "t": "复感于邪，"}, {"f": "audio/6c/school-sch-nj-89__11.mp3", "t": "内舍于肝；"}, {"f": "audio/6c/school-sch-nj-89__12.mp3", "t": "脉痹不已，"}, {"f": "audio/6c/school-sch-nj-89__13.mp3", "t": "复感于邪，"}, {"f": "audio/6c/school-sch-nj-89__14.mp3", "t": "内舍于心；"}, {"f": "audio/6c/school-sch-nj-89__15.mp3", "t": "肌痹不已，"}, {"f": "audio/6c/school-sch-nj-89__16.mp3", "t": "复感于邪，"}, {"f": "audio/6c/school-sch-nj-89__17.mp3", "t": "内舍于脾；"}, {"f": "audio/6c/school-sch-nj-89__18.mp3", "t": "皮痹不已，"}, {"f": "audio/6c/school-sch-nj-89__19.mp3", "t": "复感于邪，"}, {"f": "audio/6c/school-sch-nj-89__20.mp3", "t": "内舍于肺。"}, {"f": "audio/6c/school-sch-nj-89__21.mp3", "t": "所谓痹者，"}, {"f": "audio/6c/school-sch-nj-89__22.mp3", "t": "各以其时重感于风寒湿之气也。"}], "school-sch-nj-90": [{"f": "audio/b0/school-sch-nj-90__0.mp3", "t": "凡痹之客五藏者，"}, {"f": "audio/b0/school-sch-nj-90__1.mp3", "t": "肺痹者，"}, {"f": "audio/b0/school-sch-nj-90__2.mp3", "t": "烦满，"}, {"f": "audio/b0/school-sch-nj-90__3.mp3", "t": "喘而呕；"}, {"f": "audio/b0/school-sch-nj-90__4.mp3", "t": "心痹者，"}, {"f": "audio/b0/school-sch-nj-90__5.mp3", "t": "脉不通，"}, {"f": "audio/b0/school-sch-nj-90__6.mp3", "t": "烦则心下鼓，"}, {"f": "audio/b0/school-sch-nj-90__7.mp3", "t": "暴上气而喘，"}, {"f": "audio/b0/school-sch-nj-90__8.mp3", "t": "嗌干，"}, {"f": "audio/b0/school-sch-nj-90__9.mp3", "t": "善噫，"}, {"f": "audio/b0/school-sch-nj-90__10.mp3", "t": "厥气上则恐；"}, {"f": "audio/b0/school-sch-nj-90__11.mp3", "t": "肝痹者，"}, {"f": "audio/b0/school-sch-nj-90__12.mp3", "t": "夜卧则惊，"}, {"f": "audio/b0/school-sch-nj-90__13.mp3", "t": "多饮，"}, {"f": "audio/b0/school-sch-nj-90__14.mp3", "t": "数小便，"}, {"f": "audio/b0/school-sch-nj-90__15.mp3", "t": "上为引如怀；"}, {"f": "audio/b0/school-sch-nj-90__16.mp3", "t": "肾痹者，"}, {"f": "audio/b0/school-sch-nj-90__17.mp3", "t": "善胀，"}, {"f": "audio/b0/school-sch-nj-90__18.mp3", "t": "尻以代踵，"}, {"f": "audio/b0/school-sch-nj-90__19.mp3", "t": "脊以代头；"}, {"f": "audio/b0/school-sch-nj-90__20.mp3", "t": "脾痹者，"}, {"f": "audio/b0/school-sch-nj-90__21.mp3", "t": "四支解堕，"}, {"f": "audio/b0/school-sch-nj-90__22.mp3", "t": "发咳，"}, {"f": "audio/b0/school-sch-nj-90__23.mp3", "t": "呕汁，"}, {"f": "audio/b0/school-sch-nj-90__24.mp3", "t": "上为大塞。"}, {"f": "audio/b0/school-sch-nj-90__25.mp3", "t": "肠痹者，"}, {"f": "audio/b0/school-sch-nj-90__26.mp3", "t": "数饮而出不得，"}, {"f": "audio/b0/school-sch-nj-90__27.mp3", "t": "中气喘争，"}, {"f": "audio/b0/school-sch-nj-90__28.mp3", "t": "时发飧泄。"}, {"f": "audio/b0/school-sch-nj-90__29.mp3", "t": "胞痹者，"}, {"f": "audio/b0/school-sch-nj-90__30.mp3", "t": "少腹膀胱按之内痛，"}, {"f": "audio/b0/school-sch-nj-90__31.mp3", "t": "若沃以汤，"}, {"f": "audio/b0/school-sch-nj-90__32.mp3", "t": "涩于小便，"}, {"f": "audio/b0/school-sch-nj-90__33.mp3", "t": "上为清涕。"}], "school-sch-nj-91": [{"f": "audio/1f/school-sch-nj-91__0.mp3", "t": "阴气者，"}, {"f": "audio/1f/school-sch-nj-91__1.mp3", "t": "静则神藏，"}, {"f": "audio/1f/school-sch-nj-91__2.mp3", "t": "躁则消亡。"}, {"f": "audio/1f/school-sch-nj-91__3.mp3", "t": "饮食自倍，"}, {"f": "audio/1f/school-sch-nj-91__4.mp3", "t": "肠胃乃伤。"}, {"f": "audio/1f/school-sch-nj-91__5.mp3", "t": "淫气喘息，"}, {"f": "audio/1f/school-sch-nj-91__6.mp3", "t": "痹聚在肺。"}, {"f": "audio/1f/school-sch-nj-91__7.mp3", "t": "淫气忧思，"}, {"f": "audio/1f/school-sch-nj-91__8.mp3", "t": "痹聚在心。"}, {"f": "audio/1f/school-sch-nj-91__9.mp3", "t": "淫气遗溺，"}, {"f": "audio/1f/school-sch-nj-91__10.mp3", "t": "痹聚在肾。"}, {"f": "audio/1f/school-sch-nj-91__11.mp3", "t": "淫气乏竭，"}, {"f": "audio/1f/school-sch-nj-91__12.mp3", "t": "痹聚在肝。"}, {"f": "audio/1f/school-sch-nj-91__13.mp3", "t": "淫气肌绝，"}, {"f": "audio/1f/school-sch-nj-91__14.mp3", "t": "痹聚在脾。"}], "school-sch-nj-92": [{"f": "audio/b4/school-sch-nj-92__0.mp3", "t": "诸痹不已，"}, {"f": "audio/b4/school-sch-nj-92__1.mp3", "t": "亦益内也。"}, {"f": "audio/b4/school-sch-nj-92__2.mp3", "t": "其风气胜者，"}, {"f": "audio/b4/school-sch-nj-92__3.mp3", "t": "其人易已也。"}], "school-sch-nj-93": [{"f": "audio/f7/school-sch-nj-93__0.mp3", "t": "帝曰："}, {"f": "audio/f7/school-sch-nj-93__1.mp3", "t": "痹，"}, {"f": "audio/f7/school-sch-nj-93__2.mp3", "t": "其时有死者，"}, {"f": "audio/f7/school-sch-nj-93__3.mp3", "t": "或疼久者，"}, {"f": "audio/f7/school-sch-nj-93__4.mp3", "t": "或易已者，"}, {"f": "audio/f7/school-sch-nj-93__5.mp3", "t": "其故何也？"}, {"f": "audio/f7/school-sch-nj-93__6.mp3", "t": "岐伯曰："}, {"f": "audio/f7/school-sch-nj-93__7.mp3", "t": "其入藏者死，"}, {"f": "audio/f7/school-sch-nj-93__8.mp3", "t": "其留连筋骨间者疼久，"}, {"f": "audio/f7/school-sch-nj-93__9.mp3", "t": "其留皮肤间者易已。"}], "school-sch-nj-94": [{"f": "audio/73/school-sch-nj-94__0.mp3", "t": "帝曰："}, {"f": "audio/73/school-sch-nj-94__1.mp3", "t": "其客于六府者，"}, {"f": "audio/73/school-sch-nj-94__2.mp3", "t": "何也？"}, {"f": "audio/73/school-sch-nj-94__3.mp3", "t": "岐伯曰："}, {"f": "audio/73/school-sch-nj-94__4.mp3", "t": "此亦其食饮居处，"}, {"f": "audio/73/school-sch-nj-94__5.mp3", "t": "为其病本也。"}, {"f": "audio/73/school-sch-nj-94__6.mp3", "t": "六府亦各有俞，"}, {"f": "audio/73/school-sch-nj-94__7.mp3", "t": "风寒湿气中其俞，"}, {"f": "audio/73/school-sch-nj-94__8.mp3", "t": "而食饮应之，"}, {"f": "audio/73/school-sch-nj-94__9.mp3", "t": "循俞而入，"}, {"f": "audio/73/school-sch-nj-94__10.mp3", "t": "各舍其府也。"}], "school-sch-nj-95": [{"f": "audio/36/school-sch-nj-95__0.mp3", "t": "帝曰："}, {"f": "audio/36/school-sch-nj-95__1.mp3", "t": "以针治之奈何？"}, {"f": "audio/36/school-sch-nj-95__2.mp3", "t": "岐伯曰："}, {"f": "audio/36/school-sch-nj-95__3.mp3", "t": "五藏有俞，"}, {"f": "audio/36/school-sch-nj-95__4.mp3", "t": "六府有合，"}, {"f": "audio/36/school-sch-nj-95__5.mp3", "t": "循脉之分，"}, {"f": "audio/36/school-sch-nj-95__6.mp3", "t": "各有所发，"}, {"f": "audio/36/school-sch-nj-95__7.mp3", "t": "各随其过，"}, {"f": "audio/36/school-sch-nj-95__8.mp3", "t": "则病瘳也。"}], "school-sch-nj-96": [{"f": "audio/99/school-sch-nj-96__0.mp3", "t": "帝曰："}, {"f": "audio/99/school-sch-nj-96__1.mp3", "t": "荣卫之气，"}, {"f": "audio/99/school-sch-nj-96__2.mp3", "t": "亦令人痹乎？"}, {"f": "audio/99/school-sch-nj-96__3.mp3", "t": "岐伯曰："}, {"f": "audio/99/school-sch-nj-96__4.mp3", "t": "荣者，"}, {"f": "audio/99/school-sch-nj-96__5.mp3", "t": "水谷之精气也，"}, {"f": "audio/99/school-sch-nj-96__6.mp3", "t": "和调于五藏，"}, {"f": "audio/99/school-sch-nj-96__7.mp3", "t": "洒陈于六府，"}, {"f": "audio/99/school-sch-nj-96__8.mp3", "t": "乃能入于脉也。"}, {"f": "audio/99/school-sch-nj-96__9.mp3", "t": "故循脉上下，"}, {"f": "audio/99/school-sch-nj-96__10.mp3", "t": "贯五藏，"}, {"f": "audio/99/school-sch-nj-96__11.mp3", "t": "络六府也。"}, {"f": "audio/99/school-sch-nj-96__12.mp3", "t": "卫者，"}, {"f": "audio/99/school-sch-nj-96__13.mp3", "t": "水谷之悍气也，"}, {"f": "audio/99/school-sch-nj-96__14.mp3", "t": "其气慓疾滑利，"}, {"f": "audio/99/school-sch-nj-96__15.mp3", "t": "不能入于脉也。"}, {"f": "audio/99/school-sch-nj-96__16.mp3", "t": "故循皮肤之中，"}, {"f": "audio/99/school-sch-nj-96__17.mp3", "t": "分肉之间，"}, {"f": "audio/99/school-sch-nj-96__18.mp3", "t": "熏于肓膜，"}, {"f": "audio/99/school-sch-nj-96__19.mp3", "t": "散于胸腹。"}, {"f": "audio/99/school-sch-nj-96__20.mp3", "t": "逆其气则病，"}, {"f": "audio/99/school-sch-nj-96__21.mp3", "t": "从其气则愈，"}, {"f": "audio/99/school-sch-nj-96__22.mp3", "t": "不与风寒湿气合，"}, {"f": "audio/99/school-sch-nj-96__23.mp3", "t": "故不为痹。"}], "school-sch-nj-97": [{"f": "audio/6e/school-sch-nj-97__0.mp3", "t": "帝曰："}, {"f": "audio/6e/school-sch-nj-97__1.mp3", "t": "善。"}, {"f": "audio/6e/school-sch-nj-97__2.mp3", "t": "痹或痛，"}, {"f": "audio/6e/school-sch-nj-97__3.mp3", "t": "或不痛，"}, {"f": "audio/6e/school-sch-nj-97__4.mp3", "t": "或不仁，"}, {"f": "audio/6e/school-sch-nj-97__5.mp3", "t": "或寒，"}, {"f": "audio/6e/school-sch-nj-97__6.mp3", "t": "或热，"}, {"f": "audio/6e/school-sch-nj-97__7.mp3", "t": "或燥，"}, {"f": "audio/6e/school-sch-nj-97__8.mp3", "t": "或湿，"}, {"f": "audio/6e/school-sch-nj-97__9.mp3", "t": "其故何也？"}, {"f": "audio/6e/school-sch-nj-97__10.mp3", "t": "岐伯曰："}, {"f": "audio/6e/school-sch-nj-97__11.mp3", "t": "痛者，"}, {"f": "audio/6e/school-sch-nj-97__12.mp3", "t": "寒气多也，"}, {"f": "audio/6e/school-sch-nj-97__13.mp3", "t": "有寒故痛也。"}, {"f": "audio/6e/school-sch-nj-97__14.mp3", "t": "其不痛不仁者，"}, {"f": "audio/6e/school-sch-nj-97__15.mp3", "t": "病久入深，"}, {"f": "audio/6e/school-sch-nj-97__16.mp3", "t": "荣卫之行涩，"}, {"f": "audio/6e/school-sch-nj-97__17.mp3", "t": "经络时疏，"}, {"f": "audio/6e/school-sch-nj-97__18.mp3", "t": "故不通；"}, {"f": "audio/6e/school-sch-nj-97__19.mp3", "t": "皮肤不荣，"}, {"f": "audio/6e/school-sch-nj-97__20.mp3", "t": "故为不仁。"}, {"f": "audio/6e/school-sch-nj-97__21.mp3", "t": "其寒者，"}, {"f": "audio/6e/school-sch-nj-97__22.mp3", "t": "阳气少，"}, {"f": "audio/6e/school-sch-nj-97__23.mp3", "t": "阴气多，"}, {"f": "audio/6e/school-sch-nj-97__24.mp3", "t": "与病相益，"}, {"f": "audio/6e/school-sch-nj-97__25.mp3", "t": "故寒也。"}, {"f": "audio/6e/school-sch-nj-97__26.mp3", "t": "其热者，"}, {"f": "audio/6e/school-sch-nj-97__27.mp3", "t": "阳气多，"}, {"f": "audio/6e/school-sch-nj-97__28.mp3", "t": "阴气少，"}, {"f": "audio/6e/school-sch-nj-97__29.mp3", "t": "病气胜，"}, {"f": "audio/6e/school-sch-nj-97__30.mp3", "t": "阳遭阴，"}, {"f": "audio/6e/school-sch-nj-97__31.mp3", "t": "故为痹热。"}, {"f": "audio/6e/school-sch-nj-97__32.mp3", "t": "其多汗而濡者，"}, {"f": "audio/6e/school-sch-nj-97__33.mp3", "t": "此其逢湿甚也，"}, {"f": "audio/6e/school-sch-nj-97__34.mp3", "t": "阳气少，"}, {"f": "audio/6e/school-sch-nj-97__35.mp3", "t": "阴气盛，"}, {"f": "audio/6e/school-sch-nj-97__36.mp3", "t": "两气相感，"}, {"f": "audio/6e/school-sch-nj-97__37.mp3", "t": "故汗出而濡也。"}], "school-sch-nj-98": [{"f": "audio/3f/school-sch-nj-98__0.mp3", "t": "帝曰："}, {"f": "audio/3f/school-sch-nj-98__1.mp3", "t": "夫痹之为病，"}, {"f": "audio/3f/school-sch-nj-98__2.mp3", "t": "不痛何也？"}, {"f": "audio/3f/school-sch-nj-98__3.mp3", "t": "岐伯曰："}, {"f": "audio/3f/school-sch-nj-98__4.mp3", "t": "痹在于骨则重，"}, {"f": "audio/3f/school-sch-nj-98__5.mp3", "t": "在于脉则血凝而不流，"}, {"f": "audio/3f/school-sch-nj-98__6.mp3", "t": "在于筋则屈不伸，"}, {"f": "audio/3f/school-sch-nj-98__7.mp3", "t": "在于肉则不仁，"}, {"f": "audio/3f/school-sch-nj-98__8.mp3", "t": "在于皮则寒，"}, {"f": "audio/3f/school-sch-nj-98__9.mp3", "t": "故具此五者，"}, {"f": "audio/3f/school-sch-nj-98__10.mp3", "t": "则不痛也。"}, {"f": "audio/3f/school-sch-nj-98__11.mp3", "t": "凡痹之类，"}, {"f": "audio/3f/school-sch-nj-98__12.mp3", "t": "逢寒则虫，"}, {"f": "audio/3f/school-sch-nj-98__13.mp3", "t": "逢热则纵。"}, {"f": "audio/3f/school-sch-nj-98__14.mp3", "t": "帝曰："}, {"f": "audio/3f/school-sch-nj-98__15.mp3", "t": "善。"}], "school-sch-nj-99": [{"f": "audio/9e/school-sch-nj-99__0.mp3", "t": "黄帝问曰："}, {"f": "audio/9e/school-sch-nj-99__1.mp3", "t": "五藏使人痿，"}, {"f": "audio/9e/school-sch-nj-99__2.mp3", "t": "何也？"}, {"f": "audio/9e/school-sch-nj-99__3.mp3", "t": "岐伯对曰："}, {"f": "audio/9e/school-sch-nj-99__4.mp3", "t": "肺主身之皮毛，"}, {"f": "audio/9e/school-sch-nj-99__5.mp3", "t": "心主身之血脉，"}, {"f": "audio/9e/school-sch-nj-99__6.mp3", "t": "肝主身之筋膜，"}, {"f": "audio/9e/school-sch-nj-99__7.mp3", "t": "脾主身之肌肉，"}, {"f": "audio/9e/school-sch-nj-99__8.mp3", "t": "肾主身之骨髓。"}, {"f": "audio/9e/school-sch-nj-99__9.mp3", "t": "故肺热叶焦，"}, {"f": "audio/9e/school-sch-nj-99__10.mp3", "t": "则皮毛虚弱急薄，"}, {"f": "audio/9e/school-sch-nj-99__11.mp3", "t": "着则生痿躄也。"}, {"f": "audio/9e/school-sch-nj-99__12.mp3", "t": "心气热，"}, {"f": "audio/9e/school-sch-nj-99__13.mp3", "t": "则下脉厥而上，"}, {"f": "audio/9e/school-sch-nj-99__14.mp3", "t": "上则下脉虚，"}, {"f": "audio/9e/school-sch-nj-99__15.mp3", "t": "虚则生脉痿，"}, {"f": "audio/9e/school-sch-nj-99__16.mp3", "t": "枢折挈，"}, {"f": "audio/9e/school-sch-nj-99__17.mp3", "t": "胫纵而不任地也。"}, {"f": "audio/9e/school-sch-nj-99__18.mp3", "t": "肝气热，"}, {"f": "audio/9e/school-sch-nj-99__19.mp3", "t": "则胆泄口苦，"}, {"f": "audio/9e/school-sch-nj-99__20.mp3", "t": "筋膜干，"}, {"f": "audio/9e/school-sch-nj-99__21.mp3", "t": "筋膜干则筋急而挛，"}, {"f": "audio/9e/school-sch-nj-99__22.mp3", "t": "发为筋痿，"}, {"f": "audio/9e/school-sch-nj-99__23.mp3", "t": "脾气热，"}, {"f": "audio/9e/school-sch-nj-99__24.mp3", "t": "则胃干而渴，"}, {"f": "audio/9e/school-sch-nj-99__25.mp3", "t": "肌肉不仁，"}, {"f": "audio/9e/school-sch-nj-99__26.mp3", "t": "发为肉痿。"}, {"f": "audio/9e/school-sch-nj-99__27.mp3", "t": "肾气热，"}, {"f": "audio/9e/school-sch-nj-99__28.mp3", "t": "则腰脊不举，"}, {"f": "audio/9e/school-sch-nj-99__29.mp3", "t": "骨枯而髓减，"}, {"f": "audio/9e/school-sch-nj-99__30.mp3", "t": "发为骨痿。"}], "school-sch-nj-100": [{"f": "audio/a6/school-sch-nj-100__0.mp3", "t": "帝曰："}, {"f": "audio/a6/school-sch-nj-100__1.mp3", "t": "何以得之？"}, {"f": "audio/a6/school-sch-nj-100__2.mp3", "t": "岐伯曰："}, {"f": "audio/a6/school-sch-nj-100__3.mp3", "t": "肺者，"}, {"f": "audio/a6/school-sch-nj-100__4.mp3", "t": "藏之长也，"}, {"f": "audio/a6/school-sch-nj-100__5.mp3", "t": "为心之盖也，"}, {"f": "audio/a6/school-sch-nj-100__6.mp3", "t": "有所失亡，"}, {"f": "audio/a6/school-sch-nj-100__7.mp3", "t": "所求不得，"}, {"f": "audio/a6/school-sch-nj-100__8.mp3", "t": "则发肺鸣，"}, {"f": "audio/a6/school-sch-nj-100__9.mp3", "t": "鸣则肺热叶焦。"}, {"f": "audio/a6/school-sch-nj-100__10.mp3", "t": "故曰："}, {"f": "audio/a6/school-sch-nj-100__11.mp3", "t": "五藏因肺热叶焦，"}, {"f": "audio/a6/school-sch-nj-100__12.mp3", "t": "发为痿躄。"}, {"f": "audio/a6/school-sch-nj-100__13.mp3", "t": "此之谓也。"}, {"f": "audio/a6/school-sch-nj-100__14.mp3", "t": "悲哀太甚，"}, {"f": "audio/a6/school-sch-nj-100__15.mp3", "t": "则胞络绝，"}, {"f": "audio/a6/school-sch-nj-100__16.mp3", "t": "胞络绝则阳气内动，"}, {"f": "audio/a6/school-sch-nj-100__17.mp3", "t": "发则心下崩，"}, {"f": "audio/a6/school-sch-nj-100__18.mp3", "t": "数溲血也。"}, {"f": "audio/a6/school-sch-nj-100__19.mp3", "t": "故《本病》曰："}, {"f": "audio/a6/school-sch-nj-100__20.mp3", "t": "大经空虚，"}, {"f": "audio/a6/school-sch-nj-100__21.mp3", "t": "发为肌痹，"}, {"f": "audio/a6/school-sch-nj-100__22.mp3", "t": "传为脉痿。"}, {"f": "audio/a6/school-sch-nj-100__23.mp3", "t": "思想无穷，"}, {"f": "audio/a6/school-sch-nj-100__24.mp3", "t": "所愿不得，"}, {"f": "audio/a6/school-sch-nj-100__25.mp3", "t": "意淫于外，"}, {"f": "audio/a6/school-sch-nj-100__26.mp3", "t": "入房太甚，"}, {"f": "audio/a6/school-sch-nj-100__27.mp3", "t": "宗筋弛纵，"}, {"f": "audio/a6/school-sch-nj-100__28.mp3", "t": "发为筋痿，"}, {"f": "audio/a6/school-sch-nj-100__29.mp3", "t": "及为白淫。"}, {"f": "audio/a6/school-sch-nj-100__30.mp3", "t": "故《下经》曰："}, {"f": "audio/a6/school-sch-nj-100__31.mp3", "t": "筋痿者，"}, {"f": "audio/a6/school-sch-nj-100__32.mp3", "t": "生于肝，"}, {"f": "audio/a6/school-sch-nj-100__33.mp3", "t": "使内也。"}, {"f": "audio/a6/school-sch-nj-100__34.mp3", "t": "有渐于湿，"}, {"f": "audio/a6/school-sch-nj-100__35.mp3", "t": "以水为事，"}, {"f": "audio/a6/school-sch-nj-100__36.mp3", "t": "若有所留，"}, {"f": "audio/a6/school-sch-nj-100__37.mp3", "t": "居处相湿，"}, {"f": "audio/a6/school-sch-nj-100__38.mp3", "t": "肌肉濡渍，"}, {"f": "audio/a6/school-sch-nj-100__39.mp3", "t": "痹而不仁，"}, {"f": "audio/a6/school-sch-nj-100__40.mp3", "t": "发为肉痿。"}, {"f": "audio/a6/school-sch-nj-100__41.mp3", "t": "故《下经》曰："}, {"f": "audio/a6/school-sch-nj-100__42.mp3", "t": "肉痿者，"}, {"f": "audio/a6/school-sch-nj-100__43.mp3", "t": "得之湿地也。"}, {"f": "audio/a6/school-sch-nj-100__44.mp3", "t": "有所远行劳倦，"}, {"f": "audio/a6/school-sch-nj-100__45.mp3", "t": "逢大热而渴，"}, {"f": "audio/a6/school-sch-nj-100__46.mp3", "t": "渴则阳气内伐，"}, {"f": "audio/a6/school-sch-nj-100__47.mp3", "t": "内伐则热舍于肾。"}, {"f": "audio/a6/school-sch-nj-100__48.mp3", "t": "肾者水藏也，"}, {"f": "audio/a6/school-sch-nj-100__49.mp3", "t": "今水不胜火，"}, {"f": "audio/a6/school-sch-nj-100__50.mp3", "t": "则骨枯而髓虚，"}, {"f": "audio/a6/school-sch-nj-100__51.mp3", "t": "故足不任身，"}, {"f": "audio/a6/school-sch-nj-100__52.mp3", "t": "发为骨痿。"}, {"f": "audio/a6/school-sch-nj-100__53.mp3", "t": "故《下经》曰："}, {"f": "audio/a6/school-sch-nj-100__54.mp3", "t": "骨痿者，"}, {"f": "audio/a6/school-sch-nj-100__55.mp3", "t": "生于大热也。"}], "school-sch-nj-101": [{"f": "audio/b0/school-sch-nj-101__0.mp3", "t": "帝曰："}, {"f": "audio/b0/school-sch-nj-101__1.mp3", "t": "何以别之？"}, {"f": "audio/b0/school-sch-nj-101__2.mp3", "t": "岐伯曰："}, {"f": "audio/b0/school-sch-nj-101__3.mp3", "t": "肺热者，"}, {"f": "audio/b0/school-sch-nj-101__4.mp3", "t": "色白而毛败；"}, {"f": "audio/b0/school-sch-nj-101__5.mp3", "t": "心热者，"}, {"f": "audio/b0/school-sch-nj-101__6.mp3", "t": "色赤而络脉溢；"}, {"f": "audio/b0/school-sch-nj-101__7.mp3", "t": "肝热者，"}, {"f": "audio/b0/school-sch-nj-101__8.mp3", "t": "色苍而爪枯；"}, {"f": "audio/b0/school-sch-nj-101__9.mp3", "t": "脾热者，"}, {"f": "audio/b0/school-sch-nj-101__10.mp3", "t": "色黄而肉蠕动；"}, {"f": "audio/b0/school-sch-nj-101__11.mp3", "t": "肾热者，"}, {"f": "audio/b0/school-sch-nj-101__12.mp3", "t": "色黑而齿槁。"}], "school-sch-nj-102": [{"f": "audio/75/school-sch-nj-102__0.mp3", "t": "帝曰："}, {"f": "audio/75/school-sch-nj-102__1.mp3", "t": "如夫子言可矣。"}, {"f": "audio/75/school-sch-nj-102__2.mp3", "t": "论言治痿者，"}, {"f": "audio/75/school-sch-nj-102__3.mp3", "t": "独取阳明何也？"}, {"f": "audio/75/school-sch-nj-102__4.mp3", "t": "岐伯曰："}, {"f": "audio/75/school-sch-nj-102__5.mp3", "t": "阳明者，"}, {"f": "audio/75/school-sch-nj-102__6.mp3", "t": "五藏六府之海，"}, {"f": "audio/75/school-sch-nj-102__7.mp3", "t": "主润宗筋，"}, {"f": "audio/75/school-sch-nj-102__8.mp3", "t": "宗筋主束骨而利机关也。"}, {"f": "audio/75/school-sch-nj-102__9.mp3", "t": "冲脉者，"}, {"f": "audio/75/school-sch-nj-102__10.mp3", "t": "经脉之海也，"}, {"f": "audio/75/school-sch-nj-102__11.mp3", "t": "主渗灌溪谷，"}, {"f": "audio/75/school-sch-nj-102__12.mp3", "t": "与阳明合于宗筋。"}, {"f": "audio/75/school-sch-nj-102__13.mp3", "t": "阴阳总宗筋之会，"}, {"f": "audio/75/school-sch-nj-102__14.mp3", "t": "会于气街，"}, {"f": "audio/75/school-sch-nj-102__15.mp3", "t": "而阳明为之长，"}, {"f": "audio/75/school-sch-nj-102__16.mp3", "t": "皆属于带脉，"}, {"f": "audio/75/school-sch-nj-102__17.mp3", "t": "而络于督脉。"}, {"f": "audio/75/school-sch-nj-102__18.mp3", "t": "故阳明虚，"}, {"f": "audio/75/school-sch-nj-102__19.mp3", "t": "则宗筋纵，"}, {"f": "audio/75/school-sch-nj-102__20.mp3", "t": "带脉不引，"}, {"f": "audio/75/school-sch-nj-102__21.mp3", "t": "故足痿不用也。"}, {"f": "audio/75/school-sch-nj-102__22.mp3", "t": "帝曰："}, {"f": "audio/75/school-sch-nj-102__23.mp3", "t": "治之余何？"}, {"f": "audio/75/school-sch-nj-102__24.mp3", "t": "岐伯曰："}, {"f": "audio/75/school-sch-nj-102__25.mp3", "t": "各补其荥而通其俞，"}, {"f": "audio/75/school-sch-nj-102__26.mp3", "t": "调其虚实，"}, {"f": "audio/75/school-sch-nj-102__27.mp3", "t": "和其逆顺，"}, {"f": "audio/75/school-sch-nj-102__28.mp3", "t": "筋脉骨肉，"}, {"f": "audio/75/school-sch-nj-102__29.mp3", "t": "各以其时受月，"}, {"f": "audio/75/school-sch-nj-102__30.mp3", "t": "则病已矣。"}, {"f": "audio/75/school-sch-nj-102__31.mp3", "t": "帝曰："}, {"f": "audio/75/school-sch-nj-102__32.mp3", "t": "善。"}], "school-sch-nj-103": [{"f": "audio/1c/school-sch-nj-103__0.mp3", "t": "黄帝问于岐伯曰："}, {"f": "audio/1c/school-sch-nj-103__1.mp3", "t": "水与肤胀、"}, {"f": "audio/1c/school-sch-nj-103__2.mp3", "t": "鼓胀、"}, {"f": "audio/1c/school-sch-nj-103__3.mp3", "t": "肠覃、"}, {"f": "audio/1c/school-sch-nj-103__4.mp3", "t": "石瘕、"}, {"f": "audio/1c/school-sch-nj-103__5.mp3", "t": "石水，"}, {"f": "audio/1c/school-sch-nj-103__6.mp3", "t": "何以别之？"}, {"f": "audio/1c/school-sch-nj-103__7.mp3", "t": "岐伯答曰："}, {"f": "audio/1c/school-sch-nj-103__8.mp3", "t": "水始起也，"}, {"f": "audio/1c/school-sch-nj-103__9.mp3", "t": "目窠上微肿，"}, {"f": "audio/1c/school-sch-nj-103__10.mp3", "t": "如新卧起之状，"}, {"f": "audio/1c/school-sch-nj-103__11.mp3", "t": "其颈脉动，"}, {"f": "audio/1c/school-sch-nj-103__12.mp3", "t": "时咳，"}, {"f": "audio/1c/school-sch-nj-103__13.mp3", "t": "阴股间寒，"}, {"f": "audio/1c/school-sch-nj-103__14.mp3", "t": "足胫肿，"}, {"f": "audio/1c/school-sch-nj-103__15.mp3", "t": "腹乃大，"}, {"f": "audio/1c/school-sch-nj-103__16.mp3", "t": "其水已成矣。"}, {"f": "audio/1c/school-sch-nj-103__17.mp3", "t": "以手按其腹，"}, {"f": "audio/1c/school-sch-nj-103__18.mp3", "t": "随手而起，"}, {"f": "audio/1c/school-sch-nj-103__19.mp3", "t": "如裹水之状，"}, {"f": "audio/1c/school-sch-nj-103__20.mp3", "t": "此其候也。"}], "school-sch-nj-104": [{"f": "audio/5d/school-sch-nj-104__0.mp3", "t": "黄帝曰："}, {"f": "audio/5d/school-sch-nj-104__1.mp3", "t": "肤胀何以候之？"}, {"f": "audio/5d/school-sch-nj-104__2.mp3", "t": "岐伯曰："}, {"f": "audio/5d/school-sch-nj-104__3.mp3", "t": "肤胀者，"}, {"f": "audio/5d/school-sch-nj-104__4.mp3", "t": "寒气客于皮肤之间，"}, {"f": "audio/5d/school-sch-nj-104__5.mp3", "t": "𪔣𪔣然不坚，"}, {"f": "audio/5d/school-sch-nj-104__6.mp3", "t": "腹大，"}, {"f": "audio/5d/school-sch-nj-104__7.mp3", "t": "身尽肿，"}, {"f": "audio/5d/school-sch-nj-104__8.mp3", "t": "皮厚，"}, {"f": "audio/5d/school-sch-nj-104__9.mp3", "t": "按其腹，"}, {"f": "audio/5d/school-sch-nj-104__10.mp3", "t": "窅而不起，"}, {"f": "audio/5d/school-sch-nj-104__11.mp3", "t": "腹色不变，"}, {"f": "audio/5d/school-sch-nj-104__12.mp3", "t": "此其候也。"}], "school-sch-nj-105": [{"f": "audio/e9/school-sch-nj-105__0.mp3", "t": "鼓胀何如？"}, {"f": "audio/e9/school-sch-nj-105__1.mp3", "t": "岐伯曰："}, {"f": "audio/e9/school-sch-nj-105__2.mp3", "t": "腹胀身皆大，"}, {"f": "audio/e9/school-sch-nj-105__3.mp3", "t": "大与肤胀等也，"}, {"f": "audio/e9/school-sch-nj-105__4.mp3", "t": "色苍黄，"}, {"f": "audio/e9/school-sch-nj-105__5.mp3", "t": "腹筋起，"}, {"f": "audio/e9/school-sch-nj-105__6.mp3", "t": "此其候也。"}], "school-sch-nj-106": [{"f": "audio/15/school-sch-nj-106__0.mp3", "t": "肠覃何如？"}, {"f": "audio/15/school-sch-nj-106__1.mp3", "t": "岐伯曰："}, {"f": "audio/15/school-sch-nj-106__2.mp3", "t": "寒气客于肠外，"}, {"f": "audio/15/school-sch-nj-106__3.mp3", "t": "与卫气相搏，"}, {"f": "audio/15/school-sch-nj-106__4.mp3", "t": "气不得荣，"}, {"f": "audio/15/school-sch-nj-106__5.mp3", "t": "因有所系，"}, {"f": "audio/15/school-sch-nj-106__6.mp3", "t": "癖而内著，"}, {"f": "audio/15/school-sch-nj-106__7.mp3", "t": "恶气乃起，"}, {"f": "audio/15/school-sch-nj-106__8.mp3", "t": "瘜肉乃生。"}, {"f": "audio/15/school-sch-nj-106__9.mp3", "t": "其始生也，"}, {"f": "audio/15/school-sch-nj-106__10.mp3", "t": "大如鸡卵，"}, {"f": "audio/15/school-sch-nj-106__11.mp3", "t": "稍以益大，"}, {"f": "audio/15/school-sch-nj-106__12.mp3", "t": "至其成，"}, {"f": "audio/15/school-sch-nj-106__13.mp3", "t": "如怀子之状，"}, {"f": "audio/15/school-sch-nj-106__14.mp3", "t": "久者离岁，"}, {"f": "audio/15/school-sch-nj-106__15.mp3", "t": "按之则坚，"}, {"f": "audio/15/school-sch-nj-106__16.mp3", "t": "推之则移，"}, {"f": "audio/15/school-sch-nj-106__17.mp3", "t": "月事以时下，"}, {"f": "audio/15/school-sch-nj-106__18.mp3", "t": "此其候也。"}], "school-sch-nj-107": [{"f": "audio/b1/school-sch-nj-107__0.mp3", "t": "石瘕何如？"}, {"f": "audio/b1/school-sch-nj-107__1.mp3", "t": "岐伯曰："}, {"f": "audio/b1/school-sch-nj-107__2.mp3", "t": "石瘕生于胞中，"}, {"f": "audio/b1/school-sch-nj-107__3.mp3", "t": "寒气客于子门，"}, {"f": "audio/b1/school-sch-nj-107__4.mp3", "t": "子门闭塞，"}, {"f": "audio/b1/school-sch-nj-107__5.mp3", "t": "气不得通，"}, {"f": "audio/b1/school-sch-nj-107__6.mp3", "t": "恶血当写不写，"}, {"f": "audio/b1/school-sch-nj-107__7.mp3", "t": "衃以留止。"}, {"f": "audio/b1/school-sch-nj-107__8.mp3", "t": "日以益大，"}, {"f": "audio/b1/school-sch-nj-107__9.mp3", "t": "状如怀子，"}, {"f": "audio/b1/school-sch-nj-107__10.mp3", "t": "月事不以时下。"}, {"f": "audio/b1/school-sch-nj-107__11.mp3", "t": "皆生于女子，"}, {"f": "audio/b1/school-sch-nj-107__12.mp3", "t": "可导而下。"}], "school-sch-nj-108": [{"f": "audio/61/school-sch-nj-108__0.mp3", "t": "黄帝曰："}, {"f": "audio/61/school-sch-nj-108__1.mp3", "t": "肤胀、"}, {"f": "audio/61/school-sch-nj-108__2.mp3", "t": "鼓胀，"}, {"f": "audio/61/school-sch-nj-108__3.mp3", "t": "可刺邪？"}, {"f": "audio/61/school-sch-nj-108__4.mp3", "t": "岐伯曰："}, {"f": "audio/61/school-sch-nj-108__5.mp3", "t": "先写其胀之血络，"}, {"f": "audio/61/school-sch-nj-108__6.mp3", "t": "后调其经，"}, {"f": "audio/61/school-sch-nj-108__7.mp3", "t": "刺去其血络也。"}], "school-sch-nj-109": [{"f": "audio/db/school-sch-nj-109__0.mp3", "t": "黄帝问曰："}, {"f": "audio/db/school-sch-nj-109__1.mp3", "t": "诊法何如？"}, {"f": "audio/db/school-sch-nj-109__2.mp3", "t": "岐伯对曰："}, {"f": "audio/db/school-sch-nj-109__3.mp3", "t": "诊法常以平旦，"}, {"f": "audio/db/school-sch-nj-109__4.mp3", "t": "阴气未动，"}, {"f": "audio/db/school-sch-nj-109__5.mp3", "t": "阳气未散，"}, {"f": "audio/db/school-sch-nj-109__6.mp3", "t": "饮食未进，"}, {"f": "audio/db/school-sch-nj-109__7.mp3", "t": "经脉未盛，"}, {"f": "audio/db/school-sch-nj-109__8.mp3", "t": "络脉调匀，"}, {"f": "audio/db/school-sch-nj-109__9.mp3", "t": "气血未乱，"}, {"f": "audio/db/school-sch-nj-109__10.mp3", "t": "故乃可诊有过之脉。"}, {"f": "audio/db/school-sch-nj-109__11.mp3", "t": "切脉动静，"}, {"f": "audio/db/school-sch-nj-109__12.mp3", "t": "而视精明，"}, {"f": "audio/db/school-sch-nj-109__13.mp3", "t": "察五色，"}, {"f": "audio/db/school-sch-nj-109__14.mp3", "t": "观五藏有余不足，"}, {"f": "audio/db/school-sch-nj-109__15.mp3", "t": "六府强弱，"}, {"f": "audio/db/school-sch-nj-109__16.mp3", "t": "形之盛衰，"}, {"f": "audio/db/school-sch-nj-109__17.mp3", "t": "以此参伍，"}, {"f": "audio/db/school-sch-nj-109__18.mp3", "t": "决死生之分。"}], "school-sch-nj-110": [{"f": "audio/85/school-sch-nj-110__0.mp3", "t": "夫脉者，"}, {"f": "audio/85/school-sch-nj-110__1.mp3", "t": "血之府也。"}, {"f": "audio/85/school-sch-nj-110__2.mp3", "t": "长则气治；"}, {"f": "audio/85/school-sch-nj-110__3.mp3", "t": "短则气病；"}, {"f": "audio/85/school-sch-nj-110__4.mp3", "t": "数则烦心；"}, {"f": "audio/85/school-sch-nj-110__5.mp3", "t": "大则病进；"}, {"f": "audio/85/school-sch-nj-110__6.mp3", "t": "上盛则气高；"}, {"f": "audio/85/school-sch-nj-110__7.mp3", "t": "下盛则气胀；"}, {"f": "audio/85/school-sch-nj-110__8.mp3", "t": "代则气衰；"}, {"f": "audio/85/school-sch-nj-110__9.mp3", "t": "细则气少；"}, {"f": "audio/85/school-sch-nj-110__10.mp3", "t": "涩则心痛；"}, {"f": "audio/85/school-sch-nj-110__11.mp3", "t": "浑浑革至如涌泉，"}, {"f": "audio/85/school-sch-nj-110__12.mp3", "t": "病进而色弊；"}, {"f": "audio/85/school-sch-nj-110__13.mp3", "t": "绵绵其去如弦绝，"}, {"f": "audio/85/school-sch-nj-110__14.mp3", "t": "死。"}], "school-sch-nj-111": [{"f": "audio/3a/school-sch-nj-111__0.mp3", "t": "夫精明五色者，"}, {"f": "audio/3a/school-sch-nj-111__1.mp3", "t": "气之华也。"}, {"f": "audio/3a/school-sch-nj-111__2.mp3", "t": "赤欲如白裹朱，"}, {"f": "audio/3a/school-sch-nj-111__3.mp3", "t": "不欲如赭；"}, {"f": "audio/3a/school-sch-nj-111__4.mp3", "t": "白欲如鹅羽，"}, {"f": "audio/3a/school-sch-nj-111__5.mp3", "t": "不欲如盐，"}, {"f": "audio/3a/school-sch-nj-111__6.mp3", "t": "青欲如苍璧之泽，"}, {"f": "audio/3a/school-sch-nj-111__7.mp3", "t": "不欲如蓝；"}, {"f": "audio/3a/school-sch-nj-111__8.mp3", "t": "黄欲如罗裹雄黄，"}, {"f": "audio/3a/school-sch-nj-111__9.mp3", "t": "不欲如黄土；"}, {"f": "audio/3a/school-sch-nj-111__10.mp3", "t": "黑欲如重漆色，"}, {"f": "audio/3a/school-sch-nj-111__11.mp3", "t": "不欲如地苍。"}, {"f": "audio/3a/school-sch-nj-111__12.mp3", "t": "五色精微象见矣，"}, {"f": "audio/3a/school-sch-nj-111__13.mp3", "t": "其寿不久也。"}, {"f": "audio/3a/school-sch-nj-111__14.mp3", "t": "夫精明者，"}, {"f": "audio/3a/school-sch-nj-111__15.mp3", "t": "所以视万物，"}, {"f": "audio/3a/school-sch-nj-111__16.mp3", "t": "别白黑，"}, {"f": "audio/3a/school-sch-nj-111__17.mp3", "t": "审短长，"}, {"f": "audio/3a/school-sch-nj-111__18.mp3", "t": "以长为短，"}, {"f": "audio/3a/school-sch-nj-111__19.mp3", "t": "以白为黑，"}, {"f": "audio/3a/school-sch-nj-111__20.mp3", "t": "如是则精衰矣。"}], "school-sch-nj-112": [{"f": "audio/d0/school-sch-nj-112__0.mp3", "t": "五藏者，"}, {"f": "audio/d0/school-sch-nj-112__1.mp3", "t": "中之守也。"}, {"f": "audio/d0/school-sch-nj-112__2.mp3", "t": "中盛藏满，"}, {"f": "audio/d0/school-sch-nj-112__3.mp3", "t": "气胜伤恐者，"}, {"f": "audio/d0/school-sch-nj-112__4.mp3", "t": "声如从室中言，"}, {"f": "audio/d0/school-sch-nj-112__5.mp3", "t": "是中气之湿也；"}, {"f": "audio/d0/school-sch-nj-112__6.mp3", "t": "言而微，"}, {"f": "audio/d0/school-sch-nj-112__7.mp3", "t": "终日乃复言者，"}, {"f": "audio/d0/school-sch-nj-112__8.mp3", "t": "此夺气也；"}, {"f": "audio/d0/school-sch-nj-112__9.mp3", "t": "衣被不敛，"}, {"f": "audio/d0/school-sch-nj-112__10.mp3", "t": "言语善恶不避亲疏者，"}, {"f": "audio/d0/school-sch-nj-112__11.mp3", "t": "此神明之乱也；"}, {"f": "audio/d0/school-sch-nj-112__12.mp3", "t": "仓廪不藏者，"}, {"f": "audio/d0/school-sch-nj-112__13.mp3", "t": "是门户不要也；"}, {"f": "audio/d0/school-sch-nj-112__14.mp3", "t": "水泉不止者，"}, {"f": "audio/d0/school-sch-nj-112__15.mp3", "t": "是膀胱不藏也。"}, {"f": "audio/d0/school-sch-nj-112__16.mp3", "t": "得守者生，"}, {"f": "audio/d0/school-sch-nj-112__17.mp3", "t": "失守者死。"}], "school-sch-nj-113": [{"f": "audio/ef/school-sch-nj-113__0.mp3", "t": "夫五藏者，"}, {"f": "audio/ef/school-sch-nj-113__1.mp3", "t": "身之强也。"}, {"f": "audio/ef/school-sch-nj-113__2.mp3", "t": "头者，"}, {"f": "audio/ef/school-sch-nj-113__3.mp3", "t": "精明之府，"}, {"f": "audio/ef/school-sch-nj-113__4.mp3", "t": "头倾视深，"}, {"f": "audio/ef/school-sch-nj-113__5.mp3", "t": "精神将夺矣；"}, {"f": "audio/ef/school-sch-nj-113__6.mp3", "t": "背者，"}, {"f": "audio/ef/school-sch-nj-113__7.mp3", "t": "胸中之府，"}, {"f": "audio/ef/school-sch-nj-113__8.mp3", "t": "背曲肩随，"}, {"f": "audio/ef/school-sch-nj-113__9.mp3", "t": "府将坏矣；"}, {"f": "audio/ef/school-sch-nj-113__10.mp3", "t": "腰者，"}, {"f": "audio/ef/school-sch-nj-113__11.mp3", "t": "肾之府，"}, {"f": "audio/ef/school-sch-nj-113__12.mp3", "t": "转摇不能，"}, {"f": "audio/ef/school-sch-nj-113__13.mp3", "t": "肾将惫矣；"}, {"f": "audio/ef/school-sch-nj-113__14.mp3", "t": "膝者，"}, {"f": "audio/ef/school-sch-nj-113__15.mp3", "t": "筋之府，"}, {"f": "audio/ef/school-sch-nj-113__16.mp3", "t": "屈伸不能，"}, {"f": "audio/ef/school-sch-nj-113__17.mp3", "t": "行则偻附，"}, {"f": "audio/ef/school-sch-nj-113__18.mp3", "t": "筋将惫矣；"}, {"f": "audio/ef/school-sch-nj-113__19.mp3", "t": "骨者，"}, {"f": "audio/ef/school-sch-nj-113__20.mp3", "t": "髓之府，"}, {"f": "audio/ef/school-sch-nj-113__21.mp3", "t": "不能久立，"}, {"f": "audio/ef/school-sch-nj-113__22.mp3", "t": "行则振掉，"}, {"f": "audio/ef/school-sch-nj-113__23.mp3", "t": "骨将惫矣。"}, {"f": "audio/ef/school-sch-nj-113__24.mp3", "t": "得强则生，"}, {"f": "audio/ef/school-sch-nj-113__25.mp3", "t": "失强则死。"}], "school-sch-nj-114": [{"f": "audio/2f/school-sch-nj-114__0.mp3", "t": "帝曰："}, {"f": "audio/2f/school-sch-nj-114__1.mp3", "t": "脉其四时动奈何？"}, {"f": "audio/2f/school-sch-nj-114__2.mp3", "t": "知病之所在奈何？"}, {"f": "audio/2f/school-sch-nj-114__3.mp3", "t": "知病之所变奈何？"}, {"f": "audio/2f/school-sch-nj-114__4.mp3", "t": "知病乍在内奈何？"}, {"f": "audio/2f/school-sch-nj-114__5.mp3", "t": "知病乍在外奈何？"}, {"f": "audio/2f/school-sch-nj-114__6.mp3", "t": "请问此五者，"}, {"f": "audio/2f/school-sch-nj-114__7.mp3", "t": "可得闻乎？"}, {"f": "audio/2f/school-sch-nj-114__8.mp3", "t": "岐伯曰："}, {"f": "audio/2f/school-sch-nj-114__9.mp3", "t": "请言其与天运转大也。"}, {"f": "audio/2f/school-sch-nj-114__10.mp3", "t": "万物之外，"}, {"f": "audio/2f/school-sch-nj-114__11.mp3", "t": "六合之内，"}, {"f": "audio/2f/school-sch-nj-114__12.mp3", "t": "天地之变，"}, {"f": "audio/2f/school-sch-nj-114__13.mp3", "t": "阴阳之应，"}, {"f": "audio/2f/school-sch-nj-114__14.mp3", "t": "彼春之暖，"}, {"f": "audio/2f/school-sch-nj-114__15.mp3", "t": "为夏之暑，"}, {"f": "audio/2f/school-sch-nj-114__16.mp3", "t": "彼秋之忿，"}, {"f": "audio/2f/school-sch-nj-114__17.mp3", "t": "为冬之怒。"}, {"f": "audio/2f/school-sch-nj-114__18.mp3", "t": "四变之动，"}, {"f": "audio/2f/school-sch-nj-114__19.mp3", "t": "脉与之上下，"}, {"f": "audio/2f/school-sch-nj-114__20.mp3", "t": "以春应中规，"}, {"f": "audio/2f/school-sch-nj-114__21.mp3", "t": "夏应中矩，"}, {"f": "audio/2f/school-sch-nj-114__22.mp3", "t": "秋应中衡，"}, {"f": "audio/2f/school-sch-nj-114__23.mp3", "t": "冬应中权。"}, {"f": "audio/2f/school-sch-nj-114__24.mp3", "t": "是故冬至四十五日，"}, {"f": "audio/2f/school-sch-nj-114__25.mp3", "t": "阳气微上，"}, {"f": "audio/2f/school-sch-nj-114__26.mp3", "t": "阴气微下；"}, {"f": "audio/2f/school-sch-nj-114__27.mp3", "t": "夏至四十五日，"}, {"f": "audio/2f/school-sch-nj-114__28.mp3", "t": "阴气微上，"}, {"f": "audio/2f/school-sch-nj-114__29.mp3", "t": "阳气微下。"}, {"f": "audio/2f/school-sch-nj-114__30.mp3", "t": "阴阳有时，"}, {"f": "audio/2f/school-sch-nj-114__31.mp3", "t": "与脉为期，"}, {"f": "audio/2f/school-sch-nj-114__32.mp3", "t": "期而相失，"}, {"f": "audio/2f/school-sch-nj-114__33.mp3", "t": "知脉所分，"}, {"f": "audio/2f/school-sch-nj-114__34.mp3", "t": "分之有期，"}, {"f": "audio/2f/school-sch-nj-114__35.mp3", "t": "故知死时。"}, {"f": "audio/2f/school-sch-nj-114__36.mp3", "t": "微妙在脉，"}, {"f": "audio/2f/school-sch-nj-114__37.mp3", "t": "不可不察，"}, {"f": "audio/2f/school-sch-nj-114__38.mp3", "t": "察之有纪，"}, {"f": "audio/2f/school-sch-nj-114__39.mp3", "t": "从阴阳始，"}, {"f": "audio/2f/school-sch-nj-114__40.mp3", "t": "始之有经，"}, {"f": "audio/2f/school-sch-nj-114__41.mp3", "t": "从五行生，"}, {"f": "audio/2f/school-sch-nj-114__42.mp3", "t": "生之有度，"}, {"f": "audio/2f/school-sch-nj-114__43.mp3", "t": "四时为宜。"}, {"f": "audio/2f/school-sch-nj-114__44.mp3", "t": "补泻勿失，"}, {"f": "audio/2f/school-sch-nj-114__45.mp3", "t": "与天地如一，"}, {"f": "audio/2f/school-sch-nj-114__46.mp3", "t": "得一之情，"}, {"f": "audio/2f/school-sch-nj-114__47.mp3", "t": "以知死生。"}, {"f": "audio/2f/school-sch-nj-114__48.mp3", "t": "是故声合五音，"}, {"f": "audio/2f/school-sch-nj-114__49.mp3", "t": "色合五行，"}, {"f": "audio/2f/school-sch-nj-114__50.mp3", "t": "脉合阴阳。"}], "school-sch-nj-115": [{"f": "audio/f2/school-sch-nj-115__0.mp3", "t": "是故持脉有道，"}, {"f": "audio/f2/school-sch-nj-115__1.mp3", "t": "虚静为保。"}, {"f": "audio/f2/school-sch-nj-115__2.mp3", "t": "春日浮，"}, {"f": "audio/f2/school-sch-nj-115__3.mp3", "t": "如鱼之游在波；"}, {"f": "audio/f2/school-sch-nj-115__4.mp3", "t": "夏日在肤，"}, {"f": "audio/f2/school-sch-nj-115__5.mp3", "t": "泛泛乎万物有余；"}, {"f": "audio/f2/school-sch-nj-115__6.mp3", "t": "秋日下肤，"}, {"f": "audio/f2/school-sch-nj-115__7.mp3", "t": "蛰虫将去；"}, {"f": "audio/f2/school-sch-nj-115__8.mp3", "t": "冬日在骨，"}, {"f": "audio/f2/school-sch-nj-115__9.mp3", "t": "蛰虫周密，"}, {"f": "audio/f2/school-sch-nj-115__10.mp3", "t": "君子居室。"}, {"f": "audio/f2/school-sch-nj-115__11.mp3", "t": "故曰："}, {"f": "audio/f2/school-sch-nj-115__12.mp3", "t": "知内者按而纪之，"}, {"f": "audio/f2/school-sch-nj-115__13.mp3", "t": "知外者终而始之。"}, {"f": "audio/f2/school-sch-nj-115__14.mp3", "t": "此六者，"}, {"f": "audio/f2/school-sch-nj-115__15.mp3", "t": "持脉之大法。"}], "school-sch-nj-116": [{"f": "audio/4a/school-sch-nj-116__0.mp3", "t": "黄帝问曰："}, {"f": "audio/4a/school-sch-nj-116__1.mp3", "t": "平人何如？"}, {"f": "audio/4a/school-sch-nj-116__2.mp3", "t": "岐伯对曰："}, {"f": "audio/4a/school-sch-nj-116__3.mp3", "t": "人一呼脉再动，"}, {"f": "audio/4a/school-sch-nj-116__4.mp3", "t": "一吸脉亦再动，"}, {"f": "audio/4a/school-sch-nj-116__5.mp3", "t": "呼吸定息脉五动，"}, {"f": "audio/4a/school-sch-nj-116__6.mp3", "t": "闰以太息，"}, {"f": "audio/4a/school-sch-nj-116__7.mp3", "t": "命曰平人。"}, {"f": "audio/4a/school-sch-nj-116__8.mp3", "t": "平人者，"}, {"f": "audio/4a/school-sch-nj-116__9.mp3", "t": "不病也。"}, {"f": "audio/4a/school-sch-nj-116__10.mp3", "t": "常以不病调病人，"}, {"f": "audio/4a/school-sch-nj-116__11.mp3", "t": "医不病，"}, {"f": "audio/4a/school-sch-nj-116__12.mp3", "t": "故为病人平息以调之为法。"}, {"f": "audio/4a/school-sch-nj-116__13.mp3", "t": "人一呼脉一动，"}, {"f": "audio/4a/school-sch-nj-116__14.mp3", "t": "一吸脉一动，"}, {"f": "audio/4a/school-sch-nj-116__15.mp3", "t": "曰少气。"}, {"f": "audio/4a/school-sch-nj-116__16.mp3", "t": "人一呼脉三动，"}, {"f": "audio/4a/school-sch-nj-116__17.mp3", "t": "一吸脉三动而躁，"}, {"f": "audio/4a/school-sch-nj-116__18.mp3", "t": "尺热曰病温，"}, {"f": "audio/4a/school-sch-nj-116__19.mp3", "t": "尺不热脉滑曰病风，"}, {"f": "audio/4a/school-sch-nj-116__20.mp3", "t": "脉涩曰痹。"}, {"f": "audio/4a/school-sch-nj-116__21.mp3", "t": "人一呼吸脉四动以上曰死，"}, {"f": "audio/4a/school-sch-nj-116__22.mp3", "t": "脉绝不至曰死，"}, {"f": "audio/4a/school-sch-nj-116__23.mp3", "t": "乍疏乍数曰死。"}], "school-sch-nj-117": [{"f": "audio/1a/school-sch-nj-117__0.mp3", "t": "平人之常气禀于胃，"}, {"f": "audio/1a/school-sch-nj-117__1.mp3", "t": "胃者平人之常气也，"}, {"f": "audio/1a/school-sch-nj-117__2.mp3", "t": "人无胃气曰逆，"}, {"f": "audio/1a/school-sch-nj-117__3.mp3", "t": "逆者死。"}, {"f": "audio/1a/school-sch-nj-117__4.mp3", "t": "春胃微弦曰平，"}, {"f": "audio/1a/school-sch-nj-117__5.mp3", "t": "弦多胃少曰肝病，"}, {"f": "audio/1a/school-sch-nj-117__6.mp3", "t": "但弦无胃曰死，"}, {"f": "audio/1a/school-sch-nj-117__7.mp3", "t": "胃而有毛曰秋病，"}, {"f": "audio/1a/school-sch-nj-117__8.mp3", "t": "毛甚曰今病。"}, {"f": "audio/1a/school-sch-nj-117__9.mp3", "t": "藏真散于肝，"}, {"f": "audio/1a/school-sch-nj-117__10.mp3", "t": "肝藏筋膜之气也。"}, {"f": "audio/1a/school-sch-nj-117__11.mp3", "t": "夏胃微钩曰平，"}, {"f": "audio/1a/school-sch-nj-117__12.mp3", "t": "钩多胃少曰心病，"}, {"f": "audio/1a/school-sch-nj-117__13.mp3", "t": "但钩无胃曰死，"}, {"f": "audio/1a/school-sch-nj-117__14.mp3", "t": "胃而有石曰冬病，"}, {"f": "audio/1a/school-sch-nj-117__15.mp3", "t": "石甚曰今病。"}, {"f": "audio/1a/school-sch-nj-117__16.mp3", "t": "藏真通于心，"}, {"f": "audio/1a/school-sch-nj-117__17.mp3", "t": "心藏血脉之气也。"}, {"f": "audio/1a/school-sch-nj-117__18.mp3", "t": "长夏胃微软弱曰平，"}, {"f": "audio/1a/school-sch-nj-117__19.mp3", "t": "弱多胃少曰脾病，"}, {"f": "audio/1a/school-sch-nj-117__20.mp3", "t": "但代无胃曰死，"}, {"f": "audio/1a/school-sch-nj-117__21.mp3", "t": "软弱有石曰冬病，"}, {"f": "audio/1a/school-sch-nj-117__22.mp3", "t": "弱甚曰今病。"}, {"f": "audio/1a/school-sch-nj-117__23.mp3", "t": "藏真濡于脾，"}, {"f": "audio/1a/school-sch-nj-117__24.mp3", "t": "脾藏肌肉之气也。"}, {"f": "audio/1a/school-sch-nj-117__25.mp3", "t": "秋胃微毛曰平，"}, {"f": "audio/1a/school-sch-nj-117__26.mp3", "t": "毛多胃少曰肺病，"}, {"f": "audio/1a/school-sch-nj-117__27.mp3", "t": "但毛无胃曰死。"}, {"f": "audio/1a/school-sch-nj-117__28.mp3", "t": "毛而有弦曰春病，"}, {"f": "audio/1a/school-sch-nj-117__29.mp3", "t": "弦甚曰今病。"}, {"f": "audio/1a/school-sch-nj-117__30.mp3", "t": "藏真高于肺，"}, {"f": "audio/1a/school-sch-nj-117__31.mp3", "t": "以行营卫阴阳也。"}, {"f": "audio/1a/school-sch-nj-117__32.mp3", "t": "冬胃微石曰平，"}, {"f": "audio/1a/school-sch-nj-117__33.mp3", "t": "石多胃少曰肾病，"}, {"f": "audio/1a/school-sch-nj-117__34.mp3", "t": "但石无胃曰死，"}, {"f": "audio/1a/school-sch-nj-117__35.mp3", "t": "石而有钩曰夏病，"}, {"f": "audio/1a/school-sch-nj-117__36.mp3", "t": "钩甚曰今病。"}, {"f": "audio/1a/school-sch-nj-117__37.mp3", "t": "藏真下于肾，"}, {"f": "audio/1a/school-sch-nj-117__38.mp3", "t": "肾藏骨髓之气也。"}], "school-sch-nj-118": [{"f": "audio/f8/school-sch-nj-118__0.mp3", "t": "胃之大络，"}, {"f": "audio/f8/school-sch-nj-118__1.mp3", "t": "名曰虚里，"}, {"f": "audio/f8/school-sch-nj-118__2.mp3", "t": "贯鬲络肺，"}, {"f": "audio/f8/school-sch-nj-118__3.mp3", "t": "出于左乳下，"}, {"f": "audio/f8/school-sch-nj-118__4.mp3", "t": "其动应衣，"}, {"f": "audio/f8/school-sch-nj-118__5.mp3", "t": "脉宗气也。"}, {"f": "audio/f8/school-sch-nj-118__6.mp3", "t": "盛喘数绝者，"}, {"f": "audio/f8/school-sch-nj-118__7.mp3", "t": "则病在中；"}, {"f": "audio/f8/school-sch-nj-118__8.mp3", "t": "结而横，"}, {"f": "audio/f8/school-sch-nj-118__9.mp3", "t": "有积矣；"}, {"f": "audio/f8/school-sch-nj-118__10.mp3", "t": "绝不至曰死。"}, {"f": "audio/f8/school-sch-nj-118__11.mp3", "t": "乳之下，"}, {"f": "audio/f8/school-sch-nj-118__12.mp3", "t": "其动应衣，"}, {"f": "audio/f8/school-sch-nj-118__13.mp3", "t": "宗气泄也。"}], "school-sch-nj-119": [{"f": "audio/a6/school-sch-nj-119__0.mp3", "t": "五藏受气于其所生，"}, {"f": "audio/a6/school-sch-nj-119__1.mp3", "t": "传之于其所胜，"}, {"f": "audio/a6/school-sch-nj-119__2.mp3", "t": "气舍于其所生，"}, {"f": "audio/a6/school-sch-nj-119__3.mp3", "t": "死于其所不胜。"}, {"f": "audio/a6/school-sch-nj-119__4.mp3", "t": "病之且死，"}, {"f": "audio/a6/school-sch-nj-119__5.mp3", "t": "必先传行，"}, {"f": "audio/a6/school-sch-nj-119__6.mp3", "t": "至其所不胜，"}, {"f": "audio/a6/school-sch-nj-119__7.mp3", "t": "病乃死。"}, {"f": "audio/a6/school-sch-nj-119__8.mp3", "t": "此言气之逆行也，"}, {"f": "audio/a6/school-sch-nj-119__9.mp3", "t": "故死。"}, {"f": "audio/a6/school-sch-nj-119__10.mp3", "t": "肝受气于心，"}, {"f": "audio/a6/school-sch-nj-119__11.mp3", "t": "传之于脾，"}, {"f": "audio/a6/school-sch-nj-119__12.mp3", "t": "气舍于肾，"}, {"f": "audio/a6/school-sch-nj-119__13.mp3", "t": "至肺而死。"}, {"f": "audio/a6/school-sch-nj-119__14.mp3", "t": "心受气于脾，"}, {"f": "audio/a6/school-sch-nj-119__15.mp3", "t": "传之于肺，"}, {"f": "audio/a6/school-sch-nj-119__16.mp3", "t": "气舍于肝，"}, {"f": "audio/a6/school-sch-nj-119__17.mp3", "t": "至肾而死。"}, {"f": "audio/a6/school-sch-nj-119__18.mp3", "t": "脾受气于肺，"}, {"f": "audio/a6/school-sch-nj-119__19.mp3", "t": "传之于肾，"}, {"f": "audio/a6/school-sch-nj-119__20.mp3", "t": "气舍于心，"}, {"f": "audio/a6/school-sch-nj-119__21.mp3", "t": "至肝而死。"}, {"f": "audio/a6/school-sch-nj-119__22.mp3", "t": "肺受气于肾，"}, {"f": "audio/a6/school-sch-nj-119__23.mp3", "t": "传之于肝，"}, {"f": "audio/a6/school-sch-nj-119__24.mp3", "t": "气舍于脾，"}, {"f": "audio/a6/school-sch-nj-119__25.mp3", "t": "至心而死。"}, {"f": "audio/a6/school-sch-nj-119__26.mp3", "t": "肾受气于肝，"}, {"f": "audio/a6/school-sch-nj-119__27.mp3", "t": "传之于心，"}, {"f": "audio/a6/school-sch-nj-119__28.mp3", "t": "气舍于肺，"}, {"f": "audio/a6/school-sch-nj-119__29.mp3", "t": "至脾而死。"}, {"f": "audio/a6/school-sch-nj-119__30.mp3", "t": "此皆逆死也，"}, {"f": "audio/a6/school-sch-nj-119__31.mp3", "t": "一日一夜五分之，"}, {"f": "audio/a6/school-sch-nj-119__32.mp3", "t": "此所以占死生之早暮也。"}, {"f": "audio/a6/school-sch-nj-119__33.mp3", "t": "黄帝曰："}, {"f": "audio/a6/school-sch-nj-119__34.mp3", "t": "五藏相通，"}, {"f": "audio/a6/school-sch-nj-119__35.mp3", "t": "移皆有次。"}, {"f": "audio/a6/school-sch-nj-119__36.mp3", "t": "五藏有病，"}, {"f": "audio/a6/school-sch-nj-119__37.mp3", "t": "则各传其所胜。"}, {"f": "audio/a6/school-sch-nj-119__38.mp3", "t": "不治，"}, {"f": "audio/a6/school-sch-nj-119__39.mp3", "t": "法三月若六月，"}, {"f": "audio/a6/school-sch-nj-119__40.mp3", "t": "若三日若六日，"}, {"f": "audio/a6/school-sch-nj-119__41.mp3", "t": "传五藏而当死，"}, {"f": "audio/a6/school-sch-nj-119__42.mp3", "t": "是顺传所胜之次。"}, {"f": "audio/a6/school-sch-nj-119__43.mp3", "t": "故曰："}, {"f": "audio/a6/school-sch-nj-119__44.mp3", "t": "\"别于阳者，"}, {"f": "audio/a6/school-sch-nj-119__45.mp3", "t": "知病从来；"}, {"f": "audio/a6/school-sch-nj-119__46.mp3", "t": "别于阴者，"}, {"f": "audio/a6/school-sch-nj-119__47.mp3", "t": "知死生之期。"}, {"f": "audio/a6/school-sch-nj-119__48.mp3", "t": "\"言知至其所困而死。"}], "school-sch-nj-120": [{"f": "audio/bc/school-sch-nj-120__0.mp3", "t": "黄帝曰："}, {"f": "audio/bc/school-sch-nj-120__1.mp3", "t": "余闻虚实以决死生，"}, {"f": "audio/bc/school-sch-nj-120__2.mp3", "t": "愿闻其情。"}, {"f": "audio/bc/school-sch-nj-120__3.mp3", "t": "岐伯曰："}, {"f": "audio/bc/school-sch-nj-120__4.mp3", "t": "五实死，"}, {"f": "audio/bc/school-sch-nj-120__5.mp3", "t": "五虚死。"}, {"f": "audio/bc/school-sch-nj-120__6.mp3", "t": "帝曰："}, {"f": "audio/bc/school-sch-nj-120__7.mp3", "t": "愿闻五实五虚。"}, {"f": "audio/bc/school-sch-nj-120__8.mp3", "t": "岐伯曰："}, {"f": "audio/bc/school-sch-nj-120__9.mp3", "t": "脉盛，"}, {"f": "audio/bc/school-sch-nj-120__10.mp3", "t": "皮热，"}, {"f": "audio/bc/school-sch-nj-120__11.mp3", "t": "腹胀，"}, {"f": "audio/bc/school-sch-nj-120__12.mp3", "t": "前后不通，"}, {"f": "audio/bc/school-sch-nj-120__13.mp3", "t": "闷瞀，"}, {"f": "audio/bc/school-sch-nj-120__14.mp3", "t": "此谓五实；"}, {"f": "audio/bc/school-sch-nj-120__15.mp3", "t": "脉细、"}, {"f": "audio/bc/school-sch-nj-120__16.mp3", "t": "皮寒、"}, {"f": "audio/bc/school-sch-nj-120__17.mp3", "t": "气少、"}, {"f": "audio/bc/school-sch-nj-120__18.mp3", "t": "泄利前后、"}, {"f": "audio/bc/school-sch-nj-120__19.mp3", "t": "饮食不入，"}, {"f": "audio/bc/school-sch-nj-120__20.mp3", "t": "此谓五虚。"}, {"f": "audio/bc/school-sch-nj-120__21.mp3", "t": "帝曰："}, {"f": "audio/bc/school-sch-nj-120__22.mp3", "t": "其时有生者何也？"}, {"f": "audio/bc/school-sch-nj-120__23.mp3", "t": "岐伯曰："}, {"f": "audio/bc/school-sch-nj-120__24.mp3", "t": "浆粥入胃，"}, {"f": "audio/bc/school-sch-nj-120__25.mp3", "t": "泄注止，"}, {"f": "audio/bc/school-sch-nj-120__26.mp3", "t": "则虚者活；"}, {"f": "audio/bc/school-sch-nj-120__27.mp3", "t": "身汗得后利，"}, {"f": "audio/bc/school-sch-nj-120__28.mp3", "t": "则实者活。"}, {"f": "audio/bc/school-sch-nj-120__29.mp3", "t": "此其候也。"}], "school-sch-nj-121": [{"f": "audio/20/school-sch-nj-121__0.mp3", "t": "黄帝曰："}, {"f": "audio/20/school-sch-nj-121__1.mp3", "t": "医之治病也，"}, {"f": "audio/20/school-sch-nj-121__2.mp3", "t": "一病而治各不同，"}, {"f": "audio/20/school-sch-nj-121__3.mp3", "t": "皆愈何也？"}, {"f": "audio/20/school-sch-nj-121__4.mp3", "t": "岐伯对曰："}, {"f": "audio/20/school-sch-nj-121__5.mp3", "t": "地势使然也。"}, {"f": "audio/20/school-sch-nj-121__6.mp3", "t": "故东方之域，"}, {"f": "audio/20/school-sch-nj-121__7.mp3", "t": "天地之所始生也。"}, {"f": "audio/20/school-sch-nj-121__8.mp3", "t": "鱼盐之地，"}, {"f": "audio/20/school-sch-nj-121__9.mp3", "t": "海滨傍水，"}, {"f": "audio/20/school-sch-nj-121__10.mp3", "t": "其民食鱼而嗜咸，"}, {"f": "audio/20/school-sch-nj-121__11.mp3", "t": "皆安其处，"}, {"f": "audio/20/school-sch-nj-121__12.mp3", "t": "美其食。"}, {"f": "audio/20/school-sch-nj-121__13.mp3", "t": "鱼者，"}, {"f": "audio/20/school-sch-nj-121__14.mp3", "t": "使人热中，"}, {"f": "audio/20/school-sch-nj-121__15.mp3", "t": "盐者胜血，"}, {"f": "audio/20/school-sch-nj-121__16.mp3", "t": "故其民皆黑色疏理，"}, {"f": "audio/20/school-sch-nj-121__17.mp3", "t": "其病皆为痈疡，"}, {"f": "audio/20/school-sch-nj-121__18.mp3", "t": "其治宜砭石。"}, {"f": "audio/20/school-sch-nj-121__19.mp3", "t": "故砭石者，"}, {"f": "audio/20/school-sch-nj-121__20.mp3", "t": "亦从东方来。"}, {"f": "audio/20/school-sch-nj-121__21.mp3", "t": "西方者，"}, {"f": "audio/20/school-sch-nj-121__22.mp3", "t": "金玉之域，"}, {"f": "audio/20/school-sch-nj-121__23.mp3", "t": "沙石之处，"}, {"f": "audio/20/school-sch-nj-121__24.mp3", "t": "天地之所收引也。"}, {"f": "audio/20/school-sch-nj-121__25.mp3", "t": "其民陵居而多风，"}, {"f": "audio/20/school-sch-nj-121__26.mp3", "t": "水土刚强，"}, {"f": "audio/20/school-sch-nj-121__27.mp3", "t": "其民不衣而褐荐，"}, {"f": "audio/20/school-sch-nj-121__28.mp3", "t": "其民华食而脂肥，"}, {"f": "audio/20/school-sch-nj-121__29.mp3", "t": "故邪不能伤其形体，"}, {"f": "audio/20/school-sch-nj-121__30.mp3", "t": "其病生于内，"}, {"f": "audio/20/school-sch-nj-121__31.mp3", "t": "其治宜毒药。"}, {"f": "audio/20/school-sch-nj-121__32.mp3", "t": "故毒药者，"}, {"f": "audio/20/school-sch-nj-121__33.mp3", "t": "亦从西方来。"}, {"f": "audio/20/school-sch-nj-121__34.mp3", "t": "北方者，"}, {"f": "audio/20/school-sch-nj-121__35.mp3", "t": "天地所闭藏之域也。"}, {"f": "audio/20/school-sch-nj-121__36.mp3", "t": "其地高陵居，"}, {"f": "audio/20/school-sch-nj-121__37.mp3", "t": "风寒冰冽。"}, {"f": "audio/20/school-sch-nj-121__38.mp3", "t": "其民乐野处而乳食，"}, {"f": "audio/20/school-sch-nj-121__39.mp3", "t": "藏寒生满病，"}, {"f": "audio/20/school-sch-nj-121__40.mp3", "t": "其治宜灸焫。"}, {"f": "audio/20/school-sch-nj-121__41.mp3", "t": "故灸焫者，"}, {"f": "audio/20/school-sch-nj-121__42.mp3", "t": "亦从北方来。"}, {"f": "audio/20/school-sch-nj-121__43.mp3", "t": "南方者，"}, {"f": "audio/20/school-sch-nj-121__44.mp3", "t": "天地所长养，"}, {"f": "audio/20/school-sch-nj-121__45.mp3", "t": "阳之所盛处也。"}, {"f": "audio/20/school-sch-nj-121__46.mp3", "t": "其地下，"}, {"f": "audio/20/school-sch-nj-121__47.mp3", "t": "水土弱，"}, {"f": "audio/20/school-sch-nj-121__48.mp3", "t": "雾露之所聚也。"}, {"f": "audio/20/school-sch-nj-121__49.mp3", "t": "其民嗜酸而食胕，"}, {"f": "audio/20/school-sch-nj-121__50.mp3", "t": "故其民皆致理而赤色，"}, {"f": "audio/20/school-sch-nj-121__51.mp3", "t": "其病挛痹，"}, {"f": "audio/20/school-sch-nj-121__52.mp3", "t": "其治宜微针。"}, {"f": "audio/20/school-sch-nj-121__53.mp3", "t": "故九针者，"}, {"f": "audio/20/school-sch-nj-121__54.mp3", "t": "亦从南方来。"}, {"f": "audio/20/school-sch-nj-121__55.mp3", "t": "中央者，"}, {"f": "audio/20/school-sch-nj-121__56.mp3", "t": "其地平以湿，"}, {"f": "audio/20/school-sch-nj-121__57.mp3", "t": "天地所以生万物也众。"}, {"f": "audio/20/school-sch-nj-121__58.mp3", "t": "其民食杂而不劳，"}, {"f": "audio/20/school-sch-nj-121__59.mp3", "t": "故其病多痿厥寒热，"}, {"f": "audio/20/school-sch-nj-121__60.mp3", "t": "其治宜导引按跷。"}, {"f": "audio/20/school-sch-nj-121__61.mp3", "t": "故导引按跷者，"}, {"f": "audio/20/school-sch-nj-121__62.mp3", "t": "亦从中央出也。"}, {"f": "audio/20/school-sch-nj-121__63.mp3", "t": "故圣人杂合以治，"}, {"f": "audio/20/school-sch-nj-121__64.mp3", "t": "各得其所宜。"}, {"f": "audio/20/school-sch-nj-121__65.mp3", "t": "故治所以异而病皆愈者，"}, {"f": "audio/20/school-sch-nj-121__66.mp3", "t": "得病之情，"}, {"f": "audio/20/school-sch-nj-121__67.mp3", "t": "知治之大体也。"}], "school-sch-nj-122": [{"f": "audio/f5/school-sch-nj-122__0.mp3", "t": "黄帝曰："}, {"f": "audio/f5/school-sch-nj-122__1.mp3", "t": "为五谷汤液及醪醴奈何？"}, {"f": "audio/f5/school-sch-nj-122__2.mp3", "t": "岐伯对曰："}, {"f": "audio/f5/school-sch-nj-122__3.mp3", "t": "必以稻米，"}, {"f": "audio/f5/school-sch-nj-122__4.mp3", "t": "炊之稻薪，"}, {"f": "audio/f5/school-sch-nj-122__5.mp3", "t": "稻米者完，"}, {"f": "audio/f5/school-sch-nj-122__6.mp3", "t": "稻薪者坚。"}, {"f": "audio/f5/school-sch-nj-122__7.mp3", "t": "帝曰："}, {"f": "audio/f5/school-sch-nj-122__8.mp3", "t": "何以然？"}, {"f": "audio/f5/school-sch-nj-122__9.mp3", "t": "岐伯曰："}, {"f": "audio/f5/school-sch-nj-122__10.mp3", "t": "此得天地之和，"}, {"f": "audio/f5/school-sch-nj-122__11.mp3", "t": "高下之宜，"}, {"f": "audio/f5/school-sch-nj-122__12.mp3", "t": "故能至完："}, {"f": "audio/f5/school-sch-nj-122__13.mp3", "t": "伐取得时，"}, {"f": "audio/f5/school-sch-nj-122__14.mp3", "t": "故能至坚也。"}], "school-sch-nj-123": [{"f": "audio/89/school-sch-nj-123__0.mp3", "t": "帝曰："}, {"f": "audio/89/school-sch-nj-123__1.mp3", "t": "上古圣人作汤液醪醴，"}, {"f": "audio/89/school-sch-nj-123__2.mp3", "t": "为而不用，"}, {"f": "audio/89/school-sch-nj-123__3.mp3", "t": "何也？"}, {"f": "audio/89/school-sch-nj-123__4.mp3", "t": "岐伯曰："}, {"f": "audio/89/school-sch-nj-123__5.mp3", "t": "自古圣人之作汤液醪醴者，"}, {"f": "audio/89/school-sch-nj-123__6.mp3", "t": "以为备耳。"}, {"f": "audio/89/school-sch-nj-123__7.mp3", "t": "夫上古作汤液，"}, {"f": "audio/89/school-sch-nj-123__8.mp3", "t": "故为而弗服也。"}, {"f": "audio/89/school-sch-nj-123__9.mp3", "t": "中古之世，"}, {"f": "audio/89/school-sch-nj-123__10.mp3", "t": "道德稍衰，"}, {"f": "audio/89/school-sch-nj-123__11.mp3", "t": "邪气时至，"}, {"f": "audio/89/school-sch-nj-123__12.mp3", "t": "服之万全。"}, {"f": "audio/89/school-sch-nj-123__13.mp3", "t": "帝曰："}, {"f": "audio/89/school-sch-nj-123__14.mp3", "t": "今之世，"}, {"f": "audio/89/school-sch-nj-123__15.mp3", "t": "不必已，"}, {"f": "audio/89/school-sch-nj-123__16.mp3", "t": "何也。"}, {"f": "audio/89/school-sch-nj-123__17.mp3", "t": "岐伯曰："}, {"f": "audio/89/school-sch-nj-123__18.mp3", "t": "当今之世，"}, {"f": "audio/89/school-sch-nj-123__19.mp3", "t": "必齐毒药攻其中，"}, {"f": "audio/89/school-sch-nj-123__20.mp3", "t": "镵石、"}, {"f": "audio/89/school-sch-nj-123__21.mp3", "t": "针艾治其外也。"}, {"f": "audio/89/school-sch-nj-123__22.mp3", "t": "帝曰："}, {"f": "audio/89/school-sch-nj-123__23.mp3", "t": "形弊血尽而功不立者何？"}, {"f": "audio/89/school-sch-nj-123__24.mp3", "t": "岐伯曰："}, {"f": "audio/89/school-sch-nj-123__25.mp3", "t": "神不使也。"}, {"f": "audio/89/school-sch-nj-123__26.mp3", "t": "帝曰："}, {"f": "audio/89/school-sch-nj-123__27.mp3", "t": "何谓神不使？"}, {"f": "audio/89/school-sch-nj-123__28.mp3", "t": "岐伯曰："}, {"f": "audio/89/school-sch-nj-123__29.mp3", "t": "针石，"}, {"f": "audio/89/school-sch-nj-123__30.mp3", "t": "道也。"}, {"f": "audio/89/school-sch-nj-123__31.mp3", "t": "精神不进，"}, {"f": "audio/89/school-sch-nj-123__32.mp3", "t": "志意不治，"}, {"f": "audio/89/school-sch-nj-123__33.mp3", "t": "故病不可愈。"}, {"f": "audio/89/school-sch-nj-123__34.mp3", "t": "今精坏神去，"}, {"f": "audio/89/school-sch-nj-123__35.mp3", "t": "荣卫不可复收，"}, {"f": "audio/89/school-sch-nj-123__36.mp3", "t": "何者？"}, {"f": "audio/89/school-sch-nj-123__37.mp3", "t": "嗜欲无穷，"}, {"f": "audio/89/school-sch-nj-123__38.mp3", "t": "而忧患不止，"}, {"f": "audio/89/school-sch-nj-123__39.mp3", "t": "精气弛坏，"}, {"f": "audio/89/school-sch-nj-123__40.mp3", "t": "荣泣卫除，"}, {"f": "audio/89/school-sch-nj-123__41.mp3", "t": "故神去之而病不愈也。"}, {"f": "audio/89/school-sch-nj-123__42.mp3", "t": "帝曰："}, {"f": "audio/89/school-sch-nj-123__43.mp3", "t": "夫病之始生也，"}, {"f": "audio/89/school-sch-nj-123__44.mp3", "t": "极微极精，"}, {"f": "audio/89/school-sch-nj-123__45.mp3", "t": "必先入结于皮肤，"}, {"f": "audio/89/school-sch-nj-123__46.mp3", "t": "今良工皆称曰病成，"}, {"f": "audio/89/school-sch-nj-123__47.mp3", "t": "名曰逆，"}, {"f": "audio/89/school-sch-nj-123__48.mp3", "t": "则针石不能治，"}, {"f": "audio/89/school-sch-nj-123__49.mp3", "t": "良药不能及也。"}, {"f": "audio/89/school-sch-nj-123__50.mp3", "t": "今良工皆得其法，"}, {"f": "audio/89/school-sch-nj-123__51.mp3", "t": "守其数，"}, {"f": "audio/89/school-sch-nj-123__52.mp3", "t": "亲戚兄弟远近，"}, {"f": "audio/89/school-sch-nj-123__53.mp3", "t": "音声日闻于耳，"}, {"f": "audio/89/school-sch-nj-123__54.mp3", "t": "五色日见于目，"}, {"f": "audio/89/school-sch-nj-123__55.mp3", "t": "而病不愈者，"}, {"f": "audio/89/school-sch-nj-123__56.mp3", "t": "亦何暇不早乎？"}, {"f": "audio/89/school-sch-nj-123__57.mp3", "t": "岐伯曰："}, {"f": "audio/89/school-sch-nj-123__58.mp3", "t": "病为本，"}, {"f": "audio/89/school-sch-nj-123__59.mp3", "t": "工为标，"}, {"f": "audio/89/school-sch-nj-123__60.mp3", "t": "标本不得，"}, {"f": "audio/89/school-sch-nj-123__61.mp3", "t": "邪气不服，"}, {"f": "audio/89/school-sch-nj-123__62.mp3", "t": "此之谓也。"}], "school-sch-nj-124": [{"f": "audio/fc/school-sch-nj-124__0.mp3", "t": "帝曰："}, {"f": "audio/fc/school-sch-nj-124__1.mp3", "t": "其有不从毫毛而生，"}, {"f": "audio/fc/school-sch-nj-124__2.mp3", "t": "五藏阳以竭也，"}, {"f": "audio/fc/school-sch-nj-124__3.mp3", "t": "津液充郭，"}, {"f": "audio/fc/school-sch-nj-124__4.mp3", "t": "其魄独居，"}, {"f": "audio/fc/school-sch-nj-124__5.mp3", "t": "孤精于内，"}, {"f": "audio/fc/school-sch-nj-124__6.mp3", "t": "气耗于外，"}, {"f": "audio/fc/school-sch-nj-124__7.mp3", "t": "形不可与衣相保，"}, {"f": "audio/fc/school-sch-nj-124__8.mp3", "t": "此四极急而动中，"}, {"f": "audio/fc/school-sch-nj-124__9.mp3", "t": "是气拒于内，"}, {"f": "audio/fc/school-sch-nj-124__10.mp3", "t": "而形施于外，"}, {"f": "audio/fc/school-sch-nj-124__11.mp3", "t": "治之奈何？"}, {"f": "audio/fc/school-sch-nj-124__12.mp3", "t": "岐伯曰："}, {"f": "audio/fc/school-sch-nj-124__13.mp3", "t": "平治于权衡，"}, {"f": "audio/fc/school-sch-nj-124__14.mp3", "t": "去宛陈莝，"}, {"f": "audio/fc/school-sch-nj-124__15.mp3", "t": "微动四极，"}, {"f": "audio/fc/school-sch-nj-124__16.mp3", "t": "温衣，"}, {"f": "audio/fc/school-sch-nj-124__17.mp3", "t": "缪刺其处，"}, {"f": "audio/fc/school-sch-nj-124__18.mp3", "t": "以复其形；"}, {"f": "audio/fc/school-sch-nj-124__19.mp3", "t": "开鬼门，"}, {"f": "audio/fc/school-sch-nj-124__20.mp3", "t": "洁净府，"}, {"f": "audio/fc/school-sch-nj-124__21.mp3", "t": "精以时服，"}, {"f": "audio/fc/school-sch-nj-124__22.mp3", "t": "五阳已布，"}, {"f": "audio/fc/school-sch-nj-124__23.mp3", "t": "疏涤五藏，"}, {"f": "audio/fc/school-sch-nj-124__24.mp3", "t": "故精自生，"}, {"f": "audio/fc/school-sch-nj-124__25.mp3", "t": "形自盛，"}, {"f": "audio/fc/school-sch-nj-124__26.mp3", "t": "骨肉相保，"}, {"f": "audio/fc/school-sch-nj-124__27.mp3", "t": "巨气乃平。"}, {"f": "audio/fc/school-sch-nj-124__28.mp3", "t": "帝曰："}, {"f": "audio/fc/school-sch-nj-124__29.mp3", "t": "善。"}], "school-sch-nj-125": [{"f": "audio/2a/school-sch-nj-125__0.mp3", "t": "黄帝问曰："}, {"f": "audio/2a/school-sch-nj-125__1.mp3", "t": "病有标本，"}, {"f": "audio/2a/school-sch-nj-125__2.mp3", "t": "刺有逆从，"}, {"f": "audio/2a/school-sch-nj-125__3.mp3", "t": "奈何？"}, {"f": "audio/2a/school-sch-nj-125__4.mp3", "t": "岐伯对曰："}, {"f": "audio/2a/school-sch-nj-125__5.mp3", "t": "凡刺之方，"}, {"f": "audio/2a/school-sch-nj-125__6.mp3", "t": "必别阴阳，"}, {"f": "audio/2a/school-sch-nj-125__7.mp3", "t": "前后相应，"}, {"f": "audio/2a/school-sch-nj-125__8.mp3", "t": "逆从得施，"}, {"f": "audio/2a/school-sch-nj-125__9.mp3", "t": "标本相移。"}, {"f": "audio/2a/school-sch-nj-125__10.mp3", "t": "故曰有其在标而求之于标，"}, {"f": "audio/2a/school-sch-nj-125__11.mp3", "t": "有其在本而求之于本，"}, {"f": "audio/2a/school-sch-nj-125__12.mp3", "t": "有其在本而求之于标，"}, {"f": "audio/2a/school-sch-nj-125__13.mp3", "t": "有其在标而求之于本。"}, {"f": "audio/2a/school-sch-nj-125__14.mp3", "t": "故治有取标而得者，"}, {"f": "audio/2a/school-sch-nj-125__15.mp3", "t": "有取本而得者，"}, {"f": "audio/2a/school-sch-nj-125__16.mp3", "t": "有逆取而得者，"}, {"f": "audio/2a/school-sch-nj-125__17.mp3", "t": "有从取而得者。"}, {"f": "audio/2a/school-sch-nj-125__18.mp3", "t": "故知逆与从，"}, {"f": "audio/2a/school-sch-nj-125__19.mp3", "t": "正行无问，"}, {"f": "audio/2a/school-sch-nj-125__20.mp3", "t": "知标本者，"}, {"f": "audio/2a/school-sch-nj-125__21.mp3", "t": "万举万当，"}, {"f": "audio/2a/school-sch-nj-125__22.mp3", "t": "不知标本，"}, {"f": "audio/2a/school-sch-nj-125__23.mp3", "t": "是谓妄行。"}], "school-sch-nj-126": [{"f": "audio/1b/school-sch-nj-126__0.mp3", "t": "夫阴阳、"}, {"f": "audio/1b/school-sch-nj-126__1.mp3", "t": "逆从、"}, {"f": "audio/1b/school-sch-nj-126__2.mp3", "t": "标本之为道也，"}, {"f": "audio/1b/school-sch-nj-126__3.mp3", "t": "小而大，"}, {"f": "audio/1b/school-sch-nj-126__4.mp3", "t": "言一而知百病之害。"}, {"f": "audio/1b/school-sch-nj-126__5.mp3", "t": "少而多，"}, {"f": "audio/1b/school-sch-nj-126__6.mp3", "t": "浅而博，"}, {"f": "audio/1b/school-sch-nj-126__7.mp3", "t": "可以言一而知百也。"}, {"f": "audio/1b/school-sch-nj-126__8.mp3", "t": "以浅而知深，"}, {"f": "audio/1b/school-sch-nj-126__9.mp3", "t": "察近而知远。"}, {"f": "audio/1b/school-sch-nj-126__10.mp3", "t": "言标与本，"}, {"f": "audio/1b/school-sch-nj-126__11.mp3", "t": "易而勿及。"}], "school-sch-nj-127": [{"f": "audio/10/school-sch-nj-127__0.mp3", "t": "治反为逆，"}, {"f": "audio/10/school-sch-nj-127__1.mp3", "t": "治得为从。"}, {"f": "audio/10/school-sch-nj-127__2.mp3", "t": "先病而后逆者治其本，"}, {"f": "audio/10/school-sch-nj-127__3.mp3", "t": "先逆而后病者治其本；"}, {"f": "audio/10/school-sch-nj-127__4.mp3", "t": "先寒而后生病者治其本，"}, {"f": "audio/10/school-sch-nj-127__5.mp3", "t": "先病而后生寒者治其本；"}, {"f": "audio/10/school-sch-nj-127__6.mp3", "t": "先热而后生病者治其本，"}, {"f": "audio/10/school-sch-nj-127__7.mp3", "t": "先热而后生中满者治其标；"}, {"f": "audio/10/school-sch-nj-127__8.mp3", "t": "先病而后泄者治其本，"}, {"f": "audio/10/school-sch-nj-127__9.mp3", "t": "先泄而后生他病者治其本，"}, {"f": "audio/10/school-sch-nj-127__10.mp3", "t": "必且调之，"}, {"f": "audio/10/school-sch-nj-127__11.mp3", "t": "乃治其他病。"}, {"f": "audio/10/school-sch-nj-127__12.mp3", "t": "先病而后生中满者治其标，"}, {"f": "audio/10/school-sch-nj-127__13.mp3", "t": "先中满而后烦心者治其本。"}, {"f": "audio/10/school-sch-nj-127__14.mp3", "t": "人有客气有同气。"}, {"f": "audio/10/school-sch-nj-127__15.mp3", "t": "小大不利治其标，"}, {"f": "audio/10/school-sch-nj-127__16.mp3", "t": "小大利治其本。"}, {"f": "audio/10/school-sch-nj-127__17.mp3", "t": "病发而有余，"}, {"f": "audio/10/school-sch-nj-127__18.mp3", "t": "本而标之，"}, {"f": "audio/10/school-sch-nj-127__19.mp3", "t": "先治其本，"}, {"f": "audio/10/school-sch-nj-127__20.mp3", "t": "后治其标；"}, {"f": "audio/10/school-sch-nj-127__21.mp3", "t": "病发而不足，"}, {"f": "audio/10/school-sch-nj-127__22.mp3", "t": "标而本之，"}, {"f": "audio/10/school-sch-nj-127__23.mp3", "t": "先治其标，"}, {"f": "audio/10/school-sch-nj-127__24.m
