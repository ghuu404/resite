13.mp3", "t": "益用甘味之药调之。"}, {"f": "audio/3a/L1-jg-0__14.mp3", "t": "……肝虚则用此法，"}, {"f": "audio/3a/L1-jg-0__15.mp3", "t": "实则不在用之。"}], "L1-jg-1": [{"f": "audio/5c/L1-jg-1__0.mp3", "t": "问曰："}, {"f": "audio/5c/L1-jg-1__1.mp3", "t": "病有急当救里救表者，"}, {"f": "audio/5c/L1-jg-1__2.mp3", "t": "何谓也？"}, {"f": "audio/5c/L1-jg-1__3.mp3", "t": "师曰："}, {"f": "audio/5c/L1-jg-1__4.mp3", "t": "病，"}, {"f": "audio/5c/L1-jg-1__5.mp3", "t": "医下之，"}, {"f": "audio/5c/L1-jg-1__6.mp3", "t": "续得下利清谷不止，"}, {"f": "audio/5c/L1-jg-1__7.mp3", "t": "身体疼痛者，"}, {"f": "audio/5c/L1-jg-1__8.mp3", "t": "急当救里；"}, {"f": "audio/5c/L1-jg-1__9.mp3", "t": "后身体疼痛，"}, {"f": "audio/5c/L1-jg-1__10.mp3", "t": "清便自调者，"}, {"f": "audio/5c/L1-jg-1__11.mp3", "t": "急当救表也。"}], "L1-jg-2": [{"f": "audio/92/L1-jg-2__0.mp3", "t": "太阳病，"}, {"f": "audio/92/L1-jg-2__1.mp3", "t": "发热无汗，"}, {"f": "audio/92/L1-jg-2__2.mp3", "t": "反恶寒者，"}, {"f": "audio/92/L1-jg-2__3.mp3", "t": "名曰刚痉。"}, {"f": "audio/92/L1-jg-2__4.mp3", "t": "太阳病，"}, {"f": "audio/92/L1-jg-2__5.mp3", "t": "发热汗出，"}, {"f": "audio/92/L1-jg-2__6.mp3", "t": "而不恶寒，"}, {"f": "audio/92/L1-jg-2__7.mp3", "t": "名曰柔痉。"}], "L1-jg-3": [{"f": "audio/d1/L1-jg-3__0.mp3", "t": "太阳病，"}, {"f": "audio/d1/L1-jg-3__1.mp3", "t": "其证备，"}, {"f": "audio/d1/L1-jg-3__2.mp3", "t": "身体强，"}, {"f": "audio/d1/L1-jg-3__3.mp3", "t": "几几然，"}, {"f": "audio/d1/L1-jg-3__4.mp3", "t": "脉反沉迟，"}, {"f": "audio/d1/L1-jg-3__5.mp3", "t": "此为痉，"}, {"f": "audio/d1/L1-jg-3__6.mp3", "t": "栝楼桂枝汤主之。"}], "L1-jg-4": [{"f": "audio/c0/L1-jg-4__0.mp3", "t": "风湿相搏，"}, {"f": "audio/c0/L1-jg-4__1.mp3", "t": "一身尽疼痛，"}, {"f": "audio/c0/L1-jg-4__2.mp3", "t": "法当汗出而解，"}, {"f": "audio/c0/L1-jg-4__3.mp3", "t": "值天阴雨不止，"}, {"f": "audio/c0/L1-jg-4__4.mp3", "t": "医云此可发汗，"}, {"f": "audio/c0/L1-jg-4__5.mp3", "t": "汗之病不愈者，"}, {"f": "audio/c0/L1-jg-4__6.mp3", "t": "何也？"}, {"f": "audio/c0/L1-jg-4__7.mp3", "t": "盖发其汗，"}, {"f": "audio/c0/L1-jg-4__8.mp3", "t": "汗大出者，"}, {"f": "audio/c0/L1-jg-4__9.mp3", "t": "但风气去，"}, {"f": "audio/c0/L1-jg-4__10.mp3", "t": "湿气在，"}, {"f": "audio/c0/L1-jg-4__11.mp3", "t": "是故不愈也。"}, {"f": "audio/c0/L1-jg-4__12.mp3", "t": "若治风湿者，"}, {"f": "audio/c0/L1-jg-4__13.mp3", "t": "发其汗，"}, {"f": "audio/c0/L1-jg-4__14.mp3", "t": "但微微似欲出汗者，"}, {"f": "audio/c0/L1-jg-4__15.mp3", "t": "风湿俱去也。"}], "L1-jg-5": [{"f": "audio/f1/L1-jg-5__0.mp3", "t": "风湿脉浮身重，"}, {"f": "audio/f1/L1-jg-5__1.mp3", "t": "汗出恶风者，"}, {"f": "audio/f1/L1-jg-5__2.mp3", "t": "防己黄芪汤主之。"}], "L1-jg-6": [{"f": "audio/fd/L1-jg-6__0.mp3", "t": "风湿相搏，"}, {"f": "audio/fd/L1-jg-6__1.mp3", "t": "骨节疼烦，"}, {"f": "audio/fd/L1-jg-6__2.mp3", "t": "掣痛不得屈伸，"}, {"f": "audio/fd/L1-jg-6__3.mp3", "t": "近之则痛剧，"}, {"f": "audio/fd/L1-jg-6__4.mp3", "t": "汗出短气，"}, {"f": "audio/fd/L1-jg-6__5.mp3", "t": "小便不利，"}, {"f": "audio/fd/L1-jg-6__6.mp3", "t": "恶风不欲去衣，"}, {"f": "audio/fd/L1-jg-6__7.mp3", "t": "或身微肿者，"}, {"f": "audio/fd/L1-jg-6__8.mp3", "t": "甘草附子汤主之。"}], "L1-jg-7": [{"f": "audio/31/L1-jg-7__0.mp3", "t": "百合病者，"}, {"f": "audio/31/L1-jg-7__1.mp3", "t": "百脉一宗，"}, {"f": "audio/31/L1-jg-7__2.mp3", "t": "悉致其病也。"}, {"f": "audio/31/L1-jg-7__3.mp3", "t": "意欲食复不能食，"}, {"f": "audio/31/L1-jg-7__4.mp3", "t": "常默默，"}, {"f": "audio/31/L1-jg-7__5.mp3", "t": "欲卧不能卧，"}, {"f": "audio/31/L1-jg-7__6.mp3", "t": "欲行不能行，"}, {"f": "audio/31/L1-jg-7__7.mp3", "t": "饮食或有美时，"}, {"f": "audio/31/L1-jg-7__8.mp3", "t": "或有不用闻食臭时，"}, {"f": "audio/31/L1-jg-7__9.mp3", "t": "如寒无寒，"}, {"f": "audio/31/L1-jg-7__10.mp3", "t": "如热无热，"}, {"f": "audio/31/L1-jg-7__11.mp3", "t": "口苦，"}, {"f": "audio/31/L1-jg-7__12.mp3", "t": "小便赤，"}, {"f": "audio/31/L1-jg-7__13.mp3", "t": "诸药不能治，"}, {"f": "audio/31/L1-jg-7__14.mp3", "t": "得药则剧吐利，"}, {"f": "audio/31/L1-jg-7__15.mp3", "t": "如有神灵者，"}, {"f": "audio/31/L1-jg-7__16.mp3", "t": "身形如和，"}, {"f": "audio/31/L1-jg-7__17.mp3", "t": "其脉微数。"}], "L1-jg-8": [{"f": "audio/0e/L1-jg-8__0.mp3", "t": "百合病，"}, {"f": "audio/0e/L1-jg-8__1.mp3", "t": "不经吐下发汗，"}, {"f": "audio/0e/L1-jg-8__2.mp3", "t": "病形如初者，"}, {"f": "audio/0e/L1-jg-8__3.mp3", "t": "百合地黄汤主之。"}], "L1-jg-9": [{"f": "audio/8a/L1-jg-9__0.mp3", "t": "狐惑之为病，"}, {"f": "audio/8a/L1-jg-9__1.mp3", "t": "状如伤寒，"}, {"f": "audio/8a/L1-jg-9__2.mp3", "t": "默默欲眠，"}, {"f": "audio/8a/L1-jg-9__3.mp3", "t": "目不得闭，"}, {"f": "audio/8a/L1-jg-9__4.mp3", "t": "卧起不安，"}, {"f": "audio/8a/L1-jg-9__5.mp3", "t": "蚀于喉为惑，"}, {"f": "audio/8a/L1-jg-9__6.mp3", "t": "蚀于阴为狐，"}, {"f": "audio/8a/L1-jg-9__7.mp3", "t": "不欲饮食，"}, {"f": "audio/8a/L1-jg-9__8.mp3", "t": "恶闻食臭，"}, {"f": "audio/8a/L1-jg-9__9.mp3", "t": "其面目乍赤、"}, {"f": "audio/8a/L1-jg-9__10.mp3", "t": "乍黑、"}, {"f": "audio/8a/L1-jg-9__11.mp3", "t": "乍白，"}, {"f": "audio/8a/L1-jg-9__12.mp3", "t": "蚀于上部则声喝，"}, {"f": "audio/8a/L1-jg-9__13.mp3", "t": "甘草泻心汤主之。"}], "L1-jg-10": [{"f": "audio/48/L1-jg-10__0.mp3", "t": "师曰："}, {"f": "audio/48/L1-jg-10__1.mp3", "t": "疟脉自弦，"}, {"f": "audio/48/L1-jg-10__2.mp3", "t": "弦数者多热，"}, {"f": "audio/48/L1-jg-10__3.mp3", "t": "弦迟者多寒。"}], "L1-jg-11": [{"f": "audio/4d/L1-jg-11__0.mp3", "t": "温疟者，"}, {"f": "audio/4d/L1-jg-11__1.mp3", "t": "其脉如平，"}, {"f": "audio/4d/L1-jg-11__2.mp3", "t": "身无寒但热，"}, {"f": "audio/4d/L1-jg-11__3.mp3", "t": "骨节疼烦，"}, {"f": "audio/4d/L1-jg-11__4.mp3", "t": "时呕，"}, {"f": "audio/4d/L1-jg-11__5.mp3", "t": "白虎加桂枝汤主之。"}], "L1-jg-12": [{"f": "audio/fd/L1-jg-12__0.mp3", "t": "邪在于络，"}, {"f": "audio/fd/L1-jg-12__1.mp3", "t": "肌肤不仁；"}, {"f": "audio/fd/L1-jg-12__2.mp3", "t": "邪在于经，"}, {"f": "audio/fd/L1-jg-12__3.mp3", "t": "即重不胜；"}, {"f": "audio/fd/L1-jg-12__4.mp3", "t": "邪入于腑，"}, {"f": "audio/fd/L1-jg-12__5.mp3", "t": "即不识人；"}, {"f": "audio/fd/L1-jg-12__6.mp3", "t": "邪入于脏，"}, {"f": "audio/fd/L1-jg-12__7.mp3", "t": "舌即难言，"}, {"f": "audio/fd/L1-jg-12__8.mp3", "t": "口吐涎。"}], "L1-jg-13": [{"f": "audio/b3/L1-jg-13__0.mp3", "t": "诸肢节疼痛，"}, {"f": "audio/b3/L1-jg-13__1.mp3", "t": "身体魁羸，"}, {"f": "audio/b3/L1-jg-13__2.mp3", "t": "脚肿如脱，"}, {"f": "audio/b3/L1-jg-13__3.mp3", "t": "头眩短气，"}, {"f": "audio/b3/L1-jg-13__4.mp3", "t": "温温欲吐，"}, {"f": "audio/b3/L1-jg-13__5.mp3", "t": "桂枝芍药知母汤主之。"}], "L1-jg-14": [{"f": "audio/6c/L1-jg-14__0.mp3", "t": "血痹阴阳俱微，"}, {"f": "audio/6c/L1-jg-14__1.mp3", "t": "寸口关上微，"}, {"f": "audio/6c/L1-jg-14__2.mp3", "t": "尺中小紧，"}, {"f": "audio/6c/L1-jg-14__3.mp3", "t": "外证身体不仁，"}, {"f": "audio/6c/L1-jg-14__4.mp3", "t": "如风痹状，"}, {"f": "audio/6c/L1-jg-14__5.mp3", "t": "黄芪桂枝五物汤主之。"}], "L1-jg-15": [{"f": "audio/f0/L1-jg-15__0.mp3", "t": "夫男子平人，"}, {"f": "audio/f0/L1-jg-15__1.mp3", "t": "脉大为劳，"}, {"f": "audio/f0/L1-jg-15__2.mp3", "t": "极虚亦为劳。"}], "L1-jg-16": [{"f": "audio/7f/L1-jg-16__0.mp3", "t": "虚劳里急，"}, {"f": "audio/7f/L1-jg-16__1.mp3", "t": "悸，"}, {"f": "audio/7f/L1-jg-16__2.mp3", "t": "衄，"}, {"f": "audio/7f/L1-jg-16__3.mp3", "t": "腹中痛，"}, {"f": "audio/7f/L1-jg-16__4.mp3", "t": "梦失精，"}, {"f": "audio/7f/L1-jg-16__5.mp3", "t": "四肢酸疼，"}, {"f": "audio/7f/L1-jg-16__6.mp3", "t": "手足烦热，"}, {"f": "audio/7f/L1-jg-16__7.mp3", "t": "咽干口燥，"}, {"f": "audio/7f/L1-jg-16__8.mp3", "t": "小建中汤主之。"}], "L1-jg-17": [{"f": "audio/b9/L1-jg-17__0.mp3", "t": "虚劳腰痛，"}, {"f": "audio/b9/L1-jg-17__1.mp3", "t": "少腹拘急，"}, {"f": "audio/b9/L1-jg-17__2.mp3", "t": "小便不利者，"}, {"f": "audio/b9/L1-jg-17__3.mp3", "t": "八味肾气丸主之。"}], "L1-jg-18": [{"f": "audio/bd/L1-jg-18__0.mp3", "t": "虚劳虚烦不得眠，"}, {"f": "audio/bd/L1-jg-18__1.mp3", "t": "酸枣仁汤主之。"}], "L1-jg-19": [{"f": "audio/bb/L1-jg-19__0.mp3", "t": "五劳虚极羸瘦，"}, {"f": "audio/bb/L1-jg-19__1.mp3", "t": "腹满不能饮食，"}, {"f": "audio/bb/L1-jg-19__2.mp3", "t": "食伤、"}, {"f": "audio/bb/L1-jg-19__3.mp3", "t": "忧伤、"}, {"f": "audio/bb/L1-jg-19__4.mp3", "t": "饮伤、"}, {"f": "audio/bb/L1-jg-19__5.mp3", "t": "房室伤、"}, {"f": "audio/bb/L1-jg-19__6.mp3", "t": "饥伤、"}, {"f": "audio/bb/L1-jg-19__7.mp3", "t": "劳伤、"}, {"f": "audio/bb/L1-jg-19__8.mp3", "t": "经络营卫气伤，"}, {"f": "audio/bb/L1-jg-19__9.mp3", "t": "内有干血，"}, {"f": "audio/bb/L1-jg-19__10.mp3", "t": "肌肤甲错，"}, {"f": "audio/bb/L1-jg-19__11.mp3", "t": "两目黯黑。"}, {"f": "audio/bb/L1-jg-19__12.mp3", "t": "缓中补虚，"}, {"f": "audio/bb/L1-jg-19__13.mp3", "t": "大黄䗪虫丸主之。"}], "L1-jg-20": [{"f": "audio/07/L1-jg-20__0.mp3", "t": "肺痿吐涎沫而不咳者，"}, {"f": "audio/07/L1-jg-20__1.mp3", "t": "其人不渴，"}, {"f": "audio/07/L1-jg-20__2.mp3", "t": "必遗尿，"}, {"f": "audio/07/L1-jg-20__3.mp3", "t": "小便数，"}, {"f": "audio/07/L1-jg-20__4.mp3", "t": "所以然者，"}, {"f": "audio/07/L1-jg-20__5.mp3", "t": "以上虚不能制下故也。"}, {"f": "audio/07/L1-jg-20__6.mp3", "t": "此为肺中冷，"}, {"f": "audio/07/L1-jg-20__7.mp3", "t": "必眩，"}, {"f": "audio/07/L1-jg-20__8.mp3", "t": "多涎唾，"}, {"f": "audio/07/L1-jg-20__9.mp3", "t": "甘草干姜汤以温之。"}, {"f": "audio/07/L1-jg-20__10.mp3", "t": "若服汤已渴者，"}, {"f": "audio/07/L1-jg-20__11.mp3", "t": "属消渴。"}], "L1-jg-21": [{"f": "audio/36/L1-jg-21__0.mp3", "t": "大逆上气，"}, {"f": "audio/36/L1-jg-21__1.mp3", "t": "咽喉不利，"}, {"f": "audio/36/L1-jg-21__2.mp3", "t": "止逆下气者，"}, {"f": "audio/36/L1-jg-21__3.mp3", "t": "麦门冬汤主之。"}], "L1-jg-22": [{"f": "audio/11/L1-jg-22__0.mp3", "t": "咳而上气，"}, {"f": "audio/11/L1-jg-22__1.mp3", "t": "喉中水鸡声，"}, {"f": "audio/11/L1-jg-22__2.mp3", "t": "射干麻黄汤主之。"}], "L1-jg-23": [{"f": "audio/19/L1-jg-23__0.mp3", "t": "咳而上气，"}, {"f": "audio/19/L1-jg-23__1.mp3", "t": "此为肺胀，"}, {"f": "audio/19/L1-jg-23__2.mp3", "t": "其人喘，"}, {"f": "audio/19/L1-jg-23__3.mp3", "t": "目如脱状，"}, {"f": "audio/19/L1-jg-23__4.mp3", "t": "脉浮大者，"}, {"f": "audio/19/L1-jg-23__5.mp3", "t": "越婢加半夏汤主之。"}], "L1-jg-24": [{"f": "audio/8f/L1-jg-24__0.mp3", "t": "肺胀，"}, {"f": "audio/8f/L1-jg-24__1.mp3", "t": "咳而上气，"}, {"f": "audio/8f/L1-jg-24__2.mp3", "t": "烦躁而喘，"}, {"f": "audio/8f/L1-jg-24__3.mp3", "t": "脉浮者，"}, {"f": "audio/8f/L1-jg-24__4.mp3", "t": "心下有水，"}, {"f": "audio/8f/L1-jg-24__5.mp3", "t": "小青龙加石膏汤主之。"}], "L1-jg-25": [{"f": "audio/05/L1-jg-25__0.mp3", "t": "咳有微热，"}, {"f": "audio/05/L1-jg-25__1.mp3", "t": "烦满，"}, {"f": "audio/05/L1-jg-25__2.mp3", "t": "胸中甲错，"}, {"f": "audio/05/L1-jg-25__3.mp3", "t": "是为肺痈，"}, {"f": "audio/05/L1-jg-25__4.mp3", "t": "苇茎汤主之。"}], "L1-jg-26": [{"f": "audio/c0/L1-jg-26__0.mp3", "t": "奔豚病，"}, {"f": "audio/c0/L1-jg-26__1.mp3", "t": "从少腹起，"}, {"f": "audio/c0/L1-jg-26__2.mp3", "t": "上冲咽喉，"}, {"f": "audio/c0/L1-jg-26__3.mp3", "t": "发作欲死，"}, {"f": "audio/c0/L1-jg-26__4.mp3", "t": "复还止，"}, {"f": "audio/c0/L1-jg-26__5.mp3", "t": "皆从惊恐得之。"}], "L1-jg-27": [{"f": "audio/1f/L1-jg-27__0.mp3", "t": "奔豚气上冲胸，"}, {"f": "audio/1f/L1-jg-27__1.mp3", "t": "腹痛，"}, {"f": "audio/1f/L1-jg-27__2.mp3", "t": "往来寒热，"}, {"f": "audio/1f/L1-jg-27__3.mp3", "t": "奔豚汤主之。"}], "L1-jg-28": [{"f": "audio/ca/L1-jg-28__0.mp3", "t": "师曰："}, {"f": "audio/ca/L1-jg-28__1.mp3", "t": "夫脉当取太过不及，"}, {"f": "audio/ca/L1-jg-28__2.mp3", "t": "阳微阴弦，"}, {"f": "audio/ca/L1-jg-28__3.mp3", "t": "即胸痹而痛，"}, {"f": "audio/ca/L1-jg-28__4.mp3", "t": "所以然者，"}, {"f": "audio/ca/L1-jg-28__5.mp3", "t": "责其极虚也。"}, {"f": "audio/ca/L1-jg-28__6.mp3", "t": "今阳虚知在上焦，"}, {"f": "audio/ca/L1-jg-28__7.mp3", "t": "所以胸痹心痛者，"}, {"f": "audio/ca/L1-jg-28__8.mp3", "t": "以其阴弦故也。"}], "L1-jg-29": [{"f": "audio/68/L1-jg-29__0.mp3", "t": "胸痹之病，"}, {"f": "audio/68/L1-jg-29__1.mp3", "t": "喘息咳唾，"}, {"f": "audio/68/L1-jg-29__2.mp3", "t": "胸背痛，"}, {"f": "audio/68/L1-jg-29__3.mp3", "t": "短气，"}, {"f": "audio/68/L1-jg-29__4.mp3", "t": "寸口脉沉而迟，"}, {"f": "audio/68/L1-jg-29__5.mp3", "t": "关上小紧数，"}, {"f": "audio/68/L1-jg-29__6.mp3", "t": "栝楼薤白白酒汤主之。"}], "L1-jg-30": [{"f": "audio/e1/L1-jg-30__0.mp3", "t": "胸痹不得卧，"}, {"f": "audio/e1/L1-jg-30__1.mp3", "t": "心痛彻背者，"}, {"f": "audio/e1/L1-jg-30__2.mp3", "t": "栝楼薤白半夏汤主之。"}], "L1-jg-31": [{"f": "audio/80/L1-jg-31__0.mp3", "t": "胸痹，"}, {"f": "audio/80/L1-jg-31__1.mp3", "t": "心中痞气，"}, {"f": "audio/80/L1-jg-31__2.mp3", "t": "气结在胸，"}, {"f": "audio/80/L1-jg-31__3.mp3", "t": "胸满，"}, {"f": "audio/80/L1-jg-31__4.mp3", "t": "胁下逆抢心，"}, {"f": "audio/80/L1-jg-31__5.mp3", "t": "枳实薤白桂枝汤主之，"}, {"f": "audio/80/L1-jg-31__6.mp3", "t": "人参汤亦主之。"}], "L1-jg-32": [{"f": "audio/a6/L1-jg-32__0.mp3", "t": "心痛彻背，"}, {"f": "audio/a6/L1-jg-32__1.mp3", "t": "背痛彻心，"}, {"f": "audio/a6/L1-jg-32__2.mp3", "t": "乌头赤石脂丸主之。"}], "L1-jg-33": [{"f": "audio/75/L1-jg-33__0.mp3", "t": "病腹满，"}, {"f": "audio/75/L1-jg-33__1.mp3", "t": "发热十日，"}, {"f": "audio/75/L1-jg-33__2.mp3", "t": "脉浮而数，"}, {"f": "audio/75/L1-jg-33__3.mp3", "t": "饮食如故，"}, {"f": "audio/75/L1-jg-33__4.mp3", "t": "厚朴七物汤主之。"}], "L1-jg-34": [{"f": "audio/f2/L1-jg-34__0.mp3", "t": "腹满不减，"}, {"f": "audio/f2/L1-jg-34__1.mp3", "t": "减不足言，"}, {"f": "audio/f2/L1-jg-34__2.mp3", "t": "当须下之，"}, {"f": "audio/f2/L1-jg-34__3.mp3", "t": "宜大承气汤。"}], "L1-jg-35": [{"f": "audio/f5/L1-jg-35__0.mp3", "t": "心胸中大寒痛，"}, {"f": "audio/f5/L1-jg-35__1.mp3", "t": "呕不能饮食，"}, {"f": "audio/f5/L1-jg-35__2.mp3", "t": "腹中寒，"}, {"f": "audio/f5/L1-jg-35__3.mp3", "t": "上冲皮起，"}, {"f": "audio/f5/L1-jg-35__4.mp3", "t": "出见有头足，"}, {"f": "audio/f5/L1-jg-35__5.mp3", "t": "上下痛而不可触近，"}, {"f": "audio/f5/L1-jg-35__6.mp3", "t": "大建中汤主之。"}], "L1-jg-36": [{"f": "audio/f6/L1-jg-36__0.mp3", "t": "胁下偏痛，"}, {"f": "audio/f6/L1-jg-36__1.mp3", "t": "发热，"}, {"f": "audio/f6/L1-jg-36__2.mp3", "t": "其脉紧弦，"}, {"f": "audio/f6/L1-jg-36__3.mp3", "t": "此寒也，"}, {"f": "audio/f6/L1-jg-36__4.mp3", "t": "以温药下之，"}, {"f": "audio/f6/L1-jg-36__5.mp3", "t": "宜大黄附子汤。"}], "L1-jg-37": [{"f": "audio/4b/L1-jg-37__0.mp3", "t": "寒疝腹中痛，"}, {"f": "audio/4b/L1-jg-37__1.mp3", "t": "及胁痛里急者，"}, {"f": "audio/4b/L1-jg-37__2.mp3", "t": "当归生姜羊肉汤主之。"}], "L1-jg-38": [{"f": "audio/f9/L1-jg-38__0.mp3", "t": "肝着，"}, {"f": "audio/f9/L1-jg-38__1.mp3", "t": "其人常欲蹈其胸上，"}, {"f": "audio/f9/L1-jg-38__2.mp3", "t": "先未苦时，"}, {"f": "audio/f9/L1-jg-38__3.mp3", "t": "但欲饮热，"}, {"f": "audio/f9/L1-jg-38__4.mp3", "t": "旋覆花汤主之。"}], "L1-jg-39": [{"f": "audio/05/L1-jg-39__0.mp3", "t": "肾着之病，"}, {"f": "audio/05/L1-jg-39__1.mp3", "t": "其人身体重，"}, {"f": "audio/05/L1-jg-39__2.mp3", "t": "腰中冷，"}, {"f": "audio/05/L1-jg-39__3.mp3", "t": "如坐水中，"}, {"f": "audio/05/L1-jg-39__4.mp3", "t": "形如水状，"}, {"f": "audio/05/L1-jg-39__5.mp3", "t": "反不渴，"}, {"f": "audio/05/L1-jg-39__6.mp3", "t": "小便自利，"}, {"f": "audio/05/L1-jg-39__7.mp3", "t": "饮食如故，"}, {"f": "audio/05/L1-jg-39__8.mp3", "t": "病属下焦，"}, {"f": "audio/05/L1-jg-39__9.mp3", "t": "身劳汗出，"}, {"f": "audio/05/L1-jg-39__10.mp3", "t": "衣里冷湿，"}, {"f": "audio/05/L1-jg-39__11.mp3", "t": "久久得之，"}, {"f": "audio/05/L1-jg-39__12.mp3", "t": "腰以下冷痛，"}, {"f": "audio/05/L1-jg-39__13.mp3", "t": "腹重如带五千钱，"}, {"f": "audio/05/L1-jg-39__14.mp3", "t": "甘姜苓术汤主之。"}], "L1-jg-40": [{"f": "audio/7b/L1-jg-40__0.mp3", "t": "夫饮有四，"}, {"f": "audio/7b/L1-jg-40__1.mp3", "t": "何谓也？"}, {"f": "audio/7b/L1-jg-40__2.mp3", "t": "师曰："}, {"f": "audio/7b/L1-jg-40__3.mp3", "t": "有痰饮，"}, {"f": "audio/7b/L1-jg-40__4.mp3", "t": "有悬饮，"}, {"f": "audio/7b/L1-jg-40__5.mp3", "t": "有溢饮，"}, {"f": "audio/7b/L1-jg-40__6.mp3", "t": "有支饮。"}], "L1-jg-41": [{"f": "audio/4d/L1-jg-41__0.mp3", "t": "其人素盛今瘦，"}, {"f": "audio/4d/L1-jg-41__1.mp3", "t": "水走肠间，"}, {"f": "audio/4d/L1-jg-41__2.mp3", "t": "沥沥有声，"}, {"f": "audio/4d/L1-jg-41__3.mp3", "t": "谓之痰饮；"}, {"f": "audio/4d/L1-jg-41__4.mp3", "t": "饮后水流在胁下，"}, {"f": "audio/4d/L1-jg-41__5.mp3", "t": "咳唾引痛，"}, {"f": "audio/4d/L1-jg-41__6.mp3", "t": "谓之悬饮；"}, {"f": "audio/4d/L1-jg-41__7.mp3", "t": "饮水流行，"}, {"f": "audio/4d/L1-jg-41__8.mp3", "t": "归于四肢，"}, {"f": "audio/4d/L1-jg-41__9.mp3", "t": "当汗出而不汗出，"}, {"f": "audio/4d/L1-jg-41__10.mp3", "t": "身体疼重，"}, {"f": "audio/4d/L1-jg-41__11.mp3", "t": "谓之溢饮；"}, {"f": "audio/4d/L1-jg-41__12.mp3", "t": "咳逆倚息，"}, {"f": "audio/4d/L1-jg-41__13.mp3", "t": "短气不得卧，"}, {"f": "audio/4d/L1-jg-41__14.mp3", "t": "其形如肿，"}, {"f": "audio/4d/L1-jg-41__15.mp3", "t": "谓之支饮。"}], "L1-jg-42": [{"f": "audio/a8/L1-jg-42__0.mp3", "t": "病痰饮者，"}, {"f": "audio/a8/L1-jg-42__1.mp3", "t": "当以温药和之。"}], "L1-jg-43": [{"f": "audio/be/L1-jg-43__0.mp3", "t": "心下有痰饮，"}, {"f": "audio/be/L1-jg-43__1.mp3", "t": "胸胁支满，"}, {"f": "audio/be/L1-jg-43__2.mp3", "t": "目眩，"}, {"f": "audio/be/L1-jg-43__3.mp3", "t": "苓桂术甘汤主之。"}], "L1-jg-44": [{"f": "audio/4d/L1-jg-44__0.mp3", "t": "脉沉而弦者，"}, {"f": "audio/4d/L1-jg-44__1.mp3", "t": "悬饮内痛，"}, {"f": "audio/4d/L1-jg-44__2.mp3", "t": "十枣汤主之。"}], "L1-jg-45": [{"f": "audio/ba/L1-jg-45__0.mp3", "t": "病溢饮者，"}, {"f": "audio/ba/L1-jg-45__1.mp3", "t": "当发其汗，"}, {"f": "audio/ba/L1-jg-45__2.mp3", "t": "大青龙汤主之，"}, {"f": "audio/ba/L1-jg-45__3.mp3", "t": "小青龙汤亦主之。"}], "L1-jg-46": [{"f": "audio/20/L1-jg-46__0.mp3", "t": "膈间支饮，"}, {"f": "audio/20/L1-jg-46__1.mp3", "t": "其人喘满，"}, {"f": "audio/20/L1-jg-46__2.mp3", "t": "心下痞坚，"}, {"f": "audio/20/L1-jg-46__3.mp3", "t": "面色黧黑，"}, {"f": "audio/20/L1-jg-46__4.mp3", "t": "其脉沉紧，"}, {"f": "audio/20/L1-jg-46__5.mp3", "t": "得之数十日，"}, {"f": "audio/20/L1-jg-46__6.mp3", "t": "医吐下之不愈，"}, {"f": "audio/20/L1-jg-46__7.mp3", "t": "木防己汤主之。"}], "L1-jg-47": [{"f": "audio/50/L1-jg-47__0.mp3", "t": "心下有支饮，"}, {"f": "audio/50/L1-jg-47__1.mp3", "t": "其人苦冒眩，"}, {"f": "audio/50/L1-jg-47__2.mp3", "t": "泽泻汤主之。"}], "L1-jg-48": [{"f": "audio/28/L1-jg-48__0.mp3", "t": "支饮胸满者，"}, {"f": "audio/28/L1-jg-48__1.mp3", "t": "厚朴大黄汤主之。"}], "L1-jg-49": [{"f": "audio/9e/L1-jg-49__0.mp3", "t": "腹满，"}, {"f": "audio/9e/L1-jg-49__1.mp3", "t": "口舌干燥，"}, {"f": "audio/9e/L1-jg-49__2.mp3", "t": "此肠间有水气，"}, {"f": "audio/9e/L1-jg-49__3.mp3", "t": "己椒苈黄丸主之。"}], "L1-jg-50": [{"f": "audio/ee/L1-jg-50__0.mp3", "t": "男子消渴，"}, {"f": "audio/ee/L1-jg-50__1.mp3", "t": "小便反多，"}, {"f": "audio/ee/L1-jg-50__2.mp3", "t": "以饮一斗，"}, {"f": "audio/ee/L1-jg-50__3.mp3", "t": "小便一斗，"}, {"f": "audio/ee/L1-jg-50__4.mp3", "t": "肾气丸主之。"}], "L1-jg-51": [{"f": "audio/46/L1-jg-51__0.mp3", "t": "小便不利者，"}, {"f": "audio/46/L1-jg-51__1.mp3", "t": "有水气，"}, {"f": "audio/46/L1-jg-51__2.mp3", "t": "其人若渴，"}, {"f": "audio/46/L1-jg-51__3.mp3", "t": "栝楼瞿麦丸主之。"}], "L1-jg-52": [{"f": "audio/24/L1-jg-52__0.mp3", "t": "师曰："}, {"f": "audio/24/L1-jg-52__1.mp3", "t": "病有风水、"}, {"f": "audio/24/L1-jg-52__2.mp3", "t": "有皮水、"}, {"f": "audio/24/L1-jg-52__3.mp3", "t": "有正水、"}, {"f": "audio/24/L1-jg-52__4.mp3", "t": "有石水、"}, {"f": "audio/24/L1-jg-52__5.mp3", "t": "有黄汗。"}], "L1-jg-53": [{"f": "audio/32/L1-jg-53__0.mp3", "t": "脉得诸沉，"}, {"f": "audio/32/L1-jg-53__1.mp3", "t": "当责有水，"}, {"f": "audio/32/L1-jg-53__2.mp3", "t": "身体肿重。"}], "L1-jg-54": [{"f": "audio/78/L1-jg-54__0.mp3", "t": "诸有水者，"}, {"f": "audio/78/L1-jg-54__1.mp3", "t": "腰以下肿，"}, {"f": "audio/78/L1-jg-54__2.mp3", "t": "当利小便；"}, {"f": "audio/78/L1-jg-54__3.mp3", "t": "腰以上肿，"}, {"f": "audio/78/L1-jg-54__4.mp3", "t": "当发汗乃愈。"}], "L1-jg-55": [{"f": "audio/69/L1-jg-55__0.mp3", "t": "风水，"}, {"f": "audio/69/L1-jg-55__1.mp3", "t": "脉浮身重，"}, {"f": "audio/69/L1-jg-55__2.mp3", "t": "汗出恶风者，"}, {"f": "audio/69/L1-jg-55__3.mp3", "t": "防己黄芪汤主之。"}], "L1-jg-56": [{"f": "audio/ec/L1-jg-56__0.mp3", "t": "风水恶风，"}, {"f": "audio/ec/L1-jg-56__1.mp3", "t": "一身悉肿，"}, {"f": "audio/ec/L1-jg-56__2.mp3", "t": "脉浮不渴，"}, {"f": "audio/ec/L1-jg-56__3.mp3", "t": "续自汗出，"}, {"f": "audio/ec/L1-jg-56__4.mp3", "t": "无大热，"}, {"f": "audio/ec/L1-jg-56__5.mp3", "t": "越婢汤主之。"}], "L1-jg-57": [{"f": "audio/7a/L1-jg-57__0.mp3", "t": "皮水为病，"}, {"f": "audio/7a/L1-jg-57__1.mp3", "t": "四肢肿，"}, {"f": "audio/7a/L1-jg-57__2.mp3", "t": "水气在皮肤中，"}, {"f": "audio/7a/L1-jg-57__3.mp3", "t": "四肢聂聂动者，"}, {"f": "audio/7a/L1-jg-57__4.mp3", "t": "防己茯苓汤主之。"}], "L1-jg-58": [{"f": "audio/e5/L1-jg-58__0.mp3", "t": "里水，"}, {"f": "audio/e5/L1-jg-58__1.mp3", "t": "越婢加术汤主之，"}, {"f": "audio/e5/L1-jg-58__2.mp3", "t": "甘草麻黄汤亦主之。"}], "L1-jg-59": [{"f": "audio/dd/L1-jg-59__0.mp3", "t": "水之为病，"}, {"f": "audio/dd/L1-jg-59__1.mp3", "t": "其脉沉小，"}, {"f": "audio/dd/L1-jg-59__2.mp3", "t": "属少阴；"}, {"f": "audio/dd/L1-jg-59__3.mp3", "t": "浮者为风；"}, {"f": "audio/dd/L1-jg-59__4.mp3", "t": "无水虚胀者为气；"}, {"f": "audio/dd/L1-jg-59__5.mp3", "t": "水，"}, {"f": "audio/dd/L1-jg-59__6.mp3", "t": "发其汗即已。"}, {"f": "audio/dd/L1-jg-59__7.mp3", "t": "脉沉者宜麻黄附子汤；"}, {"f": "audio/dd/L1-jg-59__8.mp3", "t": "浮者，"}, {"f": "audio/dd/L1-jg-59__9.mp3", "t": "宜杏子汤。"}], "L1-jg-60": [{"f": "audio/16/L1-jg-60__0.mp3", "t": "寸口脉浮而缓，"}, {"f": "audio/16/L1-jg-60__1.mp3", "t": "浮则为风，"}, {"f": "audio/16/L1-jg-60__2.mp3", "t": "缓则为痹。"}, {"f": "audio/16/L1-jg-60__3.mp3", "t": "痹非中风，"}, {"f": "audio/16/L1-jg-60__4.mp3", "t": "四肢苦烦，"}, {"f": "audio/16/L1-jg-60__5.mp3", "t": "脾色必黄，"}, {"f": "audio/16/L1-jg-60__6.mp3", "t": "瘀热以行。"}], "L1-jg-61": [{"f": "audio/18/L1-jg-61__0.mp3", "t": "趺阳脉紧而数，"}, {"f": "audio/18/L1-jg-61__1.mp3", "t": "数则为热，"}, {"f": "audio/18/L1-jg-61__2.mp3", "t": "热则消谷；"}, {"f": "audio/18/L1-jg-61__3.mp3", "t": "紧则为寒，"}, {"f": "audio/18/L1-jg-61__4.mp3", "t": "食即为满。"}, {"f": "audio/18/L1-jg-61__5.mp3", "t": "尺脉浮为伤肾，"}, {"f": "audio/18/L1-jg-61__6.mp3", "t": "趺阳脉紧为伤脾。"}, {"f": "audio/18/L1-jg-61__7.mp3", "t": "风寒相搏，"}, {"f": "audio/18/L1-jg-61__8.mp3", "t": "食谷即眩，"}, {"f": "audio/18/L1-jg-61__9.mp3", "t": "谷气不消，"}, {"f": "audio/18/L1-jg-61__10.mp3", "t": "胃中苦浊，"}, {"f": "audio/18/L1-jg-61__11.mp3", "t": "浊气下流，"}, {"f": "audio/18/L1-jg-61__12.mp3", "t": "小便不通……身体尽黄，"}, {"f": "audio/18/L1-jg-61__13.mp3", "t": "名曰谷疸。"}, {"f": "audio/18/L1-jg-61__14.mp3", "t": "额上黑，"}, {"f": "audio/18/L1-jg-61__15.mp3", "t": "微汗出，"}, {"f": "audio/18/L1-jg-61__16.mp3", "t": "手足中热，"}, {"f": "audio/18/L1-jg-61__17.mp3", "t": "薄暮即发，"}, {"f": "audio/18/L1-jg-61__18.mp3", "t": "膀胱急，"}, {"f": "audio/18/L1-jg-61__19.mp3", "t": "小便自利，"}, {"f": "audio/18/L1-jg-61__20.mp3", "t": "名曰女劳疸。"}, {"f": "audio/18/L1-jg-61__21.mp3", "t": "腹如水状，"}, {"f": "audio/18/L1-jg-61__22.mp3", "t": "不治。"}, {"f": "audio/18/L1-jg-61__23.mp3", "t": "心中懊憹而热，"}, {"f": "audio/18/L1-jg-61__24.mp3", "t": "不能食，"}, {"f": "audio/18/L1-jg-61__25.mp3", "t": "时欲吐，"}, {"f": "audio/18/L1-jg-61__26.mp3", "t": "名曰酒疸。"}], "L1-jg-62": [{"f": "audio/dc/L1-jg-62__0.mp3", "t": "谷疸之为病，"}, {"f": "audio/dc/L1-jg-62__1.mp3", "t": "寒热不食，"}, {"f": "audio/dc/L1-jg-62__2.mp3", "t": "食即头眩，"}, {"f": "audio/dc/L1-jg-62__3.mp3", "t": "心胸不安，"}, {"f": "audio/dc/L1-jg-62__4.mp3", "t": "久久发黄为谷疸，"}, {"f": "audio/dc/L1-jg-62__5.mp3", "t": "茵陈蒿汤主之。"}], "L1-jg-63": [{"f": "audio/f4/L1-jg-63__0.mp3", "t": "酒黄疸，"}, {"f": "audio/f4/L1-jg-63__1.mp3", "t": "心中懊憹，"}, {"f": "audio/f4/L1-jg-63__2.mp3", "t": "或热痛，"}, {"f": "audio/f4/L1-jg-63__3.mp3", "t": "栀子大黄汤主之。"}], "L1-jg-64": [{"f": "audio/8f/L1-jg-64__0.mp3", "t": "诸病黄家，"}, {"f": "audio/8f/L1-jg-64__1.mp3", "t": "但利其小便。"}, {"f": "audio/8f/L1-jg-64__2.mp3", "t": "假令脉浮，"}, {"f": "audio/8f/L1-jg-64__3.mp3", "t": "当以汗解之，"}, {"f": "audio/8f/L1-jg-64__4.mp3", "t": "宜桂枝加黄芪汤主之。"}], "L1-jg-65": [{"f": "audio/73/L1-jg-65__0.mp3", "t": "病人胸满，"}, {"f": "audio/73/L1-jg-65__1.mp3", "t": "唇痿舌青，"}, {"f": "audio/73/L1-jg-65__2.mp3", "t": "口燥，"}, {"f": "audio/73/L1-jg-65__3.mp3", "t": "但欲漱水不欲咽，"}, {"f": "audio/73/L1-jg-65__4.mp3", "t": "无寒热，"}, {"f": "audio/73/L1-jg-65__5.mp3", "t": "脉微大来迟，"}, {"f": "audio/73/L1-jg-65__6.mp3", "t": "腹不满，"}, {"f": "audio/73/L1-jg-65__7.mp3", "t": "其人言我满，"}, {"f": "audio/73/L1-jg-65__8.mp3", "t": "为有瘀血。"}], "L1-jg-66": [{"f": "audio/ee/L1-jg-66__0.mp3", "t": "火邪者，"}, {"f": "audio/ee/L1-jg-66__1.mp3", "t": "桂枝去芍药加蜀漆牡蛎龙骨救逆汤主之。"}, {"f": "audio/ee/L1-jg-66__2.mp3", "t": "心下悸者，"}, {"f": "audio/ee/L1-jg-66__3.mp3", "t": "半夏麻黄丸主之。"}], "L1-jg-67": [{"f": "audio/73/L1-jg-67__0.mp3", "t": "下血，"}, {"f": "audio/73/L1-jg-67__1.mp3", "t": "先便后血，"}, {"f": "audio/73/L1-jg-67__2.mp3", "t": "此远血也，"}, {"f": "audio/73/L1-jg-67__3.mp3", "t": "黄土汤主之。"}], "L1-jg-68": [{"f": "audio/f2/L1-jg-68__0.mp3", "t": "下血，"}, {"f": "audio/f2/L1-jg-68__1.mp3", "t": "先血后便，"}, {"f": "audio/f2/L1-jg-68__2.mp3", "t": "此近血也，"}, {"f": "audio/f2/L1-jg-68__3.mp3", "t": "赤小豆当归散主之。"}], "L1-jg-69": [{"f": "audio/c2/L1-jg-69__0.mp3", "t": "诸呕吐，"}, {"f": "audio/c2/L1-jg-69__1.mp3", "t": "谷不得下者，"}, {"f": "audio/c2/L1-jg-69__2.mp3", "t": "小半夏汤主之。"}], "L1-jg-70": [{"f": "audio/52/L1-jg-70__0.mp3", "t": "食已即吐者，"}, {"f": "audio/52/L1-jg-70__1.mp3", "t": "大黄甘草汤主之。"}], "L1-jg-71": [{"f": "audio/cd/L1-jg-71__0.mp3", "t": "干呕，"}, {"f": "audio/cd/L1-jg-71__1.mp3", "t": "吐逆，"}, {"f": "audio/cd/L1-jg-71__2.mp3", "t": "吐涎沫，"}, {"f": "audio/cd/L1-jg-71__3.mp3", "t": "半夏干姜散主之。"}], "L1-jg-72": [{"f": "audio/46/L1-jg-72__0.mp3", "t": "病人胸中似喘不喘，"}, {"f": "audio/46/L1-jg-72__1.mp3", "t": "似呕不呕，"}, {"f": "audio/46/L1-jg-72__2.mp3", "t": "似哕不哕，"}, {"f": "audio/46/L1-jg-72__3.mp3", "t": "彻心中愦愦然无奈者，"}, {"f": "audio/46/L1-jg-72__4.mp3", "t": "生姜半夏汤主之。"}], "L1-jg-73": [{"f": "audio/1f/L1-jg-73__0.mp3", "t": "胃反呕吐者，"}, {"f": "audio/1f/L1-jg-73__1.mp3", "t": "大半夏汤主之。"}], "L1-jg-74": [{"f": "audio/8a/L1-jg-74__0.mp3", "t": "哕逆者，"}, {"f": "audio/8a/L1-jg-74__1.mp3", "t": "橘皮竹茹汤主之。"}], "L1-jg-75": [{"f": "audio/1b/L1-jg-75__0.mp3", "t": "肠痈者，"}, {"f": "audio/1b/L1-jg-75__1.mp3", "t": "少腹肿痞，"}, {"f": "audio/1b/L1-jg-75__2.mp3", "t": "按之即痛如淋，"}, {"f": "audio/1b/L1-jg-75__3.mp3", "t": "小便自调，"}, {"f": "audio/1b/L1-jg-75__4.mp3", "t": "时时发热，"}, {"f": "audio/1b/L1-jg-75__5.mp3", "t": "自汗出，"}, {"f": "audio/1b/L1-jg-75__6.mp3", "t": "复恶寒。"}, {"f": "audio/1b/L1-jg-75__7.mp3", "t": "其脉迟紧者，"}, {"f": "audio/1b/L1-jg-75__8.mp3", "t": "脓未成，"}, {"f": "audio/1b/L1-jg-75__9.mp3", "t": "可下之，"}, {"f": "audio/1b/L1-jg-75__10.mp3", "t": "当有血；"}, {"f": "audio/1b/L1-jg-75__11.mp3", "t": "脉洪数者，"}, {"f": "audio/1b/L1-jg-75__12.mp3", "t": "脓已成，"}, {"f": "audio/1b/L1-jg-75__13.mp3", "t": "不可下也，"}, {"f": "audio/1b/L1-jg-75__14.mp3", "t": "大黄牡丹汤主之。"}], "L1-jg-76": [{"f": "audio/a1/L1-jg-76__0.mp3", "t": "妇人宿有癥病，"}, {"f": "audio/a1/L1-jg-76__1.mp3", "t": "经断未及三月，"}, {"f": "audio/a1/L1-jg-76__2.mp3", "t": "而得漏下不止，"}, {"f": "audio/a1/L1-jg-76__3.mp3", "t": "胎动在脐上者，"}, {"f": "audio/a1/L1-jg-76__4.mp3", "t": "为癥痼害。"}, {"f": "audio/a1/L1-jg-76__5.mp3", "t": "妊娠六月动者，"}, {"f": "audio/a1/L1-jg-76__6.mp3", "t": "前三月经水利时，"}, {"f": "audio/a1/L1-jg-76__7.mp3", "t": "胎也。"}, {"f": "audio/a1/L1-jg-76__8.mp3", "t": "下血者，"}, {"f": "audio/a1/L1-jg-76__9.mp3", "t": "后断三月衃也。"}, {"f": "audio/a1/L1-jg-76__10.mp3", "t": "所以血不止者，"}, {"f": "audio/a1/L1-jg-76__11.mp3", "t": "其癥不去故也，"}, {"f": "audio/a1/L1-jg-76__12.mp3", "t": "当下其癥，"}, {"f": "audio/a1/L1-jg-76__13.mp3", "t": "桂枝茯苓丸主之。"}], "L1-jg-77": [{"f": "audio/f9/L1-jg-77__0.mp3", "t": "妇人有漏下者，"}, {"f": "audio/f9/L1-jg-77__1.mp3", "t": "有半产后因续下血都不绝者，"}, {"f": "audio/f9/L1-jg-77__2.mp3", "t": "有妊娠下血者，"}, {"f": "audio/f9/L1-jg-77__3.mp3", "t": "假令妊娠腹中痛，"}, {"f": "audio/f9/L1-jg-77__4.mp3", "t": "为胞阻，"}, {"f": "audio/f9/L1-jg-77__5.mp3", "t": "胶艾汤主之。"}], "L1-jg-78": [{"f": "audio/84/L1-jg-78__0.mp3", "t": "妇人怀妊，"}, {"f": "audio/84/L1-jg-78__1.mp3", "t": "腹中㽲痛，"}, {"f": "audio/84/L1-jg-78__2.mp3", "t": "当归芍药散主之。"}], "L1-jg-79": [{"f": "audio/32/L1-jg-79__0.mp3", "t": "妊娠呕吐不止，"}, {"f": "audio/32/L1-jg-79__1.mp3", "t": "干姜人参半夏丸主之。"}], "L1-jg-80": [{"f": "audio/b7/L1-jg-80__0.mp3", "t": "妊娠小便难，"}, {"f": "audio/b7/L1-jg-80__1.mp3", "t": "饮食如故，"}, {"f": "audio/b7/L1-jg-80__2.mp3", "t": "当归贝母苦参丸主之。"}], "L1-jg-81": [{"f": "audio/52/L1-jg-81__0.mp3", "t": "妇人妊娠，"}, {"f": "audio/52/L1-jg-81__1.mp3", "t": "宜常服当归散主之。"}], "L1-jg-82": [{"f": "audio/04/L1-jg-82__0.mp3", "t": "新产妇人有三病，"}, {"f": "audio/04/L1-jg-82__1.mp3", "t": "一者病痉，"}, {"f": "audio/04/L1-jg-82__2.mp3", "t": "二者病郁冒，"}, {"f": "audio/04/L1-jg-82__3.mp3", "t": "三者大便难，"}, {"f": "audio/04/L1-jg-82__4.mp3", "t": "何谓也？"}, {"f": "audio/04/L1-jg-82__5.mp3", "t": "师曰："}, {"f": "audio/04/L1-jg-82__6.mp3", "t": "新产血虚，"}, {"f": "audio/04/L1-jg-82__7.mp3", "t": "多汗出，"}, {"f": "audio/04/L1-jg-82__8.mp3", "t": "喜中风，"}, {"f": "audio/04/L1-jg-82__9.mp3", "t": "故令病痉；"}, {"f": "audio/04/L1-jg-82__10.mp3", "t": "亡血复汗，"}, {"f": "audio/04/L1-jg-82__11.mp3", "t": "寒多，"}, {"f": "audio/04/L1-jg-82__12.mp3", "t": "故令郁冒；"}, {"f": "audio/04/L1-jg-82__13.mp3", "t": "亡津液，"}, {"f": "audio/04/L1-jg-82__14.mp3", "t": "胃燥，"}, {"f": "audio/04/L1-jg-82__15.mp3", "t": "故大便难。"}], "L1-jg-83": [{"f": "audio/cc/L1-jg-83__0.mp3", "t": "产后腹中㽲痛，"}, {"f": "audio/cc/L1-jg-83__1.mp3", "t": "当归生姜羊肉汤主之。"}], "L1-jg-84": [{"f": "audio/56/L1-jg-84__0.mp3", "t": "产后腹痛，"}, {"f": "audio/56/L1-jg-84__1.mp3", "t": "烦满不得卧，"}, {"f": "audio/56/L1-jg-84__2.mp3", "t": "枳实芍药散主之。"}], "L1-jg-85": [{"f": "audio/24/L1-jg-85__0.mp3", "t": "妇人咽中如有炙脔，"}, {"f": "audio/24/L1-jg-85__1.mp3", "t": "半夏厚朴汤主之。"}], "L1-jg-86": [{"f": "audio/56/L1-jg-86__0.mp3", "t": "妇人脏躁，"}, {"f": "audio/56/L1-jg-86__1.mp3", "t": "喜悲伤欲哭，"}, {"f": "audio/56/L1-jg-86__2.mp3", "t": "象如神灵所作，"}, {"f": "audio/56/L1-jg-86__3.mp3", "t": "数欠伸，"}, {"f": "audio/56/L1-jg-86__4.mp3", "t": "甘麦大枣汤主之。"}], "L1-jg-87": [{"f": "audio/1e/L1-jg-87__0.mp3", "t": "妇人陷经，"}, {"f": "audio/1e/L1-jg-87__1.mp3", "t": "漏下黑不解，"}, {"f": "audio/1e/L1-jg-87__2.mp3", "t": "胶姜汤主之。"}], "L1-jg-88": [{"f": "audio/da/L1-jg-88__0.mp3", "t": "妇人少腹满如敦状，"}, {"f": "audio/da/L1-jg-88__1.mp3", "t": "小便微难而不渴，"}, {"f": "audio/da/L1-jg-88__2.mp3", "t": "生后者，"}, {"f": "audio/da/L1-jg-88__3.mp3", "t": "此为水与血并结在血室也，"}, {"f": "audio/da/L1-jg-88__4.mp3", "t": "大黄甘遂汤主之。"}], "L1-wb-0": [{"f": "audio/68/L1-wb-0__0.mp3", "t": "温邪上受，"}, {"f": "audio/68/L1-wb-0__1.mp3", "t": "首先犯肺，"}, {"f": "audio/68/L1-wb-0__2.mp3", "t": "逆传心包。"}, {"f": "audio/68/L1-wb-0__3.mp3", "t": "肺主气属卫，"}, {"f": "audio/68/L1-wb-0__4.mp3", "t": "心主血属营。"}, {"f": "audio/68/L1-wb-0__5.mp3", "t": "辨营卫气血虽与伤寒同，"}, {"f": "audio/68/L1-wb-0__6.mp3", "t": "若论治法则与伤寒大异也。"}], "L1-wb-1": [{"f": "audio/05/L1-wb-1__0.mp3", "t": "盖伤寒之邪留恋在表，"}, {"f": "audio/05/L1-wb-1__1.mp3", "t": "然后化热入里，"}, {"f": "audio/05/L1-wb-1__2.mp3", "t": "温邪则热变最速。"}, {"f": "audio/05/L1-wb-1__3.mp3", "t": "未传心包，"}, {"f": "audio/05/L1-wb-1__4.mp3", "t": "邪尚在肺，"}, {"f": "audio/05/L1-wb-1__5.mp3", "t": "肺主气，"}, {"f": "audio/05/L1-wb-1__6.mp3", "t": "其合皮毛，"}, {"f": "audio/05/L1-wb-1__7.mp3", "t": "故云在表。"}, {"f": "audio/05/L1-wb-1__8.mp3", "t": "在表初用辛凉轻剂。"}, {"f": "audio/05/L1-wb-1__9.mp3", "t": "挟风则加入薄荷、"}, {"f": "audio/05/L1-wb-1__10.mp3", "t": "牛蒡之属，"}, {"f": "audio/05/L1-wb-1__11.mp3", "t": "挟湿加芦根、"}, {"f": "audio/05/L1-wb-1__12.mp3", "t": "滑石之流。"}], "L1-wb-2": [{"f": "audio/ab/L1-wb-2__0.mp3", "t": "营分受热，"}, {"f": "audio/ab/L1-wb-2__1.mp3", "t": "则血液受劫，"}, {"f": "audio/ab/L1-wb-2__2.mp3", "t": "心神不安，"}, {"f": "audio/ab/L1-wb-2__3.mp3", "t": "夜甚无寐，"}, {"f": "audio/ab/L1-wb-2__4.mp3", "t": "或斑点隐隐。"}], "L1-wb-3": [{"f": "audio/29/L1-wb-3__0.mp3", "t": "若其邪始终在气分流连者，"}, {"f": "audio/29/L1-wb-3__1.mp3", "t": "可冀其战汗透邪，"}, {"f": "audio/29/L1-wb-3__2.mp3", "t": "法宜益胃，"}, {"f": "audio/29/L1-wb-3__3.mp3", "t": "令邪与汗并，"}, {"f": "audio/29/L1-wb-3__4.mp3", "t": "热达腠开，"}, {"f": "audio/29/L1-wb-3__5.mp3", "t": "邪从汗出。"}, {"f": "audio/29/L1-wb-3__6.mp3", "t": "解后胃气空虚，"}, {"f": "audio/29/L1-wb-3__7.mp3", "t": "当肤冷一昼夜，"}, {"f": "audio/29/L1-wb-3__8.mp3", "t": "待气还自温暖如常矣。"}, {"f": "audio/29/L1-wb-3__9.mp3", "t": "盖战汗而解，"}, {"f": "audio/29/L1-wb-3__10.mp3", "t": "邪退正虚，"}, {"f": "audio/29/L1-wb-3__11.mp3", "t": "阳从汗泄，"}, {"f": "audio/29/L1-wb-3__12.mp3", "t": "故渐肤冷，"}, {"f": "audio/29/L1-wb-3__13.mp3", "t": "未必即成脱证。"}, {"f": "audio/29/L1-wb-3__14.mp3", "t": "此时宜令病者，"}, {"f": "audio/29/L1-wb-3__15.mp3", "t": "安舒静卧，"}, {"f": "audio/29/L1-wb-3__16.mp3", "t": "以养阳气来复。"}, {"f": "audio/29/L1-wb-3__17.mp3", "t": "旁人切勿惊惶，"}, {"f": "audio/29/L1-wb-3__18.mp3", "t": "频频呼唤，"}, {"f": "audio/29/L1-wb-3__19.mp3", "t": "扰其元神，"}, {"f": "audio/29/L1-wb-3__20.mp3", "t": "使其烦躁。"}, {"f": "audio/29/L1-wb-3__21.mp3", "t": "但诊其脉，"}, {"f": "audio/29/L1-wb-3__22.mp3", "t": "若虚软和缓，"}, {"f": "audio/29/L1-wb-3__23.mp3", "t": "虽倦卧不语，"}, {"f": "audio/29/L1-wb-3__24.mp3", "t": "汗出肤冷，"}, {"f": "audio/29/L1-wb-3__25.mp3", "t": "却非脱证；"}, {"f": "audio/29/L1-wb-3__26.mp3", "t": "若脉急疾，"}, {"f": "audio/29/L1-wb-3__27.mp3", "t": "躁扰不卧，"}, {"f": "audio/29/L1-wb-3__28.mp3", "t": "肤冷汗出，"}, {"f": "audio/29/L1-wb-3__29.mp3", "t": "便为气脱之证矣。"}], "L1-wb-4": [{"f": "audio/55/L1-wb-4__0.mp3", "t": "大凡看法，"}, {"f": "audio/55/L1-wb-4__1.mp3", "t": "卫之后方言气，"}, {"f": "audio/55/L1-wb-4__2.mp3", "t": "营之后方言血。"}, {"f": "audio/55/L1-wb-4__3.mp3", "t": "在卫汗之可也，"}, {"f": "audio/55/L1-wb-4__4.mp3", "t": "到气才可清气，"}, {"f": "audio/55/L1-wb-4__5.mp3", "t": "入营犹可透热转气，"}, {"f": "audio/55/L1-wb-4__6.mp3", "t": "如犀角、"}, {"f": "audio/55/L1-wb-4__7.mp3", "t": "玄参、"}, {"f": "audio/55/L1-wb-4__8.mp3", "t": "羚羊角等物，"}, {"f": "audio/55/L1-wb-4__9.mp3", "t": "入血就恐耗血动血，"}, {"f": "audio/55/L1-wb-4__10.mp3", "t": "直须凉血散血，"}, {"f": "audio/55/L1-wb-4__11.mp3", "t": "如生地、"}, {"f": "audio/55/L1-wb-4__12.mp3", "t": "丹皮、"}, {"f": "audio/55/L1-wb-4__13.mp3", "t": "阿胶、"}, {"f": "audio/55/L1-wb-4__14.mp3", "t": "赤芍等物。"}, {"f": "audio/55/L1-wb-4__15.mp3", "t": "否则前后不循缓急之法，"}, {"f": "audio/55/L1-wb-4__16.mp3", "t": "虑其动手便错，"}, {"f": "audio/55/L1-wb-4__17.mp3", "t": "反致慌张矣。"}], "L1-wb-5": [{"f": "audio/ee/L1-wb-5__0.mp3", "t": "且吾吴湿邪害人最广，"}, {"f": "audio/ee/L1-wb-5__1.mp3", "t": "如面色白者，"}, {"f": "audio/ee/L1-wb-5__2.mp3", "t": "须要顾其阳气，"}, {"f": "audio/ee/L1-wb-5__3.mp3", "t": "湿胜则阳微也，"}, {"f": "audio/ee/L1-wb-5__4.mp3", "t": "法应清凉，"}, {"f": "audio/ee/L1-wb-5__5.mp3", "t": "然到十分之六七，"}, {"f": "audio/ee/L1-wb-5__6.mp3", "t": "即不可过于寒凉，"}, {"f": "audio/ee/L1-wb-5__7.mp3", "t": "恐成功反弃，"}, {"f": "audio/ee/L1-wb-5__8.mp3", "t": "何以故耶？"}, {"f": "audio/ee/L1-wb-5__9.mp3", "t": "湿热一去，"}, {"f": "audio/ee/L1-wb-5__10.mp3", "t": "阳亦衰微也；"}, {"f": "audio/ee/L1-wb-5__11.mp3", "t": "面色苍者，"}, {"f": "audio/ee/L1-wb-5__12.mp3", "t": "须要顾其津液，"}, {"f": "audio/ee/L1-wb-5__13.mp3", "t": "清凉到十分之六七，"}, {"f": "audio/ee/L1-wb-5__14.mp3", "t": "往往热减身寒者，"}, {"f": "audio/ee/L1-wb-5__15.mp3", "t": "不可就云虚寒而投补剂，"}, {"f": "audio/ee/L1-wb-5__16.mp3", "t": "恐炉烟虽熄，"}, {"f": "audio/ee/L1-wb-5__17.mp3", "t": "灰中有火也，"}, {"f": "audio/ee/L1-wb-5__18.mp3", "t": "须细察精详，"}, {"f": "audio/ee/L1-wb-5__19.mp3", "t": "方少少与之，"}, {"f": "audio/ee/L1-wb-5__20.mp3", "t": "慎不可直率而往也。"}], "L1-wb-6": [{"f": "audio/b2/L1-wb-6__0.mp3", "t": "伤寒大便溏为邪已尽，"}, {"f": "audio/b2/L1-wb-6__1.mp3", "t": "不可再下；"}, {"f": "audio/b2/L1-wb-6__2.mp3", "t": "湿温病大便溏为邪未尽，"}, {"f": "audio/b2/L1-wb-6__3.mp3", "t": "必大便硬，"}, {"f": "audio/b2/L1-wb-6__4.mp3", "t": "慎不可再攻也，"}, {"f": "audio/b2/L1-wb-6__5.mp3", "t": "以粪燥为无湿矣。"}], "L1-wb-7": [{"f": "audio/8e/L1-wb-7__0.mp3", "t": "再人之体，"}, {"f": "audio/8e/L1-wb-7__1.mp3", "t": "脘在腹上，"}, {"f": "audio/8e/L1-wb-7__2.mp3", "t": "其地位处于中，"}, {"f": "audio/8e/L1-wb-7__3.mp3", "t": "按之痛，"}, {"f": "audio/8e/L1-wb-7__4.mp3", "t": "或自痛，"}, {"f": "audio/8e/L1-wb-7__5.mp3", "t": "或痞胀，"}, {"f": "audio/8e/L1-wb-7__6.mp3", "t": "当用苦泄，"}, {"f": "audio/8e/L1-wb-7__7.mp3", "t": "以其入腹近也。"}], "L1-wb-8": [{"f": "audio/f2/L1-wb-8__0.mp3", "t": "斑属血者恒多，"}, {"f": "audio/f2/L1-wb-8__1.mp3", "t": "疹属气者不少。"}, {"f": "audio/f2/L1-wb-8__2.mp3", "t": "斑疹皆是邪气外露之象，"}, {"f": "audio/f2/L1-wb-8__3.mp3", "t": "发出宜神情清爽，"}, {"f": "audio/f2/L1-wb-8__4.mp3", "t": "为外解里和之意；"}, {"f": "audio/f2/L1-wb-8__5.mp3", "t": "如斑疹出而昏者，"}, {"f": "audio/f2/L1-wb-8__6.mp3", "t": "正不胜邪，"}, {"f": "audio/f2/L1-wb-8__7.mp3", "t": "内陷为患。"}], "L1-wb-9": [{"f": "audio/04/L1-wb-9__0.mp3", "t": "湿热证，"}, {"f": "audio/04/L1-wb-9__1.mp3", "t": "始恶寒，"}, {"f": "audio/04/L1-wb-9__2.mp3", "t": "后但热不寒，"}, {"f": "audio/04/L1-wb-9__3.mp3", "t": "汗出胸痞，"}, {"f": "audio/04/L1-wb-9__4.mp3", "t": "舌白，"}, {"f": "audio/04/L1-wb-9__5.mp3", "t": "口渴不引饮。"}], "L1-wb-10": [{"f": "audio/b8/L1-wb-10__0.mp3", "t": "湿热之邪从表伤者，"}, {"f": "audio/b8/L1-wb-10__1.mp3", "t": "十之一二，"}, {"f": "audio/b8/L1-wb-10__2.mp3", "t": "由口鼻入者，"}, {"f": "audio/b8/L1-wb-10__3.mp3", "t": "十之八九。"}, {"f": "audio/b8/L1-wb-10__4.mp3", "t": "阳明为水谷之海，"}, {"f": "audio/b8/L1-wb-10__5.mp3", "t": "太阴为湿土之脏，"}, {"f": "audio/b8/L1-wb-10__6.mp3", "t": "故多阳明太阴受病。"}], "L1-wb-11": [{"f": "audio/f5/L1-wb-11__0.mp3", "t": "湿热证，"}, {"f": "audio/f5/L1-wb-11__1.mp3", "t": "恶寒无汗，"}, {"f": "audio/f5/L1-wb-11__2.mp3", "t": "身重头痛，"}, {"f": "audio/f5/L1-wb-11__3.mp3", "t": "湿在表分，"}, {"f": "audio/f5/L1-wb-11__4.mp3", "t": "宜藿香、"}, {"f": "audio/f5/L1-wb-11__5.mp3", "t": "香薷、"}, {"f": "audio/f5/L1-wb-11__6.mp3", "t": "羌活、"}, {"f": "audio/f5/L1-wb-11__7.mp3", "t": "苍术皮、"}, {"f": "audio/f5/L1-wb-11__8.mp3", "t": "薄荷、"}, {"f": "audio/f5/L1-wb-11__9.mp3", "t": "牛蒡子等味。"}], "L1-wb-12": [{"f": "audio/30/L1-wb-12__0.mp3", "t": "湿热证，"}, {"f": "audio/30/L1-wb-12__1.mp3", "t": "恶寒发热，"}, {"f": "audio/30/L1-wb-12__2.mp3", "t": "身重关节疼痛，"}, {"f": "audio/30/L1-wb-12__3.mp3", "t": "湿在肌肉，"}, {"f": "audio/30/L1-wb-12__4.mp3", "t": "不为汗解，"}, {"f": "audio/30/L1-wb-12__5.mp3", "t": "宜滑石、"}, {"f": "audio/30/L1-wb-12__6.mp3", "t": "大豆黄卷、"}, {"f": "audio/30/L1-wb-12__7.mp3", "t": "茯苓皮、"}, {"f": "audio/30/L1-wb-12__8.mp3", "t": "苍术皮、"}, {"f": "audio/30/L1-wb-12__9.mp3", "t": "藿香、"}, {"f": "audio/30/L1-wb-12__10.mp3", "t": "鲜荷叶、"}, {"f": "audio/30/L1-wb-12__11.mp3", "t": "通草等味。"}], "L1-wb-13": [{"f": "audio/5c/L1-wb-13__0.mp3", "t": "湿热证，"}, {"f": "audio/5c/L1-wb-13__1.mp3", "t": "数日后，"}, {"f": "audio/5c/L1-wb-13__2.mp3", "t": "脘中微闷，"}, {"f": "audio/5c/L1-wb-13__3.mp3", "t": "知饥不食，"}, {"f": "audio/5c/L1-wb-13__4.mp3", "t": "湿邪蒙绕三焦，"}, {"f": "audio/5c/L1-wb-13__5.mp3", "t": "宜藿香叶、"}, {"f": "audio/5c/L1-wb-13__6.mp3", "t": "薄荷叶、"}, {"f": "audio/5c/L1-wb-13__7.mp3", "t": "鲜荷叶、"}, {"f": "audio/5c/L1-wb-13__8.mp3", "t": "枇杷叶、"}, {"f": "audio/5c/L1-wb-13__9.mp3", "t": "佩兰叶、"}, {"f": "audio/5c/L1-wb-13__10.mp3", "t": "芦根等味。"}], "L1-wb-14": [{"f": "audio/d0/L1-wb-14__0.mp3", "t": "湿热证，"}, {"f": "audio/d0/L1-wb-14__1.mp3", "t": "数日后自利，"}, {"f": "audio/d0/L1-wb-14__2.mp3", "t": "溺赤，"}, {"f": "audio/d0/L1-wb-14__3.mp3", "t": "口渴，"}, {"f": "audio/d0/L1-wb-14__4.mp3", "t": "湿流下焦，"}, {"f": "audio/d0/L1-wb-14__5.mp3", "t": "宜滑石、"}, {"f": "audio/d0/L1-wb-14__6.mp3", "t": "猪苓、"}, {"f": "audio/d0/L1-wb-14__7.mp3", "t": "茯苓、"}, {"f": "audio/d0/L1-wb-14__8.mp3", "t": "泽泻、"}, {"f": "audio/d0/L1-wb-14__9.mp3", "t": "萆薢、"}, {"f": "audio/d0/L1-wb-14__10.mp3", "t": "通草等味。"}], "L1-wb-15": [{"f": "audio/24/L1-wb-15__0.mp3", "t": "湿热证，"}, {"f": "audio/24/L1-wb-15__1.mp3", "t": "舌遍体白，"}, {"f": "audio/24/L1-wb-15__2.mp3", "t": "口渴，"}, {"f": "audio/24/L1-wb-15__3.mp3", "t": "湿滞阳明，"}, {"f": "audio/24/L1-wb-15__4.mp3", "t": "宜用辛开，"}, {"f": "audio/24/L1-wb-15__5.mp3", "t": "如厚朴、"}, {"f": "audio/24/L1-wb-15__6.mp3", "t": "草果、"}, {"f": "audio/24/L1-wb-15__7.mp3", "t": "半夏、"}, {"f": "audio/24/L1-wb-15__8.mp3", "t": "干菖蒲等味。"}], "L1-wb-16": [{"f": "audio/f8/L1-wb-16__0.mp3", "t": "湿热证，"}, {"f": "audio/f8/L1-wb-16__1.mp3", "t": "按法治之，"}, {"f": "audio/f8/L1-wb-16__2.mp3", "t": "诸证皆退，"}, {"f": "audio/f8/L1-wb-16__3.mp3", "t": "惟目瞑则惊悸梦惕，"}, {"f": "audio/f8/L1-wb-16__4.mp3", "t": "余邪内留，"}, {"f": "audio/f8/L1-wb-16__5.mp3", "t": "胆气未舒，"}, {"f": "audio/f8/L1-wb-16__6.mp3", "t": "宜用酒浸郁李仁、"}, {"f": "audio/f8/L1-wb-16__7.mp3", "t": "姜汁炒枣仁、"}, {"f": "audio/f8/L1-wb-16__8.mp3", "t": "猪胆皮等味。"}], "L1-wb-17": [{"f": "audio/c6/L1-wb-17__0.mp3", "t": "温病者："}, {"f": "audio/c6/L1-wb-17__1.mp3", "t": "有风温、"}, {"f": "audio/c6/L1-wb-17__2.mp3", "t": "有温热、"}, {"f": "audio/c6/L1-wb-17__3.mp3", "t": "有温疫、"}, {"f": "audio/c6/L1-wb-17__4.mp3", "t": "有温毒、"}, {"f": "audio/c6/L1-wb-17__5.mp3", "t": "有暑温、"}, {"f": "audio/c6/L1-wb-17__6.mp3", "t": "有湿温、"}, {"f": "audio/c6/L1-wb-17__7.mp3", "t": "有秋燥、"}, {"f": "audio/c6/L1-wb-17__8.mp3", "t": "有冬温、"}, {"f": "audio/c6/L1-wb-17__9.mp3", "t": "有温疟。"}], "L1-wb-18": [{"f": "audio/6b/L1-wb-18__0.mp3", "t": "凡病温者，"}, {"f": "audio/6b/L1-wb-18__1.mp3", "t": "始于上焦，"}, {"f": "audio/6b/L1-wb-18__2.mp3", "t": "在手太阴。"}], "L1-wb-19": [{"f": "audio/32/L1-wb-19__0.mp3", "t": "太阴之为病，"}, {"f": "audio/32/L1-wb-19__1.mp3", "t": "脉不缓不紧而动数，"}, {"f": "audio/32/L1-wb-19__2.mp3", "t": "或两寸独大，"}, {"f": "audio/32/L1-wb-19__3.mp3", "t": "尺肤热，"}, {"f": "audio/32/L1-wb-19__4.mp3", "t": "头痛，"}, {"f": "audio/32/L1-wb-19__5.mp3", "t": "微恶风寒，"}, {"f": "audio/32/L1-wb-19__6.mp3", "t": "身热自汗，"}, {"f": "audio/32/L1-wb-19__7.mp3", "t": "口渴，"}, {"f": "audio/32/L1-wb-19__8.mp3", "t": "或不渴，"}, {"f": "audio/32/L1-wb-19__9.mp3", "t": "而咳，"}, {"f": "audio/32/L1-wb-19__10.mp3", "t": "午后热甚者，"}, {"f": "audio/32/L1-wb-19__11.mp3", "t": "名曰温病。"}], "L1-wb-20": [{"f": "audio/cc/L1-wb-20__0.mp3", "t": "太阴风温、"}, {"f": "audio/cc/L1-wb-20__1.mp3", "t": "温热、"}, {"f": "audio/cc/L1-wb-20__2.mp3", "t": "温疫、"}, {"f": "audio/cc/L1-wb-20__3.mp3", "t": "冬温，"}, {"f": "audio/cc/L1-wb-20__4.mp3", "t": "初起恶风寒者，"}, {"f": "audio/cc/L1-wb-20__5.mp3", "t": "桂枝汤主之；"}, {"f": "audio/cc/L1-wb-20__6.mp3", "t": "但热不恶寒而渴者，"}, {"f": "audio/cc/L1-wb-20__7.mp3", "t": "辛凉平剂银翘散主之。"}], "L1-wb-21": [{"f": "audio/75/L1-wb-21__0.mp3", "t": "太阴风温，"}, {"f": "audio/75/L1-wb-21__1.mp3", "t": "但咳，"}, {"f": "audio/75/L1-wb-21__2.mp3", "t": "身不甚热，"}, {"f": "audio/75/L1-wb-21__3.mp3", "t": "微渴者，"}, {"f": "audio/75/L1-wb-21__4.mp3", "t": "辛凉轻剂桑菊饮主之。"}], "L1-wb-22": [{"f": "audio/8a/L1-wb-22__0.mp3", "t": "白虎本为达热出表，"}, {"f": "audio/8a/L1-wb-22__1.mp3", "t": "若其人脉浮弦而细者，"}, {"f": "audio/8a/L1-wb-22__2.mp3", "t": "不可与也；"}, {"f": "audio/8a/L1-wb-22__3.mp3", "t": "脉沉者，"}, {"f": "audio/8a/L1-wb-22__4.mp3", "t": "不可与也；"}, {"f": "audio/8a/L1-wb-22__5.mp3", "t": "不渴者，"}, {"f": "audio/8a/L1-wb-22__6.mp3", "t": "不可与也；"}, {"f": "audio/8a/L1-wb-22__7.mp3", "t": "汗不出者，"}, {"f": "audio/8a/L1-wb-22__8.mp3", "t": "不可与也。"}, {"f": "audio/8a/L1-wb-22__9.mp3", "t": "常须识此，"}, {"f": "audio/8a/L1-wb-22__10.mp3", "t": "勿令误也。"}], "L1-wb-23": [{"f": "audio/1c/L1-wb-23__0.mp3", "t": "太阴温病，"}, {"f": "audio/1c/L1-wb-23__1.mp3", "t": "气血两燔者，"}, {"f": "audio/1c/L1-wb-23__2.mp3", "t": "玉女煎去牛膝加元参主之。"}], "L1-wb-24": [{"f": "audio/83/L1-wb-24__0.mp3", "t": "太阴温病，"}, {"f": "audio/83/L1-wb-24__1.mp3", "t": "血从上溢者，"}, {"f": "audio/83/L1-wb-24__2.mp3", "t": "犀角地黄汤合银翘散主之。"}], "L1-wb-25": [{"f": "audio/73/L1-wb-25__0.mp3", "t": "邪入心包，"}, {"f": "audio/73/L1-wb-25__1.mp3", "t": "舌蹇肢厥，"}, {"f": "audio/73/L1-wb-25__2.mp3", "t": "牛黄丸主之，"}, {"f": "audio/73/L1-wb-25__3.mp3", "t": "紫雪丹亦主之。"}], "L1-wb-26": [{"f": "audio/e8/L1-wb-26__0.mp3", "t": "手太阴暑湿，"}, {"f": "audio/e8/L1-wb-26__1.mp3", "t": "按之或咳或不咳，"}, {"f": "audio/e8/L1-wb-26__2.mp3", "t": "无热，"}, {"f": "audio/e8/L1-wb-26__3.mp3", "t": "但胸微闷，"}, {"f": "audio/e8/L1-wb-26__4.mp3", "t": "或四肢倦怠，"}, {"f": "audio/e8/L1-wb-26__5.mp3", "t": "无汗者，"}, {"f": "audio/e8/L1-wb-26__6.mp3", "t": "新加香薷饮主之。"}], "L1-wb-27": [{"f": "audio/60/L1-wb-27__0.mp3", "t": "手太阴暑温，"}, {"f": "audio/60/L1-wb-27__1.mp3", "t": "或已经发汗，"}, {"f": "audio/60/L1-wb-27__2.mp3", "t": "或未发汗，"}, {"f": "audio/60/L1-wb-27__3.mp3", "t": "而汗不止，"}, {"f": "audio/60/L1-wb-27__4.mp3", "t": "烦渴而喘，"}, {"f": "audio/60/L1-wb-27__5.mp3", "t": "脉洪大有力者，"}, {"f": "audio/60/L1-wb-27__6.mp3", "t": "白虎汤主之。"}], "L1-wb-28": [{"f": "audio/2d/L1-wb-28__0.mp3", "t": "小儿暑温，"}, {"f": "audio/2d/L1-wb-28__1.mp3", "t": "身热，"}, {"f": "audio/2d/L1-wb-28__2.mp3", "t": "卒然痉厥，"}, {"f": "audio/2d/L1-wb-28__3.mp3", "t": "名曰暑痫，"}, {"f": "audio/2d/L1-wb-28__4.mp3", "t": "清营汤主之。"}], "L1-wb-29": [{"f": "audio/4a/L1-wb-29__0.mp3", "t": "长夏受暑，"}, {"f": "audio/4a/L1-wb-29__1.mp3", "t": "过夏而发者，"}, {"f": "audio/4a/L1-wb-29__2.mp3", "t": "名曰伏暑。"}], "L1-wb-30": [{"f": "audio/61/L1-wb-30__0.mp3", "t": "伏暑、"}, {"f": "audio/61/L1-wb-30__1.mp3", "t": "暑温、"}, {"f": "audio/61/L1-wb-30__2.mp3", "t": "湿温，"}, {"f": "audio/61/L1-wb-30__3.mp3", "t": "证本一源，"}, {"f": "audio/61/L1-wb-30__4.mp3", "t": "前后互参，"}, {"f": "audio/61/L1-wb-30__5.mp3", "t": "不可偏执。"}], "L1-wb-31": [{"f": "audio/38/L1-wb-31__0.mp3", "t": "头痛恶寒，"}, {"f": "audio/38/L1-wb-31__1.mp3", "t": "身重疼痛，"}, {"f": "audio/38/L1-wb-31__2.mp3", "t": "舌白不渴，"}, {"f": "audio/38/L1-wb-31__3.mp3", "t": "脉弦细而濡，"}, {"f": "audio/38/L1-wb-31__4.mp3", "t": "面色淡黄，"}, {"f": "audio/38/L1-wb-31__5.mp3", "t": "胸闷不饥，"}, {"f": "audio/38/L1-wb-31__6.mp3", "t": "午后身热，"}, {"f": "audio/38/L1-wb-31__7.mp3", "t": "状若阴虚，"}, {"f": "audio/38/L1-wb-31__8.mp3", "t": "病难速已，"}, {"f": "audio/38/L1-wb-31__9.mp3", "t": "名曰湿温。"}, {"f": "audio/38/L1-wb-31__10.mp3", "t": "汗之则神昏耳聋，"}, {"f": "audio/38/L1-wb-31__11.mp3", "t": "甚则目瞑不欲言，"}, {"f": "audio/38/L1-wb-31__12.mp3", "t": "下之则洞泄，"}, {"f": "audio/38/L1-wb-31__13.mp3", "t": "润之则病深不解，"}, {"f": "audio/38/L1-wb-31__14.mp3", "t": "三仁汤主之。"}], "L1-wb-32": [{"f": "audio/e1/L1-wb-32__0.mp3", "t": "燥伤肺胃阴分，"}, {"f": "audio/e1/L1-wb-32__1.mp3", "t": "或热或咳者，"}, {"f": "audio/e1/L1-wb-32__2.mp3", "t": "沙参麦冬汤主之。"}], "L1-wb-33": [{"f": "audio/45/L1-wb-33__0.mp3", "t": "燥气化火，"}, {"f": "audio/45/L1-wb-33__1.mp3", "t": "清窍不利者，"}, {"f": "audio/45/L1-wb-33__2.mp3", "t": "翘荷汤主之。"}], "L1-wb-34": [{"f": "audio/4e/L1-wb-34__0.mp3", "t": "诸气膹郁，"}, {"f": "audio/4e/L1-wb-34__1.mp3", "t": "诸痿喘呕之因于燥者，"}, {"f": "audio/4e/L1-wb-34__2.mp3", "t": "喻氏清燥救肺汤主之。"}], "L1-wb-35": [{"f": "audio/44/L1-wb-35__0.mp3", "t": "面目俱赤，"}, {"f": "audio/44/L1-wb-35__1.mp3", "t": "语声重浊，"}, {"f": "audio/44/L1-wb-35__2.mp3", "t": "呼吸俱粗，"}, {"f": "audio/44/L1-wb-35__3.mp3", "t": "大便闭，"}, {"f": "audio/44/L1-wb-35__4.mp3", "t": "小便涩，"}, {"f": "audio/44/L1-wb-35__5.mp3", "t": "舌苔老黄，"}, {"f": "audio/44/L1-wb-35__6.mp3", "t": "甚则黑有芒刺，"}, {"f": "audio/44/L1-wb-35__7.mp3", "t": "但恶热不恶寒，"}, {"f": "audio/44/L1-wb-35__8.mp3", "t": "日晡益甚者，"}, {"f": "audio/44/L1-wb-35__9.mp3", "t": "传至中焦，"}, {"f": "audio/44/L1-wb-35__10.mp3", "t": "阳明温病也。"}, {"f": "audio/44/L1-wb-35__11.mp3", "t": "脉浮洪躁甚者，"}, {"f": "audio/44/L1-wb-35__12.mp3", "t": "白虎汤主之；"}, {"f": "audio/44/L1-wb-35__13.mp3", "t": "脉沉数有力，"}, {"f": "audio/44/L1-wb-35__14.mp3", "t": "甚则脉体反小而实者，"}, {"f": "audio/44/L1-wb-35__15.mp3", "t": "大承气汤主之。"}, {"f": "audio/44/L1-wb-35__16.mp3", "t": "暑温、"}, {"f": "audio/44/L1-wb-35__17.mp3", "t": "湿温、"}, {"f": "audio/44/L1-wb-35__18.mp3", "t": "温疟不在此例。"}], "L1-wb-36": [{"f": "audio/81/L1-wb-36__0.mp3", "t": "承气非可轻尝也，"}, {"f": "audio/81/L1-wb-36__1.mp3", "t": "即邪入中焦，"}, {"f": "audio/81/L1-wb-36__2.mp3", "t": "有急下、"}, {"f": "audio/81/L1-wb-36__3.mp3", "t": "可下、"}, {"f": "audio/81/L1-wb-36__4.mp3", "t": "不可下之分，"}, {"f": "audio/81/L1-wb-36__5.mp3", "t": "当细辨之。"}], "L1-wb-37": [{"f": "audio/82/L1-wb-37__0.mp3", "t": "阳明温病，"}, {"f": "audio/82/L1-wb-37__1.mp3", "t": "下后汗出，"}, {"f": "audio/82/L1-wb-37__2.mp3", "t": "当复其阴，"}, {"f": "audio/82/L1-wb-37__3.mp3", "t": "益胃汤主之。"}], "L1-wb-38": [{"f": "audio/09/L1-wb-38__0.mp3", "t": "阳明温病，"}, {"f": "audio/09/L1-wb-38__1.mp3", "t": "下之不通，"}, {"f": "audio/09/L1-wb-38__2.mp3", "t": "其证有五："}, {"f": "audio/09/L1-wb-38__3.mp3", "t": "应下失下，"}, {"f": "audio/09/L1-wb-38__4.mp3", "t": "正虚不能运药，"}, {"f": "audio/09/L1-wb-38__5.mp3", "t": "不运药者死，"}, {"f": "audio/09/L1-wb-38__6.mp3", "t": "新加黄龙汤主之；"}, {"f": "audio/09/L1-wb-38__7.mp3", "t": "喘促不宁，"}, {"f": "audio/09/L1-wb-38__8.mp3", "t": "痰涎壅滞，"}, {"f": "audio/09/L1-wb-38__9.mp3", "t": "右寸实大，"}, {"f": "audio/09/L1-wb-38__10.mp3", "t": "肺气不降者，"}, {"f": "audio/09/L1-wb-38__11.mp3", "t": "宣白承气汤主之；"}, {"f": "audio/09/L1-wb-38__12.mp3", "t": "左尺牢坚，"}, {"f": "audio/09/L1-wb-38__13.mp3", "t": "小便赤痛，"}, {"f": "audio/09/L1-wb-38__14.mp3", "t": "时烦渴甚，"}, {"f": "audio/09/L1-wb-38__15.mp3", "t": "导赤承气汤主之；"}, {"f": "audio/09/L1-wb-38__16.mp3", "t": "邪闭心包，"}, {"f": "audio/09/L1-wb-38__17.mp3", "t": "神昏舌短，"}, {"f": "audio/09/L1-wb-38__18.mp3", "t": "内窍不通，"}, {"f": "audio/09/L1-wb-38__19.mp3", "t": "饮不解渴者，"}, {"f": "audio/09/L1-wb-38__20.mp3", "t": "牛黄承气汤主之；"}, {"f": "audio/09/L1-wb-38__21.mp3", "t": "津液不足，"}, {"f": "audio/09/L1-wb-38__22.mp3", "t": "无水舟停者，"}, {"f": "audio/09/L1-wb-38__23.mp3", "t": "间服增液，"}, {"f": "audio/09/L1-wb-38__24.mp3", "t": "再不下者，"}, {"f": "audio/09/L1-wb-38__25.mp3", "t": "增液承气汤主之。"}], "L1-wb-39": [{"f": "audio/14/L1-wb-39__0.mp3", "t": "斑疹，"}, {"f": "audio/14/L1-wb-39__1.mp3", "t": "用升提则衄，"}, {"f": "audio/14/L1-wb-39__2.mp3", "t": "或厥，"}, {"f": "audio/14/L1-wb-39__3.mp3", "t": "或呛咳，"}, {"f": "audio/14/L1-wb-39__4.mp3", "t": "或昏痉；"}, {"f": "audio/14/L1-wb-39__5.mp3", "t": "用壅补则瞀乱。"}], "L1-wb-40": [{"f": "audio/af/L1-wb-40__0.mp3", "t": "温病小便不利者，"}, {"f": "audio/af/L1-wb-40__1.mp3", "t": "淡渗不可与也，"}, {"f": "audio/af/L1-wb-40__2.mp3", "t": "忌五苓、"}, {"f": "audio/af/L1-wb-40__3.mp3", "t": "八正辈。"}], "L1-wb-41": [{"f": "audio/c8/L1-wb-41__0.mp3", "t": "脉洪滑，"}, {"f": "audio/c8/L1-wb-41__1.mp3", "t": "面赤，"}, {"f": "audio/c8/L1-wb-41__2.mp3", "t": "身热，"}, {"f": "audio/c8/L1-wb-41__3.mp3", "t": "头晕，"}, {"f": "audio/c8/L1-wb-41__4.mp3", "t": "不恶寒，"}, {"f": "audio/c8/L1-wb-41__5.mp3", "t": "但恶热，"}, {"f": "audio/c8/L1-wb-41__6.mp3", "t": "舌上黄滑苔，"}, {"f": "audio/c8/L1-wb-41__7.mp3", "t": "渴欲凉饮，"}, {"f": "audio/c8/L1-wb-41__8.mp3", "t": "饮不解渴，"}, {"f": "audio/c8/L1-wb-41__9.mp3", "t": "得水则呕，"}, {"f": "audio/c8/L1-wb-41__10.mp3", "t": "按之胸下痛，"}, {"f": "audio/c8/L1-wb-41__11.mp3", "t": "小便短，"}, {"f": "audio/c8/L1-wb-41__12.mp3", "t": "大便闭者，"}, {"f": "audio/c8/L1-wb-41__13.mp3", "t": "阳明暑温，"}, {"f": "audio/c8/L1-wb-41__14.mp3", "t": "水结在胸也，"}, {"f": "audio/c8/L1-wb-41__15.mp3", "t": "小陷胸汤加枳实主之。"}], "L1-wb-42": [{"f": "audio/51/L1-wb-42__0.mp3", "t": "暑湿蔓延三焦，"}, {"f": "audio/51/L1-wb-42__1.mp3", "t": "舌滑微黄，"}, {"f": "audio/51/L1-wb-42__2.mp3", "t": "邪在气分者，"}, {"f": "audio/51/L1-wb-42__3.mp3", "t": "三石汤主之。"}], "L1-wb-43": [{"f": "audio/c8/L1-wb-43__0.mp3", "t": "脉缓身痛，"}, {"f": "audio/c8/L1-wb-43__1.mp3", "t": "舌淡黄而滑，"}, {"f": "audio/c8/L1-wb-43__2.mp3", "t": "渴不多饮，"}, {"f": "audio/c8/L1-wb-43__3.mp3", "t": "或竟不渴，"}, {"f": "audio/c8/L1-wb-43__4.mp3", "t": "汗出热解，"}, {"f": "audio/c8/L1-wb-43__5.mp3", "t": "继而复热，"}, {"f": "audio/c8/L1-wb-43__6.mp3", "t": "内不能运水谷之湿，"}, {"f": "audio/c8/L1-wb-43__7.mp3", "t": "外复感时令之湿，"}, {"f": "audio/c8/L1-wb-43__8.mp3", "t": "发表攻里，"}, {"f": "audio/c8/L1-wb-43__9.mp3", "t": "两不可施，"}, {"f": "audio/c8/L1-wb-43__10.mp3", "t": "误认伤寒，"}, {"f": "audio/c8/L1-wb-43__11.mp3", "t": "必转坏证，"}, {"f": "audio/c8/L1-wb-43__12.mp3", "t": "徒清热则湿不退，"}, {"f": "audio/c8/L1-wb-43__13.mp3", "t": "徒祛湿则热愈炽，"}, {"f": "audio/c8/L1-wb-43__14.mp3", "t": "黄芩滑石汤主之。"}], "L1-wb-44": [{"f": "audio/be/L1-wb-44__0.mp3", "t": "痹证大抵不越寒热两条，"}, {"f": "audio/be/L1-wb-44__1.mp3", "t": "虚实异治。"}, {"f": "audio/be/L1-wb-44__2.mp3", "t": "寒痹势重而治反易，"}, {"f": "audio/be/L1-wb-44__3.mp3", "t": "热痹势缓而治反难，"}, {"f": "audio/be/L1-wb-44__4.mp3", "t": "实者单病躯壳，"}, {"f": "audio/be/L1-wb-44__5.mp3", "t": "易治；"}, {"f": "audio/be/L1-wb-44__6.mp3", "t": "虚者兼病脏腑，"}, {"f": "audio/be/L1-wb-44__7.mp3", "t": "难治。"}], "L1-wb-45": [{"f": "audio/eb/L1-wb-45__0.mp3", "t": "风温、"}, {"f": "audio/eb/L1-wb-45__1.mp3", "t": "温热、"}, {"f": "audio/eb/L1-wb-45__2.mp3", "t": "温疫、"}, {"f": "audio/eb/L1-wb-45__3.mp3", "t": "温毒、"}, {"f": "audio/eb/L1-wb-45__4.mp3", "t": "冬温，"}, {"f": "audio/eb/L1-wb-45__5.mp3", "t": "邪在阳明久羁，"}, {"f": "audio/eb/L1-wb-45__6.mp3", "t": "或已下，"}, {"f": "audio/eb/L1-wb-45__7.mp3", "t": "或未下，"}, {"f": "audio/eb/L1-wb-45__8.mp3", "t": "身热面赤，"}, {"f": "audio/eb/L1-wb-45__9.mp3", "t": "口干舌燥，"}, {"f": "audio/eb/L1-wb-45__10.mp3", "t": "甚则齿黑唇裂，"}, {"f": "audio/eb/L1-wb-45__11.mp3", "t": "脉虚大，"}, {"f": "audio/eb/L1-wb-45__12.mp3", "t": "手足心热甚于手足背者，"}, {"f": "audio/eb/L1-wb-45__13.mp3", "t": "加减复脉汤主之。"}], "L1-wb-46": [{"f": "audio/c9/L1-wb-46__0.mp3", "t": "少阴温病，"}, {"f": "audio/c9/L1-wb-46__1.mp3", "t": "真阴欲竭，"}, {"f": "audio/c9/L1-wb-46__2.mp3", "t": "壮火复炽，"}, {"f": "audio/c9/L1-wb-46__3.mp3", "t": "心中烦，"}, {"f": "audio/c9/L1-wb-46__4.mp3", "t": "不得卧者，"}, {"f": "audio/c9/L1-wb-46__5.mp3", "t": "黄连阿胶汤主之。"}], "L1-wb-47": [{"f": "audio/2f/L1-wb-47__0.mp3", "t": "夜热早凉，"}, {"f": "audio/2f/L1-wb-47__1.mp3", "t": "热退无汗，"}, {"f": "audio/2f/L1-wb-47__2.mp3", "t": "热自阴来者，"}, {"f": "audio/2f/L1-wb-47__3.mp3", "t": "青蒿鳖甲汤主之。"}], "L1-wb-48": [{"f": "audio/1b/L1-wb-48__0.mp3", "t": "下焦温病，"}, {"f": "audio/1b/L1-wb-48__1.mp3", "t": "热深厥甚，"}, {"f": "audio/1b/L1-wb-48__2.mp3", "t": "脉细促，"}, {"f": "audio/1b/L1-wb-48__3.mp3", "t": "心中憺憺大动，"}, {"f": "audio/1b/L1-wb-48__4.mp3", "t": "甚则心中痛者，"}, {"f": "audio/1b/L1-wb-48__5.mp3", "t": "三甲复脉汤主之。"}], "L1-wb-49": [{"f": "audio/5b/L1-wb-49__0.mp3", "t": "热邪久羁，"}, {"f": "audio/5b/L1-wb-49__1.mp3", "t": "吸烁真阴，"}, {"f": "audio/5b/L1-wb-49__2.mp3", "t": "或因误表，"}, {"f": "audio/5b/L1-wb-49__3.mp3", "t": "或因妄攻，"}, {"f": "audio/5b/L1-wb-49__4.mp3", "t": "神倦瘛疭，"}, {"f": "audio/5b/L1-wb-49__5.mp3", "t": "脉气虚弱，"}, {"f": "audio/5b/L1-wb-49__6.mp3", "t": "舌绛苔少，"}, {"f": "audio/5b/L1-wb-49__7.mp3", "t": "时时欲脱者，"}, {"f": "audio/5b/L1-wb-49__8.mp3", "t": "大定风珠主之。"}], "L1-wb-50": [{"f": "audio/b3/L1-wb-50__0.mp3", "t": "暑邪深入少阴消渴者，"}, {"f": "audio/b3/L1-wb-50__1.mp3", "t": "连梅汤主之；"}, {"f": "audio/b3/L1-wb-50__2.mp3", "t": "入厥阴麻痹者，"}, {"f": "audio/b3/L1-wb-50__3.mp3", "t": "连梅汤主之；"}, {"f": "audio/b3/L1-wb-50__4.mp3", "t": "心热烦躁神迷甚者，"}, {"f": "audio/b3/L1-wb-50__5.mp3", "t": "先与紫雪丹，"}, {"f": "audio/b3/L1-wb-50__6.mp3", "t": "再与连梅汤。"}], "L1-wb-51": [{"f": "audio/a4/L1-wb-51__0.mp3", "t": "治上焦如羽，"}, {"f": "audio/a4/L1-wb-51__1.mp3", "t": "非轻不举；"}, {"f": "audio/a4/L1-wb-51__2.mp3", "t": "治中焦如衡，"}, {"f": "audio/a4/L1-wb-51__3.mp3", "t": "非平不安；"}, {"f": "audio/a4/L1-wb-51__4.mp3", "t": "治下焦如权，"}, {"f": "audio/a4/L1-wb-51__5.mp3", "t": "非重不沉。"}], "L1-wb-52": [{"f": "audio/1a/L1-wb-52__0.mp3", "t": "风温为病，"}, {"f": "audio/1a/L1-wb-52__1.mp3", "t": "春月与冬季居多，"}, {"f": "audio/1a/L1-wb-52__2.mp3", "t": "或恶风，"}, {"f": "audio/1a/L1-wb-52__3.mp3", "t": "或不恶风，"}, {"f": "audio/1a/L1-wb-52__4.mp3", "t": "必身热，"}, {"f": "audio/1a/L1-wb-52__5.mp3", "t": "咳嗽，"}, {"f": "audio/1a/L1-wb-52__6.mp3", "t": "烦渴，"}, {"f": "audio/1a/L1-wb-52__7.mp3", "t": "此风温证之提纲也。"}], "L1-wb-53": [{"f": "audio/e3/L1-wb-53__0.mp3", "t": "夫温疫之为病，"}, {"f": "audio/e3/L1-wb-53__1.mp3", "t": "非风、"}, {"f": "audio/e3/L1-wb-53__2.mp3", "t": "非寒、"}, {"f": "audio/e3/L1-wb-53__3.mp3", "t": "非暑、"}, {"f": "audio/e3/L1-wb-53__4.mp3", "t": "非湿，"}, {"f": "audio/e3/L1-wb-53__5.mp3", "t": "乃天地间别有一种异气所感。"}], "L1-wb-54": [{"f": "audio/7c/L1-wb-54__0.mp3", "t": "本气充满，"}, {"f": "audio/7c/L1-wb-54__1.mp3", "t": "邪不易入；"}, {"f": "audio/7c/L1-wb-54__2.mp3", "t": "本气适逢亏欠，"}, {"f": "audio/7c/L1-wb-54__3.mp3", "t": "呼吸之间，"}, {"f": "audio/7c/L1-wb-54__4.mp3", "t": "外邪因而乘之。"}], "L1-wb-55": [{"f": "audio/3f/L1-wb-55__0.mp3", "t": "温疫初起，"}, {"f": "audio/3f/L1-wb-55__1.mp3", "t": "先憎寒而后发热，"}, {"f": "audio/3f/L1-wb-55__2.mp3", "t": "日后但热而无憎寒也。"}, {"f": "audio/3f/L1-wb-55__3.mp3", "t": "初得之二三日，"}, {"f": "audio/3f/L1-wb-55__4.mp3", "t": "其脉不浮不沉而数，"}, {"f": "audio/3f/L1-wb-55__5.mp3", "t": "昼夜发热，"}, {"f": "audio/3f/L1-wb-55__6.mp3", "t": "日晡益甚，"}, {"f": "audio/3f/L1-wb-55__7.mp3", "t": "头疼身痛，"}, {"f": "audio/3f/L1-wb-55__8.mp3", "t": "宜达原饮。"}], "L1-wb-56": [{"f": "audio/2e/L1-wb-56__0.mp3", "t": "大凡客邪贵乎早逐，"}, {"f": "audio/2e/L1-wb-56__1.mp3", "t": "乘人气血未乱，"}, {"f": "audio/2e/L1-wb-56__2.mp3", "t": "肌肉未消，"}, {"f": "audio/2e/L1-wb-56__3.mp3", "t": "津液未耗，"}, {"f": "audio/2e/L1-wb-56__4.mp3", "t": "病人不至危殆，"}, {"f": "audio/2e/L1-wb-56__5.mp3", "t": "投剂不至掣肘，"}, {"f": "audio/2e/L1-wb-56__6.mp3", "t": "愈后亦易平复。"}], "L1-wb-57": [{"f": "audio/58/L1-wb-57__0.mp3", "t": "伤寒在下其燥结，"}, {"f": "audio/58/L1-wb-57__1.mp3", "t": "时疫在下其郁热。"}], "L1-wb-58": [{"f": "audio/60/L1-wb-58__0.mp3", "t": "春温一证，"}, {"f": "audio/60/L1-wb-58__1.mp3", "t": "由冬令收藏未固，"}, {"f": "audio/60/L1-wb-58__2.mp3", "t": "昔人以冬寒内伏，"}, {"f": "audio/60/L1-wb-58__3.mp3", "t": "藏于少阴，"}, {"f": "audio/60/L1-wb-58__4.mp3", "t": "入春发于少阳。"}], "L1-wb-59": [{"f": "audio/18/L1-wb-59__0.mp3", "t": "风温者，"}, {"f": "audio/18/L1-wb-59__1.mp3", "t": "春月受风，"}, {"f": "audio/18/L1-wb-59__2.mp3", "t": "其气已温，"}, {"f": "audio/18/L1-wb-59__3.mp3", "t": "经谓春病在头，"}, {"f": "audio/18/L1-wb-59__4.mp3", "t": "治在上焦。"}, {"f": "audio/18/L1-wb-59__5.mp3", "t": "肺位最高，"}, {"f": "audio/18/L1-wb-59__6.mp3", "t": "邪必先伤。"}], "school-sch-nj-0": [{"f": "audio/6b/school-sch-nj-0__0.mp3", "t": "黄帝曰："}, {"f": "audio/6b/school-sch-nj-0__1.mp3", "t": "阴阳者，"}, {"f": "audio/6b/school-sch-nj-0__2.mp3", "t": "天地之道也，"}, {"f": "audio/6b/school-sch-nj-0__3.mp3", "t": "万物之纲纪，"}, {"f": "audio/6b/school-sch-nj-0__4.mp3", "t": "变化之父母，"}, {"f": "audio/6b/school-sch-nj-0__5.mp3", "t": "生杀之本始，"}, {"f": "audio/6b/school-sch-nj-0__6.mp3", "t": "神明之府也。"}, {"f": "audio/6b/school-sch-nj-0__7.mp3", "t": "治病必求于本。"}, {"f": "audio/6b/school-sch-nj-0__8.mp3", "t": "故积阳为天，"}, {"f": "audio/6b/school-sch-nj-0__9.mp3", "t": "积阴为地。"}, {"f": "audio/6b/school-sch-nj-0__10.mp3", "t": "阴静阳躁。"}, {"f": "audio/6b/school-sch-nj-0__11.mp3", "t": "阳生阴长，"}, {"f": "audio/6b/school-sch-nj-0__12.mp3", "t": "阳杀阴藏。"}, {"f": "audio/6b/school-sch-nj-0__13.mp3", "t": "阳化气，"}, {"f": "audio/6b/school-sch-nj-0__14.mp3", "t": "阴成形。"}, {"f": "audio/6b/school-sch-nj-0__15.mp3", "t": "寒极生热，"}, {"f": "audio/6b/school-sch-nj-0__16.mp3", "t": "热极生寒。"}, {"f": "audio/6b/school-sch-nj-0__17.mp3", "t": "寒气生浊，"}, {"f": "audio/6b/school-sch-nj-0__18.mp3", "t": "热气生清。"}, {"f": "audio/6b/school-sch-nj-0__19.mp3", "t": "清气在下，"}, {"f": "audio/6b/school-sch-nj-0__20.mp3", "t": "则生飧泄。"}, {"f": "audio/6b/school-sch-nj-0__21.mp3", "t": "浊气在上，"}, {"f": "audio/6b/school-sch-nj-0__22.mp3", "t": "则生䐜胀。"}, {"f": "audio/6b/school-sch-nj-0__23.mp3", "t": "此阴阳反作，"}, {"f": "audio/6b/school-sch-nj-0__24.mp3", "t": "病之逆从也。"}], "school-sch-nj-1": [{"f": "audio/52/school-sch-nj-1__0.mp3", "t": "故清阳为天，"}, {"f": "audio/52/school-sch-nj-1__1.mp3", "t": "浊阴为地。"}, {"f": "audio/52/school-sch-nj-1__2.mp3", "t": "地气上为云，"}, {"f": "audio/52/school-sch-nj-1__3.mp3", "t": "天气下为雨；"}, {"f": "audio/52/school-sch-nj-1__4.mp3", "t": "雨出地气，"}, {"f": "audio/52/school-sch-nj-1__5.mp3", "t": "云出天气。"}, {"f": "audio/52/school-sch-nj-1__6.mp3", "t": "故清阳出上窍，"}, {"f": "audio/52/school-sch-nj-1__7.mp3", "t": "浊阴出下窍；"}, {"f": "audio/52/school-sch-nj-1__8.mp3", "t": "清阳发腠理，"}, {"f": "audio/52/school-sch-nj-1__9.mp3", "t": "浊阴走五藏；"}, {"f": "audio/52/school-sch-nj-1__10.mp3", "t": "清阳实四支，"}, {"f": "audio/52/school-sch-nj-1__11.mp3", "t": "浊阴归六府。"}], "school-sch-nj-2": [{"f": "audio/07/school-sch-nj-2__0.mp3", "t": "水为阴，"}, {"f": "audio/07/school-sch-nj-2__1.mp3", "t": "火为阳，"}, {"f": "audio/07/school-sch-nj-2__2.mp3", "t": "阳为气，"}, {"f": "audio/07/school-sch-nj-2__3.mp3", "t": "阴为味，"}, {"f": "audio/07/school-sch-nj-2__4.mp3", "t": "味归形，"}, {"f": "audio/07/school-sch-nj-2__5.mp3", "t": "形归气，"}, {"f": "audio/07/school-sch-nj-2__6.mp3", "t": "气归精，"}, {"f": "audio/07/school-sch-nj-2__7.mp3", "t": "精归化，"}, {"f": "audio/07/school-sch-nj-2__8.mp3", "t": "精食气，"}, {"f": "audio/07/school-sch-nj-2__9.mp3", "t": "形食味，"}, {"f": "audio/07/school-sch-nj-2__10.mp3", "t": "化生精，"}, {"f": "audio/07/school-sch-nj-2__11.mp3", "t": "气生形。"}, {"f": "audio/07/school-sch-nj-2__12.mp3", "t": "味伤形，"}, {"f": "audio/07/school-sch-nj-2__13.mp3", "t": "气伤精，"}, {"f": "audio/07/school-sch-nj-2__14.mp3", "t": "精化为气，"}, {"f": "audio/07/school-sch-nj-2__15.mp3", "t": "气伤于味。"}], "school-sch-nj-3": [{"f": "audio/00/school-sch-nj-3__0.mp3", "t": "阴胜则阳病，"}, {"f": "audio/00/school-sch-nj-3__1.mp3", "t": "阳胜则阴病。"}, {"f": "audio/00/school-sch-nj-3__2.mp3", "t": "阳胜则热，"}, {"f": "audio/00/school-sch-nj-3__3.mp3", "t": "阴胜则寒。"}, {"f": "audio/00/school-sch-nj-3__4.mp3", "t": "重寒则热，"}, {"f": "audio/00/school-sch-nj-3__5.mp3", "t": "重热则寒。"}, {"f": "audio/00/school-sch-nj-3__6.mp3", "t": "寒伤形，"}, {"f": "audio/00/school-sch-nj-3__7.mp3", "t": "热伤气，"}, {"f": "audio/00/school-sch-nj-3__8.mp3", "t": "气伤痛，"}, {"f": "audio/00/school-sch-nj-3__9.mp3", "t": "形伤肿。"}, {"f": "audio/00/school-sch-nj-3__10.mp3", "t": "故先痛而后肿者，"}, {"f": "audio/00/school-sch-nj-3__11.mp3", "t": "气伤形也；"}, {"f": "audio/00/school-sch-nj-3__12.mp3", "t": "先肿而后痛者，"}, {"f": "audio/00/school-sch-nj-3__13.mp3", "t": "形伤气也。"}, {"f": "audio/00/school-sch-nj-3__14.mp3", "t": "风胜则动，"}, {"f": "audio/00/school-sch-nj-3__15.mp3", "t": "热胜则肿，"}, {"f": "audio/00/school-sch-nj-3__16.mp3", "t": "燥胜则干，"}, {"f": "audio/00/school-sch-nj-3__17.mp3", "t": "寒胜则浮，"}, {"f": "audio/00/school-sch-nj-3__18.mp3", "t": "湿胜则濡泻。"}], "school-sch-nj-4": [{"f": "audio/62/school-sch-nj-4__0.mp3", "t": "天有四时五行，"}, {"f": "audio/62/school-sch-nj-4__1.mp3", "t": "以生长收藏，"}, {"f": "audio/62/school-sch-nj-4__2.mp3", "t": "以生寒暑燥湿风。"}, {"f": "audio/62/school-sch-nj-4__3.mp3", "t": "人有五藏化五气，"}, {"f": "audio/62/school-sch-nj-4__4.mp3", "t": "以生喜怒忧恐。"}, {"f": "audio/62/school-sch-nj-4__5.mp3", "t": "故喜怒伤气，"}, {"f": "audio/62/school-sch-nj-4__6.mp3", "t": "寒暑伤形；"}, {"f": "audio/62/school-sch-nj-4__7.mp3", "t": "暴怒伤阴，"}, {"f": "audio/62/school-sch-nj-4__8.mp3", "t": "暴喜伤阳。"}, {"f": "audio/62/school-sch-nj-4__9.mp3", "t": "厥气上行，"}, {"f": "audio/62/school-sch-nj-4__10.mp3", "t": "满脉去形。"}, {"f": "audio/62/school-sch-nj-4__11.mp3", "t": "喜怒不节，"}, {"f": "audio/62/school-sch-nj-4__12.mp3", "t": "寒暑过度，"}, {"f": "audio/62/school-sch-nj-4__13.mp3", "t": "生乃不固。"}, {"f": "audio/62/school-sch-nj-4__14.mp3", "t": "故重阴必阳，"}, {"f": "audio/62/school-sch-nj-4__15.mp3", "t": "重阳必阴。"}, {"f": "audio/62/school-sch-nj-4__16.mp3", "t": "故曰："}, {"f": "audio/62/school-sch-nj-4__17.mp3", "t": "冬伤于寒，"}, {"f": "audio/62/school-sch-nj-4__18.mp3", "t": "春必温病；"}, {"f": "audio/62/school-sch-nj-4__19.mp3", "t": "春伤于风，"}, {"f": "audio/62/school-sch-nj-4__20.mp3", "t": "夏生飧泄；"}, {"f": "audio/62/school-sch-nj-4__21.mp3", "t": "夏伤于暑，"}, {"f": "audio/62/school-sch-nj-4__22.mp3", "t": "秋必痎疟；"}, {"f": "audio/62/school-sch-nj-4__23.mp3", "t": "秋伤于湿，"}, {"f": "audio/62/school-sch-nj-4__24.mp3", "t": "冬生咳嗽。"}], "school-sch-nj-5": [{"f": "audio/20/school-sch-nj-5__0.mp3", "t": "帝曰："}, {"f": "audio/20/school-sch-nj-5__1.mp3", "t": "法阴阳奈何？"}, {"f": "audio/20/school-sch-nj-5__2.mp3", "t": "岐伯曰："}, {"f": "audio/20/school-sch-nj-5__3.mp3", "t": "阳胜则身热，"}, {"f": "audio/20/school-sch-nj-5__4.mp3", "t": "腠理闭，"}, {"f": "audio/20/school-sch-nj-5__5.mp3", "t": "喘粗为之俛仰，"}, {"f": "audio/20/school-sch-nj-5__6.mp3", "t": "汗不出而热，"}, {"f": "audio/20/school-sch-nj-5__7.mp3", "t": "齿干以烦冤，"}, {"f": "audio/20/school-sch-nj-5__8.mp3", "t": "腹满，"}, {"f": "audio/20/school-sch-nj-5__9.mp3", "t": "死，"}, {"f": "audio/20/school-sch-nj-5__10.mp3", "t": "能冬不能夏；"}, {"f": "audio/20/school-sch-nj-5__11.mp3", "t": "阴胜则身寒，"}, {"f": "audio/20/school-sch-nj-5__12.mp3", "t": "汗出身常清，"}, {"f": "audio/20/school-sch-nj-5__13.mp3", "t": "数栗而寒，"}, {"f": "audio/20/school-sch-nj-5__14.mp3", "t": "寒则厥，"}, {"f": "audio/20/school-sch-nj-5__15.mp3", "t": "厥则腹满，"}, {"f": "audio/20/school-sch-nj-5__16.mp3", "t": "死，"}, {"f": "audio/20/school-sch-nj-5__17.mp3", "t": "能夏不能冬。"}, {"f": "audio/20/school-sch-nj-5__18.mp3", "t": "此阴阳更胜之变，"}, {"f": "audio/20/school-sch-nj-5__19.mp3", "t": "病之形能也。"}], "school-sch-nj-6": [{"f": "audio/4c/school-sch-nj-6__0.mp3", "t": "帝曰："}, {"f": "audio/4c/school-sch-nj-6__1.mp3", "t": "调此二者奈何？"}, {"f": "audio/4c/school-sch-nj-6__2.mp3", "t": "岐伯曰："}, {"f": "audio/4c/school-sch-nj-6__3.mp3", "t": "能知七损八益，"}, {"f": "audio/4c/school-sch-nj-6__4.mp3", "t": "则二者可调；"}, {"f": "audio/4c/school-sch-nj-6__5.mp3", "t": "不知用此，"}, {"f": "audio/4c/school-sch-nj-6__6.mp3", "t": "则早衰之节也。"}, {"f": "audio/4c/school-sch-nj-6__7.mp3", "t": "年四十，"}, {"f": "audio/4c/school-sch-nj-6__8.mp3", "t": "而阴气自半也，"}, {"f": "audio/4c/school-sch-nj-6__9.mp3", "t": "起居衰矣；"}, {"f": "audio/4c/school-sch-nj-6__10.mp3", "t": "年五十，"}, {"f": "audio/4c/school-sch-nj-6__11.mp3", "t": "体重，"}, {"f": "audio/4c/school-sch-nj-6__12.mp3", "t": "耳目不聪明矣；"}, {"f": "audio/4c/school-sch-nj-6__13.mp3", "t": "年六十，"}, {"f": "audio/4c/school-sch-nj-6__14.mp3", "t": "阴痿，"}, {"f": "audio/4c/school-sch-nj-6__15.mp3", "t": "气大衰，"}, {"f": "audio/4c/school-sch-nj-6__16.mp3", "t": "九窍不利，"}, {"f": "audio/4c/school-sch-nj-6__17.mp3", "t": "下虚上实，"}, {"f": "audio/4c/school-sch-nj-6__18.mp3", "t": "涕泣俱出矣。"}, {"f": "audio/4c/school-sch-nj-6__19.mp3", "t": "故曰："}, {"f": "audio/4c/school-sch-nj-6__20.mp3", "t": "知之则强，"}, {"f": "audio/4c/school-sch-nj-6__21.mp3", "t": "不知则老，"}, {"f": "audio/4c/school-sch-nj-6__22.mp3", "t": "故同出而名异耳。"}, {"f": "audio/4c/school-sch-nj-6__23.mp3", "t": "智者察同，"}, {"f": "audio/4c/school-sch-nj-6__24.mp3", "t": "愚者察异，"}, {"f": "audio/4c/school-sch-nj-6__25.mp3", "t": "愚者不足，"}, {"f": "audio/4c/school-sch-nj-6__26.mp3", "t": "智者有余。"}, {"f": "audio/4c/school-sch-nj-6__27.mp3", "t": "有余则耳目聪明，"}, {"f": "audio/4c/school-sch-nj-6__28.mp3", "t": "身体轻强，"}, {"f": "audio/4c/school-sch-nj-6__29.mp3", "t": "老者复壮，"}, {"f": "audio/4c/school-sch-nj-6__30.mp3", "t": "壮者益治。"}, {"f": "audio/4c/school-sch-nj-6__31.mp3", "t": "是以圣人为无为之事，"}, {"f": "audio/4c/school-sch-nj-6__32.mp3", "t": "乐恬愉之能，"}, {"f": "audio/4c/school-sch-nj-6__33.mp3", "t": "从欲快志于虚无之守，"}, {"f": "audio/4c/school-sch-nj-6__34.mp3", "t": "故寿命无穷，"}, {"f": "audio/4c/school-sch-nj-6__35.mp3", "t": "与天地终，"}, {"f": "audio/4c/school-sch-nj-6__36.mp3", "t": "此圣人之治身也。"}], "school-sch-nj-7": [{"f": "audio/ed/school-sch-nj-7__0.mp3", "t": "故邪风之至，"}, {"f": "audio/ed/school-sch-nj-7__1.mp3", "t": "疾如风雨，"}, {"f": "audio/ed/school-sch-nj-7__2.mp3", "t": "故善治者治皮毛，"}, {"f": "audio/ed/school-sch-nj-7__3.mp3", "t": "其次治肌肤，"}, {"f": "audio/ed/school-sch-nj-7__4.mp3", "t": "其次治六府，"}, {"f": "audio/ed/school-sch-nj-7__5.mp3", "t": "其次治五藏。"}, {"f": "audio/ed/school-sch-nj-7__6.mp3", "t": "治五藏者，"}, {"f": "audio/ed/school-sch-nj-7__7.mp3", "t": "半死半生也。"}, {"f": "audio/ed/school-sch-nj-7__8.mp3", "t": "故天之邪气，"}, {"f": "audio/ed/school-sch-nj-7__9.mp3", "t": "感则害人五藏；"}, {"f": "audio/ed/school-sch-nj-7__10.mp3", "t": "水谷之寒热，"}, {"f": "audio/ed/school-sch-nj-7__11.mp3", "t": "感则害于六府；"}, {"f": "audio/ed/school-sch-nj-7__12.mp3", "t": "地之湿气，"}, {"f": "audio/ed/school-sch-nj-7__13.mp3", "t": "感则害皮肉筋脉。"}], "school-sch-nj-8": [{"f": "audio/20/school-sch-nj-8__0.mp3", "t": "故善用针者，"}, {"f": "audio/20/school-sch-nj-8__1.mp3", "t": "从阴引阳，"}, {"f": "audio/20/school-sch-nj-8__2.mp3", "t": "从阳引阴；"}, {"f": "audio/20/school-sch-nj-8__3.mp3", "t": "以右治左，"}, {"f": "audio/20/school-sch-nj-8__4.mp3", "t": "以左治右；"}, {"f": "audio/20/school-sch-nj-8__5.mp3", "t": "以我知彼，"}, {"f": "audio/20/school-sch-nj-8__6.mp3", "t": "以表知里，"}, {"f": "audio/20/school-sch-nj-8__7.mp3", "t": "以观过与不及之理，"}, {"f": "audio/20/school-sch-nj-8__8.mp3", "t": "见微得过，"}, {"f": "audio/20/school-sch-nj-8__9.mp3", "t": "用之不殆。"}], "school-sch-nj-9": [{"f": "audio/29/school-sch-nj-9__0.mp3", "t": "善诊者，"}, {"f": "audio/29/school-sch-nj-9__1.mp3", "t": "察色按脉，"}, {"f": "audio/29/school-sch-nj-9__2.mp3", "t": "先别阴阳，"}, {"f": "audio/29/school-sch-nj-9__3.mp3", "t": "审清浊而知部分；"}, {"f": "audio/29/school-sch-nj-9__4.mp3", "t": "视喘息，"}, {"f": "audio/29/school-sch-nj-9__5.mp3", "t": "听音声而知所苦；"}, {"f": "audio/29/school-sch-nj-9__6.mp3", "t": "观权衡规矩而知病所主；"}, {"f": "audio/29/school-sch-nj-9__7.mp3", "t": "按尺寸，"}, {"f": "audio/29/school-sch-nj-9__8.mp3", "t": "观浮沉滑涩而知病所生。"}, {"f": "audio/29/school-sch-nj-9__9.mp3", "t": "以治无过，"}, {"f": "audio/29/school-sch-nj-9__10.mp3", "t": "以诊则不失矣。"}], "school-sch-nj-10": [{"f": "audio/9d/school-sch-nj-10__0.mp3", "t": "黄帝曰："}, {"f": "audio/9d/school-sch-nj-10__1.mp3", "t": "夫自古通天者，"}, {"f": "audio/9d/school-sch-nj-10__2.mp3", "t": "生之本，"}, {"f": "audio/9d/school-sch-nj-10__3.mp3", "t": "本于阴阳。"}, {"f": "audio/9d/school-sch-nj-10__4.mp3", "t": "天地之间，"}, {"f": "audio/9d/school-sch-nj-10__5.mp3", "t": "六合之内，"}, {"f": "audio/9d/school-sch-nj-10__6.mp3", "t": "其气九州、"}, {"f": "audio/9d/school-sch-nj-10__7.mp3", "t": "九窍、"}, {"f": "audio/9d/school-sch-nj-10__8.mp3", "t": "五藏、"}, {"f": "audio/9d/school-sch-nj-10__9.mp3", "t": "十二节，"}, {"f": "audio/9d/school-sch-nj-10__10.mp3", "t": "皆通乎天气。"}, {"f": "audio/9d/school-sch-nj-10__11.mp3", "t": "其生五，"}, {"f": "audio/9d/school-sch-nj-10__12.mp3", "t": "其气三，"}, {"f": "audio/9d/school-sch-nj-10__13.mp3", "t": "数犯此者，"}, {"f": "audio/9d/school-sch-nj-10__14.mp3", "t": "则邪气伤人，"}, {"f": "audio/9d/school-sch-nj-10__15.mp3", "t": "此寿命之本也。"}, {"f": "audio/9d/school-sch-nj-10__16.mp3", "t": "苍天之气，"}, {"f": "audio/9d/school-sch-nj-10__17.mp3", "t": "清静则志意治，"}, {"f": "audio/9d/school-sch-nj-10__18.mp3", "t": "顺之则阳气固，"}, {"f": "audio/9d/school-sch-nj-10__19.mp3", "t": "虽有贼邪，"}, {"f": "audio/9d/school-sch-nj-10__20.mp3", "t": "弗能害也。"}, {"f": "audio/9d/school-sch-nj-10__21.mp3", "t": "此因时之序。"}, {"f": "audio/9d/school-sch-nj-10__22.mp3", "t": "故圣人传精神，"}, {"f": "audio/9d/school-sch-nj-10__23.mp3", "t": "服天气，"}, {"f": "audio/9d/school-sch-nj-10__24.mp3", "t": "而通神明。"}, {"f": "audio/9d/school-sch-nj-10__25.mp3", "t": "失之，"}, {"f": "audio/9d/school-sch-nj-10__26.mp3", "t": "则内闭九窍，"}, {"f": "audio/9d/school-sch-nj-10__27.mp3", "t": "外壅肌肉，"}, {"f": "audio/9d/school-sch-nj-10__28.mp3", "t": "卫气散解，"}, {"f": "audio/9d/school-sch-nj-10__29.mp3", "t": "此谓自伤，"}, {"f": "audio/9d/school-sch-nj-10__30.mp3", "t": "气之削也。"}], "school-sch-nj-11": [{"f": "audio/4e/school-sch-nj-11__0.mp3", "t": "阳气者，"}, {"f": "audio/4e/school-sch-nj-11__1.mp3", "t": "若天与日，"}, {"f": "audio/4e/school-sch-nj-11__2.mp3", "t": "失其所则折寿而不彰。"}, {"f": "audio/4e/school-sch-nj-11__3.mp3", "t": "故天运当以日光明。"}, {"f": "audio/4e/school-sch-nj-11__4.mp3", "t": "是故阳因而上，"}, {"f": "audio/4e/school-sch-nj-11__5.mp3", "t": "卫外者也。"}, {"f": "audio/4e/school-sch-nj-11__6.mp3", "t": "因于寒，"}, {"f": "audio/4e/school-sch-nj-11__7.mp3", "t": "欲如运枢，"}, {"f": "audio/4e/school-sch-nj-11__8.mp3", "t": "起居如惊，"}, {"f": "audio/4e/school-sch-nj-11__9.mp3", "t": "神气乃浮；"}, {"f": "audio/4e/school-sch-nj-11__10.mp3", "t": "因于暑，"}, {"f": "audio/4e/school-sch-nj-11__11.mp3", "t": "汗，"}, {"f": "audio/4e/school-sch-nj-11__12.mp3", "t": "烦则喘喝，"}, {"f": "audio/4e/school-sch-nj-11__13.mp3", "t": "静则多言，"}, {"f": "audio/4e/school-sch-nj-11__14.mp3", "t": "体若燔炭，"}, {"f": "audio/4e/school-sch-nj-11__15.mp3", "t": "汗出而散；"}, {"f": "audio/4e/school-sch-nj-11__16.mp3", "t": "因于湿，"}, {"f": "audio/4e/school-sch-nj-11__17.mp3", "t": "首如裹，"}, {"f": "audio/4e/school-sch-nj-11__18.mp3", "t": "湿热不攘，"}, {"f": "audio/4e/school-sch-nj-11__19.mp3", "t": "大筋緛短，"}, {"f": "audio/4e/school-sch-nj-11__20.mp3", "t": "小筋弛长。"}, {"f": "audio/4e/school-sch-nj-11__21.mp3", "t": "緛短为拘，"}, {"f": "audio/4e/school-sch-nj-11__22.mp3", "t": "弛长为痿；"}, {"f": "audio/4e/school-sch-nj-11__23.mp3", "t": "因于气，"}, {"f": "audio/4e/school-sch-nj-11__24.mp3", "t": "为肿，"}, {"f": "audio/4e/school-sch-nj-11__25.mp3", "t": "四维相代，"}, {"f": "audio/4e/school-sch-nj-11__26.mp3", "t": "阳气乃竭。"}], "school-sch-nj-12": [{"f": "audio/b5/school-sch-nj-12__0.mp3", "t": "阳气者，"}, {"f": "audio/b5/school-sch-nj-12__1.mp3", "t": "烦劳则张，"}, {"f": "audio/b5/school-sch-nj-12__2.mp3", "t": "精绝，"}, {"f": "audio/b5/school-sch-nj-12__3.mp3", "t": "辟积于夏，"}, {"f": "audio/b5/school-sch-nj-12__4.mp3", "t": "使人煎厥；"}, {"f": "audio/b5/school-sch-nj-12__5.mp3", "t": "目盲不可以视，"}, {"f": "audio/b5/school-sch-nj-12__6.mp3", "t": "耳闭不可以听，"}, {"f": "audio/b5/school-sch-nj-12__7.mp3", "t": "溃溃乎若坏都，"}, {"f": "audio/b5/school-sch-nj-12__8.mp3", "t": "汩汩乎不可止。"}, {"f": "audio/b5/school-sch-nj-12__9.mp3", "t": "阳气者，"}, {"f": "audio/b5/school-sch-nj-12__10.mp3", "t": "大怒则形气绝，"}, {"f": "audio/b5/school-sch-nj-12__11.mp3", "t": "而血菀于上，"}, {"f": "audio/b5/school-sch-nj-12__12.mp3", "t": "使人薄厥。"}, {"f": "audio/b5/school-sch-nj-12__13.mp3", "t": "有伤于筋，"}, {"f": "audio/b5/school-sch-nj-12__14.mp3", "t": "纵，"}, {"f": "audio/b5/school-sch-nj-12__15.mp3", "t": "其若不容。"}, {"f": "audio/b5/school-sch-nj-12__16.mp3", "t": "汗出偏沮，"}, {"f": "audio/b5/school-sch-nj-12__17.mp3", "t": "使人偏枯。"}, {"f": "audio/b5/school-sch-nj-12__18.mp3", "t": "汗出见湿，"}, {"f": "audio/b5/school-sch-nj-12__19.mp3", "t": "乃生痤痱。"}, {"f": "audio/b5/school-sch-nj-12__20.mp3", "t": "高梁之变，"}, {"f": "audio/b5/school-sch-nj-12__21.mp3", "t": "足生大丁，"}, {"f": "audio/b5/school-sch-nj-12__22.mp3", "t": "受如持虚。"}, {"f": "audio/b5/school-sch-nj-12__23.mp3", "t": "劳汗当风，"}, {"f": "audio/b5/school-sch-nj-12__24.mp3", "t": "寒薄为皶，"}, {"f": "audio/b5/school-sch-nj-12__25.mp3", "t": "郁乃痤。"}], "school-sch-nj-13": [{"f": "audio/27/school-sch-nj-13__0.mp3", "t": "阳气者，"}, {"f": "audio/27/school-sch-nj-13__1.mp3", "t": "精则养神，"}, {"f": "audio/27/school-sch-nj-13__2.mp3", "t": "柔则养筋。"}, {"f": "audio/27/school-sch-nj-13__3.mp3", "t": "开合不得，"}, {"f": "audio/27/school-sch-nj-13__4.mp3", "t": "寒气从之，"}, {"f": "audio/27/school-sch-nj-13__5.mp3", "t": "乃生大偻。"}, {"f": "audio/27/school-sch-nj-13__6.mp3", "t": "陷脉为瘘，"}, {"f": "audio/27/school-sch-nj-13__7.mp3", "t": "留连肉腠，"}, {"f": "audio/27/school-sch-nj-13__8.mp3", "t": "俞气化薄，"}, {"f": "audio/27/school-sch-nj-13__9.mp3", "t": "传为善畏，"}, {"f": "audio/27/school-sch-nj-13__10.mp3", "t": "及为惊骇。"}, {"f": "audio/27/school-sch-nj-13__11.mp3", "t": "营气不从，"}, {"f": "audio/27/school-sch-nj-13__12.mp3", "t": "逆于肉理，"}, {"f": "audio/27/school-sch-nj-13__13.mp3", "t": "乃生痈肿。"}, {"f": "audio/27/school-sch-nj-13__14.mp3", "t": "魄汗未尽，"}, {"f": "audio/27/school-sch-nj-13__15.mp3", "t": "形弱而气烁，"}, {"f": "audio/27/school-sch-nj-13__16.mp3", "t": "穴俞以闭，"}, {"f": "audio/27/school-sch-nj-13__17.mp3", "t": "发为风疟。"}], "school-sch-nj-14": [{"f": "audio/aa/school-sch-nj-14__0.mp3", "t": "故风者，"}, {"f": "audio/aa/school-sch-nj-14__1.mp3", "t": "百病之始也，"}, {"f": "audio/aa/school-sch-nj-14__2.mp3", "t": "清静则肉腠闭拒，"}, {"f": "audio/aa/school-sch-nj-14__3.mp3", "t": "虽有大风苛毒，"}, {"f": "audio/aa/school-sch-nj-14__4.mp3", "t": "弗之能害，"}, {"f": "audio/aa/school-sch-nj-14__5.mp3", "t": "此因时之序也。"}, {"f": "audio/aa/school-sch-nj-14__6.mp3", "t": "故病久则传化，"}, {"f": "audio/aa/school-sch-nj-14__7.mp3", "t": "上下不并，"}, {"f": "audio/aa/school-sch-nj-14__8.mp3", "t": "良医弗为。"}, {"f": "audio/aa/school-sch-nj-14__9.mp3", "t": "故阳畜积病死，"}, {"f": "audio/aa/school-sch-nj-14__10.mp3", "t": "而阳气当隔，"}, {"f": "audio/aa/school-sch-nj-14__11.mp3", "t": "隔者当泻。"}, {"f": "audio/aa/school-sch-nj-14__12.mp3", "t": "不亟正治，"}, {"f": "audio/aa/school-sch-nj-14__13.mp3", "t": "粗乃败之。"}], "school-sch-nj-15": [{"f": "audio/76/school-sch-nj-15__0.mp3", "t": "故阳气者，"}, {"f": "audio/76/school-sch-nj-15__1.mp3", "t": "一日而主外，"}, {"f": "audio/76/school-sch-nj-15__2.mp3", "t": "平旦人气生，"}, {"f": "audio/76/school-sch-nj-15__3.mp3", "t": "日中而阳气隆，"}, {"f": "audio/76/school-sch-nj-15__4.mp3", "t": "日西而阳气已虚，"}, {"f": "audio/76/school-sch-nj-15__5.mp3", "t": "气门乃闭。"}, {"f": "audio/76/school-sch-nj-15__6.mp3", "t": "是故暮而收拒，"}, {"f": "audio/76/school-sch-nj-15__7.mp3", "t": "无扰筋骨，"}, {"f": "audio/76/school-sch-nj-15__8.mp3", "t": "无见雾露，"}, {"f": "audio/76/school-sch-nj-15__9.mp3", "t": "反此三时，"}, {"f": "audio/76/school-sch-nj-15__10.mp3", "t": "形乃困薄。"}], "school-sch-nj-16": [{"f": "audio/7c/school-sch-nj-16__0.mp3", "t": "岐伯曰："}, {"f": "audio/7c/school-sch-nj-16__1.mp3", "t": "阴者藏精而起亟也；"}, {"f": "audio/7c/school-sch-nj-16__2.mp3", "t": "阳者卫外而为固也。"}, {"f": "audio/7c/school-sch-nj-16__3.mp3", "t": "阴不胜其阳，"}, {"f": "audio/7c/school-sch-nj-16__4.mp3", "t": "则脉流薄疾，"}, {"f": "audio/7c/school-sch-nj-16__5.mp3", "t": "并乃狂；"}, {"f": "audio/7c/school-sch-nj-16__6.mp3", "t": "阳不胜其阴，"}, {"f": "audio/7c/school-sch-nj-16__7.mp3", "t": "则五藏气争，"}, {"f": "audio/7c/school-sch-nj-16__8.mp3", "t": "九窍不通。"}, {"f": "audio/7c/school-sch-nj-16__9.mp3", "t": "是以圣人陈阴阳，"}, {"f": "audio/7c/school-sch-nj-16__10.mp3", "t": "筋脉和同，"}, {"f": "audio/7c/school-sch-nj-16__11.mp3", "t": "骨髓坚固，"}, {"f": "audio/7c/school-sch-nj-16__12.mp3", "t": "气血皆从。"}, {"f": "audio/7c/school-sch-nj-16__13.mp3", "t": "如是则内外调和，"}, {"f": "audio/7c/school-sch-nj-16__14.mp3", "t": "邪不能害，"}, {"f": "audio/7c/school-sch-nj-16__15.mp3", "t": "耳目聪明，"}, {"f": "audio/7c/school-sch-nj-16__16.mp3", "t": "气立如故。"}], "school-sch-nj-17": [{"f": "audio/86/school-sch-nj-17__0.mp3", "t": "风客淫气，"}, {"f": "audio/86/school-sch-nj-17__1.mp3", "t": "精乃亡，"}, {"f": "audio/86/school-sch-nj-17__2.mp3", "t": "邪伤肝也。"}, {"f": "audio/86/school-sch-nj-17__3.mp3", "t": "因而饱食，"}, {"f": "audio/86/school-sch-nj-17__4.mp3", "t": "筋脉横解，"}, {"f": "audio/86/school-sch-nj-17__5.mp3", "t": "肠澼为痔。"}, {"f": "audio/86/school-sch-nj-17__6.mp3", "t": "因而大饮，"}, {"f": "audio/86/school-sch-nj-17__7.mp3", "t": "则气逆。"}, {"f": "audio/86/school-sch-nj-17__8.mp3", "t": "因而强力，"}, {"f": "audio/86/school-sch-nj-17__9.mp3", "t": "肾气乃伤，"}, {"f": "audio/86/school-sch-nj-17__10.mp3", "t": "高骨乃坏。"}], "school-sch-nj-18": [{"f": "audio/23/school-sch-nj-18__0.mp3", "t": "凡阴阳之要，"}, {"f": "audio/23/school-sch-nj-18__1.mp3", "t": "阳密乃固，"}, {"f": "audio/23/school-sch-nj-18__2.mp3", "t": "两者不和，"}, {"f": "audio/23/school-sch-nj-18__3.mp3", "t": "若春无秋，"}, {"f": "audio/23/school-sch-nj-18__4.mp3", "t": "若冬无夏。"}, {"f": "audio/23/school-sch-nj-18__5.mp3", "t": "因而和之，"}, {"f": "audio/23/school-sch-nj-18__6.mp3", "t": "是谓圣度。"}, {"f": "audio/23/school-sch-nj-18__7.mp3", "t": "故阳强不能密，"}, {"f": "audio/23/school-sch-nj-18__8.mp3", "t": "阴气乃绝。"}, {"f": "audio/23/school-sch-nj-18__9.mp3", "t": "阴平阳秘，"}, {"f": "audio/23/school-sch-nj-18__10.mp3", "t": "精神乃治；"}, {"f": "audio/23/school-sch-nj-18__11.mp3", "t": "阴阳离决，"}, {"f": "audio/23/school-sch-nj-18__12.mp3", "t": "精气乃绝。"}], "school-sch-nj-19": [{"f": "audio/c0/school-sch-nj-19__0.mp3", "t": "因于露风，"}, {"f": "audio/c0/school-sch-nj-19__1.mp3", "t": "乃生寒热。"}, {"f": "audio/c0/school-sch-nj-19__2.mp3", "t": "是以春伤于风，"}, {"f": "audio/c0/school-sch-nj-19__3.mp3", "t": "邪气留连，"}, {"f": "audio/c0/school-sch-nj-19__4.mp3", "t": "乃为洞泄。"}, {"f": "audio/c0/school-sch-nj-19__5.mp3", "t": "夏伤于暑，"}, {"f": "audio/c0/school-sch-nj-19__6.mp3", "t": "秋为痎疟。"}, {"f": "audio/c0/school-sch-nj-19__7.mp3", "t": "秋伤于湿，"}, {"f": "audio/c0/school-sch-nj-19__8.mp3", "t": "上逆而咳，"}, {"f": "audio/c0/school-sch-nj-19__9.mp3", "t": "发为痿厥。"}, {"f": "audio/c0/school-sch-nj-19__10.mp3", "t": "冬伤于寒，"}, {"f": "audio/c0/school-sch-nj-19__11.mp3", "t": "春必温病。"}, {"f": "audio/c0/school-sch-nj-19__12.mp3", "t": "四时之气，"}, {"f": "audio/c0/school-sch-nj-19__13.mp3", "t": "更伤五藏。"}], "school-sch-nj-20": [{"f": "audio/15/school-sch-nj-20__0.mp3", "t": "阴之所生，"}, {"f": "audio/15/school-sch-nj-20__1.mp3", "t": "本在五味；"}, {"f": "audio/15/school-sch-nj-20__2.mp3", "t": "阴之五宫，"}, {"f": "audio/15/school-sch-nj-20__3.mp3", "t": "伤在五味。"}, {"f": "audio/15/school-sch-nj-20__4.mp3", "t": "是故味过于酸，"}, {"f": "audio/15/school-sch-nj-20__5.mp3", "t": "肝气以津，"}, {"f": "audio/15/school-sch-nj-20__6.mp3", "t": "脾气乃绝。"}, {"f": "audio/15/school-sch-nj-20__7.mp3", "t": "味过于咸，"}, {"f": "audio/15/school-sch-nj-20__8.mp3", "t": "大骨气劳，"}, {"f": "audio/15/school-sch-nj-20__9.mp3", "t": "短肌，"}, {"f": "audio/15/school-sch-nj-20__10.mp3", "t": "心气抑。"}, {"f": "audio/15/school-sch-nj-20__11.mp3", "t": "味过于苦，"}, {"f": "audio/15/school-sch-nj-20__12.mp3", "t": "心气喘满，"}, {"f": "audio/15/school-sch-nj-20__13.mp3", "t": "色黑，"}, {"f": "audio/15/school-sch-nj-20__14.mp3", "t": "肾气不衡。"}, {"f": "audio/15/school-sch-nj-20__15.mp3", "t": "味过于甘，"}, {"f": "audio/15/school-sch-nj-20__16.mp3", "t": "脾气濡，"}, {"f": "audio/15/school-sch-nj-20__17.mp3", "t": "胃气乃厚。"}, {"f": "audio/15/school-sch-nj-20__18.mp3", "t": "味过于辛，"}, {"f": "audio/15/school-sch-nj-20__19.mp3", "t": "筋脉沮弛，"}, {"f": "audio/15/school-sch-nj-20__20.mp3", "t": "精神乃央。"}, {"f": "audio/15/school-sch-nj-20__21.mp3", "t": "是故谨和五味，"}, {"f": "audio/15/school-sch-nj-20__22.mp3", "t": "骨正筋柔，"}, {"f": "audio/15/school-sch-nj-20__23.mp3", "t": "气血以流，"}, {"f": "audio/15/school-sch-nj-20__24.mp3", "t": "腠理以密，"}, {"f": "audio/15/school-sch-nj-20__25.mp3", "t": "如是则骨气以精。"}, {"f": "audio/15/school-sch-nj-20__26.mp3", "t": "谨道如法，"}, {"f": "audio/15/school-sch-nj-20__27.mp3", "t": "长有天命。"}], "school-sch-nj-21": [{"f": "audio/25/school-sch-nj-21__0.mp3", "t": "黄帝问曰："}, {"f": "audio/25/school-sch-nj-21__1.mp3", "t": "愿闻十二藏之相使，"}, {"f": "audio/25/school-sch-nj-21__2.mp3", "t": "贵贱何如？"}, {"f": "audio/25/school-sch-nj-21__3.mp3", "t": "岐伯曰："}, {"f": "audio/25/school-sch-nj-21__4.mp3", "t": "悉乎哉问也，"}, {"f": "audio/25/school-sch-nj-21__5.mp3", "t": "请遂言之："}, {"f": "audio/25/school-sch-nj-21__6.mp3", "t": "心者，"}, {"f": "audio/25/school-sch-nj-21__7.mp3", "t": "君主之官也，"}, {"f": "audio/25/school-sch-nj-21__8.mp3", "t": "神明出焉。"}, {"f": "audio/25/school-sch-nj-21__9.mp3", "t": "肺者，"}, {"f": "audio/25/school-sch-nj-21__10.mp3", "t": "相傅之官，"}, {"f": "audio/25/school-sch-nj-21__11.mp3", "t": "治节出焉。"}, {"f": "audio/25/school-sch-nj-21__12.mp3", "t": "肝者，"}, {"f": "audio/25/school-sch-nj-21__13.mp3", "t": "将军之官，"}, {"f": "audio/25/school-sch-nj-21__14.mp3", "t": "谋虑出焉。"}, {"f": "audio/25/school-sch-nj-21__15.mp3", "t": "胆者，"}, {"f": "audio/25/school-sch-nj-21__16.mp3", "t": "中正之官，"}, {"f": "audio/25/school-sch-nj-21__17.mp3", "t": "决断出焉。"}, {"f": "audio/25/school-sch-nj-21__18.mp3", "t": "膻中者，"}, {"f": "audio/25/school-sch-nj-21__19.mp3", "t": "臣使之官，"}, {"f": "audio/25/school-sch-nj-21__20.mp3", "t": "喜乐出焉。"}, {"f": "audio/25/school-sch-nj-21__21.mp3", "t": "脾胃者，"}, {"f": "audio/25/school-sch-nj-21__22.mp3", "t": "仓廪之官，"}, {"f": "audio/25/school-sch-nj-21__23.mp3", "t": "五味出焉。"}, {"f": "audio/25/school-sch-nj-21__24.mp3", "t": "大肠者，"}, {"f": "audio/25/school-sch-nj-21__25.mp3", "t": "传道之官，"}, {"f": "audio/25/school-sch-nj-21__26.mp3", "t": "变化出焉。"}, {"f": "audio/25/school-sch-nj-21__27.mp3", "t": "小肠者，"}, {"f": "audio/25/school-sch-nj-21__28.mp3", "t": "受盛之官，"}, {"f": "audio/25/school-sch-nj-21__29.mp3", "t": "化物出焉。"}, {"f": "audio/25/school-sch-nj-21__30.mp3", "t": "肾者，"}, {"f": "audio/25/school-sch-nj-21__31.mp3", "t": "作强之官，"}, {"f": "audio/25/school-sch-nj-21__32.mp3", "t": "伎巧出焉。"}, {"f": "audio/25/school-sch-nj-21__33.mp3", "t": "三焦者，"}, {"f": "audio/25/school-s
