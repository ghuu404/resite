<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#faf8f4">
<title>经典条文 ·背（单文件版）</title>
<style>
:root {
  --bg: #faf8f4;
  --surface: #ffffff;
  --surface-2: #f4efe7;
  --ink: #2b2823;
  --ink-2: #6b655c;
  --ink-3: #a8a096;
  --line: #e9e3d9;
  --accent: #8a5a3b;
  --accent-2: #a8704a;
  --accent-soft: #f4ece3;
  --green: #3f8a63;
  --green-soft: #e9f5ee;
  --red: #bf4a44;
  --red-soft: #fceceb;
  --gold: #c9a961;
  --radius: 14px;
  --radius-sm: 9px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
    "Microsoft YaHei", sans-serif; font-size: 16px; line-height: 1.6;
  -webkit-font-smoothing: antialiased; }
#app { min-height: 100vh; }

.page { max-width: 720px; margin: 0 auto; min-height: 100vh;
  display: flex; flex-direction: column; }

.classic { font-family: "Songti SC", "SimSun", "Noto Serif SC", Georgia, serif;
  letter-spacing: .02em; }

/* ---- 顶栏 ---- */
.topbar { display: flex; align-items: center; gap: 8px; padding: 14px 16px 8px;
  position: sticky; top: 0; background: var(--bg); z-index: 10; }
.icon-btn { width: 38px; height: 38px; border: none; background: transparent;
  color: var(--ink); font-size: 26px; border-radius: 50%; cursor: pointer;
  display: flex; align-items: center; justify-content: center; padding: 0; }
.icon-btn:active { transform: scale(.94); }
.icon-btn.ghost { visibility: hidden; }
.topbar-title { flex: 1; min-width: 0; }
.tt-kicker { font-size: 11px; color: var(--ink-3); letter-spacing: .08em; }
.tt-name { font-size: 16px; font-weight: 600; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; }
.queue-badge { font-size: 12px; color: var(--accent); background: var(--accent-soft);
  padding: 3px 10px; border-radius: 20px; font-weight: 600; }

.btn-all { border: 1px solid var(--line); background: var(--surface);
  color: var(--ink-2); font-size: 12.5px; padding: 6px 12px; border-radius: 20px;
  cursor: pointer; font-family: inherit; }
.btn-all:active { transform: scale(.96); }

/* ---- 首页 ---- */
.home-head { padding: 20px 18px 0; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand-mark { width: 42px; height: 42px; display: flex; align-items: center;
  justify-content: center; background: var(--accent); color: #fff;
  border-radius: 11px; font-family: "Songti SC", serif; font-size: 22px;
  font-weight: 600; }
.brand-title { font-size: 17px; font-weight: 700; }
.brand-sub { font-size: 11.5px; color: var(--ink-3); }
.home-main { padding: 20px 18px 48px; flex: 1; }

.hero { background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 22px; margin-bottom: 16px; }
.hero-row { display: flex; align-items: center; }
.hero-item { flex: 1; text-align: center; }
.hero-divider { width: 1px; height: 40px; background: var(--line); }
.hero-num { font-size: 34px; font-weight: 700; color: var(--accent);
  line-height: 1.1; font-variant-numeric: tabular-nums; }
.hero-num span { font-size: 18px; color: var(--ink-3); font-weight: 500; }
.hero-label { margin-top: 4px; font-size: 12.5px; color: var(--ink-2); }
.due-tip { margin-top: 14px; text-align: center; font-size: 13px;
  color: var(--red); background: var(--red-soft); padding: 8px;
  border-radius: 8px; }
.due-tip b { font-weight: 700; }

.card { background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 18px; margin-bottom: 16px; }
.card-title { font-size: 14px; font-weight: 600; margin-bottom: 12px; }
.goal-row { display: flex; align-items: center; gap: 12px; }
.goal-row input[type=range] { flex: 1; accent-color: var(--accent); }
.goal-value { font-size: 14px; color: var(--ink-2); white-space: nowrap; }
.goal-value b { color: var(--accent); font-size: 18px; }
.days-tip { margin-top: 10px; font-size: 13px; color: var(--ink-2); }
.days-tip b { color: var(--accent); font-size: 15px; }

.btn-main { display: block; width: 100%; padding: 15px; font-size: 16px;
  font-weight: 600; color: #fff; background: var(--accent); border: none;
  border-radius: 12px; cursor: pointer; font-family: inherit;
  box-shadow: 0 6px 18px -8px rgba(138,90,59,.8); }
.btn-main:active:not(:disabled) { transform: scale(.98); }
.btn-main:disabled { background: var(--ink-3); box-shadow: none; cursor: not-allowed; }
.btn-sub { display: block; width: 100%; padding: 14px; font-size: 15px;
  color: var(--ink-2); background: var(--surface); border: 1px solid var(--line);
  border-radius: 12px; cursor: pointer; margin-top: 10px; font-family: inherit; }

/* ---- 科目选择页 ---- */
.list-main { flex: 1; padding: 0 18px 48px; }

.select-hint { font-size: 12.5px; color: var(--ink-3); margin-bottom: 12px;
  padding-left: 2px; }

.subject-select-list { display: grid; gap: 10px; margin-bottom: 30px; }

.subject-select {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 15px; background: var(--surface);
  border: 1px solid var(--line); border-radius: var(--radius-sm);
  cursor: pointer; transition: all .15s; position: relative;
}
.subject-select:active { transform: scale(.995); }
.subject-select.checked {
  border-color: var(--accent);
  background: var(--accent-soft);
  box-shadow: 0 0 0 1px var(--accent) inset;
}
.subject-select input[type=checkbox] {
  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;
}
.sc-check {
  width: 20px; height: 20px; flex: 0 0 auto;
  border: 1.8px solid #ded6c9; border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  background: var(--surface); transition: all .15s;
}
.subject-select.checked .sc-check {
  background: var(--accent); border-color: var(--accent);
}
.subject-select.checked .sc-check::after {
  content: ''; width: 5px; height: 9px;
  border: solid #fff; border-width: 0 2px 2px 0;
  transform: rotate(45deg) translate(-1px, -1px);
}
.sc-icon { font-size: 22px; width: 44px; height: 44px; flex: 0 0 auto;
  display: flex; align-items: center; justify-content: center;
  background: var(--accent-soft); border-radius: 11px; }
.sc-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.sc-name { font-size: 16px; font-weight: 600; }
.sc-meta { font-size: 12px; color: var(--ink-3); }
.due-num { color: var(--red); font-weight: 600; }

.select-foot {
  position: sticky; bottom: 0; left: 0; right: 0;
  padding: 12px 18px calc(14px + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(rgba(250,248,244,0), var(--bg) 40%);
}
.select-summary {
  font-size: 13px; color: var(--ink-2); margin-bottom: 10px; text-align: center;
}
.select-summary b { color: var(--accent); font-size: 15px; }
.due-tag {
  display: inline-block; font-size: 11.5px; color: var(--red);
  background: var(--red-soft); padding: 2px 8px; border-radius: 20px;
  margin-left: 6px;
}

/* ---- 学习页 ---- */
.step-bar { display: flex; gap: 8px; justify-content: center; padding: 6px 16px 14px; }
.step-dot { width: 30px; height: 30px; border-radius: 50%; display: flex;
  align-items: center; justify-content: center; font-size: 12px;
  background: var(--surface-2); color: var(--ink-3); border: 1px solid var(--line);
  transition: all .2s; }
.step-dot.active { background: var(--accent); color: #fff; border-color: var(--accent);
  font-weight: 700; transform: scale(1.1); }
.step-dot.done { background: var(--green-soft); color: var(--green);
  border-color: #bfe0cd; }

.learn-body { flex: 1; padding: 0 18px 130px; }
.passage-title { font-size: 14px; font-weight: 600; color: var(--accent);
  margin-bottom: 12px; }
.passage-text { font-size: 19px; line-height: 2.1; color: var(--ink); }
.hint-row { font-size: 12px; color: var(--ink-3); margin: 14px 0; }

.quote { font-size: 18px; line-height: 2.1; padding: 16px; background: var(--surface);
  border: 1px solid var(--line); border-left: 3px solid var(--gold);
  border-radius: var(--radius-sm); margin-bottom: 18px; }
.quote-blank { display: inline-block; min-width: 4em; border-bottom: 2px solid var(--accent-2);
  color: var(--accent); text-align: center; }

.options { display: grid; gap: 9px; }
.option { display: flex; align-items: flex-start; gap: 11px; width: 100%;
  padding: 13px 15px; background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius-sm); cursor: pointer; text-align: left;
  font-family: inherit; font-size: inherit; color: inherit; transition: all .15s; }
.option:active { transform: scale(.995); }
.option.picked { border-color: var(--accent); background: var(--accent-soft);
  box-shadow: 0 0 0 1px var(--accent) inset; }
.option.correct { border-color: var(--green); background: var(--green-soft); }
.option.wrong { border-color: var(--red); background: var(--red-soft); }
.opt-letter { flex: 0 0 auto; width: 22px; height: 22px; border-radius: 50%;
  background: var(--surface-2); color: var(--ink-2); font-size: 12px;
  font-weight: 700; display: flex; align-items: center; justify-content: center;
  margin-top: 2px; }
.option.picked .opt-letter { background: var(--accent); color: #fff; }
.option.correct .opt-letter { background: var(--green); color: #fff; }
.option.wrong .opt-letter { background: var(--red); color: #fff; }
.opt-text { flex: 1; font-size: 16px; }

/* 挖空 */
.cloze-text { font-size: 19px; line-height: 2.6; color: var(--ink);
  word-break: break-word; }
.cloze-text .c { white-space: pre-wrap; }
.blank { font-family: inherit; font-size: inherit; line-height: 1.4;
  color: var(--accent); font-weight: 600; background: transparent; border: none;
  border-bottom: 1.6px solid var(--line); border-radius: 0; text-align: center;
  padding: 0 1px 1px; margin: 0 1px; outline: none; transition: all .15s;
  vertical-align: baseline; }
.blank:focus { border-bottom-color: var(--accent); background: var(--accent-soft); }
.blank.correct { color: var(--green); border-bottom-color: var(--green);
  background: var(--green-soft); }
.blank.wrong { color: var(--red); border-bottom-color: var(--red);
  background: var(--red-soft); }
.blank.revealed { color: var(--gold); border-bottom-color: var(--gold);
  background: #fdf7e8; }

/* 提示开启时：错的标红，对的无变化 */
.blank.hint-wrong {
  color: var(--red);
  border-bottom-color: var(--red);
  background: var(--red-soft);
}
.blank[readonly] { cursor: default; }

.feedback { margin-top: 18px; padding: 12px 14px; border-radius: 10px;
  font-size: 14px; }
.feedback.ok { background: var(--green-soft); color: var(--green); }
.feedback.bad { background: var(--red-soft); color: var(--red); }

.learn-foot { position: fixed; bottom: 0; left: 0; right: 0; max-width: 720px;
  margin: 0 auto; padding: 12px 18px calc(12px + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(rgba(250,248,244,0), var(--bg) 34%);
  display: flex; flex-wrap: wrap; gap: 10px; z-index: 20; }
.btn-ghost { flex: 1; padding: 14px; font-size: 15px; font-weight: 600;
  color: var(--ink-2); background: var(--surface); border: 1px solid var(--line);
  border-radius: 12px; cursor: pointer; font-family: inherit; }
.btn-ghost:active { transform: scale(.98); }
.learn-foot .btn-main { flex: 2; }

/* ---- 完成 ---- */
.done-box { text-align: center; padding: 80px 24px; }
.done-icon { width: 64px; height: 64px; border-radius: 50%; background: var(--green-soft);
  color: var(--green); font-size: 32px; display: flex; align-items: center;
  justify-content: center; margin: 0 auto 20px; }
.done-title { font-size: 20px; font-weight: 600; margin-bottom: 6px; }
.done-sub { font-size: 14px; color: var(--ink-3); margin-bottom: 28px; }

/* ---- 条文库 ---- */
.subject-list, .passage-list { display: grid; gap: 10px; }
.subject-card, .passage-item { display: flex; align-items: center; gap: 12px;
  width: 100%; padding: 14px 15px; background: var(--surface);
  border: 1px solid var(--line); border-radius: var(--radius-sm);
  cursor: pointer; text-align: left; font-family: inherit; font-size: inherit;
  color: inherit; }
.subject-card:active, .passage-item:active { transform: scale(.995); }
.sc-arrow { color: var(--ink-3); font-size: 22px; }
.pi-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.pi-title { font-size: 14.5px; font-weight: 500; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; }
.pi-article { font-size: 11.5px; color: var(--ink-3); white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; }
.tag { font-size: 11px; padding: 2px 8px; border-radius: 20px;
  background: var(--surface-2); color: var(--ink-3); flex: 0 0 auto; }
.tag.done { background: var(--green-soft); color: var(--green); }
.tag.due { background: var(--red-soft); color: var(--red); }

.empty-tip { padding: 40px 20px; text-align: center; color: var(--ink-3); }

@media (min-width: 721px) {
  .page { border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
}
/* ---- 存档区 ---- */
.backup-block {
  margin-top: 28px;
  padding-top: 20px;
  border-top: 1px dashed var(--line);
}
.backup-title {
  font-size: 12px;
  letter-spacing: .16em;
  color: var(--ink-3);
  margin-bottom: 10px;
  padding-left: 2px;
}
.backup-row {
  display: flex;
  gap: 10px;
}
.backup-btn {
  flex: 1;
  padding: 11px 14px;
  font-size: 13.5px;
  font-family: inherit;
  color: var(--ink-2);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  cursor: pointer;
  transition: all .15s;
}
.backup-btn:hover { border-color: var(--accent-2); color: var(--accent); }
.backup-btn:active { transform: scale(.97); }
.backup-hint {
  margin-top: 8px;
  font-size: 11.5px;
  color: var(--ink-3);
  line-height: 1.55;
  padding-left: 2px;
}

/* ---- toast ---- */
.toast {
  position: fixed;
  left: 50%;
  bottom: 90px;
  transform: translate(-50%, 20px);
  max-width: 86vw;
  padding: 11px 18px;
  border-radius: 12px;
  font-size: 13.5px;
  line-height: 1.5;
  background: rgba(43, 40, 35, .94);
  color: #fff;
  opacity: 0;
  pointer-events: none;
  transition: opacity .22s, transform .22s;
  z-index: 999;
  text-align: center;
  box-shadow: 0 8px 24px -8px rgba(0, 0, 0, .4);
}
.toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}
.toast.ok { background: rgba(63, 138, 99, .96); }
.toast.bad { background: rgba(191, 74, 68, .96); }
/* 自动播放被拦截时的「点击继续」提示条 */
.resume-bar {
  position: fixed;
  left: 50%;
  bottom: 96px;
  transform: translate(-50%, 16px);
  width: max-content;
  max-width: 92vw;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 11px 16px;
  border-radius: 999px;
  background: rgba(138, 90, 59, .97);
  color: #fff;
  font-size: 13.5px;
  line-height: 1.4;
  box-shadow: 0 8px 24px -6px rgba(0, 0, 0, .45);
  opacity: 0;
  pointer-events: none; /* 让轻触穿透到页面，触发全局手势监听器 */
  transition: opacity .2s, transform .2s;
  z-index: 998;
  text-align: center;
}
.resume-bar.show { opacity: 1; transform: translate(-50%, 0); }
.resume-bar .rb-ico { font-size: 16px; }
/* 复习标记 */
.review-tag {
  display: inline-block;
  font-size: 10px;
  font-weight: 700;
  color: #fff;
  background: var(--gold);
  padding: 1px 7px;
  border-radius: 20px;
  margin-left: 6px;
  letter-spacing: .06em;
  vertical-align: 1px;
}
/* 考核切换 Tab */
.exam-tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
}
.exam-tab {
  flex: 1;
  padding: 10px 8px;
  font-size: 13.5px;
  font-family: inherit;
  font-weight: 600;
  color: var(--ink-2);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  cursor: pointer;
  transition: all .15s;
}
.exam-tab.active {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}

/* 重点条文标记 */
.passage-tag {
  display: inline-block;
  font-size: 10.5px;
  font-weight: 700;
  color: #fff;
  background: var(--gold);
  padding: 1px 7px;
  border-radius: 20px;
  margin-right: 6px;
  letter-spacing: .06em;
  vertical-align: 2px;
}
/* 朗读按钮 */
.speak-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 36px;
  height: 36px;
  padding: 0 11px;
  border: 1px solid var(--line);
  border-radius: 18px;
  background: var(--surface);
  color: var(--ink-2);
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  flex: 0 0 auto;
  transition: all .15s;
  user-select: none;
  -webkit-user-select: none;
}
.speak-btn:active { transform: scale(.95); }
.speak-btn.playing {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
  animation: speak-pulse 1.6s ease-in-out infinite;
}
.speak-btn.small {
  min-width: 30px;
  height: 28px;
  padding: 0 9px;
  font-size: 12px;
  border-radius: 14px;
}
/* 朗读设置提示 */
.sheet-tip {
  font-size: 12px;
  color: var(--ink-3);
  line-height: 1.5;
  margin: -4px 0 6px;
  padding: 8px 10px;
  background: var(--accent-soft);
  border-radius: 8px;
}
@keyframes speak-pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(138, 90, 59, .45); }
  50% { box-shadow: 0 0 0 6px rgba(138, 90, 59, 0); }
}
/* 标题行 + 朗读按钮 */
.passage-title-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
}
.passage-title-row .passage-title {
  margin-bottom: 0;
  flex: 1;
  min-width: 0;
}
/* 朗读逐句高亮 */
.passage-text .cl { border-radius: 4px; transition: background .15s, color .15s; }
.passage-text .cl.speaking { background: var(--gold); color: #fff; box-shadow: 0 0 0 2px var(--gold); padding: 0 1px; }

/* 朗读设置弹层 */
.sheet-mask { position: fixed; inset: 0; background: rgba(43,40,35,.45); display: none;
  align-items: flex-end; justify-content: center; z-index: 200; }
.sheet-mask.show { display: flex; }
.sheet { width: 100%; max-width: 720px; background: var(--surface);
  border-radius: 18px 18px 0 0; padding: 20px 18px calc(22px + env(safe-area-inset-bottom,0px));
  animation: sheet-up .25s ease; }
@keyframes sheet-up { from { transform: translateY(100%); } to { transform: translateY(0); } }
.sheet-title { font-size: 17px; font-weight: 700; margin-bottom: 8px; text-align: center; }
.sheet-row { display: flex; align-items: center; gap: 12px; padding: 14px 2px; border-top: 1px solid var(--line); }
.sheet-row:first-of-type { border-top: none; }
.sheet-label { font-size: 15px; flex: 0 0 auto; }
.sheet-row input[type=range] { flex: 1; accent-color: var(--accent); }
.sheet-row select { flex: 1; padding: 9px 10px; border-radius: 9px; border: 1px solid var(--line);
  font-family: inherit; font-size: 14px; background: var(--surface); color: var(--ink); }
.sheet-row input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--accent); flex: 0 0 auto; }
.sheet-val { min-width: 44px; text-align: right; color: var(--accent); font-weight: 600; font-size: 14px; }

</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============================================================
   data.js — 全国中医药经典能力等级考试 · 一级条文数据
   ============================================================ */
const DATA = {
  levels: [
    {
      id: 'L1',
      name: '一级',
      available: true,
      subjects: [
        /* ---------------------------------------------------- 黄帝内经 */
        {
          id: 'nj', name: '黄帝内经', icon: '🌿',
          passages: [
            /* ---- 素问 ---- */
            { part:'素问', article:'上古天真论篇第一', title:'上古之人具体的养生方法',
              text:'上古之人，其知道者，法于阴阳，和于术数，食饮有节，起居有常，不妄作劳，故能形与神俱，而尽终其天年，度百岁乃去。' },
            { part:'素问', article:'上古天真论篇第一', title:'外避邪气、内养精神的两大基本原则',
              text:'虚邪贼风，避之有时，恬淡虚无，真气从之，精神内守，病安从来。' },
            { part:'素问', article:'上古天真论篇第一', title:'男女生长壮老规律及肾与生长发育生殖的关系',
              text:'女子七岁肾气盛，齿更发长。二七而天癸至，任脉通，太冲脉盛，月事以时下，故有子。三七肾气平均，故真牙生而长极。四七筋骨坚，发长极，身体盛壮。五七阳明脉衰，面始焦，发始堕。六七三阳脉衰于上，面皆焦，发始白。七七任脉虚，太冲脉衰少，天癸竭，地道不通，故形坏而无子也。丈夫八岁肾气实，发长齿更。二八肾气盛，天癸至，精气溢泻，阴阳和，故能有子。三八肾气平均，筋骨劲强，故真牙生而长极。四八筋骨隆盛，肌肉满壮。五八肾气衰，发堕齿槁。六八阳气衰竭于上，面焦，发鬓颁白。七八肝气衰，筋不能动，天癸竭，精少，肾脏衰，形体皆极。八八则齿发去。肾者主水，受五脏六腑之精而藏之，故五脏盛，乃能泻。今五脏皆衰，筋骨解堕，天癸尽矣，故发鬓白，身体重，行步不正，而无子耳。' },
            { part:'素问', article:'四气调神大论篇第二', title:'春夏养阳，秋冬养阴',
              text:'夫四时阴阳者，万物之根本也。所以圣人春夏养阳，秋冬养阴，以从其根。' },
            { part:'素问', article:'四气调神大论篇第二', title:'不治已病治未病的预防思想',
              text:'是故圣人不治已病治未病，不治已乱治未乱，此之谓也。夫病已成而后药之，乱已成而后治之，譬犹渴而穿井，斗而铸锥，不亦晚乎？' },
            { part:'素问', article:'生气通天论篇第三', title:'阳气的重要性（以太阳作比）',
              text:'阳气者，若天与日，失其所则折寿而不彰，故天运当以日光明。' },
            { part:'素问', article:'生气通天论篇第三', title:'阳气失常后感受四时邪气所致病证',
              text:'因于露风，乃生寒热。是以春伤于风，邪气留连，乃为洞泄；夏伤于暑，秋为痎疟；秋伤于湿，冬逆而咳，发为痿厥；冬伤于寒，春必温病。' },
            { part:'素问', article:'生气通天论篇第三', title:'内伤阳气所致病证（煎厥）',
              text:'阳气者，烦劳则张，精绝，辟积于夏，使人煎厥；目盲不可以视，耳闭不可以听，溃溃乎若坏都，汩汩乎不可止。' },
            { part:'素问', article:'生气通天论篇第三', title:'阳气的温养作用',
              text:'阳气者，精则养神，柔则养筋。' },
            { part:'素问', article:'生气通天论篇第三', title:'久病传变导致上下不并之理',
              text:'故病久则传化，上下不并，良医弗为。' },
            { part:'素问', article:'生气通天论篇第三', title:'按自然界阴阳变化调节起居以保阳气',
              text:'故阳气者，一日而主外，平旦人气生，日中而阳气隆，日西而阳气已虚，气门乃闭。是故暮而收拒，无扰筋骨，无见雾露，反此三时，形乃困薄。' },
            { part:'素问', article:'生气通天论篇第三', title:'阴精与阳气互相为用的关系',
              text:'阴者，藏精而起亟也；阳者，卫外而为固也。' },
            { part:'素问', article:'生气通天论篇第三', title:'阴阳平衡协调的重要意义',
              text:'凡阴阳之要，阳密乃固。两者不和，若春无秋，若冬无夏。因而和之，是谓圣度。' },
            { part:'素问', article:'生气通天论篇第三', title:'饮食五味对人体的双重作用',
              text:'阴之所生，本在五味；阴之五宫，伤在五味。' },
            { part:'素问', article:'生气通天论篇第三', title:'谨和五味的饮食调养',
              text:'是故谨和五味，骨正筋柔，气血以流，腠理以密，如是则骨气以精，谨道如法，长有天命。' },
            { part:'素问', article:'金匮真言论篇第四', title:'精气是生命活动的根本及其抗邪作用',
              text:'夫精者，身之本也。故藏于精者，春不病温。' },
            { part:'素问', article:'阴阳应象大论篇第五', title:'阴阳的基本概念及治病必求于本',
              text:'阴阳者，天地之道也，万物之纲纪，变化之父母，生杀之本始，神明之府也。治病必求于本。' },
            { part:'素问', article:'阴阳应象大论篇第五', title:'疾病发生的根本原因在于阴阳反作',
              text:'清气在下，则生飧泄；浊气在上，则生䐜胀。此阴阳反作，病之逆从也。' },
            { part:'素问', article:'阴阳应象大论篇第五', title:'人体清阳和浊阴的运动规律',
              text:'故清阳出上窍，浊阴出下窍；清阳发腠理，浊阴走五脏；清阳实四肢，浊阴归六腑。' },
            { part:'素问', article:'阴阳应象大论篇第五', title:'药食的少火、壮火分类及对人体的影响',
              text:'壮火之气衰，少火之气壮。壮火食气，气食少火。壮火散气，少火生气。' },
            { part:'素问', article:'阴阳应象大论篇第五', title:'五气偏胜致病的基本特点',
              text:'风胜则动，热胜则肿，燥胜则干，寒胜则浮，湿胜则濡泻。' },
            { part:'素问', article:'阴阳应象大论篇第五', title:'四时五行与五脏化五气、情志的关系',
              text:'天有四时五行，以生长收藏，以生寒暑燥湿风。人有五脏化五气，以生喜怒悲忧恐。' },
            { part:'素问', article:'阴阳应象大论篇第五', title:'阴阳相互依存、相互为用的关系',
              text:'天地者，万物之上下也；阴阳者，血气之男女也；左右者，阴阳之道路也；水火者，阴阳之征兆也；阴阳者，万物之能始也。' },
            { part:'素问', article:'阴阳应象大论篇第五', title:'善治者治皮毛的预防思想',
              text:'故邪风之至，疾如风雨，故善治者治皮毛，其次治肌肤，其次治筋脉，其次治六腑，其次治五脏。' },
            { part:'素问', article:'阴阳应象大论篇第五', title:'运用阴阳互根理论确立针刺治疗原则',
              text:'故善用针者，从阴引阳，从阳引阴，以右治左，以左治右。' },
            { part:'素问', article:'阴阳应象大论篇第五', title:'先辨阴阳的诊法原则',
              text:'善诊者，察色按脉，先别阴阳。' },
            { part:'素问', article:'阴阳应象大论篇第五', title:'因势利导的治则治法',
              text:'其高者，因而越之；其下者，引而竭之；中满者，泻之于内；其有邪者，渍形以为汗；其在皮者，汗而发之。' },
            { part:'素问', article:'灵兰秘典论篇第八', title:'十二脏腑的主要功能及相互联系',
              text:'心者，君主之官也，神明出焉。肺者，相傅之官，治节出焉。肝者，将军之官，谋虑出焉。胆者，中正之官，决断出焉。膻中者，臣使之官，喜乐出焉。脾胃者，仓廪之官，五味出焉。大肠者，传道之官，变化出焉。小肠者，受盛之官，化物出焉。肾者，作强之官，伎巧出焉。三焦者，决渎之官，水道出焉。膀胱者，州都之官，津液藏焉，气化则能出矣。' },
            { part:'素问', article:'六节藏象论篇第九', title:'五脏功能所主、外应四时、内藏精舍神的藏象学说',
              text:'心者，生之本，神之变也，其华在面，其充在血脉，为阳中之太阳，通于夏气。肺者，气之本，魄之处也，其华在毛，其充在皮，为阳中之太阴，通于秋气。肾者，主蛰，封藏之本，精之处也，其华在发，其充在骨，为阴中之少阴，通于冬气。肝者，罢极之本，魂之居也，其华在爪，其充在筋，以生血气，其味酸，其色苍，此为阳中之少阳，通于春气。脾胃大肠小肠三焦膀胱者，仓廪之本，营之居也，名曰器，能化糟粕，转味而入出者也，其华在唇四白，其充在肌，其味甘，其色黄，此至阴之类，通于土气。凡十一脏取决于胆也。' },
            { part:'素问', article:'五脏别论篇第十一', title:'以天地阴阳藏泻为依据划分脏腑',
              text:'所谓五脏者，藏精气而不泻也，故满而不能实。六腑者，传化物而不藏，故实而不能满也。' },
            { part:'素问', article:'五脏别论篇第十一', title:'寸口脉诊病的原理',
              text:'气口何以独为五脏主？曰：胃者，水谷之海，六腑之大源也。五味入口，藏于胃，以养五脏气，气口亦太阴也，是以五脏六腑之气味，皆出于胃，变见于气口。' },
            { part:'素问', article:'汤液醪醴论篇第十四', title:'病为本，工为标，治疗需医患配合',
              text:'病为本，工为标，标本不得，邪气不服，此之谓也。' },
            { part:'素问', article:'汤液醪醴论篇第十四', title:'水肿病的发病机理、治疗原则和方法',
              text:'帝曰：其有不从毫毛而生，五脏阳以竭也。津液充郭，其魄独居，孤精于内，气耗于外，形不可与衣相保，此四极急而动中，是气拒于内而形施于外，治之奈何？岐伯曰：平治于权衡，去宛陈莝，微动四极，温衣，缪刺其处，以复其形。开鬼门，洁净府，精以时服，五阳以布，疏涤五脏。故精自生，形自盛，骨肉相保，巨气乃平。' },
            { part:'素问', article:'脉要精微论篇第十七', title:'诊法常以平旦的原理',
              text:'诊法常以平旦，阴气未动，阳气未散，饮食未进，经脉未盛，络脉调匀，气血未乱，故乃可诊有过之脉。' },
            { part:'素问', article:'脉要精微论篇第十七', title:'强调四诊合参的诊病原则',
              text:'切脉动静而视精明，察五色，观五脏有余不足，六腑强弱，形之盛衰，以此参伍，决死生之分。' },
            { part:'素问', article:'脉要精微论篇第十七', title:'十一种临床常见脉象与主病',
              text:'长则气治，短则气病，数则烦心，大则病进，上盛则气高，下盛则气胀，代则气衰，细则气少，涩则心痛。' },
            { part:'素问', article:'脉要精微论篇第十七', title:'望面色察目诊病的原理',
              text:'夫精明五色者，气之华也。' },
            { part:'素问', article:'脉要精微论篇第十七', title:'望头胸腰膝骨五府，判断五脏精气盛衰',
              text:'头者精明之府，头倾视深，精神将夺矣；背者胸中之府，背曲肩随，府将坏矣；腰者肾之府，转摇不能，肾将惫矣；膝者筋之府，屈伸不能，行则偻附，筋将惫矣；骨者髓之府，不能久立，行则振掉，骨将惫矣。得强则生，失强则死。' },
            { part:'素问', article:'脉要精微论篇第十七', title:'脉应四时及四时脉象特点',
              text:'四变之动，脉与之上下，以春应中规，夏应中矩，秋应中衡，冬应中权。' },
            { part:'素问', article:'脉要精微论篇第十七', title:'虚静为保的诊脉要求',
              text:'持脉有道，虚静为保。' },
            { part:'素问', article:'平人气象论篇第十八', title:'脉以胃气为本的意义',
              text:'平人之常气禀于胃，胃者平人之常气也，人无胃气曰逆，逆者死。' },
            { part:'素问', article:'玉机真脏论篇第十九', title:'五实死、五虚死之生的转机',
              text:'浆粥入胃，泄注止，则虚者活；身汗得后利，则实者活。' },
            { part:'素问', article:'经脉别论篇第二十一', title:'以勇怯代表性格体质论发病',
              text:'诊病之道，观人勇怯、骨肉、皮肤，能知其情，以为诊法也。' },
            { part:'素问', article:'经脉别论篇第二十一', title:'生病起于过用的发病观',
              text:'故春秋冬夏，四时阴阳，生病起于过用，此为常也。' },
            { part:'素问', article:'经脉别论篇第二十一', title:'饮入胃后的运化、输布过程',
              text:'饮入于胃，游溢精气，上输于脾，脾气散精，上归于肺，通调水道，下输膀胱，水精四布，五经并行。' },
            { part:'素问', article:'经脉别论篇第二十一', title:'五劳所伤的内容及原理',
              text:'久视伤血，久卧伤气，久坐伤肉，久立伤骨，久行伤筋，是谓五劳所伤。' },
            { part:'素问', article:'宝命全形论篇第二十五', title:'针刺治疗应注意的五个关键问题（治神最重要）',
              text:'凡刺之真，必先治神，五脏已定，九候已备，后乃存针……经气已至，慎守勿失，深浅在志，远近若一，如临深渊，手如握虎，神无营于众物。' },
            { part:'素问', article:'通评虚实论篇第二十八', title:'从邪正盛衰角度论虚实',
              text:'邪气盛则实，精气夺则虚。' },
            { part:'素问', article:'太阴阳明论篇第二十九', title:'脾胃脉相为表里、生病各异的原因',
              text:'脾与胃以膜相连耳，而能为之行其津液，何也？曰：足太阴者三阴也，其脉贯胃属脾络嗌，故太阴为之行气于三阴。阳明者表也，五脏六腑之海也，亦为之行气于三阳。' },
            { part:'素问', article:'太阴阳明论篇第二十九', title:'阳道实、阴道虚的含义及临床表现',
              text:'阳道实，阴道虚。故犯贼风虚邪者，阳受之；食饮不节，起居不时者，阴受之。阳受之则入六腑，阴受之则入五脏。' },
            { part:'素问', article:'太阴阳明论篇第二十九', title:'脾病而四肢不用的机理',
              text:'四肢皆禀气于胃而不得至经，必因于脾乃得禀也。今脾病不能为胃行其津液，四肢不得禀水谷气，气日以衰，脉道不利，筋骨肌肉皆无气以生，故不用焉。' },
            { part:'素问', article:'太阴阳明论篇第二十九', title:'脾不主时的机理',
              text:'脾者土也，治中央，常以四时长四脏，各十八日寄治，不得独主于时也。' },
            { part:'素问', article:'热论篇第三十一', title:'热病的概念、命名及不同类型预后',
              text:'今夫热病者，皆伤寒之类也，或愈或死，其死皆以六七日之间，其愈皆以十日以上者，何也？不知其解，愿闻其故。岐伯对曰：巨阳者，诸阳之属也，其脉连于风府，故为诸阳主气也。人之伤于寒也，则为病热，热虽甚不死；其两感于寒而病者，必不免于死。' },
            { part:'素问', article:'热论篇第三十一', title:'热病的六经分证及具体表现',
              text:'伤寒一日，巨阳受之，故头项痛腰脊强。二日阳明受之，阳明主肉，其脉侠鼻络于目，故身热目疼而鼻干，不得卧也。三日少阳受之，少阳主胆，其脉循胁络于耳，故胸胁痛而耳聋。三阳经络皆受其病，而未入于脏者，故可汗而已。四日太阴受之，太阴脉布胃中络于嗌，故腹满而嗌干。五日少阴受之，少阴脉贯肾络于肺，系舌本，故口燥舌干而渴。六日厥阴受之，厥阴脉循阴器而络于肝，故烦满而囊缩。三阴三阳、五脏六腑皆受病，荣卫不行，五脏不通，则死矣。' },
            { part:'素问', article:'热论篇第三十一', title:'热病的治疗原则和具体方法',
              text:'其未满三日者，可汗而已；其满三日者，可泄而已。' },
            { part:'素问', article:'热论篇第三十一', title:'热病两感于寒的主证、传变及预后',
              text:'两感于寒者，病一日则巨阳与少阴俱病，则头痛口干而烦满；二日则阳明与太阴俱病，则腹满身热，不欲食，谵言；三日则少阳与厥阴俱病，则耳聋囊缩而厥，水浆不入，不知人，六日死。帝曰：五脏已伤，六腑不通，荣卫不行，如是之后，三日乃死何也？岐伯曰：阳明者，十二经脉之长也，其血气盛，故不知人，三日其气乃尽，故死矣。凡病伤寒而成温者，先夏至日者为病温，后夏至日者为病暑，暑当与汗皆出，勿止。' },
            { part:'素问', article:'评热病论篇第三十三', title:'正气在发病中的主导作用',
              text:'邪之所凑，其气必虚。' },
            { part:'素问', article:'咳论篇第三十八', title:'咳嗽的病因病机及外内合邪理论',
              text:'五脏六腑皆令人咳，非独肺也。帝曰：愿闻其状。岐伯曰：皮毛者，肺之合也，皮毛先受邪气，邪气以从其合也。其寒饮食入胃，从肺脉上至于肺，则肺寒，肺寒则外内合邪，因而客之，则为肺咳。五脏各以其时受病，非其时，各传以与之。' },
            { part:'素问', article:'举痛论篇第三十九', title:'五脏卒痛的主要病因及疼痛机理',
              text:'经脉流行不止，环周不休，寒气入经而稽迟，泣而不行，客于脉外则血少，客于脉中则气不通，故卒然而痛。' },
            { part:'素问', article:'举痛论篇第三十九', title:'九气为病的机理',
              text:'怒则气上，喜则气缓，悲则气消，恐则气下，寒则气收，炅则气泄，惊则气乱，劳则气耗，思则气结。' },
            { part:'素问', article:'风论篇第四十二', title:'风邪善行数变、为百病之长的特性',
              text:'风者，善行而数变。故风者百病之长也，至其变化，乃为他病也，无常方，然致有风气也。' },
            { part:'素问', article:'痹论篇第四十三', title:'痹证的病因及分类',
              text:'风寒湿三气杂至，合而为痹也。其风气胜者为行痹，寒气胜者为痛痹，湿气胜者为著痹也。' },
            { part:'素问', article:'痹论篇第四十三', title:'营卫之气与痹证的关系',
              text:'荣者，水谷之精气也，和调于五脏，洒陈于六腑，乃能入于脉也，故循脉上下，贯五脏，络六腑也。卫者，水谷之悍气也，其气慓疾滑利，不能入于脉也，故循皮肤之中，分肉之间，熏于肓膜，散于胸腹。逆其气则病，从其气则愈，不与风寒湿气合，故不为痹。' },
            { part:'素问', article:'痿论篇第四十四', title:'肺热叶焦和五脏气热是痿证的病因',
              text:'五脏因肺热叶焦，发为痿躄。' },
            { part:'素问', article:'痿论篇第四十四', title:'治痿独取阳明的原理',
              text:'阳明者，五脏六腑之海，主润宗筋，宗筋主束骨而利机关也。冲脉者，经脉之海也，主渗灌溪谷，与阳明合于宗筋，阴阳总宗筋之会，会于气街，而阳明为之长，皆属于带脉，而络于督脉。故阳明虚，则宗筋纵，带脉不引，故足痿不用也。' },
            { part:'素问', article:'水热穴论篇第六十一', title:'肾者胃之关的含义及肺胃在水肿形成中的作用',
              text:'肾者，胃之关也，关门不利，故聚水而从其类也。上下溢于皮肤，故为胕肿。' },
            { part:'素问', article:'水热穴论篇第六十一', title:'肾为牝脏，其功能失调是水肿发生的关键',
              text:'肾者，牝脏也，地气上者属于肾，而生水液也，故曰至阴。' },
            { part:'素问', article:'调经论篇第六十二', title:'五脏为生命核心及守经隧可治百病',
              text:'五脏之道，皆出于经隧，以行血气，血气不和，百病乃变化而生，是故守经隧焉。' },
            { part:'素问', article:'调经论篇第六十二', title:'从经脉气血输布失调论虚实',
              text:'气血以并，阴阳相倾，气乱于卫，血逆于经，血气离居，一实一虚。' },
            { part:'素问', article:'调经论篇第六十二', title:'邪或生于阴或生于阳——外感与内伤的基础',
              text:'夫邪之生也，或生于阴，或生于阳。其生于阳者，得之风雨寒暑；其生于阴者，得之饮食居处，阴阳喜怒。' },
            { part:'素问', article:'六微旨大论篇第六十八', title:'亢害承制理论',
              text:'亢则害，承乃制，制则生化，外列盛衰，害则败乱，生化大病。' },
            { part:'素问', article:'六微旨大论篇第六十八', title:'升降出入是气的基本运动方式',
              text:'出入废则神机化灭，升降息则气立孤危。故非出入，则无以生长壮老已；非升降，则无以生长化收藏。' },
            { part:'素问', article:'五常政大论篇第七十', title:'化不可代，时不可违',
              text:'化不可代，时不可违……无代化，无违时，必养必和，待其来复。' },
            { part:'素问', article:'六元正纪大论篇第七十一', title:'用寒远寒、用热远热的因时而治原则',
              text:'用寒远寒，用凉远凉，用温远温，用热远热，食宜同法，有假者反常，反是者病。' },
            { part:'素问', article:'至真要大论篇第七十四', title:'协调阴阳为治疗之大法',
              text:'谨察阴阳所在而调之，以平为期。' },
            { part:'素问', article:'至真要大论篇第七十四', title:'病机的概念及审查病机的重要性',
              text:'审察病机，无失气宜。' },
            { part:'素问', article:'至真要大论篇第七十四', title:'病机十九条',
              text:'诸风掉眩，皆属于肝。诸寒收引，皆属于肾。诸气膹郁，皆属于肺。诸湿肿满，皆属于脾。诸热瞀瘛，皆属于火。诸痛痒疮，皆属于心。诸厥固泄，皆属于下。诸痿喘呕，皆属于上。诸禁鼓栗，如丧神守，皆属于火。诸痉项强，皆属于湿。诸逆冲上，皆属于火。诸胀腹大，皆属于热。诸躁狂越，皆属于火。诸暴强直，皆属于风。诸病有声，鼓之如鼓，皆属于热。诸病胕肿，疼酸惊骇，皆属于火。诸转反戾，水液浑浊，皆属于热。诸病水液，澄澈清冷，皆属于寒。诸呕吐酸，暴注下迫，皆属于热。' },
            { part:'素问', article:'至真要大论篇第七十四', title:'审查病机的原则和方法',
              text:'谨守病机，各司其属，有者求之，无者求之，盛者责之，虚者责之。' },
            { part:'素问', article:'至真要大论篇第七十四', title:'正治法的使用原则及具体举例',
              text:'寒者热之，热者寒之，微者逆之，甚者从之。' },
            { part:'素问', article:'至真要大论篇第七十四', title:'反治法的使用原则及具体举例',
              text:'热因寒用，寒因热用，塞因塞用，通因通用。' },
            { part:'素问', article:'至真要大论篇第七十四', title:'阴阳虚衰所致虚寒虚热的治则',
              text:'诸寒之而热者取之阴，热之而寒者取之阳。' },
            /* ---- 灵枢 ---- */
            { part:'灵枢', article:'本输第二', title:'脏腑相合理论及三焦孤之腑的命名',
              text:'肺合大肠……心合小肠……肝合胆……脾合胃……肾合膀胱……三焦者，中渎之腑也，水道出焉，属膀胱，是孤之腑也。' },
            { part:'灵枢', article:'本神第八', title:'神的概念、生成、分类及认知思维过程',
              text:'故生之来谓之精，两精相搏谓之神，随神往来者谓之魂，并精而出入者谓之魄，所以任物者谓之心，心有所忆谓之意，意之所存谓之志，因志而存变谓之思，因思而远慕谓之虑，因虑而处物谓之智。' },
            { part:'灵枢', article:'本神第八', title:'智者达到长生久视的养生方法',
              text:'故智者之养生也，必顺四时而适寒暑，和喜怒而安居处，节阴阳而调刚柔，如是则僻邪不至，长生久视。' },
            { part:'灵枢', article:'本神第八', title:'五脏藏五神及虚实病证特点',
              text:'肝藏血，血舍魂，肝气虚则恐，实则怒。脾藏营，营舍意，脾气虚则四肢不用，五脏不安，实则腹胀，泾溲不利。心藏脉，脉舍神，心气虚则悲，实则笑不休。肺藏气，气舍魄，肺气虚则鼻塞不利，少气，实则喘喝，胸盈仰息。肾藏精，精舍志，肾气虚则厥，实则胀，五脏不安。' },
            { part:'灵枢', article:'营卫生会第十八', title:'营卫的生成、运行及功能特点',
              text:'人受气于谷，谷入于胃，以传与肺，五脏六腑皆以受气，其清者为营，浊者为卫，营在脉中，卫在脉外。' },
            { part:'灵枢', article:'营卫生会第十八', title:'上中下三焦之气的功能特点',
              text:'上焦如雾，中焦如沤，下焦如渎。' },
            { part:'灵枢', article:'决气第三十', title:'六气的概念、生成、分布与功能',
              text:'两神相搏，合而成形，常先身生，是谓精。上焦开发，宣五谷味，熏肤充身泽毛，若雾露之溉，是谓气。腠理发泄，汗出溱溱，是谓津。谷入气满，淖泽注于骨，骨属屈伸，泄泽补益脑髓，皮肤润泽，是谓液。中焦受气取汁，变化而赤，是谓血。壅遏营气，令无所避，是谓脉。' },
            { part:'灵枢', article:'决气第三十', title:'六气不足的临床表现',
              text:'精脱者，耳聋；气脱者，目不明；津脱者，腠理开，汗大泄；液脱者，骨属屈伸不利，色夭，脑髓消，胫酸，耳数鸣；血脱者，色白，夭然不泽，其脉空虚。' },
            { part:'灵枢', article:'决气第三十', title:'五谷与胃为大海的内涵及后天水谷的作用',
              text:'胃者，五脏六腑之海也，水谷皆入于胃，五脏六腑皆禀气于胃。' },
            { part:'灵枢', article:'本脏第四十七', title:'血气精神、经脉、卫气、志意及脏腑的功能',
              text:'人之血气精神者，所以奉生而周于性命者也。经脉者，所以行血气而营阴阳，濡筋骨，利关节者也。卫气者，所以温分肉，充皮肤，肥腠理，司开阖者也。志意者，所以御精神，收魂魄，适寒温，和喜怒者也。' },
            { part:'灵枢', article:'本脏第四十七', title:'观察色泽变化测知病变浅深轻重与预后',
              text:'五色各见其部，察其浮沉，以知浅深；察其泽夭，以观成败；察其散抟，以知远近；视色上下，以知病处。' },
            { part:'灵枢', article:'天年第五十四', title:'以母为基、以父为楯的含义及神的作用',
              text:'以母为基，以父为楯，失神者死，得神者生也。' },
            { part:'灵枢', article:'百病始生第六十六', title:'风雨寒暑清湿喜怒三部之气所伤人体之理',
              text:'喜怒不节则伤脏，风雨则伤上，清湿则伤下。三部之气，所伤异类。' },
            { part:'灵枢', article:'百病始生第六十六', title:'两虚相得乃客其形的发病观',
              text:'两虚相得，乃客其形，两实相逢，众人肉坚。' },
            { part:'灵枢', article:'百病始生第六十六', title:'内外合邪伤及五脏，病起于阴',
              text:'卒然外中于寒，若内伤于忧愁，则气上逆，气上逆则六输不通，温气不行，凝血蕴里而不散，津液涩渗，著而不去，而积皆成矣。' },
            { part:'灵枢', article:'刺节真邪第七十五', title:'真气本于先天元气，受后天水谷之气滋养',
              text:'真气者，所受于天，与谷气并而充身者也。' },
            { part:'灵枢', article:'大惑论第八十', title:'目与五脏精气的关系及目分五部与五脏相关',
              text:'五脏六腑之精气，皆上注于目而为之精。精之窠为眼，骨之精为瞳子，筋之精为黑眼，血之精为络，其窠气之精为白眼，肌肉之精为约束。' }
          ]
        },

        /* ---------------------------------------------------- 伤寒论 */
        {
          id: 'sh', name: '伤寒论', icon: '📜',
          passages: [
            { part:'太阳病', article:'辨太阳病脉证并治', title:'太阳病提纲', text:'太阳之为病，脉浮，头项强痛而恶寒。' },
            { part:'太阳病', article:'辨太阳病脉证并治', title:'太阳中风证的脉症特点', text:'太阳病，发热，汗出，恶风，脉缓者，名为中风。' },
            { part:'太阳病', article:'辨太阳病脉证并治', title:'太阳伤寒证的脉症特点', text:'太阳病，或已发热，或未发热，必恶寒，体痛，呕逆，脉阴阳俱紧者，名为伤寒。' },
            { part:'太阳病', article:'辨太阳病脉证并治', title:'太阳温病的脉症特点', text:'太阳病，发热而渴，不恶寒者，为温病。' },
            { part:'太阳病', article:'辨太阳病脉证并治', title:'外感病初起分辨阴阳的要点', text:'病有发热恶寒者，发于阳也；无热恶寒者，发于阴也。' },
            { part:'太阳病', article:'辨太阳病脉证并治', title:'寒热真假的辨证', text:'病人身大热，反欲得衣者，热在皮肤，寒在骨髓也；身大寒，反不欲近衣者，寒在皮肤，热在骨髓也。' },
            { part:'太阳病', article:'辨太阳病脉证并治', title:'太阳中风表虚证的病因病机及证治', text:'太阳中风，阳浮而阴弱。阳浮者，热自发；阴弱者，汗自出。啬啬恶寒，淅淅恶风，翕翕发热，鼻鸣干呕者，桂枝汤主之。' },
            { part:'太阳病', article:'辨太阳病脉证并治', title:'太阳中风兼经气不利的证治', text:'太阳病，项背强几几，反汗出恶风者，桂枝加葛根汤主之。' },
            { part:'太阳病', article:'辨太阳病脉证并治', title:'太阳病坏病治则及桂枝汤禁用指征', text:'太阳病三日，已发汗，若吐、若下、若温针，仍不解者，此为坏病，桂枝不中与之也。观其脉证，知犯何逆，随证治之。' },
            { part:'太阳病', article:'辨太阳病脉证并治', title:'外感风寒引发宿喘的证治', text:'喘家，作桂枝汤，加厚朴杏子佳。' },
            { part:'太阳病', article:'辨太阳病脉证并治', title:'太阳病过汗漏汗不止的证治', text:'太阳病，发汗，遂漏不止，其人恶风，小便难，四肢微急，难以屈伸者，桂枝加附子汤主之。' },
            { part:'太阳病', article:'辨太阳病脉证并治', title:'表证误下兼胸阳不振、不足的证治', text:'太阳病，下之后，脉促胸满者，桂枝去芍药汤主之。若微寒者，桂枝去芍药加附子汤主之。' },
            { part:'太阳病', article:'辨太阳病脉证并治', title:'太阳病脾虚水停疑似证的证治', text:'服桂枝汤，或下之，仍头项强痛，翕翕发热，无汗，心下满微痛，小便不利者，桂枝去桂加茯苓白术汤主之。' },
            { part:'太阳病', article:'辨太阳病脉证并治', title:'太阳伤寒兼经脉不利的证治', text:'太阳病，项背强几几，无汗恶风，葛根汤主之。' },
            { part:'太阳病', article:'辨太阳病脉证并治', title:'太阳与阳明合病下利的证治', text:'太阳与阳明合病者，必自下利，葛根汤主之。' },
            { part:'太阳病', article:'辨太阳病脉证并治', title:'太阳病误下后表未解兼里热下利的证治', text:'太阳病，桂枝证，医反下之，利遂不止，脉促者，表未解也；喘而汗出者，葛根黄芩黄连汤主之。' },
            { part:'太阳病', article:'辨太阳病脉证并治', title:'太阳伤寒表实证的证治', text:'太阳病，头痛发热，身疼腰痛，骨节疼痛，恶风无汗而喘者，麻黄汤主之。' },
            { part:'太阳病', article:'辨太阳病脉证并治', title:'太阳伤寒兼内热烦躁的证治及禁忌', text:'太阳中风，脉浮紧，发热恶寒，身疼痛，不汗出而烦躁者，大青龙汤主之。若脉微弱，汗出恶风者，不可服之。' },
            { part:'太阳病', article:'辨太阳病脉证并治', title:'太阳伤寒兼水停心下的证治', text:'伤寒表不解，心下有水气，干呕发热而咳，或渴，或利，或噎，或小便不利少腹满，或喘者，小青龙汤主之。' },
            { part:'太阳病', article:'辨太阳病脉证并治', title:'太阳病误下表不解兼肺气不利的证治', text:'太阳病，下之微喘者，表未解故也，桂枝加厚朴杏子汤主之。' },
            { part:'太阳病', article:'辨太阳病脉证并治', title:'病常自汗出的证治', text:'病常自汗出，此为荣气和。荣气和者，外不谐，以卫气不共荣气和谐故尔。以荣行脉中，卫行脉外，复发其汗，荣卫和则愈，宜桂枝汤。' },
            { part:'太阳病', article:'辨太阳病脉证并治', title:'时发热自汗出的证治', text:'病人脏无他病，时发热自汗出而不愈者，此卫气不和也。先其时发汗则愈，宜桂枝汤。' },
            { part:'太阳病', article:'辨太阳病脉证并治', title:'阴阳自和为疾病自愈的基础', text:'凡病，若发汗、若吐、若下、若亡血、亡津液，阴阳自和者，必自愈。' },
            { part:'太阳病', article:'辨太阳病脉证并治', title:'肾阳虚烦躁的证治', text:'下之后，复发汗，昼日烦躁不得眠，夜而安静，不呕不渴，无表证，脉沉微，身无大热者，干姜附子汤主之。' },
            { part:'太阳病', article:'辨太阳病脉证并治', title:'太阳病过汗致气阴不足身疼痛的证治', text:'发汗后，身疼痛，脉沉迟者，桂枝加芍药生姜各一两人参三两新加汤主之。' },
            { part:'太阳病', article:'辨太阳病脉证并治', title:'汗后邪热壅肺的证治', text:'发汗后，不可更行桂枝汤，汗出而喘，无大热者，可与麻黄杏仁甘草石膏汤。' },
            { part:'太阳病', article:'辨太阳病脉证并治', title:'发汗过多心阳虚心悸的证治', text:'发汗过多，其人叉手自冒心，心下悸，欲得按者，桂枝甘草汤主之。' },
            { part:'太阳病', article:'辨太阳病脉证并治', title:'心阳虚欲作奔豚的证治', text:'发汗后，其人脐下悸者，欲作奔豚，茯苓桂枝甘草大枣汤主之。' },
            { part:'太阳病', article:'辨太阳病脉证并治', title:'脾虚气滞腹胀的证治', text:'发汗后，腹胀满者，厚朴生姜半夏甘草人参汤主之。' },
            { part:'太阳病', article:'辨太阳病脉证并治', title:'脾虚水气上冲的证治及禁忌', text:'伤寒，若吐若下后，心下逆满，气上冲胸，起则头眩，脉沉紧，发汗则动经，身为振振摇者，茯苓桂枝白术甘草汤主之。' },
            { part:'太阳病', article:'辨太阳病脉证并治', title:'发汗后胃津不足与太阳蓄水证的证治', text:'太阳病，发汗后，大汗出，胃中干，烦躁不得眠，欲得饮水者，少少与饮之，令胃气和则愈。若脉浮，小便不利，微热消渴者，五苓散主之。' },
            { part:'太阳病', article:'辨太阳病脉证并治', title:'热扰胸膈的证治', text:'发汗吐下后，虚烦不得眠，若剧者，必反复颠倒，心中懊憹，栀子豉汤主之。' },
            { part:'太阳病', article:'辨太阳病脉证并治', title:'太阳病汗不得法肾阳虚水泛的证治', text:'太阳病发汗，汗出不解，其人仍发热，心下悸，头眩，身瞤动，振振欲擗地者，真武汤主之。' },
            { part:'太阳病', article:'辨太阳病脉证并治', title:'伤寒误下后表里先后缓急的治法', text:'伤寒，医下之，续得下利清谷不止，身疼痛者，急当救里；后身疼痛，清便自调者，急当救表。救里宜四逆汤，救表宜桂枝汤。' },
            { part:'太阳病', article:'辨太阳病脉证并治', title:'少阳病的证治（小柴胡汤）', text:'伤寒五六日，中风，往来寒热，胸胁苦满，嘿嘿不欲饮食，心烦喜呕，或胸中烦而不呕，或渴，或腹中痛，或胁下痞硬，或心下悸小便不利，或不渴身有微热，或咳者，小柴胡汤主之。' },
            { part:'太阳病', article:'辨太阳病脉证并治', title:'少阳兼里虚寒腹痛的证治', text:'伤寒，阳脉涩，阴脉弦，法当腹中急痛，先与小建中汤，不差者，小柴胡汤主之。' },
            { part:'太阳病', article:'辨太阳病脉证并治', title:'小柴胡汤的运用原则', text:'伤寒中风，有柴胡证，但见一证便是，不必悉具。凡柴胡汤病证而下之，若柴胡证不罢者，复与柴胡汤，必蒸蒸而振，却发热汗出而解。' },
            { part:'太阳病', article:'辨太阳病脉证并治', title:'太阳病邪传少阳兼阳明燥结的证治', text:'太阳病，过经十余日，反二三下之，后四五日，柴胡证仍在者，先与小柴胡汤。呕不止，心下急，郁郁微烦者，为未解也，与大柴胡汤下之则愈。' },
            { part:'太阳病', article:'辨太阳病脉证并治', title:'太阳蓄血轻证的证治及治禁', text:'太阳病不解，热结膀胱，其人如狂，血自下，下者愈。其外不解者，尚未可攻，当先解其外。外解已，但少腹急结者，乃可攻之，宜桃核承气汤。' },
            { part:'太阳病', article:'辨太阳病脉证并治', title:'少阳邪气弥漫烦惊谵语的证治', text:'伤寒八九日，下之，胸满烦惊，小便不利，谵语，一身尽重，不可转侧者，柴胡加龙骨牡蛎汤主之。' },
            { part:'太阳病', article:'辨太阳病脉证并治', title:'心阳虚奔豚的证治', text:'烧针令其汗，针处被寒，核起而赤者，必发奔豚。气从少腹上冲心者，灸其核上各一壮，与桂枝加桂汤，更加桂二两也。' },
            { part:'太阳病', article:'辨太阳病脉证并治', title:'大结胸证的主要脉症', text:'伤寒六七日，结胸热实，脉沉而紧，心下痛，按之石硬者，大陷胸汤主之。' },
            { part:'太阳病', article:'辨太阳病脉证并治', title:'小结胸病的证治', text:'小结胸病，正在心下，按之则痛，脉浮滑者，小陷胸汤主之。' },
            { part:'太阳病', article:'辨太阳病脉证并治', title:'少阳兼太阳表证的证治', text:'伤寒六七日，发热微恶寒，支节烦疼，微呕，心下支结，外证未去者，柴胡桂枝汤主之。' },
            { part:'太阳病', article:'辨太阳病脉证并治', title:'少阳病兼水饮内结的证治', text:'伤寒五六日，已发汗而复下之，胸胁满微结，小便不利，渴而不呕，但头汗出，往来寒热，心烦者，此为未解也，柴胡桂枝干姜汤主之。' },
            { part:'太阳病', article:'辨太阳病脉证并治', title:'小柴胡汤证误下后的三种转归及治疗', text:'伤寒五六日，呕而发热者，柴胡汤证具，而以他药下之，柴胡证仍在者，复与柴胡汤。此虽已下之，不为逆，必蒸蒸而振，却发热汗出而解。若心下满而硬痛者，此为结胸也，大陷胸汤主之。但满而不痛者，此为痞，柴胡不中与之，宜半夏泻心汤。' },
            { part:'太阳病', article:'辨太阳病脉证并治', title:'热痞的证治', text:'心下痞，按之濡，其脉关上浮者，大黄黄连泻心汤主之。' },
            { part:'太阳病', article:'辨太阳病脉证并治', title:'胃虚水停气机痞塞的证治', text:'伤寒汗出，解之后，胃中不和，心下痞硬，干噫食臭，胁下有水气，腹中雷鸣下利者，生姜泻心汤主之。' },
            { part:'太阳病', article:'辨太阳病脉证并治', title:'脾胃气虚痞利俱甚的证治', text:'伤寒中风，医反下之，其人下利日数十行，谷不化，腹中雷鸣，心下痞硬而满，干呕心烦不得安，医见心下痞，谓病不尽，复下之，其痞益甚，此非结热，但以胃中虚，客气上逆，故使硬也，甘草泻心汤主之。' },
            { part:'太阳病', article:'辨太阳病脉证并治', title:'痰气痞的证治', text:'伤寒发汗，若吐若下，解后，心下痞硬，噫气不除者，旋覆代赭汤主之。' },
            { part:'太阳病', article:'辨太阳病脉证并治', title:'脾虚寒痞兼表证的证治', text:'太阳病，外证未除，而数下之，遂协热而利，利下不止，心下痞硬，表里不解者，桂枝人参汤主之。' },
            { part:'太阳病', article:'辨太阳病脉证并治', title:'伤寒吐下后热结里热盛津伤的证治', text:'伤寒若吐若下后，七八日不解，热结在里，表里俱热，时时恶风，大渴，舌上干燥而烦，欲饮水数升者，白虎加人参汤主之。' },
            { part:'太阳病', article:'辨太阳病脉证并治', title:'太少合病下利或呕的证治', text:'太阳与少阳合病，自下利者，与黄芩汤；若呕者，黄芩加半夏生姜汤主之。' },
            { part:'太阳病', article:'辨太阳病脉证并治', title:'上热下寒腹痛欲呕的证治', text:'伤寒胸中有热，胃中有邪气，腹中痛，欲呕吐者，黄连汤主之。' },
            { part:'太阳病', article:'辨太阳病脉证并治', title:'心阴阳两虚的证治', text:'伤寒脉结代，心动悸，炙甘草汤主之。' },

            { part:'阳明病', article:'辨阳明病脉证并治', title:'阳明病提纲', text:'阳明之为病，胃家实是也。' },
            { part:'阳明病', article:'辨阳明病脉证并治', title:'阳明病外证', text:'问曰：阳明病外证云何？答曰：身热，汗自出，不恶寒，反恶热也。' },
            { part:'阳明病', article:'辨阳明病脉证并治', title:'阳明病可攻与不可攻及大小承气汤证治要点', text:'阳明病，脉迟，虽汗出不恶寒者，其身必重，短气腹满而喘，有潮热者，此外欲解，可攻里也。手足濈然汗出者，此大便已硬也，大承气汤主之；若汗多，微发热恶寒者，外未解也，其热不潮，未可与承气汤；若腹大满不通者，可与小承气汤，微和胃气，勿令至大泄下。' },
            { part:'阳明病', article:'辨阳明病脉证并治', title:'阳明病汗多津伤、便硬谵语的证治', text:'阳明病，其人多汗，以津液外出，胃中燥，大便必硬，硬则谵语，小承气汤主之。' },
            { part:'阳明病', article:'辨阳明病脉证并治', title:'三阳合病邪热偏阳明的证治及禁例', text:'三阳合病，腹满身重，难以转侧，口不仁，面垢，谵语遗尿。发汗则谵语。下之则额上生汗，手足逆冷。若自汗出者，白虎汤主之。' },
            { part:'阳明病', article:'辨阳明病脉证并治', title:'阳明热证误治后津伤水热互结的证治', text:'若脉浮发热，渴欲饮水，小便不利者，猪苓汤主之。' },
            { part:'阳明病', article:'辨阳明病脉证并治', title:'阳明病柴胡汤证未罢的治法及机理', text:'阳明病，胁下硬满，不大便而呕，舌上白苔者，可与小柴胡汤。上焦得通，津液得下，胃气因和，身濈然汗出而解。' },
            { part:'阳明病', article:'辨阳明病脉证并治', title:'阳明湿热蕴结发黄的证治', text:'阳明病，发热汗出者，此为热越，不能发黄也。但头汗出，身无汗，剂颈而还，小便不利，渴饮水浆者，此为瘀热在里，身必发黄，茵陈蒿汤主之。' },
            { part:'阳明病', article:'辨阳明病脉证并治', title:'阳明蓄血的证治', text:'阳明证，其人喜忘者，必有蓄血。所以然者，本有久瘀血，故令喜忘。屎虽硬，大便反易，其色必黑者，宜抵当汤下之。' },
            { part:'阳明病', article:'辨阳明病脉证并治', title:'阳明中寒欲呕的证治及与上焦有热的鉴别', text:'食谷欲呕，属阳明也，吴茱萸汤主之。得汤反剧者，属上焦也。' },
            { part:'阳明病', article:'辨阳明病脉证并治', title:'脾约的证治', text:'趺阳脉浮而涩，浮则胃气强，涩则小便数，浮涩相搏，大便则硬，其脾为约，麻子仁丸主之。' },
            { part:'阳明病', article:'辨阳明病脉证并治', title:'阳明病蒸蒸发热的证治', text:'太阳病三日，发汗不解，蒸蒸发热者，属胃也，调胃承气汤主之。' },
            { part:'阳明病', article:'辨阳明病脉证并治', title:'阳明湿热发黄兼表的证治', text:'伤寒瘀热在里，身必黄，麻黄连轺赤小豆汤主之。' },

            { part:'少阳病', article:'辨少阳病脉证并治', title:'少阳病辨证提纲', text:'少阳之为病，口苦，咽干，目眩也。' },

            { part:'太阴病', article:'辨太阴病脉证并治', title:'太阴病提纲及误下变证', text:'太阴之为病，腹满而吐，食不下，自利益甚，时腹自痛。若下之，必胸下结硬。' },
            { part:'太阴病', article:'辨太阴病脉证并治', title:'太阴病主证、病机和治则', text:'自利不渴者，属太阴，以其脏有寒故也，当温之，宜服四逆辈。' },
            { part:'太阴病', article:'辨太阴病脉证并治', title:'太阳病误下邪陷太阴的证治', text:'本太阳病，医反下之，因而腹满时痛者，属太阴也，桂枝加芍药汤主之；大实痛者，桂枝加大黄汤主之。' },

            { part:'少阴病', article:'辨少阴病脉证并治', title:'少阴病辨证提纲', text:'少阴之为病，脉微细，但欲寐也。' },
            { part:'少阴病', article:'辨少阴病脉证并治', title:'少阴寒化的病机及辨证要点', text:'少阴病，欲吐不吐，心烦，但欲寐，五六日自利而渴者，属少阴也，虚故引水自救。若小便色白者，少阴病形悉具。小便白者，以下焦虚有寒，不能制水，故令色白也。' },
            { part:'少阴病', article:'辨少阴病脉证并治', title:'少阴兼表的证治', text:'少阴病，始得之，反发热，脉沉者，麻黄细辛附子汤主之。' },
            { part:'少阴病', article:'辨少阴病脉证并治', title:'少阴阴虚火旺的证治', text:'少阴病，得之二三日以上，心中烦，不得卧，黄连阿胶汤主之。' },
            { part:'少阴病', article:'辨少阴病脉证并治', title:'阳虚寒湿身痛证的脉症', text:'少阴病，身体痛，手足寒，骨节痛，脉沉者，附子汤主之。' },
            { part:'少阴病', article:'辨少阴病脉证并治', title:'虚寒下利便脓血的证治', text:'少阴病，下利便脓血者，桃花汤主之。' },
            { part:'少阴病', article:'辨少阴病脉证并治', title:'少阴阳虚水泛的证治', text:'少阴病，二三日不已，至四五日，腹痛，小便不利，四肢沉重疼痛，自下利者，此为有水气，其人或咳，或小便利，或下利，或呕者，真武汤主之。' },
            { part:'少阴病', article:'辨少阴病脉证并治', title:'少阴阳郁致厥的证治', text:'少阴病，四逆，其人或咳，或悸，或小便不利，或腹中痛，或泄利下重者，四逆散主之。' },
            { part:'少阴病', article:'辨少阴病脉证并治', title:'阴虚水热互结的证治', text:'少阴病，下利六七日，咳而呕渴，心烦不得眠者，猪苓汤主之。' },

            { part:'厥阴病', article:'辨厥阴病脉证并治', title:'厥阴病辨证提纲', text:'厥阴之为病，消渴，气上撞心，心中疼热，饥而不欲食，食则吐蛔，下之利不止。' },
            { part:'厥阴病', article:'辨厥阴病脉证并治', title:'厥的病机与特征', text:'凡厥者，阴阳气不相顺接，便为厥。厥者，手足逆冷者是也。' },
            { part:'厥阴病', article:'辨厥阴病脉证并治', title:'蛔厥的证治及与脏厥的鉴别', text:'伤寒脉微而厥，至七八日，肤冷，其人躁无暂安时者，此为脏厥，非蛔厥也。蛔厥者，其人当吐蛔。今病者静，而复时烦者，此为脏寒。蛔上入其膈，故烦，须臾复止，得食而呕，又烦者，蛔闻食臭出，其人常自吐蛔。蛔厥者，乌梅丸主之。又主久利。' },
            { part:'厥阴病', article:'辨厥阴病脉证并治', title:'无形热郁致厥的证治', text:'伤寒脉滑而厥者，里有热，白虎汤主之。' },
            { part:'厥阴病', article:'辨厥阴病脉证并治', title:'血虚寒凝致厥的证治', text:'手足厥寒，脉细欲绝者，当归四逆汤主之。' },
            { part:'厥阴病', article:'辨厥阴病脉证并治', title:'厥阴热利的证治', text:'热利下重者，白头翁汤主之。' },
            { part:'厥阴病', article:'辨厥阴病脉证并治', title:'肝寒犯胃浊阴上逆的证治', text:'干呕，吐涎沫，头痛者，吴茱萸汤主之。' },
            { part:'厥阴病', article:'辨厥阴病脉证并治', title:'厥阴病转出少阳的证治', text:'呕而发热者，小柴胡汤主之。' },

            { part:'霍乱', article:'辨霍乱病脉证并治', title:'霍乱表里同病的辨治', text:'霍乱，头痛发热，身疼痛，热多欲饮水者，五苓散主之；寒多不用水者，理中丸主之。' },
            { part:'霍乱', article:'辨阴阳易差后劳复病脉证并治', title:'热病后期气阴两伤、余热未清的证治', text:'伤寒解后，虚羸少气，气逆欲吐，竹叶石膏汤主之。' }

        /* ---------------------------------------------------- 金匮要略 */
        {
          id: 'jg', name: '金匮要略', icon: '🏛️',
          passages: [
            { part:'脏腑经络先后病脉证第一', article:'脏腑经络先后病脉证第一', title:'治未病', text:'夫治未病者，见肝之病，知肝传脾，当先实脾，四季脾旺不受邪，即勿补之。中工不晓相传，见肝之病，不解实脾，惟治肝也。夫肝之病，补用酸，助用焦苦，益用甘味之药调之。……肝虚则用此法，实则不在用之。' },
            { part:'脏腑经络先后病脉证第一', article:'脏腑经络先后病脉证第一', title:'缓急治则、先后治则', text:'问曰：病有急当救里救表者，何谓也？师曰：病，医下之，续得下利清谷不止，身体疼痛者，急当救里；后身体疼痛，清便自调者，急当救表也。' },
            { part:'痉湿暍病脉证治第二', article:'痉湿暍病脉证治第二', title:'痉病的分类', text:'太阳病，发热无汗，反恶寒者，名曰刚痉。太阳病，发热汗出，而不恶寒，名曰柔痉。' },
            { part:'痉湿暍病脉证治第二', article:'痉湿暍病脉证治第二', title:'痉病的证治', text:'太阳病，其证备，身体强，几几然，脉反沉迟，此为痉，栝楼桂枝汤主之。' },
            { part:'痉湿暍病脉证治第二', article:'痉湿暍病脉证治第二', title:'湿病的治则', text:'风湿相搏，一身尽疼痛，法当汗出而解，值天阴雨不止，医云此可发汗，汗之病不愈者，何也？盖发其汗，汗大出者，但风气去，湿气在，是故不愈也。若治风湿者，发其汗，但微微似欲出汗者，风湿俱去也。' },
            { part:'痉湿暍病脉证治第二', article:'痉湿暍病脉证治第二', title:'风湿表虚的证治', text:'风湿脉浮身重，汗出恶风者，防己黄芪汤主之。' },
            { part:'痉湿暍病脉证治第二', article:'痉湿暍病脉证治第二', title:'风湿表阳虚的证治', text:'风湿相搏，骨节疼烦，掣痛不得屈伸，近之则痛剧，汗出短气，小便不利，恶风不欲去衣，或身微肿者，甘草附子汤主之。' },
            { part:'百合狐惑阴阳毒病脉证治第三', article:'百合狐惑阴阳毒病脉证治第三', title:'百合病的脉症', text:'百合病者，百脉一宗，悉致其病也。意欲食复不能食，常默默，欲卧不能卧，欲行不能行，饮食或有美时，或有不用闻食臭时，如寒无寒，如热无热，口苦，小便赤，诸药不能治，得药则剧吐利，如有神灵者，身形如和，其脉微数。' },
            { part:'百合狐惑阴阳毒病脉证治第三', article:'百合狐惑阴阳毒病脉证治第三', title:'百合病正治', text:'百合病，不经吐下发汗，病形如初者，百合地黄汤主之。' },
            { part:'百合狐惑阴阳毒病脉证治第三', article:'百合狐惑阴阳毒病脉证治第三', title:'狐惑病脓未成的证治', text:'狐惑之为病，状如伤寒，默默欲眠，目不得闭，卧起不安，蚀于喉为惑，蚀于阴为狐，不欲饮食，恶闻食臭，其面目乍赤、乍黑、乍白，蚀于上部则声喝，甘草泻心汤主之。' },
            { part:'疟病脉证并治第四', article:'疟病脉证并治第四', title:'疟病脉症与正治', text:'师曰：疟脉自弦，弦数者多热，弦迟者多寒。' },
            { part:'疟病脉证并治第四', article:'疟病脉证并治第四', title:'温疟的证治', text:'温疟者，其脉如平，身无寒但热，骨节疼烦，时呕，白虎加桂枝汤主之。' },
            { part:'中风历节病脉证并治第五', article:'中风历节病脉证并治第五', title:'中风在络、经、腑、脏的症状', text:'邪在于络，肌肤不仁；邪在于经，即重不胜；邪入于腑，即不识人；邪入于脏，舌即难言，口吐涎。' },
            { part:'中风历节病脉证并治第五', article:'中风历节病脉证并治第五', title:'风湿历节的证治', text:'诸肢节疼痛，身体魁羸，脚肿如脱，头眩短气，温温欲吐，桂枝芍药知母汤主之。' },
            { part:'血痹虚劳病脉证并治第六', article:'血痹虚劳病脉证并治第六', title:'血痹重证的证治', text:'血痹阴阳俱微，寸口关上微，尺中小紧，外证身体不仁，如风痹状，黄芪桂枝五物汤主之。' },
            { part:'血痹虚劳病脉证并治第六', article:'血痹虚劳病脉证并治第六', title:'虚劳的主脉', text:'夫男子平人，脉大为劳，极虚亦为劳。' },
            { part:'血痹虚劳病脉证并治第六', article:'血痹虚劳病脉证并治第六', title:'虚劳里急的证治（小建中汤）', text:'虚劳里急，悸，衄，腹中痛，梦失精，四肢酸疼，手足烦热，咽干口燥，小建中汤主之。' },
            { part:'血痹虚劳病脉证并治第六', article:'血痹虚劳病脉证并治第六', title:'虚劳腰痛的证治', text:'虚劳腰痛，少腹拘急，小便不利者，八味肾气丸主之。' },
            { part:'血痹虚劳病脉证并治第六', article:'血痹虚劳病脉证并治第六', title:'虚劳虚烦不得眠的证治', text:'虚劳虚烦不得眠，酸枣仁汤主之。' },
            { part:'血痹虚劳病脉证并治第六', article:'血痹虚劳病脉证并治第六', title:'虚劳干血的证治', text:'五劳虚极羸瘦，腹满不能饮食，食伤、忧伤、饮伤、房室伤、饥伤、劳伤、经络营卫气伤，内有干血，肌肤甲错，两目黯黑。缓中补虚，大黄䗪虫丸主之。' },
            { part:'肺痿肺痈咳嗽上气病脉证治第七', article:'肺痿肺痈咳嗽上气病脉证治第七', title:'肺痿的证治（甘草干姜汤）', text:'肺痿吐涎沫而不咳者，其人不渴，必遗尿，小便数，所以然者，以上虚不能制下故也。此为肺中冷，必眩，多涎唾，甘草干姜汤以温之。若服汤已渴者，属消渴。' },
            { part:'肺痿肺痈咳嗽上气病脉证治第七', article:'肺痿肺痈咳嗽上气病脉证治第七', title:'虚火咳逆的证治（麦门冬汤）', text:'大逆上气，咽喉不利，止逆下气者，麦门冬汤主之。' },
            { part:'肺痿肺痈咳嗽上气病脉证治第七', article:'肺痿肺痈咳嗽上气病脉证治第七', title:'寒饮咳喘的证治（射干麻黄汤）', text:'咳而上气，喉中水鸡声，射干麻黄汤主之。' },
            { part:'肺痿肺痈咳嗽上气病脉证治第七', article:'肺痿肺痈咳嗽上气病脉证治第七', title:'肺胀饮热的证治（越婢加半夏汤）', text:'咳而上气，此为肺胀，其人喘，目如脱状，脉浮大者，越婢加半夏汤主之。' },
            { part:'肺痿肺痈咳嗽上气病脉证治第七', article:'肺痿肺痈咳嗽上气病脉证治第七', title:'肺胀寒饮挟热的证治（小青龙加石膏汤）', text:'肺胀，咳而上气，烦躁而喘，脉浮者，心下有水，小青龙加石膏汤主之。' },
            { part:'肺痿肺痈咳嗽上气病脉证治第七', article:'肺痿肺痈咳嗽上气病脉证治第七', title:'肺痈的证治（苇茎汤）', text:'咳有微热，烦满，胸中甲错，是为肺痈，苇茎汤主之。' },
            { part:'奔豚气病脉证治第八', article:'奔豚气病脉证治第八', title:'奔豚气病的诊断', text:'奔豚病，从少腹起，上冲咽喉，发作欲死，复还止，皆从惊恐得之。' },
            { part:'奔豚气病脉证治第八', article:'奔豚气病脉证治第八', title:'奔豚汤的证治', text:'奔豚气上冲胸，腹痛，往来寒热，奔豚汤主之。' },
            { part:'胸痹心痛短气病脉证治第九', article:'胸痹心痛短气病脉证治第九', title:'胸痹、心痛的病机', text:'师曰：夫脉当取太过不及，阳微阴弦，即胸痹而痛，所以然者，责其极虚也。今阳虚知在上焦，所以胸痹心痛者，以其阴弦故也。' },
            { part:'胸痹心痛短气病脉证治第九', article:'胸痹心痛短气病脉证治第九', title:'胸痹主症的证治（栝楼薤白白酒汤）', text:'胸痹之病，喘息咳唾，胸背痛，短气，寸口脉沉而迟，关上小紧数，栝楼薤白白酒汤主之。' },
            { part:'胸痹心痛短气病脉证治第九', article:'胸痹心痛短气病脉证治第九', title:'胸痹不得卧的证治（栝楼薤白半夏汤）', text:'胸痹不得卧，心痛彻背者，栝楼薤白半夏汤主之。' },
            { part:'胸痹心痛短气病脉证治第九', article:'胸痹心痛短气病脉证治第九', title:'胸痹气结在胸的证治', text:'胸痹，心中痞气，气结在胸，胸满，胁下逆抢心，枳实薤白桂枝汤主之，人参汤亦主之。' },
            { part:'胸痹心痛短气病脉证治第九', article:'胸痹心痛短气病脉证治第九', title:'心痛的证治（乌头赤石脂丸）', text:'心痛彻背，背痛彻心，乌头赤石脂丸主之。' },
            { part:'腹满寒疝宿食病脉证治第十', article:'腹满寒疝宿食病脉证治第十', title:'腹满兼表的证治（厚朴七物汤）', text:'病腹满，发热十日，脉浮而数，饮食如故，厚朴七物汤主之。' },
            { part:'腹满寒疝宿食病脉证治第十', article:'腹满寒疝宿食病脉证治第十', title:'腹满里实的证治（大承气汤）', text:'腹满不减，减不足言，当须下之，宜大承气汤。' },
            { part:'腹满寒疝宿食病脉证治第十', article:'腹满寒疝宿食病脉证治第十', title:'中焦寒盛的大建中汤证', text:'心胸中大寒痛，呕不能饮食，腹中寒，上冲皮起，出见有头足，上下痛而不可触近，大建中汤主之。' },
            { part:'腹满寒疝宿食病脉证治第十', article:'腹满寒疝宿食病脉证治第十', title:'寒实内结的证治（大黄附子汤）', text:'胁下偏痛，发热，其脉紧弦，此寒也，以温药下之，宜大黄附子汤。' },
            { part:'腹满寒疝宿食病脉证治第十', article:'腹满寒疝宿食病脉证治第十', title:'寒疝的证治（当归生姜羊肉汤）', text:'寒疝腹中痛，及胁痛里急者，当归生姜羊肉汤主之。' },
            { part:'五脏风寒积聚病脉证并治第十一', article:'五脏风寒积聚病脉证并治第十一', title:'肝着的证治', text:'肝着，其人常欲蹈其胸上，先未苦时，但欲饮热，旋覆花汤主之。' },
            { part:'五脏风寒积聚病脉证并治第十一', article:'五脏风寒积聚病脉证并治第十一', title:'肾着的证治', text:'肾着之病，其人身体重，腰中冷，如坐水中，形如水状，反不渴，小便自利，饮食如故，病属下焦，身劳汗出，衣里冷湿，久久得之，腰以下冷痛，腹重如带五千钱，甘姜苓术汤主之。' },
            { part:'痰饮咳嗽病脉证并治第十二', article:'痰饮咳嗽病脉证并治第十二', title:'痰饮的分类', text:'夫饮有四，何谓也？师曰：有痰饮，有悬饮，有溢饮，有支饮。' },
            { part:'痰饮咳嗽病脉证并治第十二', article:'痰饮咳嗽病脉证并治第十二', title:'四饮的主症', text:'其人素盛今瘦，水走肠间，沥沥有声，谓之痰饮；饮后水流在胁下，咳唾引痛，谓之悬饮；饮水流行，归于四肢，当汗出而不汗出，身体疼重，谓之溢饮；咳逆倚息，短气不得卧，其形如肿，谓之支饮。' },
            { part:'痰饮咳嗽病脉证并治第十二', article:'痰饮咳嗽病脉证并治第十二', title:'痰饮的治则', text:'病痰饮者，当以温药和之。' },
            { part:'痰饮咳嗽病脉证并治第十二', article:'痰饮咳嗽病脉证并治第十二', title:'痰饮的证治（苓桂术甘汤）', text:'心下有痰饮，胸胁支满，目眩，苓桂术甘汤主之。' },
            { part:'痰饮咳嗽病脉证并治第十二', article:'痰饮咳嗽病脉证并治第十二', title:'悬饮的证治（十枣汤）', text:'脉沉而弦者，悬饮内痛，十枣汤主之。' },
            { part:'痰饮咳嗽病脉证并治第十二', article:'痰饮咳嗽病脉证并治第十二', title:'溢饮的证治', text:'病溢饮者，当发其汗，大青龙汤主之，小青龙汤亦主之。' },
            { part:'痰饮咳嗽病脉证并治第十二', article:'痰饮咳嗽病脉证并治第十二', title:'支饮的证治（木防己汤）', text:'膈间支饮，其人喘满，心下痞坚，面色黧黑，其脉沉紧，得之数十日，医吐下之不愈，木防己汤主之。' },
            { part:'痰饮咳嗽病脉证并治第十二', article:'痰饮咳嗽病脉证并治第十二', title:'支饮冒眩的证治（泽泻汤）', text:'心下有支饮，其人苦冒眩，泽泻汤主之。' },
            { part:'痰饮咳嗽病脉证并治第十二', article:'痰饮咳嗽病脉证并治第十二', title:'支饮胸满的证治（厚朴大黄汤）', text:'支饮胸满者，厚朴大黄汤主之。' },
            { part:'痰饮咳嗽病脉证并治第十二', article:'痰饮咳嗽病脉证并治第十二', title:'肠间有水气的证治（己椒苈黄丸）', text:'腹满，口舌干燥，此肠间有水气，己椒苈黄丸主之。' },
            { part:'消渴小便不利淋病脉证并治第十三', article:'消渴小便不利淋病脉证并治第十三', title:'消渴的证治（肾气丸）', text:'男子消渴，小便反多，以饮一斗，小便一斗，肾气丸主之。' },
            { part:'消渴小便不利淋病脉证并治第十三', article:'消渴小便不利淋病脉证并治第十三', title:'小便不利的证治（栝楼瞿麦丸）', text:'小便不利者，有水气，其人若渴，栝楼瞿麦丸主之。' },
            { part:'水气病脉证并治第十四', article:'水气病脉证并治第十四', title:'水气病的分类', text:'师曰：病有风水、有皮水、有正水、有石水、有黄汗。' },
            { part:'水气病脉证并治第十四', article:'水气病脉证并治第十四', title:'水气病的主脉与预后', text:'脉得诸沉，当责有水，身体肿重。' },
            { part:'水气病脉证并治第十四', article:'水气病脉证并治第十四', title:'水气病的治则', text:'诸有水者，腰以下肿，当利小便；腰以上肿，当发汗乃愈。' },
            { part:'水气病脉证并治第十四', article:'水气病脉证并治第十四', title:'风水的证治（防己黄芪汤）', text:'风水，脉浮身重，汗出恶风者，防己黄芪汤主之。' },
            { part:'水气病脉证并治第十四', article:'水气病脉证并治第十四', title:'风水挟热的证治（越婢汤）', text:'风水恶风，一身悉肿，脉浮不渴，续自汗出，无大热，越婢汤主之。' },
            { part:'水气病脉证并治第十四', article:'水气病脉证并治第十四', title:'皮水的证治（防己茯苓汤）', text:'皮水为病，四肢肿，水气在皮肤中，四肢聂聂动者，防己茯苓汤主之。' },
            { part:'水气病脉证并治第十四', article:'水气病脉证并治第十四', title:'里水的证治', text:'里水，越婢加术汤主之，甘草麻黄汤亦主之。' },
            { part:'水气病脉证并治第十四', article:'水气病脉证并治第十四', title:'正水的证治', text:'水之为病，其脉沉小，属少阴；浮者为风；无水虚胀者为气；水，发其汗即已。脉沉者宜麻黄附子汤；浮者，宜杏子汤。' },
            { part:'黄疸病脉证并治第十五', article:'黄疸病脉证并治第十五', title:'黄疸的病机', text:'寸口脉浮而缓，浮则为风，缓则为痹。痹非中风，四肢苦烦，脾色必黄，瘀热以行。' },
            { part:'黄疸病脉证并治第十五', article:'黄疸病脉证并治第十五', title:'黄疸的分类与脉症', text:'趺阳脉紧而数，数则为热，热则消谷；紧则为寒，食即为满。尺脉浮为伤肾，趺阳脉紧为伤脾。风寒相搏，食谷即眩，谷气不消，胃中苦浊，浊气下流，小便不通……身体尽黄，名曰谷疸。额上黑，微汗出，手足中热，薄暮即发，膀胱急，小便自利，名曰女劳疸。腹如水状，不治。心中懊憹而热，不能食，时欲吐，名曰酒疸。' },
            { part:'黄疸病脉证并治第十五', article:'黄疸病脉证并治第十五', title:'谷疸的证治（茵陈蒿汤）', text:'谷疸之为病，寒热不食，食即头眩，心胸不安，久久发黄为谷疸，茵陈蒿汤主之。' },
            { part:'黄疸病脉证并治第十五', article:'黄疸病脉证并治第十五', title:'酒疸的证治（栀子大黄汤）', text:'酒黄疸，心中懊憹，或热痛，栀子大黄汤主之。' },
            { part:'黄疸病脉证并治第十五', article:'黄疸病脉证并治第十五', title:'黄疸的治则', text:'诸病黄家，但利其小便。假令脉浮，当以汗解之，宜桂枝加黄芪汤主之。' },
            { part:'惊悸吐衄下血胸满瘀血病脉证治第十六', article:'惊悸吐衄下血胸满瘀血病脉证治第十六', title:'瘀血的脉症', text:'病人胸满，唇痿舌青，口燥，但欲漱水不欲咽，无寒热，脉微大来迟，腹不满，其人言我满，为有瘀血。' },
            { part:'惊悸吐衄下血胸满瘀血病脉证治第十六', article:'惊悸吐衄下血胸满瘀血病脉证治第十六', title:'惊悸的证治', text:'火邪者，桂枝去芍药加蜀漆牡蛎龙骨救逆汤主之。心下悸者，半夏麻黄丸主之。' },
            { part:'惊悸吐衄下血胸满瘀血病脉证治第十六', article:'惊悸吐衄下血胸满瘀血病脉证治第十六', title:'远血的证治（黄土汤）', text:'下血，先便后血，此远血也，黄土汤主之。' },
            { part:'惊悸吐衄下血胸满瘀血病脉证治第十六', article:'惊悸吐衄下血胸满瘀血病脉证治第十六', title:'近血的证治（赤小豆当归散）', text:'下血，先血后便，此近血也，赤小豆当归散主之。' },
            { part:'呕吐哕下利病脉证治第十七', article:'呕吐哕下利病脉证治第十七', title:'呕吐的证治（小半夏汤）', text:'诸呕吐，谷不得下者，小半夏汤主之。' },
            { part:'呕吐哕下利病脉证治第十七', article:'呕吐哕下利病脉证治第十七', title:'食已即吐的证治（大黄甘草汤）', text:'食已即吐者，大黄甘草汤主之。' },
            { part:'呕吐哕下利病脉证治第十七', article:'呕吐哕下利病脉证治第十七', title:'干呕吐逆的证治（半夏干姜散）', text:'干呕，吐逆，吐涎沫，半夏干姜散主之。' },
            { part:'呕吐哕下利病脉证治第十七', article:'呕吐哕下利病脉证治第十七', title:'寒饮内停的证治（生姜半夏汤）', text:'病人胸中似喘不喘，似呕不呕，似哕不哕，彻心中愦愦然无奈者，生姜半夏汤主之。' },
            { part:'呕吐哕下利病脉证治第十七', article:'呕吐哕下利病脉证治第十七', title:'胃反的证治（大半夏汤）', text:'胃反呕吐者，大半夏汤主之。' },
            { part:'呕吐哕下利病脉证治第十七', article:'呕吐哕下利病脉证治第十七', title:'哕逆的证治（橘皮竹茹汤）', text:'哕逆者，橘皮竹茹汤主之。' },
            { part:'疮痈肠痈浸淫病脉证并治第十八', article:'疮痈肠痈浸淫病脉证并治第十八', title:'肠痈脓未成的证治（大黄牡丹汤）', text:'肠痈者，少腹肿痞，按之即痛如淋，小便自调，时时发热，自汗出，复恶寒。其脉迟紧者，脓未成，可下之，当有血；脉洪数者，脓已成，不可下也，大黄牡丹汤主之。' },
            { part:'妇人妊娠病脉证并治第二十', article:'妇人妊娠病脉证并治第二十', title:'妇人癥病的证治（桂枝茯苓丸）', text:'妇人宿有癥病，经断未及三月，而得漏下不止，胎动在脐上者，为癥痼害。妊娠六月动者，前三月经水利时，胎也。下血者，后断三月衃也。所以血不止者，其癥不去故也，当下其癥，桂枝茯苓丸主之。' },
            { part:'妇人妊娠病脉证并治第二十', article:'妇人妊娠病脉证并治第二十', title:'胞阻的证治（胶艾汤）', text:'妇人有漏下者，有半产后因续下血都不绝者，有妊娠下血者，假令妊娠腹中痛，为胞阻，胶艾汤主之。' },
            { part:'妇人妊娠病脉证并治第二十', article:'妇人妊娠病脉证并治第二十', title:'妊娠腹痛的证治（当归芍药散）', text:'妇人怀妊，腹中㽲痛，当归芍药散主之。' },
            { part:'妇人妊娠病脉证并治第二十', article:'妇人妊娠病脉证并治第二十', title:'妊娠恶阻的证治（干姜人参半夏丸）', text:'妊娠呕吐不止，干姜人参半夏丸主之。' },
            { part:'妇人妊娠病脉证并治第二十', article:'妇人妊娠病脉证并治第二十', title:'妊娠小便难的证治（当归贝母苦参丸）', text:'妊娠小便难，饮食如故，当归贝母苦参丸主之。' },
            { part:'妇人妊娠病脉证并治第二十', article:'妇人妊娠病脉证并治第二十', title:'胎动不安的治法（当归散）', text:'妇人妊娠，宜常服当归散主之。' },
            { part:'妇人产后病脉证治第二十一', article:'妇人产后病脉证治第二十一', title:'产后三病的病因与病机', text:'新产妇人有三病，一者病痉，二者病郁冒，三者大便难，何谓也？师曰：新产血虚，多汗出，喜中风，故令病痉；亡血复汗，寒多，故令郁冒；亡津液，胃燥，故大便难。' },
            { part:'妇人产后病脉证治第二十一', article:'妇人产后病脉证治第二十一', title:'产后腹痛的证治（当归生姜羊肉汤）', text:'产后腹中㽲痛，当归生姜羊肉汤主之。' },
            { part:'妇人产后病脉证治第二十一', article:'妇人产后病脉证治第二十一', title:'产后腹痛烦满的证治（枳实芍药散）', text:'产后腹痛，烦满不得卧，枳实芍药散主之。' },
            { part:'妇人杂病脉证并治第二十二', article:'妇人杂病脉证并治第二十二', title:'妇人咽中如有炙脔的证治（半夏厚朴汤）', text:'妇人咽中如有炙脔，半夏厚朴汤主之。' },
            { part:'妇人杂病脉证并治第二十二', article:'妇人杂病脉证并治第二十二', title:'妇人脏躁的证治（甘麦大枣汤）', text:'妇人脏躁，喜悲伤欲哭，象如神灵所作，数欠伸，甘麦大枣汤主之。' },
            { part:'妇人杂病脉证并治第二十二', article:'妇人杂病脉证并治第二十二', title:'妇人陷经的证治（胶姜汤）', text:'妇人陷经，漏下黑不解，胶姜汤主之。' },
            { part:'妇人杂病脉证并治第二十二', article:'妇人杂病脉证并治第二十二', title:'妇人水血并结血室的证治（大黄甘遂汤）', text:'妇人少腹满如敦状，小便微难而不渴，生后者，此为水与血并结在血室也，大黄甘遂汤主之。' }
          ]
        },

        /* ---------------------------------------------------- 温病学 */
        {
          id: 'wb', name: '温病学', icon: '🌡️',
          passages: [
            { part:'温热论', article:'温热论', title:'温病证治之总纲', text:'温邪上受，首先犯肺，逆传心包。肺主气属卫，心主血属营。辨营卫气血虽与伤寒同，若论治法则与伤寒大异也。' },
            { part:'温热论', article:'温热论', title:'温病初起治法及夹风、夹湿的不同治法', text:'盖伤寒之邪留恋在表，然后化热入里，温邪则热变最速。未传心包，邪尚在肺，肺主气，其合皮毛，故云在表。在表初用辛凉轻剂。挟风则加入薄荷、牛蒡之属，挟湿加芦根、滑石之流。' },
            { part:'温热论', article:'温热论', title:'营分证的表现', text:'营分受热，则血液受劫，心神不安，夜甚无寐，或斑点隐隐。' },
            { part:'温热论', article:'温热论', title:'战汗而解与脱证的异同', text:'若其邪始终在气分流连者，可冀其战汗透邪，法宜益胃，令邪与汗并，热达腠开，邪从汗出。解后胃气空虚，当肤冷一昼夜，待气还自温暖如常矣。盖战汗而解，邪退正虚，阳从汗泄，故渐肤冷，未必即成脱证。此时宜令病者，安舒静卧，以养阳气来复。旁人切勿惊惶，频频呼唤，扰其元神，使其烦躁。但诊其脉，若虚软和缓，虽倦卧不语，汗出肤冷，却非脱证；若脉急疾，躁扰不卧，肤冷汗出，便为气脱之证矣。' },
            { part:'温热论', article:'温热论', title:'温病的辨证纲领', text:'大凡看法，卫之后方言气，营之后方言血。在卫汗之可也，到气才可清气，入营犹可透热转气，如犀角、玄参、羚羊角等物，入血就恐耗血动血，直须凉血散血，如生地、丹皮、阿胶、赤芍等物。否则前后不循缓急之法，虑其动手便错，反致慌张矣。' },
            { part:'温热论', article:'温热论', title:'湿邪为病的证治', text:'且吾吴湿邪害人最广，如面色白者，须要顾其阳气，湿胜则阳微也，法应清凉，然到十分之六七，即不可过于寒凉，恐成功反弃，何以故耶？湿热一去，阳亦衰微也；面色苍者，须要顾其津液，清凉到十分之六七，往往热减身寒者，不可就云虚寒而投补剂，恐炉烟虽熄，灰中有火也，须细察精详，方少少与之，慎不可直率而往也。' },
            { part:'温热论', article:'温热论', title:'伤寒与湿热病攻下后邪尽标志', text:'伤寒大便溏为邪已尽，不可再下；湿温病大便溏为邪未尽，必大便硬，慎不可再攻也，以粪燥为无湿矣。' },
            { part:'温热论', article:'温热论', title:'苦泄法治疗温邪夹痰湿结于胃脘致痞的证治', text:'再人之体，脘在腹上，其地位处于中，按之痛，或自痛，或痞胀，当用苦泄，以其入腹近也。' },
            { part:'温热论', article:'温热论', title:'斑和疹的形态区别及病机、诊断意义', text:'斑属血者恒多，疹属气者不少。斑疹皆是邪气外露之象，发出宜神情清爽，为外解里和之意；如斑疹出而昏者，正不胜邪，内陷为患。' },

            { part:'湿热病篇', article:'湿热病篇', title:'湿热证提纲', text:'湿热证，始恶寒，后但热不寒，汗出胸痞，舌白，口渴不引饮。' },
            { part:'湿热病篇', article:'湿热病篇', title:'湿热病病位、初起恶寒机理及侵袭途径', text:'湿热之邪从表伤者，十之一二，由口鼻入者，十之八九。阳明为水谷之海，太阴为湿土之脏，故多阳明太阴受病。' },
            { part:'湿热病篇', article:'湿热病篇', title:'阴湿伤表的证治', text:'湿热证，恶寒无汗，身重头痛，湿在表分，宜藿香、香薷、羌活、苍术皮、薄荷、牛蒡子等味。' },
            { part:'湿热病篇', article:'湿热病篇', title:'阳湿伤表的证治', text:'湿热证，恶寒发热，身重关节疼痛，湿在肌肉，不为汗解，宜滑石、大豆黄卷、茯苓皮、苍术皮、藿香、鲜荷叶、通草等味。' },
            { part:'湿热病篇', article:'湿热病篇', title:'湿热余邪未清、胃气不舒的证治', text:'湿热证，数日后，脘中微闷，知饥不食，湿邪蒙绕三焦，宜藿香叶、薄荷叶、鲜荷叶、枇杷叶、佩兰叶、芦根等味。' },
            { part:'湿热病篇', article:'湿热病篇', title:'湿流下焦的证治', text:'湿热证，数日后自利，溺赤，口渴，湿流下焦，宜滑石、猪苓、茯苓、泽泻、萆薢、通草等味。' },
            { part:'湿热病篇', article:'湿热病篇', title:'湿热在中焦，湿热轻重以舌诊辨别', text:'湿热证，舌遍体白，口渴，湿滞阳明，宜用辛开，如厚朴、草果、半夏、干菖蒲等味。' },
            { part:'湿热病篇', article:'湿热病篇', title:'湿热病后期气血凝滞、灵机失运的证治', text:'湿热证，按法治之，诸证皆退，惟目瞑则惊悸梦惕，余邪内留，胆气未舒，宜用酒浸郁李仁、姜汁炒枣仁、猪胆皮等味。' },

            { part:'温病条辨·上焦篇', article:'温病条辨', title:'温病的范围', text:'温病者：有风温、有温热、有温疫、有温毒、有暑温、有湿温、有秋燥、有冬温、有温疟。' },
            { part:'温病条辨·上焦篇', article:'温病条辨', title:'温病的发病部位', text:'凡病温者，始于上焦，在手太阴。' },
            { part:'温病条辨·上焦篇', article:'温病条辨', title:'温病的主要临床表现', text:'太阴之为病，脉不缓不紧而动数，或两寸独大，尺肤热，头痛，微恶风寒，身热自汗，口渴，或不渴，而咳，午后热甚者，名曰温病。' },
            { part:'温病条辨·上焦篇', article:'温病条辨', title:'温病初起邪在卫分的证治及治禁', text:'太阴风温、温热、温疫、冬温，初起恶风寒者，桂枝汤主之；但热不恶寒而渴者，辛凉平剂银翘散主之。' },
            { part:'温病条辨·上焦篇', article:'温病条辨', title:'风热犯肺以咳为主的证治', text:'太阴风温，但咳，身不甚热，微渴者，辛凉轻剂桑菊饮主之。' },
            { part:'温病条辨·上焦篇', article:'温病条辨', title:'白虎汤的应用禁忌', text:'白虎本为达热出表，若其人脉浮弦而细者，不可与也；脉沉者，不可与也；不渴者，不可与也；汗不出者，不可与也。常须识此，勿令误也。' },
            { part:'温病条辨·上焦篇', article:'温病条辨', title:'气营两燔的证治', text:'太阴温病，气血两燔者，玉女煎去牛膝加元参主之。' },
            { part:'温病条辨·上焦篇', article:'温病条辨', title:'温病血分证证治', text:'太阴温病，血从上溢者，犀角地黄汤合银翘散主之。' },
            { part:'温病条辨·上焦篇', article:'温病条辨', title:'邪入心包的证治', text:'邪入心包，舌蹇肢厥，牛黄丸主之，紫雪丹亦主之。' },
            { part:'温病条辨·上焦篇', article:'温病条辨', title:'手太阴暑湿的证治', text:'手太阴暑湿，按之或咳或不咳，无热，但胸微闷，或四肢倦怠，无汗者，新加香薷饮主之。' },
            { part:'温病条辨·上焦篇', article:'温病条辨', title:'暑温在气分的证治', text:'手太阴暑温，或已经发汗，或未发汗，而汗不止，烦渴而喘，脉洪大有力者，白虎汤主之。' },
            { part:'温病条辨·上焦篇', article:'温病条辨', title:'小儿暑病的证治', text:'小儿暑温，身热，卒然痉厥，名曰暑痫，清营汤主之。' },

            { part:'温病条辨·中焦篇', article:'温病条辨', title:'三种攻下治法', text:'承气非可轻尝也，即邪入中焦，有急下、可下、不可下之分，当细辨之。' },
