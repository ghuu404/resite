      text: '阳气者，精则养神，柔则养筋。开合不得，寒气从之，乃生大偻。陷脉为瘘，留连肉腠，俞气化薄，传为善畏，及为惊骇。营气不从，逆于肉理，乃生痈肿。魄汗未尽，形弱而气烁，穴俞以闭，发为风疟。' },
    { part: '一、阴阳五行', article: '生气通天论', title: '风为百病之始与病久传化', tag: '重点',
      text: '故风者，百病之始也，清静则肉腠闭拒，虽有大风苛毒，弗之能害，此因时之序也。故病久则传化，上下不并，良医弗为。故阳畜积病死，而阳气当隔，隔者当泻。不亟正治，粗乃败之。' },
    { part: '一、阴阳五行', article: '生气通天论', title: '阳气一日节律', tag: '重点',
      text: '故阳气者，一日而主外，平旦人气生，日中而阳气隆，日西而阳气已虚，气门乃闭。是故暮而收拒，无扰筋骨，无见雾露，反此三时，形乃困薄。' },
    { part: '一、阴阳五行', article: '生气通天论', title: '阴阳互根与调和',
      text: '岐伯曰：阴者藏精而起亟也；阳者卫外而为固也。阴不胜其阳，则脉流薄疾，并乃狂；阳不胜其阴，则五藏气争，九窍不通。是以圣人陈阴阳，筋脉和同，骨髓坚固，气血皆从。如是则内外调和，邪不能害，耳目聪明，气立如故。' },
    { part: '一、阴阳五行', article: '生气通天论', title: '风客淫气与饮食劳伤',
      text: '风客淫气，精乃亡，邪伤肝也。因而饱食，筋脉横解，肠澼为痔。因而大饮，则气逆。因而强力，肾气乃伤，高骨乃坏。' },
    { part: '一、阴阳五行', article: '生气通天论', title: '阴阳之要',
      text: '凡阴阳之要，阳密乃固，两者不和，若春无秋，若冬无夏。因而和之，是谓圣度。故阳强不能密，阴气乃绝。阴平阳秘，精神乃治；阴阳离决，精气乃绝。' },
    { part: '一、阴阳五行', article: '生气通天论', title: '四时之气更伤五藏',
      text: '因于露风，乃生寒热。是以春伤于风，邪气留连，乃为洞泄。夏伤于暑，秋为痎疟。秋伤于湿，上逆而咳，发为痿厥。冬伤于寒，春必温病。四时之气，更伤五藏。' },
    { part: '一、阴阳五行', article: '生气通天论', title: '五味偏嗜伤五脏', tag: '重点',
      text: '阴之所生，本在五味；阴之五宫，伤在五味。是故味过于酸，肝气以津，脾气乃绝。味过于咸，大骨气劳，短肌，心气抑。味过于苦，心气喘满，色黑，肾气不衡。味过于甘，脾气濡，胃气乃厚。味过于辛，筋脉沮弛，精神乃央。是故谨和五味，骨正筋柔，气血以流，腠理以密，如是则骨气以精。谨道如法，长有天命。' },

    /* ========== 二、藏象 ========== */
    { part: '二、藏象', article: '灵兰秘典论', title: '十二官', tag: '重点',
      text: '黄帝问曰：愿闻十二藏之相使，贵贱何如？岐伯曰：悉乎哉问也，请遂言之：心者，君主之官也，神明出焉。肺者，相傅之官，治节出焉。肝者，将军之官，谋虑出焉。胆者，中正之官，决断出焉。膻中者，臣使之官，喜乐出焉。脾胃者，仓廪之官，五味出焉。大肠者，传道之官，变化出焉。小肠者，受盛之官，化物出焉。肾者，作强之官，伎巧出焉。三焦者，决渎之官，水道出焉。膀胱者，州都之官，津液藏焉，气化则能出矣。凡此十二官者，不得相失也。故主明则下安，以此养生则寿，没世不殆，以为天下则大昌。主不明则十二官危，使道闭塞而不通，形乃大伤，以此养生则殃，以为天下者，其宗大危，戒之戒之！' },
    { part: '二、藏象', article: '六节藏象论', title: '藏象', tag: '重点',
      text: '帝曰：藏象何如？岐伯曰：心者，生之本，神之变也；其华在面，其充在血脉，为阳中之太阳，通于夏气。肺者，气之本，魄之处也；其华在毛，其充在皮，为阳中之太阴，通于秋气。肾者，主蛰，封藏之本，精之处也；其华在发，其充在骨，为阴中之少阴，通于冬气。肝者，罢极之本，魂之居也；其华在爪，其充在筋，以生血气，其味酸，其色苍，此为阳中之少阳，通于春气。脾、胃、大肠、小肠、三焦、膀胱者，仓廪之本，营之居也。名曰器，能化糟粕，转味而入出者也，其华在唇四白，其充在肌，其味甘，其色黄，此至阴之类，通于土气。凡十一藏，取决于胆也。' },
    { part: '二、藏象', article: '五藏别论', title: '奇恒之府与传化之府', tag: '重点',
      text: '黄帝问曰：余闻方士，或以脑髓为藏，或以肠胃为藏，或以为府，敢问更相反，皆自谓是，不知其道，愿闻其说。岐伯对曰：脑、髓、骨、脉、胆、女子胞，此六者，地气之所生也，皆藏于阴而象于地，故藏而不写，名曰奇恒之府。夫胃、大肠、小肠、三焦、膀胱，此五者，天气之所生也，其气象天，故写而不藏，此受五藏浊气，名曰传化之府，此不能久留，输写者也。魄门亦为五藏使，水谷不得久藏。' },
    { part: '二、藏象', article: '五藏别论', title: '五脏藏精气而不泻', tag: '重点',
      text: '所谓五藏者，藏精气而不写也，故满而不能实；六府者，传化物而不藏，故实而不能满也。所以然者，水谷入口，则胃实而肠虚；食下则肠实而胃虚。故曰：实而不满，满而不实也。' },
    { part: '二、藏象', article: '五藏别论', title: '气口独为五脏主', tag: '重点',
      text: '帝曰：气口何以独为五藏主？岐伯曰：胃者，水谷之海，六府之大源也。五味入口，藏于胃，以养五藏气。气口亦太阴也。是以五藏六府之气味，皆出于胃，变见于气口。故五气入鼻，藏于心肺，心肺有病，而鼻为之不利也。' },
    { part: '二、藏象', article: '五藏别论', title: '治病需察患者状态', tag: '重点',
      text: '凡治病，必察其下，适其脉，观其志意，与其病也。拘于鬼神者，不可与言至德；恶于针石者，不可与言至巧；病不许治者，病必不治，治之无功矣。' },
    { part: '二、藏象', article: '经脉别论', title: '勇怯与发病',
      text: '黄帝问曰：人之居处动静勇怯，脉亦为之变乎？岐伯对曰：凡人之惊恐恚劳动静，皆为变也。是以夜行则喘出于肾，淫气病肺。有所堕恐，喘出于肝，淫气害脾。有所惊恐，喘出于肺，淫气伤心。度水跌仆，喘出于肾与骨，当是之时，勇者气行则已；怯者则著而为病也。故曰：诊病之道，观人勇怯，骨肉皮肤，能知其情，以为诊法也。' },
    { part: '二、藏象', article: '经脉别论', title: '汗出与生病起于过用',
      text: '故饮食饱甚，汗出于胃；惊而夺精，汗出于心；持重远行，汗出于肾；疾走恐惧，汗出于肝；摇体劳苦，汗出于脾。故春秋冬夏，四时阴阳，生病起于过用，此为常也。' },
    { part: '二、藏象', article: '经脉别论', title: '食气入胃', tag: '重点',
      text: '食气入胃，散精于肝，淫气于筋。食气入胃，浊气归心，淫精于脉。脉气流经，经气归于肺，肺朝百脉，输精于皮毛。毛脉合精，行气于府，府精神明，留于四藏，气归于权衡。权衡以平，气口成寸，以决死生。' },
    { part: '二、藏象', article: '经脉别论', title: '饮入于胃', tag: '重点',
      text: '饮入于胃，游溢精气，上输于脾，脾气散精，上归于肺，通调水道，下输膀胱，水精四布，五经并行，合于四时五藏阴阳，揆度以为常也。' },
    { part: '二、藏象', article: '太阴阳明论', title: '太阴阳明为表里',
      text: '黄帝问曰：太阴阳明为表里，脾胃脉也，生病而异者，何也？岐伯对曰：阴阳异位，更虚更实，更逆更从，或从内，或从外，所从不同，故病异名也。' },
    { part: '二、藏象', article: '太阴阳明论', title: '阳道实阴道虚',
      text: '帝曰：愿闻其异状也？岐伯曰：阳者，天气也，主外；阴者，地气也，主内。故阳道实，阴道虚。故犯贼风虚邪者，阳受之；食饮不节，起居不时者，阴受之。阳受之则入六府，阴受之则入五藏。入六府则身热，不时卧，上为喘呼。入五藏则䐜满闭塞，下为飧泄，久为肠澼。故喉主天气，咽主地气。故阳受风气，阴受湿气。故阴气从足上行至头，而下行循臂至指端。阳气从手上行至头，而下行至足。故曰："阳病者，上行极而下；阴病者，下行极而上。"故伤于风者，上先受之；伤于湿者，下先受之。' },
    { part: '二、藏象', article: '太阴阳明论', title: '脾病而四肢不用', tag: '重点',
      text: '帝曰：脾病而四支不用，何也？岐伯曰：四支皆禀气于胃，而不得至经，必因于脾，乃得禀也。今脾病不能为胃行其津液，四支不得禀水谷气，气日以衰，脉道不利，筋骨肌肉，皆无气以生，故不用焉。' },
    { part: '二、藏象', article: '太阴阳明论', title: '脾不主时', tag: '重点',
      text: '帝曰：脾不主时，何也？岐伯曰：脾者土也，治中央，常以四时长四藏，各十八日寄治，不得独主于时也。脾藏者，常著胃土之精也。土者生万物而法天地，故上下至头足，不得主时也。' },
    { part: '二、藏象', article: '太阴阳明论', title: '脾胃行津液',
      text: '帝曰：脾与胃以膜相连耳，而能为之行其津液，何也？岐伯曰：足太阴者，三阴也，其脉贯胃属脾络嗌，故太阴为之行气于三阴。阳明者，表也，五藏六府之海也，亦为之行气于三阳。藏府各因其经而受气于阳明，故为胃行其津液。四支不得禀水谷气，日以益衰，阴道不利，筋骨肌肉，无气以生，故不用焉。' },
    { part: '二、藏象', article: '本神', title: '本神总论', tag: '重点',
      text: '黄帝问于岐伯曰：凡刺之法，先必本于神。血脉营气精神，此五藏之所藏也。至其淫泆离藏则精失，魂魄飞扬，志意恍乱，智虑去身者，何因而然乎？天之罪与？人之过乎？何谓德、气、生、精、神、魂、魄、心、意、志、思、智、虑？请问其故。' },
    { part: '二、藏象', article: '本神', title: '神的生成与智者养生', tag: '重点',
      text: '岐伯答曰：天之在我者德也，地之在我者气也。德流气薄而生者也。故生之来谓之精，两精相搏谓之神，随神往来者谓之魂，并精而出入者谓之魄。所以任物者谓之心，心有所忆谓之意，意之所存谓之志，因志而存变谓之思，因思而远慕谓之虑，因虑而处物谓之智。故智者之养生也，必顺四时而适寒暑，和喜怒而安居处，节阴阳而调刚柔。如是，则僻邪不至，长生久视。' },
    { part: '二、藏象', article: '本神', title: '情志伤神',
      text: '是故怵惕思虑者则伤神，神伤则恐惧，流淫而不止。因悲哀动中者，竭绝而失生。喜乐者，神惮散而不藏。愁忧者，气闭塞而不行。盛怒者，迷惑而不治。恐惧者，神荡惮而不收。' },
    { part: '二、藏象', article: '本神', title: '五脏藏神受伤',
      text: '心，怵惕思虑则伤神，神伤则恐惧自失，破䐃脱肉；毛悴色夭，死于冬。脾愁忧而不解则伤意，意伤则悗乱，四肢不举，毛悴色夭，死于春。肝悲哀动中则伤魂，魂伤则狂忘不精，不精则不正，当人阴缩而挛筋，两胁骨不举；毛悴色夭，死于秋。肺喜乐无极则伤魄，魄伤则狂，狂者意不存人，皮革焦，毛悴色夭，死于夏。肾盛怒而不止则伤志，志伤则喜忘其前言，腰脊不可以俛仰屈伸，毛悴色夭，死于季夏。恐惧而不解则伤精，精伤则骨酸痿厥，精时自下。是故五藏主藏精者也，不可伤，伤则失守而阴虚，阴虚则无气，无气则死矣。是故用针者，察观病人之态，以知精神魂魄之存亡得失之意，五者以伤，针不可以治之也。' },
    { part: '二、藏象', article: '本神', title: '五脏虚实', tag: '重点',
      text: '肝藏血，血舍魂，肝气虚则恐，实则怒。脾藏营，营舍意，脾气虚则四肢不用，五藏不安，实则腹胀经溲不利。心藏脉，脉舍神，心气虚则悲，实则笑不休。肺藏气，气舍魄，肺气虚则鼻塞不利，少气，实则喘喝胸盈仰息。肾藏精，精舍志，肾气虚则厥，实则胀，五藏不安。必审五藏之病形，以知其气之虚实，谨而调之也。' },
    { part: '二、藏象', article: '营卫生会', title: '营卫的生成与运行', tag: '重点',
      text: '黄帝问于岐伯曰：人焉受气？阴阳焉会？何气为营？何气为卫？营安从生？卫于焉会？老壮不同气，阴阳异位，愿闻其会。岐伯答曰：人受气于谷，谷入于胃，以传与肺，五藏六府，皆以受气，其清者为营，浊者为卫，营在脉中，卫在脉外，营周不休，五十度而复大会。阴阳相贯，如环无端。卫气行于阴二十五度，行于阳二十五度，分为昼夜，故气至阳而起，至阴而止。故曰：日中而阳陇为重阳，夜半而阴陇为重阴。故太阴主内，太阳主外，各行二十五度，分为昼夜。夜半为阴陇，夜半后而阴衰，平旦阴尽而阳受气矣。日中为阳陇，日西为阳衰，日入阳尽而阴受气矣。夜半而大会，万民皆卧，命曰合阴。平旦阴尽而阳受气，如是无已，与天地同纪。' },
    { part: '二、藏象', article: '营卫生会', title: '老人不夜瞑', tag: '重点',
      text: '黄帝曰：老人之不夜瞑者，何气使然？少壮之人不昼瞑者，何气使然？岐伯答曰：壮者之气血盛，其肌肉滑，气道通，营卫之行，不失其常，故昼精而夜瞑。老者之气血衰，其肌肉枯，气道涩，五藏之气相搏，其营气衰少而卫气内伐，故昼不精，夜不瞑。' },
    { part: '二、藏象', article: '营卫生会', title: '营卫之所行',
      text: '黄帝曰：愿闻营卫之所行，皆何道从来？岐伯答曰：营出于中焦，卫出于下焦。黄帝曰：愿闻三焦之所出。岐伯答曰：上焦出于胃上口，并咽以上，贯膈而布胸中，走腋，循太阴之分而行，还至阳明，上至舌，下足阳明，常与营俱行于阳二十五度，行于阴亦二十五度，一周也。故五十度而复大会于手太阴矣。' },
    { part: '二、藏象', article: '营卫生会', title: '漏泄',
      text: '黄帝曰：人有热饮食下胃，其气未定，汗则出，或出于面，或出于背，或出于身半，其不循卫气之道而出，何也？岐伯曰：此外伤于风，内开腠理，毛蒸理泄，卫气走之，固不得循其道，此气慓悍滑疾，见开而出，故不得从其道，故命曰漏泄。' },
    { part: '二、藏象', article: '营卫生会', title: '中焦',
      text: '黄帝曰：愿闻中焦之所出。岐伯答曰：中焦亦并胃中，出上焦之后，此所受气者，泌糟粕，蒸津液，化其精微，上注于肺脉，乃化而为血，以奉生身，莫贵于此，故独得行于经隧，命曰营气。' },
    { part: '二、藏象', article: '营卫生会', title: '血与气异名同类',
      text: '黄帝曰：夫血之与气，异名同类，何谓也？岐伯答曰：营卫者，精气也，血者，神气也。故血之与气，异名同类焉。故夺血者无汗，夺汗者无血，故人生有两死，而无两生。' },
    { part: '二、藏象', article: '营卫生会', title: '下焦',
      text: '黄帝曰：愿闻下焦之所出。岐伯答曰：下焦者，别回肠，注于膀胱，而渗入焉。故水谷者，常并居于胃中，成糟粕而俱下于大肠，而成下焦，渗而俱下，济泌别汁，循下焦而渗入膀胱焉。' },
    { part: '二、藏象', article: '营卫生会', title: '饮酒先小便',
      text: '黄帝曰：人饮酒，酒亦入胃，谷未熟而小便独先下，何也？岐伯答曰：酒者熟谷之液也。其气悍以清，故后谷而入，先谷而液出焉。' },
    { part: '二、藏象', article: '营卫生会', title: '上焦如雾',
      text: '黄帝曰：善。余闻上焦如雾，中焦如沤，下焦如渎，此之谓也。' },
    { part: '二、藏象', article: '决气', title: '六气概念',
      text: '黄帝曰：余闻人有精、气、津、液、血、脉，余意以为一气耳，今乃辨为六名，余不知其所以然。岐伯曰：两神相搏，合而成形，常先身生，是谓精。何谓气？岐伯曰：上焦开发，宣五谷味，熏肤充身泽毛，若雾露之溉，是谓气。何谓津？岐伯曰：腠理发泄，汗出溱溱，是谓津。何谓液？岐伯曰：谷入气满，淖泽注于骨，骨属屈伸，泄泽补益脑髓，皮肤润泽，是谓液。何谓血？岐伯曰：中焦受气取汁，变化而赤，是谓血。何谓脉？岐伯曰：壅遏营气，令无所避，是谓脉。' },
    { part: '二、藏象', article: '决气', title: '六气不足之候',
      text: '黄帝曰：六气者，有余不足，气之多少，脑髓之虚实，血脉之清浊，何以知之？岐伯曰：精脱者，耳聋。气脱者，目不明；津脱者，腠理开，汗大泄；液脱者，骨属屈伸不利，色夭，脑髓消，胫酸，耳数鸣；血脱者，色白，夭然不泽，其脉空虚，此其候也。' },

    /* ========== 三、病因病机 ========== */
    { part: '三、病因病机', article: '百病始生', title: '三部之气', tag: '重点',
      text: '黄帝问于岐伯曰：夫百病之始生也，皆生于风雨寒暑，清湿喜怒。喜怒不节则伤藏，风雨则伤上，清湿则伤下。三部之气，所伤异类，愿闻其会。岐伯曰：三部之气各不同，或起于阴，或起于阳，请言其方。喜怒不节则伤藏，藏伤则病起于阴也；清湿袭虚，则病起于下；风雨袭虚，则病起于上，是谓三部。至于其淫泆，不可胜数。' },
    { part: '三、病因病机', article: '百病始生', title: '两虚相得', tag: '重点',
      text: '黄帝曰：余固不能数，故问先师，愿卒闻其道。岐伯曰：风雨寒热，不得虚，邪不能独伤人，卒然逢疾风暴雨而不病者，盖无虚，故邪不能独伤人。此必因虚邪之风，与其身形，两虚相得，乃客其形。两实相逢，众人肉坚。其中于虚邪也，因于天时，与其身形，参以虚实，大病乃成。气有定舍，因处为名。上下中外，分为三员。' },
    { part: '三、病因病机', article: '百病始生', title: '虚邪传变与成积',
      text: '是故虚邪之中人也，始于皮肤，皮肤缓则腠理开，开则邪从毛发入，入则抵深，深则毛发立，毛发立则淅然，故皮肤痛。留而不去，则传舍于络脉，在络之时，痛于肌肉，故痛之时息，大经乃代。留而不去，传舍于经，在经之时，洒淅喜惊。留而不去，传舍于输，在输之时，六经不通四肢，则肢节痛，腰脊乃强。留而不去，传舍于伏冲之脉，在伏冲之时，体重身痛。留而不去，传舍于肠胃，在肠胃之时，贲响腹胀，多寒则肠鸣飧泄，食不化；多热则溏出糜。留而不去，传舍于肠胃之外，募原之间，留著于脉，稽留而不去，息而成积。或著孙脉，或著络脉，或著经脉，或著输脉，或著于伏冲之脉，或著于膂筋，或著于肠胃之募原，上连于缓筋，邪气淫泆，不可胜论。' },
    { part: '三、病因病机', article: '百病始生', title: '积的形成',
      text: '黄帝曰：愿尽闻其所由然。岐伯曰：其著孙络之脉而成积者，其积往来上下，臂手孙络之居也，浮而缓，不能句积而止之，故往来移行肠胃之间，水凑渗注灌，濯濯有音；有寒则䐜满雷引，故时切痛。其著于阳明之经，则挟脐而居，饱食则益大，饥则益小。其著于缓筋也，似阳明之积，饱食则痛，饥则安。其著于肠胃之募原也，痛而外连于缓筋，饱食则安，饥则痛。其著于伏冲之脉者，揣之应手而动，发手，则热气下于两股，如汤沃之状。其著于膂筋，在肠后者，饥则积见，饱则积不见，按之不得。其著于输之脉者，闭塞不通，津液不下，孔窍干壅。此邪气之从外入内，从上下也。' },
    { part: '三、病因病机', article: '百病始生', title: '积之始生',
      text: '黄帝曰：积之始生，至其已成，奈何？岐伯曰：积之始生，得寒乃生，厥乃成积也。黄帝曰：其成积奈何？岐伯曰：厥气生足悗，悗生胫寒，胫寒则血脉凝涩，血脉凝涩则寒气上入于肠胃，入于肠胃则䐜胀，䐜胀则肠外之汁沫迫聚不得散，日以成积。卒然多食饮，则肠满。起居不节，用力过度，则络脉伤。阳络伤则血外溢，血外溢则衄血；阴络伤则血内溢，血内溢则后血。肠胃之络伤，则血溢于肠外，肠外有寒，汁沫与血相搏，则并合凝聚不得散，而积成矣。卒然中外于寒，若内伤于忧愁，则气上逆，气上逆则六输不通，温气不行，凝血蕴裹而不散，津液涩渗，著而不去，而积皆成矣。' },
    { part: '三、病因病机', article: '百病始生', title: '病生于阴', tag: '重点',
      text: '黄帝曰：其生于阴者，奈何？岐伯曰：忧思伤心；重寒伤肺；忿怒伤肝；醉以入房，汗出当风伤脾；用力过度，若入房汗出浴，则伤肾，此内外三部之所生病者也。' },
    { part: '三、病因病机', article: '百病始生', title: '治则',
      text: '黄帝曰：善。治之奈何？岐伯答曰：察其所痛，以知其应，有余不足，当补则补，当写则写，毋逆天时，是谓至治。' },
    { part: '三、病因病机', article: '举痛论', title: '善言天者',
      text: '黄帝问曰：余闻善言天者，必有验于人；善言古者，必有合于今；善言人者，必有厌于己。如此，则道不惑而要数极，所谓明也。今余问于夫子，令言而可知，视而可见，扪而可得，令验于己，而发蒙解惑，可得而闻乎？' },
    { part: '三、病因病机', article: '举痛论', title: '五脏卒痛', tag: '重点',
      text: '岐伯再拜稽首对曰：何道之问也？帝曰：愿闻人之五藏卒痛，何气使然？岐伯对曰：经脉流行不止，环周不休。寒气入经而稽迟，泣而不行，客于脉外则血少，客于脉中则气不通，故卒然而痛。' },
    { part: '三、病因病机', article: '举痛论', title: '诸痛不同形',
      text: '帝曰：其痛或卒然而止者，或痛甚不休者，或痛甚不可按者，或按之而痛止者，或按之无益者，或喘动应手者，或心与背相引而痛者，或胁肋与少腹相引而痛者，或腹痛引阴股者，或痛宿昔而成积者，或卒然痛死不知人，有少间复生者，或痛而呕者，或腹痛而后泄者，或痛而闭不通者。凡此诸痛，各不同形，别之奈何？' },
    { part: '三、病因病机', article: '举痛论', title: '诸痛机理',
      text: '岐伯曰：寒气客于脉外则脉寒，脉寒则缩蜷，缩蜷则脉绌急，则外引小络，故卒然而痛。得炅则痛立止，因重中于寒，则痛久矣。寒气客于经脉之中，与炅气相薄则脉满，满则痛而不可按也。寒气稽留，炅气从上，则脉充大而血气乱，故痛甚不可按也。寒气客于肠胃之间，膜原之下，血不得散，小络急引故痛，按之则血气散，故按之痛止。寒气客于侠脊之脉，则深按之不能及，故按之无益也。寒气客于冲脉，冲脉起于关元，随腹直上，寒气客则脉不通，脉不通则气因之，故喘动应手矣。寒气客于背俞之脉则脉泣，脉泣则血虚，血虚则痛。其俞注于心，故相引而痛。按之则热气至，热气至则痛止矣。寒气客于厥阴之脉，厥阴之脉者，络阴器，系于肝，寒气客于脉中，则血泣脉急，故胁肋与少腹相引痛矣。厥气客于阴股，寒气上及少腹，血泣在下相引，故腹痛引阴股。寒气客于小肠膜原之间，络血之中，血泣不得注于大经，血气稽留不得行，故宿昔而成积矣。寒气客于五藏，厥逆上泄，阴气竭，阳气未入，故卒然痛死不知人，气复反则生矣。寒气客于肠胃，厥逆上出，故痛而呕也。寒气客于小肠，小肠不得成聚，故后泄腹痛矣。热气留于小肠，肠中痛、瘅热焦渴，则坚干不得出，故痛而闭不通矣。' },
    { part: '三、病因病机', article: '举痛论', title: '视而可见，扪而可得',
      text: '帝曰：所谓言而可知者也，视而可见，奈何？岐伯曰：五藏六府，固尽有部，视其五色，黄赤为热，白为寒，青黑为痛，此所谓视而可见者也。帝曰：扪而可得奈何？岐伯曰：视其主病之脉，坚而血及陷下者，皆可扪而得也。' },
    { part: '三、病因病机', article: '举痛论', title: '百病生于气', tag: '重点',
      text: '帝曰：善。余知百病生于气也，怒则气上，喜则气缓，悲则气消，恐则气下，寒则气收，炅则气泄，惊则气乱，劳则气耗，思则气结，九气不同，何病之生？岐伯曰：怒则气逆，甚则呕血及飧泄，故气上矣。喜则气和志达，荣卫通利，故气缓矣。悲则心系急，肺布叶举，而上焦不通，荣卫不散，热气在中，故气消矣。恐则精却，却则上焦闭，闭则气还，还则下焦胀，故气不行矣。寒则腠理闭，气不行，故气收矣。炅则腠理开，荣卫通，汗大泄，故气泄。惊则心无所倚，神无所归，虑无所定，故气乱矣。劳则喘息汗出，外内皆越，故气耗矣。思则心有所存，神有所归，正气留而不行，故气结矣。' },
    { part: '三、病因病机', article: '至真要大论', title: '审察病机', tag: '重点',
      text: '岐伯曰：审察病机，无失气宜，此之谓也。' },
    { part: '三、病因病机', article: '至真要大论', title: '病机十九条', tag: '重点',
      text: '帝曰：愿闻病机何如？岐伯曰：诸风掉眩，皆属于肝；诸寒收引，皆属于肾；诸气膹郁，皆属于肺；诸湿肿满，皆属于脾；诸热瞀瘛，皆属于火；诸痛痒疮，皆属于心；诸厥固泄，皆属于下；诸痿喘呕，皆属于上；诸禁鼓栗，如丧神守，皆属于火；诸痉项强，皆属于湿；诸逆冲上，皆属于火；诸胀腹大，皆属于热；诸躁狂越，皆属于火；诸暴强直，皆属于风；诸病有声，鼓之如鼓，皆属于热；诸病胕肿，疼酸惊骇，皆属于火；诸转反戾，水液浑浊，皆属于热；诸病水液，澄澈清冷，皆属于寒；诸呕吐酸，暴注下迫，皆属于热。故《大要》曰：谨守病机，各司其属，有者求之，无者求之，盛者责之，虚者责之，必先五藏，疏其血气，令其调达，而致和平，此之谓也。' },
    { part: '三、病因病机', article: '至真要大论', title: '正治反治', tag: '重点',
      text: '帝曰：何谓逆从？岐伯曰：逆者正治，从者反治，从少从多，观其事也。帝曰：反治何谓？岐伯曰：热因寒用，寒因热用，塞因塞用，通因通用，必伏其所主，而先其所因，其始则同，其终则异，可使破积，可使气和，可使必已。帝曰：善。气调而得者，何如？岐伯曰：逆之，从之，逆而从之，从而逆之，疏气令调，则其道也。' },
    { part: '三、病因病机', article: '至真要大论', title: '虚寒虚热', tag: '重点',
      text: '帝曰：论言治寒以热，治热以寒，而方士不能废绳墨而更其道也。有病热者，寒之而热；有病寒者，热之而寒。二者皆在，新病复起，奈何治？岐伯曰：诸寒之而热者取之阴，热之而寒者取之阳，所谓求其属也。' },
    { part: '三、病因病机', article: '调经论', title: '五脏虚实', tag: '重点',
      text: '黄帝问曰：余闻《刺法》言，有余泻之，不足补之。何谓有余，何谓不足？岐伯对曰：有余有五，不足亦有五。帝欲何问？帝曰：愿尽闻之。岐伯曰：神有余有不足；气有余有不足，血有余有不足，形有余有不足，志有余有不足。凡此十者，其气不等也。帝曰：人有精气、津液，四支、九窍、五藏、十六部、三百六十五节，乃生百病。百病之生，皆有虚实。今夫子乃言有余有五，不足亦有五，何以生之乎？岐伯曰：皆生于五藏也。夫心藏神，肺藏气，肝藏血，脾藏肉，肾藏志，而此成形。志意通，内连骨髓，而成身形五藏。五藏之道，皆出于经隧，以行血气，血气不和，百病乃变化而生，是故守经隧焉。' },
    { part: '三、病因病机', article: '调经论', title: '阳虚外寒等四证', tag: '重点',
      text: '帝曰：经言阳虚则外寒，阴虚则内热，阳盛则外热，阴盛则内寒，余已闻之矣，不知其所由然也。岐伯曰：阳受气于上焦，以温皮肤分肉之间。令寒气在外，则上焦不通，上焦不通，则寒气独留于外，故寒栗。帝曰：阴虚生内热奈何？岐伯曰：有所劳倦，形气衰少，谷气不盛，上焦不行，下脘不通，胃气热，热气熏胸中，故内热。帝曰：阳盛生外热奈何？岐伯曰：上焦不通利，则皮肤致密，腠理闭塞，玄府不通，卫气不得泄越，故外热。帝曰：阴盛生内寒奈何？岐伯曰：厥气上逆，寒气积于胃中而不写，不写则温气去，寒独留，则血凝泣，凝则脉不通，其脉盛大以涩，故中寒。' },

    /* ========== 四、病症 ========== */
    { part: '四、病症', article: '热论', title: '热病总论', tag: '重点',
      text: '黄帝问曰：今夫热病者，皆伤寒之类也，或愈或死，其死皆以六七日之间，其愈皆以十日以上者，何也？不知其解，愿闻其故。' },
    { part: '四、病症', article: '热论', title: '巨阳为诸阳主气', tag: '重点',
      text: '岐伯对曰：巨阳者，诸阳之属也。其脉连于风府，故为诸阳主气也。人之伤于寒也，则为病热，热虽甚不死，其两感于寒而病者，必不免于死。' },
    { part: '四、病症', article: '热论', title: '六经传变',
      text: '帝曰：愿闻其状。岐伯曰：伤寒一日，巨阳受之，故头项痛，腰脊强。二日，阳明受之，阳明主肉，其脉挟鼻络于目，故身热目疼而鼻干，不得卧也。三日，少阳受之，少阳主胆，其脉循胁络于耳，故胸胁痛而耳聋。三阳经络皆受其病，而未入于藏者，故可汗而已。四日，太阴受之，太阴脉布胃中络于嗌，故腹满而嗌干。五日，少阴受之，少阴脉贯脊络于肺，系舌本，故口燥舌干而渴。六日，厥阴受之，厥阴脉循阴器而络于肝，故烦满而囊缩。三阴三阳，五藏六府皆受病，营卫不行，五藏不通，则死矣。' },
    { part: '四、病症', article: '热论', title: '病衰过程',
      text: '其不两感于寒者，七日，巨阳病衰，头痛少愈。八日，阳明病衰，身热少愈。九日，少阳病衰，耳聋微闻。十日，太阴病衰，腹减如故，则思饮食。十一日，少阴病衰，渴止，满，舌干已而嚏。十二日，厥阴病衰，囊纵，少腹微下，大气皆去，病日已矣。' },
    { part: '四、病症', article: '热论', title: '热病治法',
      text: '帝曰：治之奈何？岐伯曰：治之各通其藏脉，病日衰已矣。其未满三日者，可汗而已；其满三日者，可泄而已。' },
    { part: '四、病症', article: '热论', title: '热病遗复与饮食禁忌', tag: '重点',
      text: '帝曰：热病已愈，时有所遗者，何也？岐伯曰：诸遗者，热甚而强食之，故有所遗也。若此者，皆病已衰而热有所藏，因其谷气相薄，两热相合，故有所遗也。帝曰：善。治遗奈何？岐伯曰：视其虚实，调其逆从，可使必已矣。帝曰：病热当何禁之？岐伯曰：病热少愈，食肉则复，多食则遗，此其禁也。' },
    { part: '四、病症', article: '热论', title: '两感于寒',
      text: '帝曰：其病两感于寒者，其脉应与其病形何如？岐伯曰：两感于寒者，病一日，则巨阳与少阴俱病，则头痛口干而烦满。二日，则阳明与太阴俱病，则腹满身热，不欲食，谵言；三日，则少阳与厥阴俱病，则耳聋囊缩而厥、水浆不入、不知人，六日死。帝曰：五藏已伤，六府不通，荣卫不行，如是之后，三日乃死，何也？岐伯曰：阳明者，十二经脉之长也，其血气盛，故不知人。三日，其气乃尽，故死矣。' },
    { part: '四、病症', article: '热论', title: '温与暑',
      text: '凡病伤寒而成温者，先夏至日者为病温，后夏至日者为病暑，暑当与汗皆出，勿止。' },
    { part: '四、病症', article: '评热病论', title: '阴阳交', tag: '重点',
      text: '黄帝问曰：有病温者，汗出辄复热，而脉躁疾不为汗衰，狂言不能食，病名为何？岐伯对曰：病名阴阳交，交者，死也。帝曰：愿闻其说。岐伯曰：人所以汗出者，皆生于谷，谷生于精，今邪气交争于骨肉而得汗者，是邪却而精胜也。精胜，则当能食而不复热。复热者，邪气也，汗者，精气也，今汗出而辄复热者，是邪胜也；不能食者，精无俾也；病而留者，其寿可立而倾也。且夫《热论》曰：汗出而脉尚躁盛者死。今脉不与汗相应，此不胜其病也，其死明矣。狂言者，是失志，失志者死。今见三死，不见一生，虽愈必死也。' },
    { part: '四、病症', article: '评热病论', title: '风厥', tag: '重点',
      text: '帝曰：有病身热，汗出烦满，烦满不为汗解，此为何病？岐伯曰：汗出而身热者，风也；汗出而烦满不解者，厥也。病名曰风厥。帝曰：愿卒闻之。岐伯曰：巨阳主气，故先受邪，少阴与其为表里也，得热则上从之，从之则厥也。帝曰：治之奈何？岐伯曰：表里刺之，饮之服汤。' },
    { part: '四、病症', article: '评热病论', title: '劳风', tag: '重点',
      text: '帝曰：劳风为病何如？岐伯曰：劳风法在肺下，其为病也，使人强上冥视，唾出若涕，恶风而振寒，此为劳风之病。帝曰：治之奈何？岐伯曰：以救俯仰。巨阳引，精者三日，中年者五日，不精者七日。咳出青黄涕，其状如脓，大如弹丸，从口中若鼻中出，不出则伤肺，伤肺则死也。' },
    { part: '四、病症', article: '评热病论', title: '肾风与风水',
      text: '帝曰：有病肾风者，面胕痝然，害于言，可刺不？岐伯曰：虚不当刺，不当刺而刺，后五日，其气必至。帝曰：其至何如？岐伯曰：至必少气时热，时热从胸背上至头，汗出手热，口干苦渴，小便黄，目下肿，腹中鸣，身重难以行，月事不来，烦而不能食，不能正偃，正偃则咳，病名曰风水，论在《刺法》中。' },
    { part: '四、病症', article: '评热病论', title: '风水病机',
      text: '帝曰：愿闻其说。岐伯曰：邪之所凑，其气必虚。阴虚者，阳必凑之，故少气时热而汗出也。小便黄者，少腹中有热也。不能正偃者，胃中不和也。正偃则咳甚，上迫肺也。诸有水气者，微肿先见于目下也。帝曰：何以言？岐伯曰：水者，阴也，目下亦阴也，腹者至阴之所居，故水在腹者，必使目下肿也。真气上逆，故口苦舌干，卧不得正偃，正偃则咳出清水也。诸水病者，故不得卧，卧则惊，惊则咳甚也。腹中鸣者，病本于胃也。薄脾则烦，不能食。食不下者，胃脘膈也。身重难以行者，胃脉在足也。月事不来者，胞脉闭也。胞脉者，属心而络于胞中。今气上迫肺，心气不得下通，故月事不来也。帝曰：善。' },
    { part: '四、病症', article: '咳论', title: '五脏六腑皆令人咳', tag: '重点',
      text: '黄帝问曰：肺之令人咳，何也？岐伯对曰：五藏六府皆令人咳，非独肺也。帝曰：愿闻其状。岐伯曰：皮毛者，肺之合也，皮毛先受邪气，邪气以从其合也。其寒饮食入胃，从肺脉上至于肺，则肺寒，肺寒则外内合邪，因而客之，则为肺咳。五藏各以其时受病，非其时各传以与之。人与天地相参，故五藏各以治时，感于寒则受病，微则为咳，甚则为泄、为痛。乘秋则肺先受邪，乘春则肝先受之，乘夏则心先受之，乘至阴则脾先受之，乘冬则肾先受之。' },
    { part: '四、病症', article: '咳论', title: '五脏咳之状',
      text: '帝曰：何以异之？岐伯曰：肺咳之状，咳而喘息有音，甚则唾血。心咳之状，咳则心痛，喉中介介如梗状，甚则咽肿喉痹。肝咳之状，咳则两胁下痛，甚则不可以转，转则两胠下满。脾咳之状，咳则右胁下痛，阴阴引肩背，甚则不可以动，动则咳剧。肾咳之状，咳则腰背相引而痛，甚则咳涎。' },
    { part: '四、病症', article: '咳论', title: '六腑咳',
      text: '帝曰：六府之咳奈何？安所受病？岐伯曰：五藏之久咳，乃移于六府。脾咳不已，则胃受之。胃咳之状，咳而呕，呕甚则长虫出。肝咳不已，则胆受之。胆咳之状，咳呕胆汁。肺咳不已，则大肠受之。大肠咳状，咳而遗矢。心咳不已，则小肠受之。小肠咳状，咳而失气，气与咳俱失。肾咳不已，则膀胱受之。膀胱咳状，咳而遗溺，久咳不已，则三焦受之，三焦咳状，咳而腹满，不欲食饮。此皆聚于胃，关于肺，使人多涕唾，而面浮肿气逆也。' },
    { part: '四、病症', article: '咳论', title: '咳之治',
      text: '帝曰：治之奈何？岐伯曰：治藏者，治其俞；治府者，治其合；浮肿者，治其经。帝曰：善。' },
    { part: '四、病症', article: '痹论', title: '痹之成因与分类', tag: '重点',
      text: '黄帝问曰：痹之安生？岐伯对曰：风、寒、湿三气杂至，合而为痹也。其风气胜者，为行痹；寒气胜者，为痛痹；湿气胜者，为着痹也。帝曰：其有五者，何也？岐伯曰：以冬遇此者为骨痹，以春遇此者为筋痹，以夏遇此者为脉痹，以至阴遇此者为肌痹，以秋遇此者为皮痹。' },
    { part: '四、病症', article: '痹论', title: '五脏痹', tag: '重点',
      text: '帝曰：内舍五藏六府，何气使然？岐伯曰：五藏皆有合，病久而不去者，内舍于其合也。故骨痹不已复感于邪，内舍于肾；筋痹不已，复感于邪，内舍于肝；脉痹不已，复感于邪，内舍于心；肌痹不已，复感于邪，内舍于脾；皮痹不已，复感于邪，内舍于肺。所谓痹者，各以其时重感于风寒湿之气也。' },
    { part: '四、病症', article: '痹论', title: '五脏痹证',
      text: '凡痹之客五藏者，肺痹者，烦满，喘而呕；心痹者，脉不通，烦则心下鼓，暴上气而喘，嗌干，善噫，厥气上则恐；肝痹者，夜卧则惊，多饮，数小便，上为引如怀；肾痹者，善胀，尻以代踵，脊以代头；脾痹者，四支解堕，发咳，呕汁，上为大塞。肠痹者，数饮而出不得，中气喘争，时发飧泄。胞痹者，少腹膀胱按之内痛，若沃以汤，涩于小便，上为清涕。' },
    { part: '四、病症', article: '痹论', title: '阴气与痹聚',
      text: '阴气者，静则神藏，躁则消亡。饮食自倍，肠胃乃伤。淫气喘息，痹聚在肺。淫气忧思，痹聚在心。淫气遗溺，痹聚在肾。淫气乏竭，痹聚在肝。淫气肌绝，痹聚在脾。' },
    { part: '四、病症', article: '痹论', title: '痹之预后',
      text: '诸痹不已，亦益内也。其风气胜者，其人易已也。' },
    { part: '四、病症', article: '痹论', title: '痹之预后区别',
      text: '帝曰：痹，其时有死者，或疼久者，或易已者，其故何也？岐伯曰：其入藏者死，其留连筋骨间者疼久，其留皮肤间者易已。' },
    { part: '四、病症', article: '痹论', title: '六腑痹',
      text: '帝曰：其客于六府者，何也？岐伯曰：此亦其食饮居处，为其病本也。六府亦各有俞，风寒湿气中其俞，而食饮应之，循俞而入，各舍其府也。' },
    { part: '四、病症', article: '痹论', title: '痹之针治',
      text: '帝曰：以针治之奈何？岐伯曰：五藏有俞，六府有合，循脉之分，各有所发，各随其过，则病瘳也。' },
    { part: '四、病症', article: '痹论', title: '营卫与痹',
      text: '帝曰：荣卫之气，亦令人痹乎？岐伯曰：荣者，水谷之精气也，和调于五藏，洒陈于六府，乃能入于脉也。故循脉上下，贯五藏，络六府也。卫者，水谷之悍气也，其气慓疾滑利，不能入于脉也。故循皮肤之中，分肉之间，熏于肓膜，散于胸腹。逆其气则病，从其气则愈，不与风寒湿气合，故不为痹。' },
    { part: '四、病症', article: '痹论', title: '痹之痛与不痛',
      text: '帝曰：善。痹或痛，或不痛，或不仁，或寒，或热，或燥，或湿，其故何也？岐伯曰：痛者，寒气多也，有寒故痛也。其不痛不仁者，病久入深，荣卫之行涩，经络时疏，故不通；皮肤不荣，故为不仁。其寒者，阳气少，阴气多，与病相益，故寒也。其热者，阳气多，阴气少，病气胜，阳遭阴，故为痹热。其多汗而濡者，此其逢湿甚也，阳气少，阴气盛，两气相感，故汗出而濡也。' },
    { part: '四、病症', article: '痹论', title: '痹在于五体',
      text: '帝曰：夫痹之为病，不痛何也？岐伯曰：痹在于骨则重，在于脉则血凝而不流，在于筋则屈不伸，在于肉则不仁，在于皮则寒，故具此五者，则不痛也。凡痹之类，逢寒则虫，逢热则纵。帝曰：善。' },
    { part: '四、病症', article: '痿论', title: '五脏使人痿',
      text: '黄帝问曰：五藏使人痿，何也？岐伯对曰：肺主身之皮毛，心主身之血脉，肝主身之筋膜，脾主身之肌肉，肾主身之骨髓。故肺热叶焦，则皮毛虚弱急薄，着则生痿躄也。心气热，则下脉厥而上，上则下脉虚，虚则生脉痿，枢折挈，胫纵而不任地也。肝气热，则胆泄口苦，筋膜干，筋膜干则筋急而挛，发为筋痿，脾气热，则胃干而渴，肌肉不仁，发为肉痿。肾气热，则腰脊不举，骨枯而髓减，发为骨痿。' },
    { part: '四、病症', article: '痿论', title: '痿之成因',
      text: '帝曰：何以得之？岐伯曰：肺者，藏之长也，为心之盖也，有所失亡，所求不得，则发肺鸣，鸣则肺热叶焦。故曰：五藏因肺热叶焦，发为痿躄。此之谓也。悲哀太甚，则胞络绝，胞络绝则阳气内动，发则心下崩，数溲血也。故《本病》曰：大经空虚，发为肌痹，传为脉痿。思想无穷，所愿不得，意淫于外，入房太甚，宗筋弛纵，发为筋痿，及为白淫。故《下经》曰：筋痿者，生于肝，使内也。有渐于湿，以水为事，若有所留，居处相湿，肌肉濡渍，痹而不仁，发为肉痿。故《下经》曰：肉痿者，得之湿地也。有所远行劳倦，逢大热而渴，渴则阳气内伐，内伐则热舍于肾。肾者水藏也，今水不胜火，则骨枯而髓虚，故足不任身，发为骨痿。故《下经》曰：骨痿者，生于大热也。' },
    { part: '四、病症', article: '痿论', title: '五脏热之色诊',
      text: '帝曰：何以别之？岐伯曰：肺热者，色白而毛败；心热者，色赤而络脉溢；肝热者，色苍而爪枯；脾热者，色黄而肉蠕动；肾热者，色黑而齿槁。' },
    { part: '四、病症', article: '痿论', title: '治痿独取阳明', tag: '重点',
      text: '帝曰：如夫子言可矣。论言治痿者，独取阳明何也？岐伯曰：阳明者，五藏六府之海，主润宗筋，宗筋主束骨而利机关也。冲脉者，经脉之海也，主渗灌溪谷，与阳明合于宗筋。阴阳总宗筋之会，会于气街，而阳明为之长，皆属于带脉，而络于督脉。故阳明虚，则宗筋纵，带脉不引，故足痿不用也。帝曰：治之余何？岐伯曰：各补其荥而通其俞，调其虚实，和其逆顺，筋脉骨肉，各以其时受月，则病已矣。帝曰：善。' },
    { part: '四、病症', article: '水胀', title: '水胀',
      text: '黄帝问于岐伯曰：水与肤胀、鼓胀、肠覃、石瘕、石水，何以别之？岐伯答曰：水始起也，目窠上微肿，如新卧起之状，其颈脉动，时咳，阴股间寒，足胫肿，腹乃大，其水已成矣。以手按其腹，随手而起，如裹水之状，此其候也。' },
    { part: '四、病症', article: '水胀', title: '肤胀',
      text: '黄帝曰：肤胀何以候之？岐伯曰：肤胀者，寒气客于皮肤之间，𪔣𪔣然不坚，腹大，身尽肿，皮厚，按其腹，窅而不起，腹色不变，此其候也。' },
    { part: '四、病症', article: '水胀', title: '鼓胀',
      text: '鼓胀何如？岐伯曰：腹胀身皆大，大与肤胀等也，色苍黄，腹筋起，此其候也。' },
    { part: '四、病症', article: '水胀', title: '肠覃',
      text: '肠覃何如？岐伯曰：寒气客于肠外，与卫气相搏，气不得荣，因有所系，癖而内著，恶气乃起，瘜肉乃生。其始生也，大如鸡卵，稍以益大，至其成，如怀子之状，久者离岁，按之则坚，推之则移，月事以时下，此其候也。' },
    { part: '四、病症', article: '水胀', title: '石瘕',
      text: '石瘕何如？岐伯曰：石瘕生于胞中，寒气客于子门，子门闭塞，气不得通，恶血当写不写，衃以留止。日以益大，状如怀子，月事不以时下。皆生于女子，可导而下。' },
    { part: '四、病症', article: '水胀', title: '肤胀鼓胀之刺',
      text: '黄帝曰：肤胀、鼓胀，可刺邪？岐伯曰：先写其胀之血络，后调其经，刺去其血络也。' },

    /* ========== 五、诊法 ========== */
    { part: '五、诊法', article: '脉要精微论', title: '诊法常以平旦', tag: '重点',
      text: '黄帝问曰：诊法何如？岐伯对曰：诊法常以平旦，阴气未动，阳气未散，饮食未进，经脉未盛，络脉调匀，气血未乱，故乃可诊有过之脉。切脉动静，而视精明，察五色，观五藏有余不足，六府强弱，形之盛衰，以此参伍，决死生之分。' },
    { part: '五、诊法', article: '脉要精微论', title: '脉象主病',
      text: '夫脉者，血之府也。长则气治；短则气病；数则烦心；大则病进；上盛则气高；下盛则气胀；代则气衰；细则气少；涩则心痛；浑浑革至如涌泉，病进而色弊；绵绵其去如弦绝，死。' },
    { part: '五、诊法', article: '脉要精微论', title: '精明五色',
      text: '夫精明五色者，气之华也。赤欲如白裹朱，不欲如赭；白欲如鹅羽，不欲如盐，青欲如苍璧之泽，不欲如蓝；黄欲如罗裹雄黄，不欲如黄土；黑欲如重漆色，不欲如地苍。五色精微象见矣，其寿不久也。夫精明者，所以视万物，别白黑，审短长，以长为短，以白为黑，如是则精衰矣。' },
    { part: '五、诊法', article: '脉要精微论', title: '五脏之中守',
      text: '五藏者，中之守也。中盛藏满，气胜伤恐者，声如从室中言，是中气之湿也；言而微，终日乃复言者，此夺气也；衣被不敛，言语善恶不避亲疏者，此神明之乱也；仓廪不藏者，是门户不要也；水泉不止者，是膀胱不藏也。得守者生，失守者死。' },
    { part: '五、诊法', article: '脉要精微论', title: '五脏身之强',
      text: '夫五藏者，身之强也。头者，精明之府，头倾视深，精神将夺矣；背者，胸中之府，背曲肩随，府将坏矣；腰者，肾之府，转摇不能，肾将惫矣；膝者，筋之府，屈伸不能，行则偻附，筋将惫矣；骨者，髓之府，不能久立，行则振掉，骨将惫矣。得强则生，失强则死。' },
    { part: '五、诊法', article: '脉要精微论', title: '脉应四时', tag: '重点',
      text: '帝曰：脉其四时动奈何？知病之所在奈何？知病之所变奈何？知病乍在内奈何？知病乍在外奈何？请问此五者，可得闻乎？岐伯曰：请言其与天运转大也。万物之外，六合之内，天地之变，阴阳之应，彼春之暖，为夏之暑，彼秋之忿，为冬之怒。四变之动，脉与之上下，以春应中规，夏应中矩，秋应中衡，冬应中权。是故冬至四十五日，阳气微上，阴气微下；夏至四十五日，阴气微上，阳气微下。阴阳有时，与脉为期，期而相失，知脉所分，分之有期，故知死时。微妙在脉，不可不察，察之有纪，从阴阳始，始之有经，从五行生，生之有度，四时为宜。补泻勿失，与天地如一，得一之情，以知死生。是故声合五音，色合五行，脉合阴阳。' },
    { part: '五、诊法', article: '脉要精微论', title: '持脉有道', tag: '重点',
      text: '是故持脉有道，虚静为保。春日浮，如鱼之游在波；夏日在肤，泛泛乎万物有余；秋日下肤，蛰虫将去；冬日在骨，蛰虫周密，君子居室。故曰：知内者按而纪之，知外者终而始之。此六者，持脉之大法。' },
    { part: '五、诊法', article: '平人气象论', title: '平人之脉', tag: '重点',
      text: '黄帝问曰：平人何如？岐伯对曰：人一呼脉再动，一吸脉亦再动，呼吸定息脉五动，闰以太息，命曰平人。平人者，不病也。常以不病调病人，医不病，故为病人平息以调之为法。人一呼脉一动，一吸脉一动，曰少气。人一呼脉三动，一吸脉三动而躁，尺热曰病温，尺不热脉滑曰病风，脉涩曰痹。人一呼吸脉四动以上曰死，脉绝不至曰死，乍疏乍数曰死。' },
    { part: '五、诊法', article: '平人气象论', title: '脉以胃气为本', tag: '重点',
      text: '平人之常气禀于胃，胃者平人之常气也，人无胃气曰逆，逆者死。春胃微弦曰平，弦多胃少曰肝病，但弦无胃曰死，胃而有毛曰秋病，毛甚曰今病。藏真散于肝，肝藏筋膜之气也。夏胃微钩曰平，钩多胃少曰心病，但钩无胃曰死，胃而有石曰冬病，石甚曰今病。藏真通于心，心藏血脉之气也。长夏胃微软弱曰平，弱多胃少曰脾病，但代无胃曰死，软弱有石曰冬病，弱甚曰今病。藏真濡于脾，脾藏肌肉之气也。秋胃微毛曰平，毛多胃少曰肺病，但毛无胃曰死。毛而有弦曰春病，弦甚曰今病。藏真高于肺，以行营卫阴阳也。冬胃微石曰平，石多胃少曰肾病，但石无胃曰死，石而有钩曰夏病，钩甚曰今病。藏真下于肾，肾藏骨髓之气也。' },
    { part: '五、诊法', article: '平人气象论', title: '虚里', tag: '重点',
      text: '胃之大络，名曰虚里，贯鬲络肺，出于左乳下，其动应衣，脉宗气也。盛喘数绝者，则病在中；结而横，有积矣；绝不至曰死。乳之下，其动应衣，宗气泄也。' },
    { part: '五、诊法', article: '玉机真脏论', title: '五脏受气传变', tag: '重点',
      text: '五藏受气于其所生，传之于其所胜，气舍于其所生，死于其所不胜。病之且死，必先传行，至其所不胜，病乃死。此言气之逆行也，故死。肝受气于心，传之于脾，气舍于肾，至肺而死。心受气于脾，传之于肺，气舍于肝，至肾而死。脾受气于肺，传之于肾，气舍于心，至肝而死。肺受气于肾，传之于肝，气舍于脾，至心而死。肾受气于肝，传之于心，气舍于肺，至脾而死。此皆逆死也，一日一夜五分之，此所以占死生之早暮也。黄帝曰：五藏相通，移皆有次。五藏有病，则各传其所胜。不治，法三月若六月，若三日若六日，传五藏而当死，是顺传所胜之次。故曰："别于阳者，知病从来；别于阴者，知死生之期。"言知至其所困而死。' },
    { part: '五、诊法', article: '玉机真脏论', title: '五实五虚', tag: '重点',
      text: '黄帝曰：余闻虚实以决死生，愿闻其情。岐伯曰：五实死，五虚死。帝曰：愿闻五实五虚。岐伯曰：脉盛，皮热，腹胀，前后不通，闷瞀，此谓五实；脉细、皮寒、气少、泄利前后、饮食不入，此谓五虚。帝曰：其时有生者何也？岐伯曰：浆粥入胃，泄注止，则虚者活；身汗得后利，则实者活。此其候也。' },

    /* ========== 六、治则治法 ========== */
    { part: '六、治则治法', article: '异法方宜论', title: '异法方宜',
      text: '黄帝曰：医之治病也，一病而治各不同，皆愈何也？岐伯对曰：地势使然也。故东方之域，天地之所始生也。鱼盐之地，海滨傍水，其民食鱼而嗜咸，皆安其处，美其食。鱼者，使人热中，盐者胜血，故其民皆黑色疏理，其病皆为痈疡，其治宜砭石。故砭石者，亦从东方来。西方者，金玉之域，沙石之处，天地之所收引也。其民陵居而多风，水土刚强，其民不衣而褐荐，其民华食而脂肥，故邪不能伤其形体，其病生于内，其治宜毒药。故毒药者，亦从西方来。北方者，天地所闭藏之域也。其地高陵居，风寒冰冽。其民乐野处而乳食，藏寒生满病，其治宜灸焫。故灸焫者，亦从北方来。南方者，天地所长养，阳之所盛处也。其地下，水土弱，雾露之所聚也。其民嗜酸而食胕，故其民皆致理而赤色，其病挛痹，其治宜微针。故九针者，亦从南方来。中央者，其地平以湿，天地所以生万物也众。其民食杂而不劳，故其病多痿厥寒热，其治宜导引按跷。故导引按跷者，亦从中央出也。故圣人杂合以治，各得其所宜。故治所以异而病皆愈者，得病之情，知治之大体也。' },
    { part: '六、治则治法', article: '汤液醪醴论', title: '汤液醪醴',
      text: '黄帝曰：为五谷汤液及醪醴奈何？岐伯对曰：必以稻米，炊之稻薪，稻米者完，稻薪者坚。帝曰：何以然？岐伯曰：此得天地之和，高下之宜，故能至完：伐取得时，故能至坚也。' },
    { part: '六、治则治法', article: '汤液醪醴论', title: '神不使',
      text: '帝曰：上古圣人作汤液醪醴，为而不用，何也？岐伯曰：自古圣人之作汤液醪醴者，以为备耳。夫上古作汤液，故为而弗服也。中古之世，道德稍衰，邪气时至，服之万全。帝曰：今之世，不必已，何也。岐伯曰：当今之世，必齐毒药攻其中，镵石、针艾治其外也。帝曰：形弊血尽而功不立者何？岐伯曰：神不使也。帝曰：何谓神不使？岐伯曰：针石，道也。精神不进，志意不治，故病不可愈。今精坏神去，荣卫不可复收，何者？嗜欲无穷，而忧患不止，精气弛坏，荣泣卫除，故神去之而病不愈也。帝曰：夫病之始生也，极微极精，必先入结于皮肤，今良工皆称曰病成，名曰逆，则针石不能治，良药不能及也。今良工皆得其法，守其数，亲戚兄弟远近，音声日闻于耳，五色日见于目，而病不愈者，亦何暇不早乎？岐伯曰：病为本，工为标，标本不得，邪气不服，此之谓也。' },
    { part: '六、治则治法', article: '汤液醪醴论', title: '水肿治法', tag: '重点',
      text: '帝曰：其有不从毫毛而生，五藏阳以竭也，津液充郭，其魄独居，孤精于内，气耗于外，形不可与衣相保，此四极急而动中，是气拒于内，而形施于外，治之奈何？岐伯曰：平治于权衡，去宛陈莝，微动四极，温衣，缪刺其处，以复其形；开鬼门，洁净府，精以时服，五阳已布，疏涤五藏，故精自生，形自盛，骨肉相保，巨气乃平。帝曰：善。' },
    { part: '六、治则治法', article: '标本病传论', title: '标本逆从',
      text: '黄帝问曰：病有标本，刺有逆从，奈何？岐伯对曰：凡刺之方，必别阴阳，前后相应，逆从得施，标本相移。故曰有其在标而求之于标，有其在本而求之于本，有其在本而求之于标，有其在标而求之于本。故治有取标而得者，有取本而得者，有逆取而得者，有从取而得者。故知逆与从，正行无问，知标本者，万举万当，不知标本，是谓妄行。' },
    { part: '六、治则治法', article: '标本病传论', title: '标本之道',
      text: '夫阴阳、逆从、标本之为道也，小而大，言一而知百病之害。少而多，浅而博，可以言一而知百也。以浅而知深，察近而知远。言标与本，易而勿及。' },
    { part: '六、治则治法', article: '标本病传论', title: '标本先后治则',
      text: '治反为逆，治得为从。先病而后逆者治其本，先逆而后病者治其本；先寒而后生病者治其本，先病而后生寒者治其本；先热而后生病者治其本，先热而后生中满者治其标；先病而后泄者治其本，先泄而后生他病者治其本，必且调之，乃治其他病。先病而后生中满者治其标，先中满而后烦心者治其本。人有客气有同气。小大不利治其标，小大利治其本。病发而有余，本而标之，先治其本，后治其标；病发而不足，标而本之，先治其标，后治其本。谨察间甚，以意调之，间者并行，甚者独行，先小大不利而后生病者治其本。' },

    /* ========== 七、养生 ========== */
    { part: '七、养生', article: '上古天真论', title: '上古之人养生', tag: '重点',
      text: '岐伯对曰：上古之人，其知道者，法于阴阳，和于术数，食饮有节，起居有常，不妄作劳，故能形与神俱，而尽终其天年，度百岁乃去。今时之人不然也，以酒为浆，以妄为常，醉以入房，以欲竭其精，以耗散其真，不知持满，不时御神，务快其心，逆于生乐，起居无节，故半百而衰也。' },
    { part: '七、养生', article: '上古天真论', title: '恬淡虚无', tag: '重点',
      text: '夫上古圣人之教下也，皆谓之虚邪贼风，避之有时，恬惔虚无，真气从之，精神内守，病安从来。是以志闲而少欲，心安而不惧，形劳而不倦，气从以顺，各从其欲，皆得所愿。故美其食，任其服，乐其俗，高下不相慕，其民故曰朴。是以嗜欲不能劳其目，淫邪不能惑其心，愚智贤不肖，不惧于物，故合于道。所以能年皆度百岁，而动作不衰者，以其德全不危也。' },
    { part: '七、养生', article: '上古天真论', title: '女七男八', tag: '重点',
      text: '岐伯曰：女子七岁，肾气盛，齿更发长；二七而天癸至，任脉通，太冲脉盛，月事以时下，故有子；三七，肾气平均，故真牙生而长极；四七，筋骨坚，发长极，身体盛壮；五七，阳明脉衰，面始焦，发始堕；六七，三阳脉衰于上，面皆焦，发始白；七七，任脉虚，太冲脉衰少，天癸竭，地道不通，故形坏而无子也。丈夫八岁，肾气实，发长齿更；二八，肾气盛，天癸至，精气溢泻，阴阳和，故能有子；三八，肾气平均，筋骨劲强，故真牙生而长极；四八，筋骨隆盛，肌肉满壮；五八，肾气衰，发堕齿槁；六八，阳气衰竭于上，面焦，发鬓颁白；七八，肝气衰，筋不能动。八八，天癸竭，精少，肾藏衰，形体皆极，则齿发去。肾者主水，受五藏六府之精而藏之，故五藏盛乃能泻。今五藏皆衰，筋骨解堕，天癸尽矣，故发鬓白，身体重，行步不正，而无子耳。' },
    { part: '七、养生', article: '上古天真论', title: '真人至人圣人贤人',
      text: '黄帝曰：余闻上古有真人者，提挈天地，把握阴阳，呼吸精气，独立守神，肌肉若一，故能寿敝天地，无有终时，此其道生。中古之时，有至人者，淳德全道，和于阴阳，调于四时，去世离俗，积精全神，游行天地之间，视听八达之外，此盖益其寿命而强者也，亦归于真人。其次，有圣人者，处天地之和，从八风之理，适嗜欲于世俗之间，无恚嗔之心，行不欲离于世，举不欲观于俗，外不劳形于事，内无思想之患，以恬愉为务，以自得为功，形体不敝，精神不散，亦可以百数。其次，有贤人者，法则天地，象似日月，辨列星辰，逆从阴阳，分别四时，将从上古，合同于道，亦可使益寿而有极时。' },
    { part: '七、养生', article: '四气调神大论', title: '四时养生',
      text: '春三月，此谓发陈。天地俱生，万物以荣，夜卧早起，广步于庭，被发缓形，以使志生，生而勿杀，予而勿夺，赏而勿罚，此春气之应，养生之道也。逆之则伤肝，夏为寒变，奉长者少。夏三月，此为蕃秀。天地气交，万物华实，夜卧早起，无厌于日，使志无怒，使华英成秀，使气得泄，若所爱在外，此夏气之应，养长之道也。逆之则伤心，秋为痎疟，奉收者少，冬至重病。秋三月，此谓容平。天气以急，地气以明，早卧早起，与鸡俱兴，使志安宁，以缓秋刑，收敛神气，使秋气平，无外其志，使肺气清。此秋气之应，养收之道也。逆之则伤肺，冬为飧泄，奉藏者少。冬三月，此谓闭藏。水冰地坼，无扰乎阳，早卧晚起，必待日光，使志若伏若匿，若有私意，若已有得，去寒就温，无泄皮肤，使气亟夺。此冬气之应，养藏之道也。逆之则伤肾，春为痿厥，奉生者少。' },
    { part: '七、养生', article: '四气调神大论', title: '天气清净',
