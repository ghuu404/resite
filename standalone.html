window.AUDIO_INDEX = {"L1-nj-0": [{"f": "audio/63/L1-nj-0__0.mp3", "t": "上古之人，"}, {"f": "audio/63/L1-nj-0__1.mp3", "t": "其知道者，"}, {"f": "audio/63/L1-nj-0__2.mp3", "t": "法于阴阳，"}, {"f": "audio/63/L1-nj-0__3.mp3", "t": "和于术数，"}, {"f": "audio/63/L1-nj-0__4.mp3", "t": "食饮有节，"}, {"f": "audio/63/L1-nj-0__5.mp3", "t": "起居有常，"}, {"f": "audio/63/L1-nj-0__6.mp3", "t": "不妄作劳，"}, {"f": "audio/63/L1-nj-0__7.mp3", "t": "故能形与神俱，"}, {"f": "audio/63/L1-nj-0__8.mp3", "t": "而尽终其天年，"}, {"f": "audio/63/L1-nj-0__9.mp3", "t": "度百岁乃去。"}], "L1-nj-1": [{"f": "audio/27/L1-nj-1__0.mp3", "t": "虚邪贼风，"}, {"f": "audio/27/L1-nj-1__1.mp3", "t": "避之有时，"}, {"f": "audio/27/L1-nj-1__2.mp3", "t": "恬淡虚无，"}, {"f": "audio/27/L1-nj-1__3.mp3", "t": "真气从之，"}, {"f": "audio/27/L1-nj-1__4.mp3", "t": "精神内守，"}, {"f": "audio/27/L1-nj-1__5.mp3", "t": "病安从来。"}], "L1-nj-2": [{"f": "audio/e0/L1-nj-2__0.mp3", "t": "女子七岁肾气盛，"}, {"f": "audio/e0/L1-nj-2__1.mp3", "t": "齿更发长。"}, {"f": "audio/e0/L1-nj-2__2.mp3", "t": "二七而天癸至，"}, {"f": "audio/e0/L1-nj-2__3.mp3", "t": "任脉通，"}, {"f": "audio/e0/L1-nj-2__4.mp3", "t": "太冲脉盛，"}, {"f": "audio/e0/L1-nj-2__5.mp3", "t": "月事以时下，"}, {"f": "audio/e0/L1-nj-2__6.mp3", "t": "故有子。"}, {"f": "audio/e0/L1-nj-2__7.mp3", "t": "三七肾气平均，"}, {"f": "audio/e0/L1-nj-2__8.mp3", "t": "故真牙生而长极。"}, {"f": "audio/e0/L1-nj-2__9.mp3", "t": "四七筋骨坚，"}, {"f": "audio/e0/L1-nj-2__10.mp3", "t": "发长极，"}, {"f": "audio/e0/L1-nj-2__11.mp3", "t": "身体盛壮。"}, {"f": "audio/e0/L1-nj-2__12.mp3", "t": "五七阳明脉衰，"}, {"f": "audio/e0/L1-nj-2__13.mp3", "t": "面始焦，"}, {"f": "audio/e0/L1-nj-2__14.mp3", "t": "发始堕。"}, {"f": "audio/e0/L1-nj-2__15.mp3", "t": "六七三阳脉衰于上，"}, {"f": "audio/e0/L1-nj-2__16.mp3", "t": "面皆焦，"}, {"f": "audio/e0/L1-nj-2__17.mp3", "t": "发始白。"}, {"f": "audio/e0/L1-nj-2__18.mp3", "t": "七七任脉虚，"}, {"f": "audio/e0/L1-nj-2__19.mp3", "t": "太冲脉衰少，"}, {"f": "audio/e0/L1-nj-2__20.mp3", "t": "天癸竭，"}, {"f": "audio/e0/L1-nj-2__21.mp3", "t": "地道不通，"}, {"f": "audio/e0/L1-nj-2__22.mp3", "t": "故形坏而无子也。"}, {"f": "audio/e0/L1-nj-2__23.mp3", "t": "丈夫八岁肾气实，"}, {"f": "audio/e0/L1-nj-2__24.mp3", "t": "发长齿更。"}, {"f": "audio/e0/L1-nj-2__25.mp3", "t": "二八肾气盛，"}, {"f": "audio/e0/L1-nj-2__26.mp3", "t": "天癸至，"}, {"f": "audio/e0/L1-nj-2__27.mp3", "t": "精气溢泻，"}, {"f": "audio/e0/L1-nj-2__28.mp3", "t": "阴阳和，"}, {"f": "audio/e0/L1-nj-2__29.mp3", "t": "故能有子。"}, {"f": "audio/e0/L1-nj-2__30.mp3", "t": "三八肾气平均，"}, {"f": "audio/e0/L1-nj-2__31.mp3", "t": "筋骨劲强，"}, {"f": "audio/e0/L1-nj-2__32.mp3", "t": "故真牙生而长极。"}, {"f": "audio/e0/L1-nj-2__33.mp3", "t": "四八筋骨隆盛，"}, {"f": "audio/e0/L1-nj-2__34.mp3", "t": "肌肉满壮。"}, {"f": "audio/e0/L1-nj-2__35.mp3", "t": "五八肾气衰，"}, {"f": "audio/e0/L1-nj-2__36.mp3", "t": "发堕齿槁。"}, {"f": "audio/e0/L1-nj-2__37.mp3", "t": "六八阳气衰竭于上，"}, {"f": "audio/e0/L1-nj-2__38.mp3", "t": "面焦，"}, {"f": "audio/e0/L1-nj-2__39.mp3", "t": "发鬓颁白。"}, {"f": "audio/e0/L1-nj-2__40.mp3", "t": "七八肝气衰，"}, {"f": "audio/e0/L1-nj-2__41.mp3", "t": "筋不能动，"}, {"f": "audio/e0/L1-nj-2__42.mp3", "t": "天癸竭，"}, {"f": "audio/e0/L1-nj-2__43.mp3", "t": "精少，"}, {"f": "audio/e0/L1-nj-2__44.mp3", "t": "肾脏衰，"}, {"f": "audio/e0/L1-nj-2__45.mp3", "t": "形体皆极。"}, {"f": "audio/e0/L1-nj-2__46.mp3", "t": "八八则齿发去。"}, {"f": "audio/e0/L1-nj-2__47.mp3", "t": "肾者主水，"}, {"f": "audio/e0/L1-nj-2__48.mp3", "t": "受五脏六腑之精而藏之，"}, {"f": "audio/e0/L1-nj-2__49.mp3", "t": "故五脏盛，"}, {"f": "audio/e0/L1-nj-2__50.mp3", "t": "乃能泻。"}, {"f": "audio/e0/L1-nj-2__51.mp3", "t": "今五脏皆衰，"}, {"f": "audio/e0/L1-nj-2__52.mp3", "t": "筋骨解堕，"}, {"f": "audio/e0/L1-nj-2__53.mp3", "t": "天癸尽矣，"}, {"f": "audio/e0/L1-nj-2__54.mp3", "t": "故发鬓白，"}, {"f": "audio/e0/L1-nj-2__55.mp3", "t": "身体重，"}, {"f": "audio/e0/L1-nj-2__56.mp3", "t": "行步不正，"}, {"f": "audio/e0/L1-nj-2__57.mp3", "t": "而无子耳。"}], "L1-nj-3": [{"f": "audio/cd/L1-nj-3__0.mp3", "t": "夫四时阴阳者，"}, {"f": "audio/cd/L1-nj-3__1.mp3", "t": "万物之根本也。"}, {"f": "audio/cd/L1-nj-3__2.mp3", "t": "所以圣人春夏养阳，"}, {"f": "audio/cd/L1-nj-3__3.mp3", "t": "秋冬养阴，"}, {"f": "audio/cd/L1-nj-3__4.mp3", "t": "以从其根。"}], "L1-nj-4": [{"f": "audio/f0/L1-nj-4__0.mp3", "t": "是故圣人不治已病治未病，"}, {"f": "audio/f0/L1-nj-4__1.mp3", "t": "不治已乱治未乱，"}, {"f": "audio/f0/L1-nj-4__2.mp3", "t": "此之谓也。"}, {"f": "audio/f0/L1-nj-4__3.mp3", "t": "夫病已成而后药之，"}, {"f": "audio/f0/L1-nj-4__4.mp3", "t": "乱已成而后治之，"}, {"f": "audio/f0/L1-nj-4__5.mp3", "t": "譬犹渴而穿井，"}, {"f": "audio/f0/L1-nj-4__6.mp3", "t": "斗而铸锥，"}, {"f": "audio/f0/L1-nj-4__7.mp3", "t": "不亦晚乎？"}], "L1-nj-5": [{"f": "audio/4d/L1-nj-5__0.mp3", "t": "阳气者，"}, {"f": "audio/4d/L1-nj-5__1.mp3", "t": "若天与日，"}, {"f": "audio/4d/L1-nj-5__2.mp3", "t": "失其所则折寿而不彰，"}, {"f": "audio/4d/L1-nj-5__3.mp3", "t": "故天运当以日光明。"}], "L1-nj-6": [{"f": "audio/3f/L1-nj-6__0.mp3", "t": "因于露风，"}, {"f": "audio/3f/L1-nj-6__1.mp3", "t": "乃生寒热。"}, {"f": "audio/3f/L1-nj-6__2.mp3", "t": "是以春伤于风，"}, {"f": "audio/3f/L1-nj-6__3.mp3", "t": "邪气留连，"}, {"f": "audio/3f/L1-nj-6__4.mp3", "t": "乃为洞泄；"}, {"f": "audio/3f/L1-nj-6__5.mp3", "t": "夏伤于暑，"}, {"f": "audio/3f/L1-nj-6__6.mp3", "t": "秋为痎疟；"}, {"f": "audio/3f/L1-nj-6__7.mp3", "t": "秋伤于湿，"}, {"f": "audio/3f/L1-nj-6__8.mp3", "t": "冬逆而咳，"}, {"f": "audio/3f/L1-nj-6__9.mp3", "t": "发为痿厥；"}, {"f": "audio/3f/L1-nj-6__10.mp3", "t": "冬伤于寒，"}, {"f": "audio/3f/L1-nj-6__11.mp3", "t": "春必温病。"}], "L1-nj-7": [{"f": "audio/d5/L1-nj-7__0.mp3", "t": "阳气者，"}, {"f": "audio/d5/L1-nj-7__1.mp3", "t": "烦劳则张，"}, {"f": "audio/d5/L1-nj-7__2.mp3", "t": "精绝，"}, {"f": "audio/d5/L1-nj-7__3.mp3", "t": "辟积于夏，"}, {"f": "audio/d5/L1-nj-7__4.mp3", "t": "使人煎厥；"}, {"f": "audio/d5/L1-nj-7__5.mp3", "t": "目盲不可以视，"}, {"f": "audio/d5/L1-nj-7__6.mp3", "t": "耳闭不可以听，"}, {"f": "audio/d5/L1-nj-7__7.mp3", "t": "溃溃乎若坏都，"}, {"f": "audio/d5/L1-nj-7__8.mp3", "t": "汩汩乎不可止。"}], "L1-nj-8": [{"f": "audio/70/L1-nj-8__0.mp3", "t": "阳气者，"}, {"f": "audio/70/L1-nj-8__1.mp3", "t": "精则养神，"}, {"f": "audio/70/L1-nj-8__2.mp3", "t": "柔则养筋。"}], "L1-nj-9": [{"f": "audio/16/L1-nj-9__0.mp3", "t": "故病久则传化，"}, {"f": "audio/16/L1-nj-9__1.mp3", "t": "上下不并，"}, {"f": "audio/16/L1-nj-9__2.mp3", "t": "良医弗为。"}], "L1-nj-10": [{"f": "audio/84/L1-nj-10__0.mp3", "t": "故阳气者，"}, {"f": "audio/84/L1-nj-10__1.mp3", "t": "一日而主外，"}, {"f": "audio/84/L1-nj-10__2.mp3", "t": "平旦人气生，"}, {"f": "audio/84/L1-nj-10__3.mp3", "t": "日中而阳气隆，"}, {"f": "audio/84/L1-nj-10__4.mp3", "t": "日西而阳气已虚，"}, {"f": "audio/84/L1-nj-10__5.mp3", "t": "气门乃闭。"}, {"f": "audio/84/L1-nj-10__6.mp3", "t": "是故暮而收拒，"}, {"f": "audio/84/L1-nj-10__7.mp3", "t": "无扰筋骨，"}, {"f": "audio/84/L1-nj-10__8.mp3", "t": "无见雾露，"}, {"f": "audio/84/L1-nj-10__9.mp3", "t": "反此三时，"}, {"f": "audio/84/L1-nj-10__10.mp3", "t": "形乃困薄。"}], "L1-nj-11": [{"f": "audio/dc/L1-nj-11__0.mp3", "t": "阴者，"}, {"f": "audio/dc/L1-nj-11__1.mp3", "t": "藏精而起亟也；"}, {"f": "audio/dc/L1-nj-11__2.mp3", "t": "阳者，"}, {"f": "audio/dc/L1-nj-11__3.mp3", "t": "卫外而为固也。"}], "L1-nj-12": [{"f": "audio/52/L1-nj-12__0.mp3", "t": "凡阴阳之要，"}, {"f": "audio/52/L1-nj-12__1.mp3", "t": "阳密乃固。"}, {"f": "audio/52/L1-nj-12__2.mp3", "t": "两者不和，"}, {"f": "audio/52/L1-nj-12__3.mp3", "t": "若春无秋，"}, {"f": "audio/52/L1-nj-12__4.mp3", "t": "若冬无夏。"}, {"f": "audio/52/L1-nj-12__5.mp3", "t": "因而和之，"}, {"f": "audio/52/L1-nj-12__6.mp3", "t": "是谓圣度。"}], "L1-nj-13": [{"f": "audio/55/L1-nj-13__0.mp3", "t": "阴之所生，"}, {"f": "audio/55/L1-nj-13__1.mp3", "t": "本在五味；"}, {"f": "audio/55/L1-nj-13__2.mp3", "t": "阴之五宫，"}, {"f": "audio/55/L1-nj-13__3.mp3", "t": "伤在五味。"}], "L1-nj-14": [{"f": "audio/22/L1-nj-14__0.mp3", "t": "是故谨和五味，"}, {"f": "audio/22/L1-nj-14__1.mp3", "t": "骨正筋柔，"}, {"f": "audio/22/L1-nj-14__2.mp3", "t": "气血以流，"}, {"f": "audio/22/L1-nj-14__3.mp3", "t": "腠理以密，"}, {"f": "audio/22/L1-nj-14__4.mp3", "t": "如是则骨气以精，"}, {"f": "audio/22/L1-nj-14__5.mp3", "t": "谨道如法，"}, {"f": "audio/22/L1-nj-14__6.mp3", "t": "长有天命。"}], "L1-nj-15": [{"f": "audio/21/L1-nj-15__0.mp3", "t": "夫精者，"}, {"f": "audio/21/L1-nj-15__1.mp3", "t": "身之本也。"}, {"f": "audio/21/L1-nj-15__2.mp3", "t": "故藏于精者，"}, {"f": "audio/21/L1-nj-15__3.mp3", "t": "春不病温。"}], "L1-nj-16": [{"f": "audio/8c/L1-nj-16__0.mp3", "t": "阴阳者，"}, {"f": "audio/8c/L1-nj-16__1.mp3", "t": "天地之道也，"}, {"f": "audio/8c/L1-nj-16__2.mp3", "t": "万物之纲纪，"}, {"f": "audio/8c/L1-nj-16__3.mp3", "t": "变化之父母，"}, {"f": "audio/8c/L1-nj-16__4.mp3", "t": "生杀之本始，"}, {"f": "audio/8c/L1-nj-16__5.mp3", "t": "神明之府也。"}, {"f": "audio/8c/L1-nj-16__6.mp3", "t": "治病必求于本。"}], "L1-nj-17": [{"f": "audio/50/L1-nj-17__0.mp3", "t": "清气在下，"}, {"f": "audio/50/L1-nj-17__1.mp3", "t": "则生飧泄；"}, {"f": "audio/50/L1-nj-17__2.mp3", "t": "浊气在上，"}, {"f": "audio/50/L1-nj-17__3.mp3", "t": "则生䐜胀。"}, {"f": "audio/50/L1-nj-17__4.mp3", "t": "此阴阳反作，"}, {"f": "audio/50/L1-nj-17__5.mp3", "t": "病之逆从也。"}], "L1-nj-18": [{"f": "audio/eb/L1-nj-18__0.mp3", "t": "故清阳出上窍，"}, {"f": "audio/eb/L1-nj-18__1.mp3", "t": "浊阴出下窍；"}, {"f": "audio/eb/L1-nj-18__2.mp3", "t": "清阳发腠理，"}, {"f": "audio/eb/L1-nj-18__3.mp3", "t": "浊阴走五脏；"}, {"f": "audio/eb/L1-nj-18__4.mp3", "t": "清阳实四肢，"}, {"f": "audio/eb/L1-nj-18__5.mp3", "t": "浊阴归六腑。"}], "L1-nj-19": [{"f": "audio/4e/L1-nj-19__0.mp3", "t": "壮火之气衰，"}, {"f": "audio/4e/L1-nj-19__1.mp3", "t": "少火之气壮。"}, {"f": "audio/4e/L1-nj-19__2.mp3", "t": "壮火食气，"}, {"f": "audio/4e/L1-nj-19__3.mp3", "t": "气食少火。"}, {"f": "audio/4e/L1-nj-19__4.mp3", "t": "壮火散气，"}, {"f": "audio/4e/L1-nj-19__5.mp3", "t": "少火生气。"}], "L1-nj-20": [{"f": "audio/4a/L1-nj-20__0.mp3", "t": "风胜则动，"}, {"f": "audio/4a/L1-nj-20__1.mp3", "t": "热胜则肿，"}, {"f": "audio/4a/L1-nj-20__2.mp3", "t": "燥胜则干，"}, {"f": "audio/4a/L1-nj-20__3.mp3", "t": "寒胜则浮，"}, {"f": "audio/4a/L1-nj-20__4.mp3", "t": "湿胜则濡泻。"}], "L1-nj-21": [{"f": "audio/6e/L1-nj-21__0.mp3", "t": "天有四时五行，"}, {"f": "audio/6e/L1-nj-21__1.mp3", "t": "以生长收藏，"}, {"f": "audio/6e/L1-nj-21__2.mp3", "t": "以生寒暑燥湿风。"}, {"f": "audio/6e/L1-nj-21__3.mp3", "t": "人有五脏化五气，"}, {"f": "audio/6e/L1-nj-21__4.mp3", "t": "以生喜怒悲忧恐。"}], "L1-nj-22": [{"f": "audio/73/L1-nj-22__0.mp3", "t": "天地者，"}, {"f": "audio/73/L1-nj-22__1.mp3", "t": "万物之上下也；"}, {"f": "audio/73/L1-nj-22__2.mp3", "t": "阴阳者，"}, {"f": "audio/73/L1-nj-22__3.mp3", "t": "血气之男女也；"}, {"f": "audio/73/L1-nj-22__4.mp3", "t": "左右者，"}, {"f": "audio/73/L1-nj-22__5.mp3", "t": "阴阳之道路也；"}, {"f": "audio/73/L1-nj-22__6.mp3", "t": "水火者，"}, {"f": "audio/73/L1-nj-22__7.mp3", "t": "阴阳之征兆也；"}, {"f": "audio/73/L1-nj-22__8.mp3", "t": "阴阳者，"}, {"f": "audio/73/L1-nj-22__9.mp3", "t": "万物之能始也。"}], "L1-nj-23": [{"f": "audio/ff/L1-nj-23__0.mp3", "t": "故邪风之至，"}, {"f": "audio/ff/L1-nj-23__1.mp3", "t": "疾如风雨，"}, {"f": "audio/ff/L1-nj-23__2.mp3", "t": "故善治者治皮毛，"}, {"f": "audio/ff/L1-nj-23__3.mp3", "t": "其次治肌肤，"}, {"f": "audio/ff/L1-nj-23__4.mp3", "t": "其次治筋脉，"}, {"f": "audio/ff/L1-nj-23__5.mp3", "t": "其次治六腑，"}, {"f": "audio/ff/L1-nj-23__6.mp3", "t": "其次治五脏。"}], "L1-nj-24": [{"f": "audio/c0/L1-nj-24__0.mp3", "t": "故善用针者，"}, {"f": "audio/c0/L1-nj-24__1.mp3", "t": "从阴引阳，"}, {"f": "audio/c0/L1-nj-24__2.mp3", "t": "从阳引阴，"}, {"f": "audio/c0/L1-nj-24__3.mp3", "t": "以右治左，"}, {"f": "audio/c0/L1-nj-24__4.mp3", "t": "以左治右。"}], "L1-nj-25": [{"f": "audio/df/L1-nj-25__0.mp3", "t": "善诊者，"}, {"f": "audio/df/L1-nj-25__1.mp3", "t": "察色按脉，"}, {"f": "audio/df/L1-nj-25__2.mp3", "t": "先别阴阳。"}], "L1-nj-26": [{"f": "audio/7b/L1-nj-26__0.mp3", "t": "其高者，"}, {"f": "audio/7b/L1-nj-26__1.mp3", "t": "因而越之；"}, {"f": "audio/7b/L1-nj-26__2.mp3", "t": "其下者，"}, {"f": "audio/7b/L1-nj-26__3.mp3", "t": "引而竭之；"}, {"f": "audio/7b/L1-nj-26__4.mp3", "t": "中满者，"}, {"f": "audio/7b/L1-nj-26__5.mp3", "t": "泻之于内；"}, {"f": "audio/7b/L1-nj-26__6.mp3", "t": "其有邪者，"}, {"f": "audio/7b/L1-nj-26__7.mp3", "t": "渍形以为汗；"}, {"f": "audio/7b/L1-nj-26__8.mp3", "t": "其在皮者，"}, {"f": "audio/7b/L1-nj-26__9.mp3", "t": "汗而发之。"}], "L1-nj-27": [{"f": "audio/62/L1-nj-27__0.mp3", "t": "心者，"}, {"f": "audio/62/L1-nj-27__1.mp3", "t": "君主之官也，"}, {"f": "audio/62/L1-nj-27__2.mp3", "t": "神明出焉。"}, {"f": "audio/62/L1-nj-27__3.mp3", "t": "肺者，"}, {"f": "audio/62/L1-nj-27__4.mp3", "t": "相傅之官，"}, {"f": "audio/62/L1-nj-27__5.mp3", "t": "治节出焉。"}, {"f": "audio/62/L1-nj-27__6.mp3", "t": "肝者，"}, {"f": "audio/62/L1-nj-27__7.mp3", "t": "将军之官，"}, {"f": "audio/62/L1-nj-27__8.mp3", "t": "谋虑出焉。"}, {"f": "audio/62/L1-nj-27__9.mp3", "t": "胆者，"}, {"f": "audio/62/L1-nj-27__10.mp3", "t": "中正之官，"}, {"f": "audio/62/L1-nj-27__11.mp3", "t": "决断出焉。"}, {"f": "audio/62/L1-nj-27__12.mp3", "t": "膻中者，"}, {"f": "audio/62/L1-nj-27__13.mp3", "t": "臣使之官，"}, {"f": "audio/62/L1-nj-27__14.mp3", "t": "喜乐出焉。"}, {"f": "audio/62/L1-nj-27__15.mp3", "t": "脾胃者，"}, {"f": "audio/62/L1-nj-27__16.mp3", "t": "仓廪之官，"}, {"f": "audio/62/L1-nj-27__17.mp3", "t": "五味出焉。"}, {"f": "audio/62/L1-nj-27__18.mp3", "t": "大肠者，"}, {"f": "audio/62/L1-nj-27__19.mp3", "t": "传道之官，"}, {"f": "audio/62/L1-nj-27__20.mp3", "t": "变化出焉。"}, {"f": "audio/62/L1-nj-27__21.mp3", "t": "小肠者，"}, {"f": "audio/62/L1-nj-27__22.mp3", "t": "受盛之官，"}, {"f": "audio/62/L1-nj-27__23.mp3", "t": "化物出焉。"}, {"f": "audio/62/L1-nj-27__24.mp3", "t": "肾者，"}, {"f": "audio/62/L1-nj-27__25.mp3", "t": "作强之官，"}, {"f": "audio/62/L1-nj-27__26.mp3", "t": "伎巧出焉。"}, {"f": "audio/62/L1-nj-27__27.mp3", "t": "三焦者，"}, {"f": "audio/62/L1-nj-27__28.mp3", "t": "决渎之官，"}, {"f": "audio/62/L1-nj-27__29.mp3", "t": "水道出焉。"}, {"f": "audio/62/L1-nj-27__30.mp3", "t": "膀胱者，"}, {"f": "audio/62/L1-nj-27__31.mp3", "t": "州都之官，"}, {"f": "audio/62/L1-nj-27__32.mp3", "t": "津液藏焉，"}, {"f": "audio/62/L1-nj-27__33.mp3", "t": "气化则能出矣。"}], "L1-nj-28": [{"f": "audio/d9/L1-nj-28__0.mp3", "t": "心者，"}, {"f": "audio/d9/L1-nj-28__1.mp3", "t": "生之本，"}, {"f": "audio/d9/L1-nj-28__2.mp3", "t": "神之变也，"}, {"f": "audio/d9/L1-nj-28__3.mp3", "t": "其华在面，"}, {"f": "audio/d9/L1-nj-28__4.mp3", "t": "其充在血脉，"}, {"f": "audio/d9/L1-nj-28__5.mp3", "t": "为阳中之太阳，"}, {"f": "audio/d9/L1-nj-28__6.mp3", "t": "通于夏气。"}, {"f": "audio/d9/L1-nj-28__7.mp3", "t": "肺者，"}, {"f": "audio/d9/L1-nj-28__8.mp3", "t": "气之本，"}, {"f": "audio/d9/L1-nj-28__9.mp3", "t": "魄之处也，"}, {"f": "audio/d9/L1-nj-28__10.mp3", "t": "其华在毛，"}, {"f": "audio/d9/L1-nj-28__11.mp3", "t": "其充在皮，"}, {"f": "audio/d9/L1-nj-28__12.mp3", "t": "为阳中之太阴，"}, {"f": "audio/d9/L1-nj-28__13.mp3", "t": "通于秋气。"}, {"f": "audio/d9/L1-nj-28__14.mp3", "t": "肾者，"}, {"f": "audio/d9/L1-nj-28__15.mp3", "t": "主蛰，"}, {"f": "audio/d9/L1-nj-28__16.mp3", "t": "封藏之本，"}, {"f": "audio/d9/L1-nj-28__17.mp3", "t": "精之处也，"}, {"f": "audio/d9/L1-nj-28__18.mp3", "t": "其华在发，"}, {"f": "audio/d9/L1-nj-28__19.mp3", "t": "其充在骨，"}, {"f": "audio/d9/L1-nj-28__20.mp3", "t": "为阴中之少阴，"}, {"f": "audio/d9/L1-nj-28__21.mp3", "t": "通于冬气。"}, {"f": "audio/d9/L1-nj-28__22.mp3", "t": "肝者，"}, {"f": "audio/d9/L1-nj-28__23.mp3", "t": "罢极之本，"}, {"f": "audio/d9/L1-nj-28__24.mp3", "t": "魂之居也，"}, {"f": "audio/d9/L1-nj-28__25.mp3", "t": "其华在爪，"}, {"f": "audio/d9/L1-nj-28__26.mp3", "t": "其充在筋，"}, {"f": "audio/d9/L1-nj-28__27.mp3", "t": "以生血气，"}, {"f": "audio/d9/L1-nj-28__28.mp3", "t": "其味酸，"}, {"f": "audio/d9/L1-nj-28__29.mp3", "t": "其色苍，"}, {"f": "audio/d9/L1-nj-28__30.mp3", "t": "此为阳中之少阳，"}, {"f": "audio/d9/L1-nj-28__31.mp3", "t": "通于春气。"}, {"f": "audio/d9/L1-nj-28__32.mp3", "t": "脾胃大肠小肠三焦膀胱者，"}, {"f": "audio/d9/L1-nj-28__33.mp3", "t": "仓廪之本，"}, {"f": "audio/d9/L1-nj-28__34.mp3", "t": "营之居也，"}, {"f": "audio/d9/L1-nj-28__35.mp3", "t": "名曰器，"}, {"f": "audio/d9/L1-nj-28__36.mp3", "t": "能化糟粕，"}, {"f": "audio/d9/L1-nj-28__37.mp3", "t": "转味而入出者也，"}, {"f": "audio/d9/L1-nj-28__38.mp3", "t": "其华在唇四白，"}, {"f": "audio/d9/L1-nj-28__39.mp3", "t": "其充在肌，"}, {"f": "audio/d9/L1-nj-28__40.mp3", "t": "其味甘，"}, {"f": "audio/d9/L1-nj-28__41.mp3", "t": "其色黄，"}, {"f": "audio/d9/L1-nj-28__42.mp3", "t": "此至阴之类，"}, {"f": "audio/d9/L1-nj-28__43.mp3", "t": "通于土气。"}, {"f": "audio/d9/L1-nj-28__44.mp3", "t": "凡十一脏取决于胆也。"}], "L1-nj-29": [{"f": "audio/93/L1-nj-29__0.mp3", "t": "所谓五脏者，"}, {"f": "audio/93/L1-nj-29__1.mp3", "t": "藏精气而不泻也，"}, {"f": "audio/93/L1-nj-29__2.mp3", "t": "故满而不能实。"}, {"f": "audio/93/L1-nj-29__3.mp3", "t": "六腑者，"}, {"f": "audio/93/L1-nj-29__4.mp3", "t": "传化物而不藏，"}, {"f": "audio/93/L1-nj-29__5.mp3", "t": "故实而不能满也。"}], "L1-nj-30": [{"f": "audio/c3/L1-nj-30__0.mp3", "t": "气口何以独为五脏主？"}, {"f": "audio/c3/L1-nj-30__1.mp3", "t": "曰："}, {"f": "audio/c3/L1-nj-30__2.mp3", "t": "胃者，"}, {"f": "audio/c3/L1-nj-30__3.mp3", "t": "水谷之海，"}, {"f": "audio/c3/L1-nj-30__4.mp3", "t": "六腑之大源也。"}, {"f": "audio/c3/L1-nj-30__5.mp3", "t": "五味入口，"}, {"f": "audio/c3/L1-nj-30__6.mp3", "t": "藏于胃，"}, {"f": "audio/c3/L1-nj-30__7.mp3", "t": "以养五脏气，"}, {"f": "audio/c3/L1-nj-30__8.mp3", "t": "气口亦太阴也，"}, {"f": "audio/c3/L1-nj-30__9.mp3", "t": "是以五脏六腑之气味，"}, {"f": "audio/c3/L1-nj-30__10.mp3", "t": "皆出于胃，"}, {"f": "audio/c3/L1-nj-30__11.mp3", "t": "变见于气口。"}], "L1-nj-31": [{"f": "audio/da/L1-nj-31__0.mp3", "t": "病为本，"}, {"f": "audio/da/L1-nj-31__1.mp3", "t": "工为标，"}, {"f": "audio/da/L1-nj-31__2.mp3", "t": "标本不得，"}, {"f": "audio/da/L1-nj-31__3.mp3", "t": "邪气不服，"}, {"f": "audio/da/L1-nj-31__4.mp3", "t": "此之谓也。"}], "L1-nj-32": [{"f": "audio/bd/L1-nj-32__0.mp3", "t": "帝曰："}, {"f": "audio/bd/L1-nj-32__1.mp3", "t": "其有不从毫毛而生，"}, {"f": "audio/bd/L1-nj-32__2.mp3", "t": "五脏阳以竭也。"}, {"f": "audio/bd/L1-nj-32__3.mp3", "t": "津液充郭，"}, {"f": "audio/bd/L1-nj-32__4.mp3", "t": "其魄独居，"}, {"f": "audio/bd/L1-nj-32__5.mp3", "t": "孤精于内，"}, {"f": "audio/bd/L1-nj-32__6.mp3", "t": "气耗于外，"}, {"f": "audio/bd/L1-nj-32__7.mp3", "t": "形不可与衣相保，"}, {"f": "audio/bd/L1-nj-32__8.mp3", "t": "此四极急而动中，"}, {"f": "audio/bd/L1-nj-32__9.mp3", "t": "是气拒于内而形施于外，"}, {"f": "audio/bd/L1-nj-32__10.mp3", "t": "治之奈何？"}, {"f": "audio/bd/L1-nj-32__11.mp3", "t": "岐伯曰："}, {"f": "audio/bd/L1-nj-32__12.mp3", "t": "平治于权衡，"}, {"f": "audio/bd/L1-nj-32__13.mp3", "t": "去宛陈莝，"}, {"f": "audio/bd/L1-nj-32__14.mp3", "t": "微动四极，"}, {"f": "audio/bd/L1-nj-32__15.mp3", "t": "温衣，"}, {"f": "audio/bd/L1-nj-32__16.mp3", "t": "缪刺其处，"}, {"f": "audio/bd/L1-nj-32__17.mp3", "t": "以复其形。"}, {"f": "audio/bd/L1-nj-32__18.mp3", "t": "开鬼门，"}, {"f": "audio/bd/L1-nj-32__19.mp3", "t": "洁净府，"}, {"f": "audio/bd/L1-nj-32__20.mp3", "t": "精以时服，"}, {"f": "audio/bd/L1-nj-32__21.mp3", "t": "五阳以布，"}, {"f": "audio/bd/L1-nj-32__22.mp3", "t": "疏涤五脏。"}, {"f": "audio/bd/L1-nj-32__23.mp3", "t": "故精自生，"}, {"f": "audio/bd/L1-nj-32__24.mp3", "t": "形自盛，"}, {"f": "audio/bd/L1-nj-32__25.mp3", "t": "骨肉相保，"}, {"f": "audio/bd/L1-nj-32__26.mp3", "t": "巨气乃平。"}], "L1-nj-33": [{"f": "audio/65/L1-nj-33__0.mp3", "t": "诊法常以平旦，"}, {"f": "audio/65/L1-nj-33__1.mp3", "t": "阴气未动，"}, {"f": "audio/65/L1-nj-33__2.mp3", "t": "阳气未散，"}, {"f": "audio/65/L1-nj-33__3.mp3", "t": "饮食未进，"}, {"f": "audio/65/L1-nj-33__4.mp3", "t": "经脉未盛，"}, {"f": "audio/65/L1-nj-33__5.mp3", "t": "络脉调匀，"}, {"f": "audio/65/L1-nj-33__6.mp3", "t": "气血未乱，"}, {"f": "audio/65/L1-nj-33__7.mp3", "t": "故乃可诊有过之脉。"}], "L1-nj-34": [{"f": "audio/2b/L1-nj-34__0.mp3", "t": "切脉动静而视精明，"}, {"f": "audio/2b/L1-nj-34__1.mp3", "t": "察五色，"}, {"f": "audio/2b/L1-nj-34__2.mp3", "t": "观五脏有余不足，"}, {"f": "audio/2b/L1-nj-34__3.mp3", "t": "六腑强弱，"}, {"f": "audio/2b/L1-nj-34__4.mp3", "t": "形之盛衰，"}, {"f": "audio/2b/L1-nj-34__5.mp3", "t": "以此参伍，"}, {"f": "audio/2b/L1-nj-34__6.mp3", "t": "决死生之分。"}], "L1-nj-35": [{"f": "audio/f0/L1-nj-35__0.mp3", "t": "长则气治，"}, {"f": "audio/f0/L1-nj-35__1.mp3", "t": "短则气病，"}, {"f": "audio/f0/L1-nj-35__2.mp3", "t": "数则烦心，"}, {"f": "audio/f0/L1-nj-35__3.mp3", "t": "大则病进，"}, {"f": "audio/f0/L1-nj-35__4.mp3", "t": "上盛则气高，"}, {"f": "audio/f0/L1-nj-35__5.mp3", "t": "下盛则气胀，"}, {"f": "audio/f0/L1-nj-35__6.mp3", "t": "代则气衰，"}, {"f": "audio/f0/L1-nj-35__7.mp3", "t": "细则气少，"}, {"f": "audio/f0/L1-nj-35__8.mp3", "t": "涩则心痛。"}], "L1-nj-36": [{"f": "audio/7f/L1-nj-36__0.mp3", "t": "夫精明五色者，"}, {"f": "audio/7f/L1-nj-36__1.mp3", "t": "气之华也。"}], "L1-nj-37": [{"f": "audio/ea/L1-nj-37__0.mp3", "t": "头者精明之府，"}, {"f": "audio/ea/L1-nj-37__1.mp3", "t": "头倾视深，"}, {"f": "audio/ea/L1-nj-37__2.mp3", "t": "精神将夺矣；"}, {"f": "audio/ea/L1-nj-37__3.mp3", "t": "背者胸中之府，"}, {"f": "audio/ea/L1-nj-37__4.mp3", "t": "背曲肩随，"}, {"f": "audio/ea/L1-nj-37__5.mp3", "t": "府将坏矣；"}, {"f": "audio/ea/L1-nj-37__6.mp3", "t": "腰者肾之府，"}, {"f": "audio/ea/L1-nj-37__7.mp3", "t": "转摇不能，"}, {"f": "audio/ea/L1-nj-37__8.mp3", "t": "肾将惫矣；"}, {"f": "audio/ea/L1-nj-37__9.mp3", "t": "膝者筋之府，"}, {"f": "audio/ea/L1-nj-37__10.mp3", "t": "屈伸不能，"}, {"f": "audio/ea/L1-nj-37__11.mp3", "t": "行则偻附，"}, {"f": "audio/ea/L1-nj-37__12.mp3", "t": "筋将惫矣；"}, {"f": "audio/ea/L1-nj-37__13.mp3", "t": "骨者髓之府，"}, {"f": "audio/ea/L1-nj-37__14.mp3", "t": "不能久立，"}, {"f": "audio/ea/L1-nj-37__15.mp3", "t": "行则振掉，"}, {"f": "audio/ea/L1-nj-37__16.mp3", "t": "骨将惫矣。"}, {"f": "audio/ea/L1-nj-37__17.mp3", "t": "得强则生，"}, {"f": "audio/ea/L1-nj-37__18.mp3", "t": "失强则死。"}], "L1-nj-38": [{"f": "audio/84/L1-nj-38__0.mp3", "t": "四变之动，"}, {"f": "audio/84/L1-nj-38__1.mp3", "t": "脉与之上下，"}, {"f": "audio/84/L1-nj-38__2.mp3", "t": "以春应中规，"}, {"f": "audio/84/L1-nj-38__3.mp3", "t": "夏应中矩，"}, {"f": "audio/84/L1-nj-38__4.mp3", "t": "秋应中衡，"}, {"f": "audio/84/L1-nj-38__5.mp3", "t": "冬应中权。"}], "L1-nj-39": [{"f": "audio/80/L1-nj-39__0.mp3", "t": "持脉有道，"}, {"f": "audio/80/L1-nj-39__1.mp3", "t": "虚静为保。"}], "L1-nj-40": [{"f": "audio/3c/L1-nj-40__0.mp3", "t": "平人之常气禀于胃，"}, {"f": "audio/3c/L1-nj-40__1.mp3", "t": "胃者平人之常气也，"}, {"f": "audio/3c/L1-nj-40__2.mp3", "t": "人无胃气曰逆，"}, {"f": "audio/3c/L1-nj-40__3.mp3", "t": "逆者死。"}], "L1-nj-41": [{"f": "audio/01/L1-nj-41__0.mp3", "t": "浆粥入胃，"}, {"f": "audio/01/L1-nj-41__1.mp3", "t": "泄注止，"}, {"f": "audio/01/L1-nj-41__2.mp3", "t": "则虚者活；"}, {"f": "audio/01/L1-nj-41__3.mp3", "t": "身汗得后利，"}, {"f": "audio/01/L1-nj-41__4.mp3", "t": "则实者活。"}], "L1-nj-42": [{"f": "audio/0b/L1-nj-42__0.mp3", "t": "诊病之道，"}, {"f": "audio/0b/L1-nj-42__1.mp3", "t": "观人勇怯、"}, {"f": "audio/0b/L1-nj-42__2.mp3", "t": "骨肉、"}, {"f": "audio/0b/L1-nj-42__3.mp3", "t": "皮肤，"}, {"f": "audio/0b/L1-nj-42__4.mp3", "t": "能知其情，"}, {"f": "audio/0b/L1-nj-42__5.mp3", "t": "以为诊法也。"}], "L1-nj-43": [{"f": "audio/f4/L1-nj-43__0.mp3", "t": "故春秋冬夏，"}, {"f": "audio/f4/L1-nj-43__1.mp3", "t": "四时阴阳，"}, {"f": "audio/f4/L1-nj-43__2.mp3", "t": "生病起于过用，"}, {"f": "audio/f4/L1-nj-43__3.mp3", "t": "此为常也。"}], "L1-nj-44": [{"f": "audio/d7/L1-nj-44__0.mp3", "t": "饮入于胃，"}, {"f": "audio/d7/L1-nj-44__1.mp3", "t": "游溢精气，"}, {"f": "audio/d7/L1-nj-44__2.mp3", "t": "上输于脾，"}, {"f": "audio/d7/L1-nj-44__3.mp3", "t": "脾气散精，"}, {"f": "audio/d7/L1-nj-44__4.mp3", "t": "上归于肺，"}, {"f": "audio/d7/L1-nj-44__5.mp3", "t": "通调水道，"}, {"f": "audio/d7/L1-nj-44__6.mp3", "t": "下输膀胱，"}, {"f": "audio/d7/L1-nj-44__7.mp3", "t": "水精四布，"}, {"f": "audio/d7/L1-nj-44__8.mp3", "t": "五经并行。"}], "L1-nj-45": [{"f": "audio/b0/L1-nj-45__0.mp3", "t": "久视伤血，"}, {"f": "audio/b0/L1-nj-45__1.mp3", "t": "久卧伤气，"}, {"f": "audio/b0/L1-nj-45__2.mp3", "t": "久坐伤肉，"}, {"f": "audio/b0/L1-nj-45__3.mp3", "t": "久立伤骨，"}, {"f": "audio/b0/L1-nj-45__4.mp3", "t": "久行伤筋，"}, {"f": "audio/b0/L1-nj-45__5.mp3", "t": "是谓五劳所伤。"}], "L1-nj-46": [{"f": "audio/3c/L1-nj-46__0.mp3", "t": "凡刺之真，"}, {"f": "audio/3c/L1-nj-46__1.mp3", "t": "必先治神，"}, {"f": "audio/3c/L1-nj-46__2.mp3", "t": "五脏已定，"}, {"f": "audio/3c/L1-nj-46__3.mp3", "t": "九候已备，"}, {"f": "audio/3c/L1-nj-46__4.mp3", "t": "后乃存针……经气已至，"}, {"f": "audio/3c/L1-nj-46__5.mp3", "t": "慎守勿失，"}, {"f": "audio/3c/L1-nj-46__6.mp3", "t": "深浅在志，"}, {"f": "audio/3c/L1-nj-46__7.mp3", "t": "远近若一，"}, {"f": "audio/3c/L1-nj-46__8.mp3", "t": "如临深渊，"}, {"f": "audio/3c/L1-nj-46__9.mp3", "t": "手如握虎，"}, {"f": "audio/3c/L1-nj-46__10.mp3", "t": "神无营于众物。"}], "L1-nj-47": [{"f": "audio/34/L1-nj-47__0.mp3", "t": "邪气盛则实，"}, {"f": "audio/34/L1-nj-47__1.mp3", "t": "精气夺则虚。"}], "L1-nj-48": [{"f": "audio/84/L1-nj-48__0.mp3", "t": "脾与胃以膜相连耳，"}, {"f": "audio/84/L1-nj-48__1.mp3", "t": "而能为之行其津液，"}, {"f": "audio/84/L1-nj-48__2.mp3", "t": "何也？"}, {"f": "audio/84/L1-nj-48__3.mp3", "t": "曰："}, {"f": "audio/84/L1-nj-48__4.mp3", "t": "足太阴者三阴也，"}, {"f": "audio/84/L1-nj-48__5.mp3", "t": "其脉贯胃属脾络嗌，"}, {"f": "audio/84/L1-nj-48__6.mp3", "t": "故太阴为之行气于三阴。"}, {"f": "audio/84/L1-nj-48__7.mp3", "t": "阳明者表也，"}, {"f": "audio/84/L1-nj-48__8.mp3", "t": "五脏六腑之海也，"}, {"f": "audio/84/L1-nj-48__9.mp3", "t": "亦为之行气于三阳。"}], "L1-nj-49": [{"f": "audio/b1/L1-nj-49__0.mp3", "t": "阳道实，"}, {"f": "audio/b1/L1-nj-49__1.mp3", "t": "阴道虚。"}, {"f": "audio/b1/L1-nj-49__2.mp3", "t": "故犯贼风虚邪者，"}, {"f": "audio/b1/L1-nj-49__3.mp3", "t": "阳受之；"}, {"f": "audio/b1/L1-nj-49__4.mp3", "t": "食饮不节，"}, {"f": "audio/b1/L1-nj-49__5.mp3", "t": "起居不时者，"}, {"f": "audio/b1/L1-nj-49__6.mp3", "t": "阴受之。"}, {"f": "audio/b1/L1-nj-49__7.mp3", "t": "阳受之则入六腑，"}, {"f": "audio/b1/L1-nj-49__8.mp3", "t": "阴受之则入五脏。"}], "L1-nj-50": [{"f": "audio/a8/L1-nj-50__0.mp3", "t": "四肢皆禀气于胃而不得至经，"}, {"f": "audio/a8/L1-nj-50__1.mp3", "t": "必因于脾乃得禀也。"}, {"f": "audio/a8/L1-nj-50__2.mp3", "t": "今脾病不能为胃行其津液，"}, {"f": "audio/a8/L1-nj-50__3.mp3", "t": "四肢不得禀水谷气，"}, {"f": "audio/a8/L1-nj-50__4.mp3", "t": "气日以衰，"}, {"f": "audio/a8/L1-nj-50__5.mp3", "t": "脉道不利，"}, {"f": "audio/a8/L1-nj-50__6.mp3", "t": "筋骨肌肉皆无气以生，"}, {"f": "audio/a8/L1-nj-50__7.mp3", "t": "故不用焉。"}], "L1-nj-51": [{"f": "audio/b2/L1-nj-51__0.mp3", "t": "脾者土也，"}, {"f": "audio/b2/L1-nj-51__1.mp3", "t": "治中央，"}, {"f": "audio/b2/L1-nj-51__2.mp3", "t": "常以四时长四脏，"}, {"f": "audio/b2/L1-nj-51__3.mp3", "t": "各十八日寄治，"}, {"f": "audio/b2/L1-nj-51__4.mp3", "t": "不得独主于时也。"}], "L1-nj-52": [{"f": "audio/81/L1-nj-52__0.mp3", "t": "今夫热病者，"}, {"f": "audio/81/L1-nj-52__1.mp3", "t": "皆伤寒之类也，"}, {"f": "audio/81/L1-nj-52__2.mp3", "t": "或愈或死，"}, {"f": "audio/81/L1-nj-52__3.mp3", "t": "其死皆以六七日之间，"}, {"f": "audio/81/L1-nj-52__4.mp3", "t": "其愈皆以十日以上者，"}, {"f": "audio/81/L1-nj-52__5.mp3", "t": "何也？"}, {"f": "audio/81/L1-nj-52__6.mp3", "t": "不知其解，"}, {"f": "audio/81/L1-nj-52__7.mp3", "t": "愿闻其故。"}, {"f": "audio/81/L1-nj-52__8.mp3", "t": "岐伯对曰："}, {"f": "audio/81/L1-nj-52__9.mp3", "t": "巨阳者，"}, {"f": "audio/81/L1-nj-52__10.mp3", "t": "诸阳之属也，"}, {"f": "audio/81/L1-nj-52__11.mp3", "t": "其脉连于风府，"}, {"f": "audio/81/L1-nj-52__12.mp3", "t": "故为诸阳主气也。"}, {"f": "audio/81/L1-nj-52__13.mp3", "t": "人之伤于寒也，"}, {"f": "audio/81/L1-nj-52__14.mp3", "t": "则为病热，"}, {"f": "audio/81/L1-nj-52__15.mp3", "t": "热虽甚不死；"}, {"f": "audio/81/L1-nj-52__16.mp3", "t": "其两感于寒而病者，"}, {"f": "audio/81/L1-nj-52__17.mp3", "t": "必不免于死。"}], "L1-nj-53": [{"f": "audio/e5/L1-nj-53__0.mp3", "t": "伤寒一日，"}, {"f": "audio/e5/L1-nj-53__1.mp3", "t": "巨阳受之，"}, {"f": "audio/e5/L1-nj-53__2.mp3", "t": "故头项痛腰脊强。"}, {"f": "audio/e5/L1-nj-53__3.mp3", "t": "二日阳明受之，"}, {"f": "audio/e5/L1-nj-53__4.mp3", "t": "阳明主肉，"}, {"f": "audio/e5/L1-nj-53__5.mp3", "t": "其脉侠鼻络于目，"}, {"f": "audio/e5/L1-nj-53__6.mp3", "t": "故身热目疼而鼻干，"}, {"f": "audio/e5/L1-nj-53__7.mp3", "t": "不得卧也。"}, {"f": "audio/e5/L1-nj-53__8.mp3", "t": "三日少阳受之，"}, {"f": "audio/e5/L1-nj-53__9.mp3", "t": "少阳主胆，"}, {"f": "audio/e5/L1-nj-53__10.mp3", "t": "其脉循胁络于耳，"}, {"f": "audio/e5/L1-nj-53__11.mp3", "t": "故胸胁痛而耳聋。"}, {"f": "audio/e5/L1-nj-53__12.mp3", "t": "三阳经络皆受其病，"}, {"f": "audio/e5/L1-nj-53__13.mp3", "t": "而未入于脏者，"}, {"f": "audio/e5/L1-nj-53__14.mp3", "t": "故可汗而已。"}, {"f": "audio/e5/L1-nj-53__15.mp3", "t": "四日太阴受之，"}, {"f": "audio/e5/L1-nj-53__16.mp3", "t": "太阴脉布胃中络于嗌，"}, {"f": "audio/e5/L1-nj-53__17.mp3", "t": "故腹满而嗌干。"}, {"f": "audio/e5/L1-nj-53__18.mp3", "t": "五日少阴受之，"}, {"f": "audio/e5/L1-nj-53__19.mp3", "t": "少阴脉贯肾络于肺，"}, {"f": "audio/e5/L1-nj-53__20.mp3", "t": "系舌本，"}, {"f": "audio/e5/L1-nj-53__21.mp3", "t": "故口燥舌干而渴。"}, {"f": "audio/e5/L1-nj-53__22.mp3", "t": "六日厥阴受之，"}, {"f": "audio/e5/L1-nj-53__23.mp3", "t": "厥阴脉循阴器而络于肝，"}, {"f": "audio/e5/L1-nj-53__24.mp3", "t": "故烦满而囊缩。"}, {"f": "audio/e5/L1-nj-53__25.mp3", "t": "三阴三阳、"}, {"f": "audio/e5/L1-nj-53__26.mp3", "t": "五脏六腑皆受病，"}, {"f": "audio/e5/L1-nj-53__27.mp3", "t": "荣卫不行，"}, {"f": "audio/e5/L1-nj-53__28.mp3", "t": "五脏不通，"}, {"f": "audio/e5/L1-nj-53__29.mp3", "t": "则死矣。"}], "L1-nj-54": [{"f": "audio/88/L1-nj-54__0.mp3", "t": "其未满三日者，"}, {"f": "audio/88/L1-nj-54__1.mp3", "t": "可汗而已；"}, {"f": "audio/88/L1-nj-54__2.mp3", "t": "其满三日者，"}, {"f": "audio/88/L1-nj-54__3.mp3", "t": "可泄而已。"}], "L1-nj-55": [{"f": "audio/a2/L1-nj-55__0.mp3", "t": "两感于寒者，"}, {"f": "audio/a2/L1-nj-55__1.mp3", "t": "病一日则巨阳与少阴俱病，"}, {"f": "audio/a2/L1-nj-55__2.mp3", "t": "则头痛口干而烦满；"}, {"f": "audio/a2/L1-nj-55__3.mp3", "t": "二日则阳明与太阴俱病，"}, {"f": "audio/a2/L1-nj-55__4.mp3", "t": "则腹满身热，"}, {"f": "audio/a2/L1-nj-55__5.mp3", "t": "不欲食，"}, {"f": "audio/a2/L1-nj-55__6.mp3", "t": "谵言；"}, {"f": "audio/a2/L1-nj-55__7.mp3", "t": "三日则少阳与厥阴俱病，"}, {"f": "audio/a2/L1-nj-55__8.mp3", "t": "则耳聋囊缩而厥，"}, {"f": "audio/a2/L1-nj-55__9.mp3", "t": "水浆不入，"}, {"f": "audio/a2/L1-nj-55__10.mp3", "t": "不知人，"}, {"f": "audio/a2/L1-nj-55__11.mp3", "t": "六日死。"}, {"f": "audio/a2/L1-nj-55__12.mp3", "t": "帝曰："}, {"f": "audio/a2/L1-nj-55__13.mp3", "t": "五脏已伤，"}, {"f": "audio/a2/L1-nj-55__14.mp3", "t": "六腑不通，"}, {"f": "audio/a2/L1-nj-55__15.mp3", "t": "荣卫不行，"}, {"f": "audio/a2/L1-nj-55__16.mp3", "t": "如是之后，"}, {"f": "audio/a2/L1-nj-55__17.mp3", "t": "三日乃死何也？"}, {"f": "audio/a2/L1-nj-55__18.mp3", "t": "岐伯曰："}, {"f": "audio/a2/L1-nj-55__19.mp3", "t": "阳明者，"}, {"f": "audio/a2/L1-nj-55__20.mp3", "t": "十二经脉之长也，"}, {"f": "audio/a2/L1-nj-55__21.mp3", "t": "其血气盛，"}, {"f": "audio/a2/L1-nj-55__22.mp3", "t": "故不知人，"}, {"f": "audio/a2/L1-nj-55__23.mp3", "t": "三日其气乃尽，"}, {"f": "audio/a2/L1-nj-55__24.mp3", "t": "故死矣。"}, {"f": "audio/a2/L1-nj-55__25.mp3", "t": "凡病伤寒而成温者，"}, {"f": "audio/a2/L1-nj-55__26.mp3", "t": "先夏至日者为病温，"}, {"f": "audio/a2/L1-nj-55__27.mp3", "t": "后夏至日者为病暑，"}, {"f": "audio/a2/L1-nj-55__28.mp3", "t": "暑当与汗皆出，"}, {"f": "audio/a2/L1-nj-55__29.mp3", "t": "勿止。"}], "L1-nj-56": [{"f": "audio/50/L1-nj-56__0.mp3", "t": "邪之所凑，"}, {"f": "audio/50/L1-nj-56__1.mp3", "t": "其气必虚。"}], "L1-nj-57": [{"f": "audio/e0/L1-nj-57__0.mp3", "t": "五脏六腑皆令人咳，"}, {"f": "audio/e0/L1-nj-57__1.mp3", "t": "非独肺也。"}, {"f": "audio/e0/L1-nj-57__2.mp3", "t": "帝曰："}, {"f": "audio/e0/L1-nj-57__3.mp3", "t": "愿闻其状。"}, {"f": "audio/e0/L1-nj-57__4.mp3", "t": "岐伯曰："}, {"f": "audio/e0/L1-nj-57__5.mp3", "t": "皮毛者，"}, {"f": "audio/e0/L1-nj-57__6.mp3", "t": "肺之合也，"}, {"f": "audio/e0/L1-nj-57__7.mp3", "t": "皮毛先受邪气，"}, {"f": "audio/e0/L1-nj-57__8.mp3", "t": "邪气以从其合也。"}, {"f": "audio/e0/L1-nj-57__9.mp3", "t": "其寒饮食入胃，"}, {"f": "audio/e0/L1-nj-57__10.mp3", "t": "从肺脉上至于肺，"}, {"f": "audio/e0/L1-nj-57__11.mp3", "t": "则肺寒，"}, {"f": "audio/e0/L1-nj-57__12.mp3", "t": "肺寒则外内合邪，"}, {"f": "audio/e0/L1-nj-57__13.mp3", "t": "因而客之，"}, {"f": "audio/e0/L1-nj-57__14.mp3", "t": "则为肺咳。"}, {"f": "audio/e0/L1-nj-57__15.mp3", "t": "五脏各以其时受病，"}, {"f": "audio/e0/L1-nj-57__16.mp3", "t": "非其时，"}, {"f": "audio/e0/L1-nj-57__17.mp3", "t": "各传以与之。"}], "L1-nj-58": [{"f": "audio/f2/L1-nj-58__0.mp3", "t": "经脉流行不止，"}, {"f": "audio/f2/L1-nj-58__1.mp3", "t": "环周不休，"}, {"f": "audio/f2/L1-nj-58__2.mp3", "t": "寒气入经而稽迟，"}, {"f": "audio/f2/L1-nj-58__3.mp3", "t": "泣而不行，"}, {"f": "audio/f2/L1-nj-58__4.mp3", "t": "客于脉外则血少，"}, {"f": "audio/f2/L1-nj-58__5.mp3", "t": "客于脉中则气不通，"}, {"f": "audio/f2/L1-nj-58__6.mp3", "t": "故卒然而痛。"}], "L1-nj-59": [{"f": "audio/e0/L1-nj-59__0.mp3", "t": "怒则气上，"}, {"f": "audio/e0/L1-nj-59__1.mp3", "t": "喜则气缓，"}, {"f": "audio/e0/L1-nj-59__2.mp3", "t": "悲则气消，"}, {"f": "audio/e0/L1-nj-59__3.mp3", "t": "恐则气下，"}, {"f": "audio/e0/L1-nj-59__4.mp3", "t": "寒则气收，"}, {"f": "audio/e0/L1-nj-59__5.mp3", "t": "炅则气泄，"}, {"f": "audio/e0/L1-nj-59__6.mp3", "t": "惊则气乱，"}, {"f": "audio/e0/L1-nj-59__7.mp3", "t": "劳则气耗，"}, {"f": "audio/e0/L1-nj-59__8.mp3", "t": "思则气结。"}], "L1-nj-60": [{"f": "audio/b9/L1-nj-60__0.mp3", "t": "风者，"}, {"f": "audio/b9/L1-nj-60__1.mp3", "t": "善行而数变。"}, {"f": "audio/b9/L1-nj-60__2.mp3", "t": "故风者百病之长也，"}, {"f": "audio/b9/L1-nj-60__3.mp3", "t": "至其变化，"}, {"f": "audio/b9/L1-nj-60__4.mp3", "t": "乃为他病也，"}, {"f": "audio/b9/L1-nj-60__5.mp3", "t": "无常方，"}, {"f": "audio/b9/L1-nj-60__6.mp3", "t": "然致有风气也。"}], "L1-nj-61": [{"f": "audio/ad/L1-nj-61__0.mp3", "t": "风寒湿三气杂至，"}, {"f": "audio/ad/L1-nj-61__1.mp3", "t": "合而为痹也。"}, {"f": "audio/ad/L1-nj-61__2.mp3", "t": "其风气胜者为行痹，"}, {"f": "audio/ad/L1-nj-61__3.mp3", "t": "寒气胜者为痛痹，"}, {"f": "audio/ad/L1-nj-61__4.mp3", "t": "湿气胜者为著痹也。"}], "L1-nj-62": [{"f": "audio/1b/L1-nj-62__0.mp3", "t": "荣者，"}, {"f": "audio/1b/L1-nj-62__1.mp3", "t": "水谷之精气也，"}, {"f": "audio/1b/L1-nj-62__2.mp3", "t": "和调于五脏，"}, {"f": "audio/1b/L1-nj-62__3.mp3", "t": "洒陈于六腑，"}, {"f": "audio/1b/L1-nj-62__4.mp3", "t": "乃能入于脉也，"}, {"f": "audio/1b/L1-nj-62__5.mp3", "t": "故循脉上下，"}, {"f": "audio/1b/L1-nj-62__6.mp3", "t": "贯五脏，"}, {"f": "audio/1b/L1-nj-62__7.mp3", "t": "络六腑也。"}, {"f": "audio/1b/L1-nj-62__8.mp3", "t": "卫者，"}, {"f": "audio/1b/L1-nj-62__9.mp3", "t": "水谷之悍气也，"}, {"f": "audio/1b/L1-nj-62__10.mp3", "t": "其气慓疾滑利，"}, {"f": "audio/1b/L1-nj-62__11.mp3", "t": "不能入于脉也，"}, {"f": "audio/1b/L1-nj-62__12.mp3", "t": "故循皮肤之中，"}, {"f": "audio/1b/L1-nj-62__13.mp3", "t": "分肉之间，"}, {"f": "audio/1b/L1-nj-62__14.mp3", "t": "熏于肓膜，"}, {"f": "audio/1b/L1-nj-62__15.mp3", "t": "散于胸腹。"}, {"f": "audio/1b/L1-nj-62__16.mp3", "t": "逆其气则病，"}, {"f": "audio/1b/L1-nj-62__17.mp3", "t": "从其气则愈，"}, {"f": "audio/1b/L1-nj-62__18.mp3", "t": "不与风寒湿气合，"}, {"f": "audio/1b/L1-nj-62__19.mp3", "t": "故不为痹。"}], "L1-nj-63": [{"f": "audio/d5/L1-nj-63__0.mp3", "t": "五脏因肺热叶焦，"}, {"f": "audio/d5/L1-nj-63__1.mp3", "t": "发为痿躄。"}], "L1-nj-64": [{"f": "audio/6f/L1-nj-64__0.mp3", "t": "阳明者，"}, {"f": "audio/6f/L1-nj-64__1.mp3", "t": "五脏六腑之海，"}, {"f": "audio/6f/L1-nj-64__2.mp3", "t": "主润宗筋，"}, {"f": "audio/6f/L1-nj-64__3.mp3", "t": "宗筋主束骨而利机关也。"}, {"f": "audio/6f/L1-nj-64__4.mp3", "t": "冲脉者，"}, {"f": "audio/6f/L1-nj-64__5.mp3", "t": "经脉之海也，"}, {"f": "audio/6f/L1-nj-64__6.mp3", "t": "主渗灌溪谷，"}, {"f": "audio/6f/L1-nj-64__7.mp3", "t": "与阳明合于宗筋，"}, {"f": "audio/6f/L1-nj-64__8.mp3", "t": "阴阳总宗筋之会，"}, {"f": "audio/6f/L1-nj-64__9.mp3", "t": "会于气街，"}, {"f": "audio/6f/L1-nj-64__10.mp3", "t": "而阳明为之长，"}, {"f": "audio/6f/L1-nj-64__11.mp3", "t": "皆属于带脉，"}, {"f": "audio/6f/L1-nj-64__12.mp3", "t": "而络于督脉。"}, {"f": "audio/6f/L1-nj-64__13.mp3", "t": "故阳明虚，"}, {"f": "audio/6f/L1-nj-64__14.mp3", "t": "则宗筋纵，"}, {"f": "audio/6f/L1-nj-64__15.mp3", "t": "带脉不引，"}, {"f": "audio/6f/L1-nj-64__16.mp3", "t": "故足痿不用也。"}], "L1-nj-65": [{"f": "audio/62/L1-nj-65__0.mp3", "t": "肾者，"}, {"f": "audio/62/L1-nj-65__1.mp3", "t": "胃之关也，"}, {"f": "audio/62/L1-nj-65__2.mp3", "t": "关门不利，"}, {"f": "audio/62/L1-nj-65__3.mp3", "t": "故聚水而从其类也。"}, {"f": "audio/62/L1-nj-65__4.mp3", "t": "上下溢于皮肤，"}, {"f": "audio/62/L1-nj-65__5.mp3", "t": "故为胕肿。"}], "L1-nj-66": [{"f": "audio/2f/L1-nj-66__0.mp3", "t": "肾者，"}, {"f": "audio/2f/L1-nj-66__1.mp3", "t": "牝脏也，"}, {"f": "audio/2f/L1-nj-66__2.mp3", "t": "地气上者属于肾，"}, {"f": "audio/2f/L1-nj-66__3.mp3", "t": "而生水液也，"}, {"f": "audio/2f/L1-nj-66__4.mp3", "t": "故曰至阴。"}], "L1-nj-67": [{"f": "audio/eb/L1-nj-67__0.mp3", "t": "五脏之道，"}, {"f": "audio/eb/L1-nj-67__1.mp3", "t": "皆出于经隧，"}, {"f": "audio/eb/L1-nj-67__2.mp3", "t": "以行血气，"}, {"f": "audio/eb/L1-nj-67__3.mp3", "t": "血气不和，"}, {"f": "audio/eb/L1-nj-67__4.mp3", "t": "百病乃变化而生，"}, {"f": "audio/eb/L1-nj-67__5.mp3", "t": "是故守经隧焉。"}], "L1-nj-68": [{"f": "audio/c0/L1-nj-68__0.mp3", "t": "气血以并，"}, {"f": "audio/c0/L1-nj-68__1.mp3", "t": "阴阳相倾，"}, {"f": "audio/c0/L1-nj-68__2.mp3", "t": "气乱于卫，"}, {"f": "audio/c0/L1-nj-68__3.mp3", "t": "血逆于经，"}, {"f": "audio/c0/L1-nj-68__4.mp3", "t": "血气离居，"}, {"f": "audio/c0/L1-nj-68__5.mp3", "t": "一实一虚。"}], "L1-nj-69": [{"f": "audio/f7/L1-nj-69__0.mp3", "t": "夫邪之生也，"}, {"f": "audio/f7/L1-nj-69__1.mp3", "t": "或生于阴，"}, {"f": "audio/f7/L1-nj-69__2.mp3", "t": "或生于阳。"}, {"f": "audio/f7/L1-nj-69__3.mp3", "t": "其生于阳者，"}, {"f": "audio/f7/L1-nj-69__4.mp3", "t": "得之风雨寒暑；"}, {"f": "audio/f7/L1-nj-69__5.mp3", "t": "其生于阴者，"}, {"f": "audio/f7/L1-nj-69__6.mp3", "t": "得之饮食居处，"}, {"f": "audio/f7/L1-nj-69__7.mp3", "t": "阴阳喜怒。"}], "L1-nj-70": [{"f": "audio/24/L1-nj-70__0.mp3", "t": "亢则害，"}, {"f": "audio/24/L1-nj-70__1.mp3", "t": "承乃制，"}, {"f": "audio/24/L1-nj-70__2.mp3", "t": "制则生化，"}, {"f": "audio/24/L1-nj-70__3.mp3", "t": "外列盛衰，"}, {"f": "audio/24/L1-nj-70__4.mp3", "t": "害则败乱，"}, {"f": "audio/24/L1-nj-70__5.mp3", "t": "生化大病。"}], "L1-nj-71": [{"f": "audio/6d/L1-nj-71__0.mp3", "t": "出入废则神机化灭，"}, {"f": "audio/6d/L1-nj-71__1.mp3", "t": "升降息则气立孤危。"}, {"f": "audio/6d/L1-nj-71__2.mp3", "t": "故非出入，"}, {"f": "audio/6d/L1-nj-71__3.mp3", "t": "则无以生长壮老已；"}, {"f": "audio/6d/L1-nj-71__4.mp3", "t": "非升降，"}, {"f": "audio/6d/L1-nj-71__5.mp3", "t": "则无以生长化收藏。"}], "L1-nj-72": [{"f": "audio/67/L1-nj-72__0.mp3", "t": "化不可代，"}, {"f": "audio/67/L1-nj-72__1.mp3", "t": "时不可违……无代化，"}, {"f": "audio/67/L1-nj-72__2.mp3", "t": "无违时，"}, {"f": "audio/67/L1-nj-72__3.mp3", "t": "必养必和，"}, {"f": "audio/67/L1-nj-72__4.mp3", "t": "待其来复。"}], "L1-nj-73": [{"f": "audio/e0/L1-nj-73__0.mp3", "t": "用寒远寒，"}, {"f": "audio/e0/L1-nj-73__1.mp3", "t": "用凉远凉，"}, {"f": "audio/e0/L1-nj-73__2.mp3", "t": "用温远温，"}, {"f": "audio/e0/L1-nj-73__3.mp3", "t": "用热远热，"}, {"f": "audio/e0/L1-nj-73__4.mp3", "t": "食宜同法，"}, {"f": "audio/e0/L1-nj-73__5.mp3", "t": "有假者反常，"}, {"f": "audio/e0/L1-nj-73__6.mp3", "t": "反是者病。"}], "L1-nj-74": [{"f": "audio/0f/L1-nj-74__0.mp3", "t": "谨察阴阳所在而调之，"}, {"f": "audio/0f/L1-nj-74__1.mp3", "t": "以平为期。"}], "L1-nj-75": [{"f": "audio/29/L1-nj-75__0.mp3", "t": "审察病机，"}, {"f": "audio/29/L1-nj-75__1.mp3", "t": "无失气宜。"}], "L1-nj-76": [{"f": "audio/fe/L1-nj-76__0.mp3", "t": "诸风掉眩，"}, {"f": "audio/fe/L1-nj-76__1.mp3", "t": "皆属于肝。"}, {"f": "audio/fe/L1-nj-76__2.mp3", "t": "诸寒收引，"}, {"f": "audio/fe/L1-nj-76__3.mp3", "t": "皆属于肾。"}, {"f": "audio/fe/L1-nj-76__4.mp3", "t": "诸气膹郁，"}, {"f": "audio/fe/L1-nj-76__5.mp3", "t": "皆属于肺。"}, {"f": "audio/fe/L1-nj-76__6.mp3", "t": "诸湿肿满，"}, {"f": "audio/fe/L1-nj-76__7.mp3", "t": "皆属于脾。"}, {"f": "audio/fe/L1-nj-76__8.mp3", "t": "诸热瞀瘛，"}, {"f": "audio/fe/L1-nj-76__9.mp3", "t": "皆属于火。"}, {"f": "audio/fe/L1-nj-76__10.mp3", "t": "诸痛痒疮，"}, {"f": "audio/fe/L1-nj-76__11.mp3", "t": "皆属于心。"}, {"f": "audio/fe/L1-nj-76__12.mp3", "t": "诸厥固泄，"}, {"f": "audio/fe/L1-nj-76__13.mp3", "t": "皆属于下。"}, {"f": "audio/fe/L1-nj-76__14.mp3", "t": "诸痿喘呕，"}, {"f": "audio/fe/L1-nj-76__15.mp3", "t": "皆属于上。"}, {"f": "audio/fe/L1-nj-76__16.mp3", "t": "诸禁鼓栗，"}, {"f": "audio/fe/L1-nj-76__17.mp3", "t": "如丧神守，"}, {"f": "audio/fe/L1-nj-76__18.mp3", "t": "皆属于火。"}, {"f": "audio/fe/L1-nj-76__19.mp3", "t": "诸痉项强，"}, {"f": "audio/fe/L1-nj-76__20.mp3", "t": "皆属于湿。"}, {"f": "audio/fe/L1-nj-76__21.mp3", "t": "诸逆冲上，"}, {"f": "audio/fe/L1-nj-76__22.mp3", "t": "皆属于火。"}, {"f": "audio/fe/L1-nj-76__23.mp3", "t": "诸胀腹大，"}, {"f": "audio/fe/L1-nj-76__24.mp3", "t": "皆属于热。"}, {"f": "audio/fe/L1-nj-76__25.mp3", "t": "诸躁狂越，"}, {"f": "audio/fe/L1-nj-76__26.mp3", "t": "皆属于火。"}, {"f": "audio/fe/L1-nj-76__27.mp3", "t": "诸暴强直，"}, {"f": "audio/fe/L1-nj-76__28.mp3", "t": "皆属于风。"}, {"f": "audio/fe/L1-nj-76__29.mp3", "t": "诸病有声，"}, {"f": "audio/fe/L1-nj-76__30.mp3", "t": "鼓之如鼓，"}, {"f": "audio/fe/L1-nj-76__31.mp3", "t": "皆属于热。"}, {"f": "audio/fe/L1-nj-76__32.mp3", "t": "诸病胕肿，"}, {"f": "audio/fe/L1-nj-76__33.mp3", "t": "疼酸惊骇，"}, {"f": "audio/fe/L1-nj-76__34.mp3", "t": "皆属于火。"}, {"f": "audio/fe/L1-nj-76__35.mp3", "t": "诸转反戾，"}, {"f": "audio/fe/L1-nj-76__36.mp3", "t": "水液浑浊，"}, {"f": "audio/fe/L1-nj-76__37.mp3", "t": "皆属于热。"}, {"f": "audio/fe/L1-nj-76__38.mp3", "t": "诸病水液，"}, {"f": "audio/fe/L1-nj-76__39.mp3", "t": "澄澈清冷，"}, {"f": "audio/fe/L1-nj-76__40.mp3", "t": "皆属于寒。"}, {"f": "audio/fe/L1-nj-76__41.mp3", "t": "诸呕吐酸，"}, {"f": "audio/fe/L1-nj-76__42.mp3", "t": "暴注下迫，"}, {"f": "audio/fe/L1-nj-76__43.mp3", "t": "皆属于热。"}], "L1-nj-77": [{"f": "audio/99/L1-nj-77__0.mp3", "t": "谨守病机，"}, {"f": "audio/99/L1-nj-77__1.mp3", "t": "各司其属，"}, {"f": "audio/99/L1-nj-77__2.mp3", "t": "有者求之，"}, {"f": "audio/99/L1-nj-77__3.mp3", "t": "无者求之，"}, {"f": "audio/99/L1-nj-77__4.mp3", "t": "盛者责之，"}, {"f": "audio/99/L1-nj-77__5.mp3", "t": "虚者责之。"}], "L1-nj-78": [{"f": "audio/30/L1-nj-78__0.mp3", "t": "寒者热之，"}, {"f": "audio/30/L1-nj-78__1.mp3", "t": "热者寒之，"}, {"f": "audio/30/L1-nj-78__2.mp3", "t": "微者逆之，"}, {"f": "audio/30/L1-nj-78__3.mp3", "t": "甚者从之。"}], "L1-nj-79": [{"f": "audio/bd/L1-nj-79__0.mp3", "t": "热因寒用，"}, {"f": "audio/bd/L1-nj-79__1.mp3", "t": "寒因热用，"}, {"f": "audio/bd/L1-nj-79__2.mp3", "t": "塞因塞用，"}, {"f": "audio/bd/L1-nj-79__3.mp3", "t": "通因通用。"}], "L1-nj-80": [{"f": "audio/23/L1-nj-80__0.mp3", "t": "诸寒之而热者取之阴，"}, {"f": "audio/23/L1-nj-80__1.mp3", "t": "热之而寒者取之阳。"}], "L1-nj-81": [{"f": "audio/6f/L1-nj-81__0.mp3", "t": "肺合大肠……心合小肠……肝合胆……脾合胃……肾合膀胱……三焦者，"}, {"f": "audio/6f/L1-nj-81__1.mp3", "t": "中渎之腑也，"}, {"f": "audio/6f/L1-nj-81__2.mp3", "t": "水道出焉，"}, {"f": "audio/6f/L1-nj-81__3.mp3", "t": "属膀胱，"}, {"f": "audio/6f/L1-nj-81__4.mp3", "t": "是孤之腑也。"}], "L1-nj-82": [{"f": "audio/e4/L1-nj-82__0.mp3", "t": "故生之来谓之精，"}, {"f": "audio/e4/L1-nj-82__1.mp3", "t": "两精相搏谓之神，"}, {"f": "audio/e4/L1-nj-82__2.mp3", "t": "随神往来者谓之魂，"}, {"f": "audio/e4/L1-nj-82__3.mp3", "t": "并精而出入者谓之魄，"}, {"f": "audio/e4/L1-nj-82__4.mp3", "t": "所以任物者谓之心，"}, {"f": "audio/e4/L1-nj-82__5.mp3", "t": "心有所忆谓之意，"}, {"f": "audio/e4/L1-nj-82__6.mp3", "t": "意之所存谓之志，"}, {"f": "audio/e4/L1-nj-82__7.mp3", "t": "因志而存变谓之思，"}, {"f": "audio/e4/L1-nj-82__8.mp3", "t": "因思而远慕谓之虑，"}, {"f": "audio/e4/L1-nj-82__9.mp3", "t": "因虑而处物谓之智。"}], "L1-nj-83": [{"f": "audio/dc/L1-nj-83__0.mp3", "t": "故智者之养生也，"}, {"f": "audio/dc/L1-nj-83__1.mp3", "t": "必顺四时而适寒暑，"}, {"f": "audio/dc/L1-nj-83__2.mp3", "t": "和喜怒而安居处，"}, {"f": "audio/dc/L1-nj-83__3.mp3", "t": "节阴阳而调刚柔，"}, {"f": "audio/dc/L1-nj-83__4.mp3", "t": "如是则僻邪不至，"}, {"f": "audio/dc/L1-nj-83__5.mp3", "t": "长生久视。"}], "L1-nj-84": [{"f": "audio/7f/L1-nj-84__0.mp3", "t": "肝藏血，"}, {"f": "audio/7f/L1-nj-84__1.mp3", "t": "血舍魂，"}, {"f": "audio/7f/L1-nj-84__2.mp3", "t": "肝气虚则恐，"}, {"f": "audio/7f/L1-nj-84__3.mp3", "t": "实则怒。"}, {"f": "audio/7f/L1-nj-84__4.mp3", "t": "脾藏营，"}, {"f": "audio/7f/L1-nj-84__5.mp3", "t": "营舍意，"}, {"f": "audio/7f/L1-nj-84__6.mp3", "t": "脾气虚则四肢不用，"}, {"f": "audio/7f/L1-nj-84__7.mp3", "t": "五脏不安，"}, {"f": "audio/7f/L1-nj-84__8.mp3", "t": "实则腹胀，"}, {"f": "audio/7f/L1-nj-84__9.mp3", "t": "泾溲不利。"}, {"f": "audio/7f/L1-nj-84__10.mp3", "t": "心藏脉，"}, {"f": "audio/7f/L1-nj-84__11.mp3", "t": "脉舍神，"}, {"f": "audio/7f/L1-nj-84__12.mp3", "t": "心气虚则悲，"}, {"f": "audio/7f/L1-nj-84__13.mp3", "t": "实则笑不休。"}, {"f": "audio/7f/L1-nj-84__14.mp3", "t": "肺藏气，"}, {"f": "audio/7f/L1-nj-84__15.mp3", "t": "气舍魄，"}, {"f": "audio/7f/L1-nj-84__16.mp3", "t": "肺气虚则鼻塞不利，"}, {"f": "audio/7f/L1-nj-84__17.mp3", "t": "少气，"}, {"f": "audio/7f/L1-nj-84__18.mp3", "t": "实则喘喝，"}, {"f": "audio/7f/L1-nj-84__19.mp3", "t": "胸盈仰息。"}, {"f": "audio/7f/L1-nj-84__20.mp3", "t": "肾藏精，"}, {"f": "audio/7f/L1-nj-84__21.mp3", "t": "精舍志，"}, {"f": "audio/7f/L1-nj-84__22.mp3", "t": "肾气虚则厥，"}, {"f": "audio/7f/L1-nj-84__23.mp3", "t": "实则胀，"}, {"f": "audio/7f/L1-nj-84__24.mp3", "t": "五脏不安。"}], "L1-nj-85": [{"f": "audio/8d/L1-nj-85__0.mp3", "t": "人受气于谷，"}, {"f": "audio/8d/L1-nj-85__1.mp3", "t": "谷入于胃，"}, {"f": "audio/8d/L1-nj-85__2.mp3", "t": "以传与肺，"}, {"f": "audio/8d/L1-nj-85__3.mp3", "t": "五脏六腑皆以受气，"}, {"f": "audio/8d/L1-nj-85__4.mp3", "t": "其清者为营，"}, {"f": "audio/8d/L1-nj-85__5.mp3", "t": "浊者为卫，"}, {"f": "audio/8d/L1-nj-85__6.mp3", "t": "营在脉中，"}, {"f": "audio/8d/L1-nj-85__7.mp3", "t": "卫在脉外。"}], "L1-nj-86": [{"f": "audio/7e/L1-nj-86__0.mp3", "t": "上焦如雾，"}, {"f": "audio/7e/L1-nj-86__1.mp3", "t": "中焦如沤，"}, {"f": "audio/7e/L1-nj-86__2.mp3", "t": "下焦如渎。"}], "L1-nj-87": [{"f": "audio/05/L1-nj-87__0.mp3", "t": "两神相搏，"}, {"f": "audio/05/L1-nj-87__1.mp3", "t": "合而成形，"}, {"f": "audio/05/L1-nj-87__2.mp3", "t": "常先身生，"}, {"f": "audio/05/L1-nj-87__3.mp3", "t": "是谓精。"}, {"f": "audio/05/L1-nj-87__4.mp3", "t": "上焦开发，"}, {"f": "audio/05/L1-nj-87__5.mp3", "t": "宣五谷味，"}, {"f": "audio/05/L1-nj-87__6.mp3", "t": "熏肤充身泽毛，"}, {"f": "audio/05/L1-nj-87__7.mp3", "t": "若雾露之溉，"}, {"f": "audio/05/L1-nj-87__8.mp3", "t": "是谓气。"}, {"f": "audio/05/L1-nj-87__9.mp3", "t": "腠理发泄，"}, {"f": "audio/05/L1-nj-87__10.mp3", "t": "汗出溱溱，"}, {"f": "audio/05/L1-nj-87__11.mp3", "t": "是谓津。"}, {"f": "audio/05/L1-nj-87__12.mp3", "t": "谷入气满，"}, {"f": "audio/05/L1-nj-87__13.mp3", "t": "淖泽注于骨，"}, {"f": "audio/05/L1-nj-87__14.mp3", "t": "骨属屈伸，"}, {"f": "audio/05/L1-nj-87__15.mp3", "t": "泄泽补益脑髓，"}, {"f": "audio/05/L1-nj-87__16.mp3", "t": "皮肤润泽，"}, {"f": "audio/05/L1-nj-87__17.mp3", "t": "是谓液。"}, {"f": "audio/05/L1-nj-87__18.mp3", "t": "中焦受气取汁，"}, {"f": "audio/05/L1-nj-87__19.mp3", "t": "变化而赤，"}, {"f": "audio/05/L1-nj-87__20.mp3", "t": "是谓血。"}, {"f": "audio/05/L1-nj-87__21.mp3", "t": "壅遏营气，"}, {"f": "audio/05/L1-nj-87__22.mp3", "t": "令无所避，"}, {"f": "audio/05/L1-nj-87__23.mp3", "t": "是谓脉。"}], "L1-nj-88": [{"f": "audio/a5/L1-nj-88__0.mp3", "t": "精脱者，"}, {"f": "audio/a5/L1-nj-88__1.mp3", "t": "耳聋；"}, {"f": "audio/a5/L1-nj-88__2.mp3", "t": "气脱者，"}, {"f": "audio/a5/L1-nj-88__3.mp3", "t": "目不明；"}, {"f": "audio/a5/L1-nj-88__4.mp3", "t": "津脱者，"}, {"f": "audio/a5/L1-nj-88__5.mp3", "t": "腠理开，"}, {"f": "audio/a5/L1-nj-88__6.mp3", "t": "汗大泄；"}, {"f": "audio/a5/L1-nj-88__7.mp3", "t": "液脱者，"}, {"f": "audio/a5/L1-nj-88__8.mp3", "t": "骨属屈伸不利，"}, {"f": "audio/a5/L1-nj-88__9.mp3", "t": "色夭，"}, {"f": "audio/a5/L1-nj-88__10.mp3", "t": "脑髓消，"}, {"f": "audio/a5/L1-nj-88__11.mp3", "t": "胫酸，"}, {"f": "audio/a5/L1-nj-88__12.mp3", "t": "耳数鸣；"}, {"f": "audio/a5/L1-nj-88__13.mp3", "t": "血脱者，"}, {"f": "audio/a5/L1-nj-88__14.mp3", "t": "色白，"}, {"f": "audio/a5/L1-nj-88__15.mp3", "t": "夭然不泽，"}, {"f": "audio/a5/L1-nj-88__16.mp3", "t": "其脉空虚。"}], "L1-nj-89": [{"f": "audio/2a/L1-nj-89__0.mp3", "t": "胃者，"}, {"f": "audio/2a/L1-nj-89__1.mp3", "t": "五脏六腑之海也，"}, {"f": "audio/2a/L1-nj-89__2.mp3", "t": "水谷皆入于胃，"}, {"f": "audio/2a/L1-nj-89__3.mp3", "t": "五脏六腑皆禀气于胃。"}], "L1-nj-90": [{"f": "audio/34/L1-nj-90__0.mp3", "t": "人之血气精神者，"}, {"f": "audio/34/L1-nj-90__1.mp3", "t": "所以奉生而周于性命者也。"}, {"f": "audio/34/L1-nj-90__2.mp3", "t": "经脉者，"}, {"f": "audio/34/L1-nj-90__3.mp3", "t": "所以行血气而营阴阳，"}, {"f": "audio/34/L1-nj-90__4.mp3", "t": "濡筋骨，"}, {"f": "audio/34/L1-nj-90__5.mp3", "t": "利关节者也。"}, {"f": "audio/34/L1-nj-90__6.mp3", "t": "卫气者，"}, {"f": "audio/34/L1-nj-90__7.mp3", "t": "所以温分肉，"}, {"f": "audio/34/L1-nj-90__8.mp3", "t": "充皮肤，"}, {"f": "audio/34/L1-nj-90__9.mp3", "t": "肥腠理，"}, {"f": "audio/34/L1-nj-90__10.mp3", "t": "司开阖者也。"}, {"f": "audio/34/L1-nj-90__11.mp3", "t": "志意者，"}, {"f": "audio/34/L1-nj-90__12.mp3", "t": "所以御精神，"}, {"f": "audio/34/L1-nj-90__13.mp3", "t": "收魂魄，"}, {"f": "audio/34/L1-nj-90__14.mp3", "t": "适寒温，"}, {"f": "audio/34/L1-nj-90__15.mp3", "t": "和喜怒者也。"}], "L1-nj-91": [{"f": "audio/81/L1-nj-91__0.mp3", "t": "五色各见其部，"}, {"f": "audio/81/L1-nj-91__1.mp3", "t": "察其浮沉，"}, {"f": "audio/81/L1-nj-91__2.mp3", "t": "以知浅深；"}, {"f": "audio/81/L1-nj-91__3.mp3", "t": "察其泽夭，"}, {"f": "audio/81/L1-nj-91__4.mp3", "t": "以观成败；"}, {"f": "audio/81/L1-nj-91__5.mp3", "t": "察其散抟，"}, {"f": "audio/81/L1-nj-91__6.mp3", "t": "以知远近；"}, {"f": "audio/81/L1-nj-91__7.mp3", "t": "视色上下，"}, {"f": "audio/81/L1-nj-91__8.mp3", "t": "以知病处。"}], "L1-nj-92": [{"f": "audio/14/L1-nj-92__0.mp3", "t": "以母为基，"}, {"f": "audio/14/L1-nj-92__1.mp3", "t": "以父为楯，"}, {"f": "audio/14/L1-nj-92__2.mp3", "t": "失神者死，"}, {"f": "audio/14/L1-nj-92__3.mp3", "t": "得神者生也。"}], "L1-nj-93": [{"f": "audio/09/L1-nj-93__0.mp3", "t": "喜怒不节则伤脏，"}, {"f": "audio/09/L1-nj-93__1.mp3", "t": "风雨则伤上，"}, {"f": "audio/09/L1-nj-93__2.mp3", "t": "清湿则伤下。"}, {"f": "audio/09/L1-nj-93__3.mp3", "t": "三部之气，"}, {"f": "audio/09/L1-nj-93__4.mp3", "t": "所伤异类。"}], "L1-nj-94": [{"f": "audio/c7/L1-nj-94__0.mp3", "t": "两虚相得，"}, {"f": "audio/c7/L1-nj-94__1.mp3", "t": "乃客其形，"}, {"f": "audio/c7/L1-nj-94__2.mp3", "t": "两实相逢，"}, {"f": "audio/c7/L1-nj-94__3.mp3", "t": "众人肉坚。"}], "L1-nj-95": [{"f": "audio/25/L1-nj-95__0.mp3", "t": "卒然外中于寒，"}, {"f": "audio/25/L1-nj-95__1.mp3", "t": "若内伤于忧愁，"}, {"f": "audio/25/L1-nj-95__2.mp3", "t": "则气上逆，"}, {"f": "audio/25/L1-nj-95__3.mp3", "t": "气上逆则六输不通，"}, {"f": "audio/25/L1-nj-95__4.mp3", "t": "温气不行，"}, {"f": "audio/25/L1-nj-95__5.mp3", "t": "凝血蕴里而不散，"}, {"f": "audio/25/L1-nj-95__6.mp3", "t": "津液涩渗，"}, {"f": "audio/25/L1-nj-95__7.mp3", "t": "著而不去，"}, {"f": "audio/25/L1-nj-95__8.mp3", "t": "而积皆成矣。"}], "L1-nj-96": [{"f": "audio/82/L1-nj-96__0.mp3", "t": "真气者，"}, {"f": "audio/82/L1-nj-96__1.mp3", "t": "所受于天，"}, {"f": "audio/82/L1-nj-96__2.mp3", "t": "与谷气并而充身者也。"}], "L1-nj-97": [{"f": "audio/0b/L1-nj-97__0.mp3", "t": "五脏六腑之精气，"}, {"f": "audio/0b/L1-nj-97__1.mp3", "t": "皆上注于目而为之精。"}, {"f": "audio/0b/L1-nj-97__2.mp3", "t": "精之窠为眼，"}, {"f": "audio/0b/L1-nj-97__3.mp3", "t": "骨之精为瞳子，"}, {"f": "audio/0b/L1-nj-97__4.mp3", "t": "筋之精为黑眼，"}, {"f": "audio/0b/L1-nj-97__5.mp3", "t": "血之精为络，"}, {"f": "audio/0b/L1-nj-97__6.mp3", "t": "其窠气之精为白眼，"}, {"f": "audio/0b/L1-nj-97__7.mp3", "t": "肌肉之精为约束。"}], "L1-sh-0": [{"f": "audio/6f/L1-sh-0__0.mp3", "t": "太阳之为病，"}, {"f": "audio/6f/L1-sh-0__1.mp3", "t": "脉浮，"}, {"f": "audio/6f/L1-sh-0__2.mp3", "t": "头项强痛而恶寒。"}], "L1-sh-1": [{"f": "audio/c2/L1-sh-1__0.mp3", "t": "太阳病，"}, {"f": "audio/c2/L1-sh-1__1.mp3", "t": "发热，"}, {"f": "audio/c2/L1-sh-1__2.mp3", "t": "汗出，"}, {"f": "audio/c2/L1-sh-1__3.mp3", "t": "恶风，"}, {"f": "audio/c2/L1-sh-1__4.mp3", "t": "脉缓者，"}, {"f": "audio/c2/L1-sh-1__5.mp3", "t": "名为中风。"}], "L1-sh-2": [{"f": "audio/7f/L1-sh-2__0.mp3", "t": "太阳病，"}, {"f": "audio/7f/L1-sh-2__1.mp3", "t": "或已发热，"}, {"f": "audio/7f/L1-sh-2__2.mp3", "t": "或未发热，"}, {"f": "audio/7f/L1-sh-2__3.mp3", "t": "必恶寒，"}, {"f": "audio/7f/L1-sh-2__4.mp3", "t": "体痛，"}, {"f": "audio/7f/L1-sh-2__5.mp3", "t": "呕逆，"}, {"f": "audio/7f/L1-sh-2__6.mp3", "t": "脉阴阳俱紧者，"}, {"f": "audio/7f/L1-sh-2__7.mp3", "t": "名为伤寒。"}], "L1-sh-3": [{"f": "audio/e9/L1-sh-3__0.mp3", "t": "太阳病，"}, {"f": "audio/e9/L1-sh-3__1.mp3", "t": "发热而渴，"}, {"f": "audio/e9/L1-sh-3__2.mp3", "t": "不恶寒者，"}, {"f": "audio/e9/L1-sh-3__3.mp3", "t": "为温病。"}], "L1-sh-4": [{"f": "audio/7f/L1-sh-4__0.mp3", "t": "病有发热恶寒者，"}, {"f": "audio/7f/L1-sh-4__1.mp3", "t": "发于阳也；"}, {"f": "audio/7f/L1-sh-4__2.mp3", "t": "无热恶寒者，"}, {"f": "audio/7f/L1-sh-4__3.mp3", "t": "发于阴也。"}], "L1-sh-5": [{"f": "audio/46/L1-sh-5__0.mp3", "t": "病人身大热，"}, {"f": "audio/46/L1-sh-5__1.mp3", "t": "反欲得衣者，"}, {"f": "audio/46/L1-sh-5__2.mp3", "t": "热在皮肤，"}, {"f": "audio/46/L1-sh-5__3.mp3", "t": "寒在骨髓也；"}, {"f": "audio/46/L1-sh-5__4.mp3", "t": "身大寒，"}, {"f": "audio/46/L1-sh-5__5.mp3", "t": "反不欲近衣者，"}, {"f": "audio/46/L1-sh-5__6.mp3", "t": "寒在皮肤，"}, {"f": "audio/46/L1-sh-5__7.mp3", "t": "热在骨髓也。"}], "L1-sh-6": [{"f": "audio/14/L1-sh-6__0.mp3", "t": "太阳中风，"}, {"f": "audio/14/L1-sh-6__1.mp3", "t": "阳浮而阴弱。"}, {"f": "audio/14/L1-sh-6__2.mp3", "t": "阳浮者，"}, {"f": "audio/14/L1-sh-6__3.mp3", "t": "热自发；"}, {"f": "audio/14/L1-sh-6__4.mp3", "t": "阴弱者，"}, {"f": "audio/14/L1-sh-6__5.mp3", "t": "汗自出。"}, {"f": "audio/14/L1-sh-6__6.mp3", "t": "啬啬恶寒，"}, {"f": "audio/14/L1-sh-6__7.mp3", "t": "淅淅恶风，"}, {"f": "audio/14/L1-sh-6__8.mp3", "t": "翕翕发热，"}, {"f": "audio/14/L1-sh-6__9.mp3", "t": "鼻鸣干呕者，"}, {"f": "audio/14/L1-sh-6__10.mp3", "t": "桂枝汤主之。"}], "L1-sh-7": [{"f": "audio/bd/L1-sh-7__0.mp3", "t": "太阳病，"}, {"f": "audio/bd/L1-sh-7__1.mp3", "t": "项背强几几，"}, {"f": "audio/bd/L1-sh-7__2.mp3", "t": "反汗出恶风者，"}, {"f": "audio/bd/L1-sh-7__3.mp3", "t": "桂枝加葛根汤主之。"}], "L1-sh-8": [{"f": "audio/cf/L1-sh-8__0.mp3", "t": "太阳病三日，"}, {"f": "audio/cf/L1-sh-8__1.mp3", "t": "已发汗，"}, {"f": "audio/cf/L1-sh-8__2.mp3", "t": "若吐、"}, {"f": "audio/cf/L1-sh-8__3.mp3", "t": "若下、"}, {"f": "audio/cf/L1-sh-8__4.mp3", "t": "若温针，"}, {"f": "audio/cf/L1-sh-8__5.mp3", "t": "仍不解者，"}, {"f": "audio/cf/L1-sh-8__6.mp3", "t": "此为坏病，"}, {"f": "audio/cf/L1-sh-8__7.mp3", "t": "桂枝不中与之也。"}, {"f": "audio/cf/L1-sh-8__8.mp3", "t": "观其脉证，"}, {"f": "audio/cf/L1-sh-8__9.mp3", "t": "知犯何逆，"}, {"f": "audio/cf/L1-sh-8__10.mp3", "t": "随证治之。"}], "L1-sh-9": [{"f": "audio/a6/L1-sh-9__0.mp3", "t": "喘家，"}, {"f": "audio/a6/L1-sh-9__1.mp3", "t": "作桂枝汤，"}, {"f": "audio/a6/L1-sh-9__2.mp3", "t": "加厚朴杏子佳。"}], "L1-sh-10": [{"f": "audio/3b/L1-sh-10__0.mp3", "t": "太阳病，"}, {"f": "audio/3b/L1-sh-10__1.mp3", "t": "发汗，"}, {"f": "audio/3b/L1-sh-10__2.mp3", "t": "遂漏不止，"}, {"f": "audio/3b/L1-sh-10__3.mp3", "t": "其人恶风，"}, {"f": "audio/3b/L1-sh-10__4.mp3", "t": "小便难，"}, {"f": "audio/3b/L1-sh-10__5.mp3", "t": "四肢微急，"}, {"f": "audio/3b/L1-sh-10__6.mp3", "t": "难以屈伸者，"}, {"f": "audio/3b/L1-sh-10__7.mp3", "t": "桂枝加附子汤主之。"}], "L1-sh-11": [{"f": "audio/cb/L1-sh-11__0.mp3", "t": "太阳病，"}, {"f": "audio/cb/L1-sh-11__1.mp3", "t": "下之后，"}, {"f": "audio/cb/L1-sh-11__2.mp3", "t": "脉促胸满者，"}, {"f": "audio/cb/L1-sh-11__3.mp3", "t": "桂枝去芍药汤主之。"}, {"f": "audio/cb/L1-sh-11__4.mp3", "t": "若微寒者，"}, {"f": "audio/cb/L1-sh-11__5.mp3", "t": "桂枝去芍药加附子汤主之。"}], "L1-sh-12": [{"f": "audio/22/L1-sh-12__0.mp3", "t": "服桂枝汤，"}, {"f": "audio/22/L1-sh-12__1.mp3", "t": "或下之，"}, {"f": "audio/22/L1-sh-12__2.mp3", "t": "仍头项强痛，"}, {"f": "audio/22/L1-sh-12__3.mp3", "t": "翕翕发热，"}, {"f": "audio/22/L1-sh-12__4.mp3", "t": "无汗，"}, {"f": "audio/22/L1-sh-12__5.mp3", "t": "心下满微痛，"}, {"f": "audio/22/L1-sh-12__6.mp3", "t": "小便不利者，"}, {"f": "audio/22/L1-sh-12__7.mp3", "t": "桂枝去桂加茯苓白术汤主之。"}], "L1-sh-13": [{"f": "audio/2e/L1-sh-13__0.mp3", "t": "太阳病，"}, {"f": "audio/2e/L1-sh-13__1.mp3", "t": "项背强几几，"}, {"f": "audio/2e/L1-sh-13__2.mp3", "t": "无汗恶风，"}, {"f": "audio/2e/L1-sh-13__3.mp3", "t": "葛根汤主之。"}], "L1-sh-14": [{"f": "audio/e2/L1-sh-14__0.mp3", "t": "太阳与阳明合病者，"}, {"f": "audio/e2/L1-sh-14__1.mp3", "t": "必自下利，"}, {"f": "audio/e2/L1-sh-14__2.mp3", "t": "葛根汤主之。"}], "L1-sh-15": [{"f": "audio/74/L1-sh-15__0.mp3", "t": "太阳病，"}, {"f": "audio/74/L1-sh-15__1.mp3", "t": "桂枝证，"}, {"f": "audio/74/L1-sh-15__2.mp3", "t": "医反下之，"}, {"f": "audio/74/L1-sh-15__3.mp3", "t": "利遂不止，"}, {"f": "audio/74/L1-sh-15__4.mp3", "t": "脉促者，"}, {"f": "audio/74/L1-sh-15__5.mp3", "t": "表未解也；"}, {"f": "audio/74/L1-sh-15__6.mp3", "t": "喘而汗出者，"}, {"f": "audio/74/L1-sh-15__7.mp3", "t": "葛根黄芩黄连汤主之。"}], "L1-sh-16": [{"f": "audio/87/L1-sh-16__0.mp3", "t": "太阳病，"}, {"f": "audio/87/L1-sh-16__1.mp3", "t": "头痛发热，"}, {"f": "audio/87/L1-sh-16__2.mp3", "t": "身疼腰痛，"}, {"f": "audio/87/L1-sh-16__3.mp3", "t": "骨节疼痛，"}, {"f": "audio/87/L1-sh-16__4.mp3", "t": "恶风无汗而喘者，"}, {"f": "audio/87/L1-sh-16__5.mp3", "t": "麻黄汤主之。"}], "L1-sh-17": [{"f": "audio/1f/L1-sh-17__0.mp3", "t": "太阳中风，"}, {"f": "audio/1f/L1-sh-17__1.mp3", "t": "脉浮紧，"}, {"f": "audio/1f/L1-sh-17__2.mp3", "t": "发热恶寒，"}, {"f": "audio/1f/L1-sh-17__3.mp3", "t": "身疼痛，"}, {"f": "audio/1f/L1-sh-17__4.mp3", "t": "不汗出而烦躁者，"}, {"f": "audio/1f/L1-sh-17__5.mp3", "t": "大青龙汤主之。"}, {"f": "audio/1f/L1-sh-17__6.mp3", "t": "若脉微弱，"}, {"f": "audio/1f/L1-sh-17__7.mp3", "t": "汗出恶风者，"}, {"f": "audio/1f/L1-sh-17__8.mp3", "t": "不可服之。"}], "L1-sh-18": [{"f": "audio/5b/L1-sh-18__0.mp3", "t": "伤寒表不解，"}, {"f": "audio/5b/L1-sh-18__1.mp3", "t": "心下有水气，"}, {"f": "audio/5b/L1-sh-18__2.mp3", "t": "干呕发热而咳，"}, {"f": "audio/5b/L1-sh-18__3.mp3", "t": "或渴，"}, {"f": "audio/5b/L1-sh-18__4.mp3", "t": "或利，"}, {"f": "audio/5b/L1-sh-18__5.mp3", "t": "或噎，"}, {"f": "audio/5b/L1-sh-18__6.mp3", "t": "或小便不利少腹满，"}, {"f": "audio/5b/L1-sh-18__7.mp3", "t": "或喘者，"}, {"f": "audio/5b/L1-sh-18__8.mp3", "t": "小青龙汤主之。"}], "L1-sh-19": [{"f": "audio/9d/L1-sh-19__0.mp3", "t": "太阳病，"}, {"f": "audio/9d/L1-sh-19__1.mp3", "t": "下之微喘者，"}, {"f": "audio/9d/L1-sh-19__2.mp3", "t": "表未解故也，"}, {"f": "audio/9d/L1-sh-19__3.mp3", "t": "桂枝加厚朴杏子汤主之。"}], "L1-sh-20": [{"f": "audio/83/L1-sh-20__0.mp3", "t": "病常自汗出，"}, {"f": "audio/83/L1-sh-20__1.mp3", "t": "此为荣气和。"}, {"f": "audio/83/L1-sh-20__2.mp3", "t": "荣气和者，"}, {"f": "audio/83/L1-sh-20__3.mp3", "t": "外不谐，"}, {"f": "audio/83/L1-sh-20__4.mp3", "t": "以卫气不共荣气和谐故尔。"}, {"f": "audio/83/L1-sh-20__5.mp3", "t": "以荣行脉中，"}, {"f": "audio/83/L1-sh-20__6.mp3", "t": "卫行脉外，"}, {"f": "audio/83/L1-sh-20__7.mp3", "t": "复发其汗，"}, {"f": "audio/83/L1-sh-20__8.mp3", "t": "荣卫和则愈，"}, {"f": "audio/83/L1-sh-20__9.mp3", "t": "宜桂枝汤。"}], "L1-sh-21": [{"f": "audio/ec/L1-sh-21__0.mp3", "t": "病人脏无他病，"}, {"f": "audio/ec/L1-sh-21__1.mp3", "t": "时发热自汗出而不愈者，"}, {"f": "audio/ec/L1-sh-21__2.mp3", "t": "此卫气不和也。"}, {"f": "audio/ec/L1-sh-21__3.mp3", "t": "先其时发汗则愈，"}, {"f": "audio/ec/L1-sh-21__4.mp3", "t": "宜桂枝汤。"}], "L1-sh-22": [{"f": "audio/b2/L1-sh-22__0.mp3", "t": "凡病，"}, {"f": "audio/b2/L1-sh-22__1.mp3", "t": "若发汗、"}, {"f": "audio/b2/L1-sh-22__2.mp3", "t": "若吐、"}, {"f": "audio/b2/L1-sh-22__3.mp3", "t": "若下、"}, {"f": "audio/b2/L1-sh-22__4.mp3", "t": "若亡血、"}, {"f": "audio/b2/L1-sh-22__5.mp3", "t": "亡津液，"}, {"f": "audio/b2/L1-sh-22__6.mp3", "t": "阴阳自和者，"}, {"f": "audio/b2/L1-sh-22__7.mp3", "t": "必自愈。"}], "L1-sh-23": [{"f": "audio/72/L1-sh-23__0.mp3", "t": "下之后，"}, {"f": "audio/72/L1-sh-23__1.mp3", "t": "复发汗，"}, {"f": "audio/72/L1-sh-23__2.mp3", "t": "昼日烦躁不得眠，"}, {"f": "audio/72/L1-sh-23__3.mp3", "t": "夜而安静，"}, {"f": "audio/72/L1-sh-23__4.mp3", "t": "不呕不渴，"}, {"f": "audio/72/L1-sh-23__5.mp3", "t": "无表证，"}, {"f": "audio/72/L1-sh-23__6.mp3", "t": "脉沉微，"}, {"f": "audio/72/L1-sh-23__7.mp3", "t": "身无大热者，"}, {"f": "audio/72/L1-sh-23__8.mp3", "t": "干姜附子汤主之。"}], "L1-sh-24": [{"f": "audio/35/L1-sh-24__0.mp3", "t": "发汗后，"}, {"f": "audio/35/L1-sh-24__1.mp3", "t": "身疼痛，"}, {"f": "audio/35/L1-sh-24__2.mp3", "t": "脉沉迟者，"}, {"f": "audio/35/L1-sh-24__3.mp3", "t": "桂枝加芍药生姜各一两人参三两新加汤主之。"}], "L1-sh-25": [{"f": "audio/4a/L1-sh-25__0.mp3", "t": "发汗后，"}, {"f": "audio/4a/L1-sh-25__1.mp3", "t": "不可更行桂枝汤，"}, {"f": "audio/4a/L1-sh-25__2.mp3", "t": "汗出而喘，"}, {"f": "audio/4a/L1-sh-25__3.mp3", "t": "无大热者，"}, {"f": "audio/4a/L1-sh-25__4.mp3", "t": "可与麻黄杏仁甘草石膏汤。"}], "L1-sh-26": [{"f": "audio/a1/L1-sh-26__0.mp3", "t": "发汗过多，"}, {"f": "audio/a1/L1-sh-26__1.mp3", "t": "其人叉手自冒心，"}, {"f": "audio/a1/L1-sh-26__2.mp3", "t": "心下悸，"}, {"f": "audio/a1/L1-sh-26__3.mp3", "t": "欲得按者，"}, {"f": "audio/a1/L1-sh-26__4.mp3", "t": "桂枝甘草汤主之。"}], "L1-sh-27": [{"f": "audio/b6/L1-sh-27__0.mp3", "t": "发汗后，"}, {"f": "audio/b6/L1-sh-27__1.mp3", "t": "其人脐下悸者，"}, {"f": "audio/b6/L1-sh-27__2.mp3", "t": "欲作奔豚，"}, {"f": "audio/b6/L1-sh-27__3.mp3", "t": "茯苓桂枝甘草大枣汤主之。"}], "L1-sh-28": [{"f": "audio/1f/L1-sh-28__0.mp3", "t": "发汗后，"}, {"f": "audio/1f/L1-sh-28__1.mp3", "t": "腹胀满者，"}, {"f": "audio/1f/L1-sh-28__2.mp3", "t": "厚朴生姜半夏甘草人参汤主之。"}], "L1-sh-29": [{"f": "audio/1f/L1-sh-29__0.mp3", "t": "伤寒，"}, {"f": "audio/1f/L1-sh-29__1.mp3", "t": "若吐若下后，"}, {"f": "audio/1f/L1-sh-29__2.mp3", "t": "心下逆满，"}, {"f": "audio/1f/L1-sh-29__3.mp3", "t": "气上冲胸，"}, {"f": "audio/1f/L1-sh-29__4.mp3", "t": "起则头眩，"}, {"f": "audio/1f/L1-sh-29__5.mp3", "t": "脉沉紧，"}, {"f": "audio/1f/L1-sh-29__6.mp3", "t": "发汗则动经，"}, {"f": "audio/1f/L1-sh-29__7.mp3", "t": "身为振振摇者，"}, {"f": "audio/1f/L1-sh-29__8.mp3", "t": "茯苓桂枝白术甘草汤主之。"}], "L1-sh-30": [{"f": "audio/77/L1-sh-30__0.mp3", "t": "太阳病，"}, {"f": "audio/77/L1-sh-30__1.mp3", "t": "发汗后，"}, {"f": "audio/77/L1-sh-30__2.mp3", "t": "大汗出，"}, {"f": "audio/77/L1-sh-30__3.mp3", "t": "胃中干，"}, {"f": "audio/77/L1-sh-30__4.mp3", "t": "烦躁不得眠，"}, {"f": "audio/77/L1-sh-30__5.mp3", }, {"f": "audio/76/L1-sh-34__9.mp3", "t": "或胁下痞硬，"}, {"f": "audio/76/L1-sh-34__10.mp3", "t": "或心下悸小便不利，"}, {"f": "audio/76/L1-sh-34__11.mp3", "t": "或不渴身有微热，"}, {"f": "audio/76/L1-sh-34__12.mp3", "t": "或咳者，"}, {"f": "audio/76/L1-sh-34__13.mp3", "t": "小柴胡汤主之。"}], "L1-sh-35": [{"f": "audio/1a/L1-sh-35__0.mp3", "t": "伤寒，"}, {"f": "audio/1a/L1-sh-35__1.mp3", "t": "阳脉涩，"}, {"f": "audio/1a/L1-sh-35__2.mp3", "t": "阴脉弦，"}, {"f": "audio/1a/L1-sh-35__3.mp3", "t": "法当腹中急痛，"}, {"f": "audio/1a/L1-sh-35__4.mp3", "t": "先与小建中汤，"}, {"f": "audio/1a/L1-sh-35__5.mp3", "t": "不差者，"}, {"f": "audio/1a/L1-sh-35__6.mp3", "t": "小柴胡汤主之。"}], "L1-sh-36": [{"f": "audio/21/L1-sh-36__0.mp3", "t": "伤寒中风，"}, {"f": "audio/21/L1-sh-36__1.mp3", "t": "有柴胡证，"}, {"f": "audio/21/L1-sh-36__2.mp3", "t": "但见一证便是，"}, {"f": "audio/21/L1-sh-36__3.mp3", "t": "不必悉具。"}, {"f": "audio/21/L1-sh-36__4.mp3", "t": "凡柴胡汤病证而下之，"}, {"f": "audio/21/L1-sh-36__5.mp3", "t": "若柴胡证不罢者，"}, {"f": "audio/21/L1-sh-36__6.mp3", "t": "复与柴胡汤，"}, {"f": "audio/21/L1-sh-36__7.mp3", "t": "必蒸蒸而振，"}, {"f": "audio/21/L1-sh-36__8.mp3", "t": "却发热汗出而解。"}], "L1-sh-37": [{"f": "audio/78/L1-sh-37__0.mp3", "t": "太阳病，"}, {"f": "audio/78/L1-sh-37__1.mp3", "t": "过经十余日，"}, {"f": "audio/78/L1-sh-37__2.mp3", "t": "反二三下之，"}, {"f": "audio/78/L1-sh-37__3.mp3", "t": "后四五日，"}, {"f": "audio/78/L1-sh-37__4.mp3", "t": "柴胡证仍在者，"}, {"f": "audio/78/L1-sh-37__5.mp3", "t": "先与小柴胡汤。"}, {"f": "audio/78/L1-sh-37__6.mp3", "t": "呕不止，"}, {"f": "audio/78/L1-sh-37__7.mp3", "t": "心下急，"}, {"f": "audio/78/L1-sh-37__8.mp3", "t": "郁郁微烦者，"}, {"f": "audio/78/L1-sh-37__9.mp3", "t": "为未解也，"}, {"f": "audio/78/L1-sh-37__10.mp3", "t": "与大柴胡汤下之则愈。"}], "L1-sh-38": [{"f": "audio/0d/L1-sh-38__0.mp3", "t": "太阳病不解，"}, {"f": "audio/0d/L1-sh-38__1.mp3", "t": "热结膀胱，"}, {"f": "audio/0d/L1-sh-38__2.mp3", "t": "其人如狂，"}, {"f": "audio/0d/L1-sh-38__3.mp3", "t": "血自下，"}, {"f": "audio/0d/L1-sh-38__4.mp3", "t": "下者愈。"}, {"f": "audio/0d/L1-sh-38__5.mp3", "t": "其外不解者，"}, {"f": "audio/0d/L1-sh-38__6.mp3", "t": "尚未可攻，"}, {"f": "audio/0d/L1-sh-38__7.mp3", "t": "当先解其外。"}, {"f": "audio/0d/L1-sh-38__8.mp3", "t": "外解已，"}, {"f": "audio/0d/L1-sh-38__9.mp3", "t": "但少腹急结者，"}, {"f": "audio/0d/L1-sh-38__10.mp3", "t": "乃可攻之，"}, {"f": "audio/0d/L1-sh-38__11.mp3", "t": "宜桃核承气汤。"}], "L1-sh-39": [{"f": "audio/8d/L1-sh-39__0.mp3", "t": "伤寒八九日，"}, {"f": "audio/8d/L1-sh-39__1.mp3", "t": "下之，"}, {"f": "audio/8d/L1-sh-39__2.mp3", "t": "胸满烦惊，"}, {"f": "audio/8d/L1-sh-39__3.mp3", "t": "小便不利，"}, {"f": "audio/8d/L1-sh-39__4.mp3", "t": "谵语，"}, {"f": "audio/8d/L1-sh-39__5.mp3", "t": "一身尽重，"}, {"f": "audio/8d/L1-sh-39__6.mp3", "t": "不可转侧者，"}, {"f": "audio/8d/L1-sh-39__7.mp3", "t": "柴胡加龙骨牡蛎汤主之。"}], "L1-sh-40": [{"f": "audio/78/L1-sh-40__0.mp3", "t": "烧针令其汗，"}, {"f": "audio/78/L1-sh-40__1.mp3", "t": "针处被寒，"}, {"f": "audio/78/L1-sh-40__2.mp3", "t": "核起而赤者，"}, {"f": "audio/78/L1-sh-40__3.mp3", "t": "必发奔豚。"}, {"f": "audio/78/L1-sh-40__4.mp3", "t": "气从少腹上冲心者，"}, {"f": "audio/78/L1-sh-40__5.mp3", "t": "灸其核上各一壮，"}, {"f": "audio/78/L1-sh-40__6.mp3", "t": "与桂枝加桂汤，"}, {"f": "audio/78/L1-sh-40__7.mp3", "t": "更加桂二两也。"}], "L1-sh-41": [{"f": "audio/5e/L1-sh-41__0.mp3", "t": "伤寒六七日，"}, {"f": "audio/5e/L1-sh-41__1.mp3", "t": "结胸热实，"}, {"f": "audio/5e/L1-sh-41__2.mp3", "t": "脉沉而紧，"}, {"f": "audio/5e/L1-sh-41__3.mp3", "t": "心下痛，"}, {"f": "audio/5e/L1-sh-41__4.mp3", "t": "按之石硬者，"}, {"f": "audio/5e/L1-sh-41__5.mp3", "t": "大陷胸汤主之。"}], "L1-sh-42": [{"f": "audio/49/L1-sh-42__0.mp3", "t": "小结胸病，"}, {"f": "audio/49/L1-sh-42__1.mp3", "t": "正在心下，"}, {"f": "audio/49/L1-sh-42__2.mp3", "t": "按之则痛，"}, {"f": "audio/49/L1-sh-42__3.mp3", "t": "脉浮滑者，"}, {"f": "audio/49/L1-sh-42__4.mp3", "t": "小陷胸汤主之。"}], "L1-sh-43": [{"f": "audio/a7/L1-sh-43__0.mp3", "t": "伤寒六七日，"}, {"f": "audio/a7/L1-sh-43__1.mp3", "t": "发热微恶寒，"}, {"f": "audio/a7/L1-sh-43__2.mp3", "t": "支节烦疼，"}, {"f": "audio/a7/L1-sh-43__3.mp3", "t": "微呕，"}, {"f": "audio/a7/L1-sh-43__4.mp3", "t": "心下支结，"}, {"f": "audio/a7/L1-sh-43__5.mp3", "t": "外证未去者，"}, {"f": "audio/a7/L1-sh-43__6.mp3", "t": "柴胡桂枝汤主之。"}], "L1-sh-44": [{"f": "audio/a9/L1-sh-44__0.mp3", "t": "伤寒五六日，"}, {"f": "audio/a9/L1-sh-44__1.mp3", "t": "已发汗而复下之，"}, {"f": "audio/a9/L1-sh-44__2.mp3", "t": "胸胁满微结，"}, {"f": "audio/a9/L1-sh-44__3.mp3", "t": "小便不利，"}, {"f": "audio/a9/L1-sh-44__4.mp3", "t": "渴而不呕，"}, {"f": "audio/a9/L1-sh-44__5.mp3", "t": "但头汗出，"}, {"f": "audio/a9/L1-sh-44__6.mp3", "t": "往来寒热，"}, {"f": "audio/a9/L1-sh-44__7.mp3", "t": "心烦者，"}, {"f": "audio/a9/L1-sh-44__8.mp3", "t": "此为未解也，"}, {"f": "audio/a9/L1-sh-44__9.mp3", "t": "柴胡桂枝干姜汤主之。"}], "L1-sh-45": [{"f": "audio/6e/L1-sh-45__0.mp3", "t": "伤寒五六日，"}, {"f": "audio/6e/L1-sh-45__1.mp3", "t": "呕而发热者，"}, {"f": "audio/6e/L1-sh-45__2.mp3", "t": "柴胡汤证具，"}, {"f": "audio/6e/L1-sh-45__3.mp3", "t": "而以他药下之，"}, {"f": "audio/6e/L1-sh-45__4.mp3", "t": "柴胡证仍在者，"}, {"f": "audio/6e/L1-sh-45__5.mp3", "t": "复与柴胡汤。"}, {"f": "audio/6e/L1-sh-45__6.mp3", "t": "此虽已下之，"}, {"f": "audio/6e/L1-sh-45__7.mp3", "t": "不为逆，"}, {"f": "audio/6e/L1-sh-45__8.mp3", "t": "必蒸蒸而振，"}, {"f": "audio/6e/L1-sh-45__9.mp3", "t": "却发热汗出而解。"}, {"f": "audio/6e/L1-sh-45__10.mp3", "t": "若心下满而硬痛者，"}, {"f": "audio/6e/L1-sh-45__11.mp3", "t": "此为结胸也，"}, {"f": "audio/6e/L1-sh-45__12.mp3", "t": "大陷胸汤主之。"}, {"f": "audio/6e/L1-sh-45__13.mp3", "t": "但满而不痛者，"}, {"f": "audio/6e/L1-sh-45__14.mp3", "t": "此为痞，"}, {"f": "audio/6e/L1-sh-45__15.mp3", "t": "柴胡不中与之，"}, {"f": "audio/6e/L1-sh-45__16.mp3", "t": "宜半夏泻心汤。"}], "L1-sh-46": [{"f": "audio/95/L1-sh-46__0.mp3", "t": "心下痞，"}, {"f": "audio/95/L1-sh-46__1.mp3", "t": "按之濡，"}, {"f": "audio/95/L1-sh-46__2.mp3", "t": "其脉关上浮者，"}, {"f": "audio/95/L1-sh-46__3.mp3", "t": "大黄黄连泻心汤主之。"}], "L1-sh-47": [{"f": "audio/f3/L1-sh-47__0.mp3", "t": "伤寒汗出，"}, {"f": "audio/f3/L1-sh-47__1.mp3", "t": "解之后，"}, {"f": "audio/f3/L1-sh-47__2.mp3", "t": "胃中不和，"}, {"f": "audio/f3/L1-sh-47__3.mp3", "t": "心下痞硬，"}, {"f": "audio/f3/L1-sh-47__4.mp3", "t": "干噫食臭，"}, {"f": "audio/f3/L1-sh-47__5.mp3", "t": "胁下有水气，"}, {"f": "audio/f3/L1-sh-47__6.mp3", "t": "腹中雷鸣下利者，"}, {"f": "audio/f3/L1-sh-47__7.mp3", "t": "生姜泻心汤主之。"}], "L1-sh-48": [{"f": "audio/37/L1-sh-48__0.mp3", "t": "伤寒中风，"}, {"f": "audio/37/L1-sh-48__1.mp3", "t": "医反下之，"}, {"f": "audio/37/L1-sh-48__2.mp3", "t": "其人下利日数十行，"}, {"f": "audio/37/L1-sh-48__3.mp3", "t": "谷不化，"}, {"f": "audio/37/L1-sh-48__4.mp3", "t": "腹中雷鸣，"}, {"f": "audio/37/L1-sh-48__5.mp3", "t": "心下痞硬而满，"}, {"f": "audio/37/L1-sh-48__6.mp3", "t": "干呕心烦不得安，"}, {"f": "audio/37/L1-sh-48__7.mp3", "t": "医见心下痞，"}, {"f": "audio/37/L1-sh-48__8.mp3", "t": "谓病不尽，"}, {"f": "audio/37/L1-sh-48__9.mp3", "t": "复下之，"}, {"f": "audio/37/L1-sh-48__10.mp3", "t": "其痞益甚，"}, {"f": "audio/37/L1-sh-48__11.mp3", "t": "此非结热，"}, {"f": "audio/37/L1-sh-48__12.mp3", "t": "但以胃中虚，"}, {"f": "audio/37/L1-sh-48__13.mp3", "t": "客气上逆，"}, {"f": "audio/37/L1-sh-48__14.mp3", "t": "故使硬也，"}, {"f": "audio/37/L1-sh-48__15.mp3", "t": "甘草泻心汤主之。"}], "L1-sh-49": [{"f": "audio/6a/L1-sh-49__0.mp3", "t": "伤寒发汗，"}, {"f": "audio/6a/L1-sh-49__1.mp3", "t": "若吐若下，"}, {"f": "audio/6a/L1-sh-49__2.mp3", "t": "解后，"}, {"f": "audio/6a/L1-sh-49__3.mp3", "t": "心下痞硬，"}, {"f": "audio/6a/L1-sh-49__4.mp3", "t": "噫气不除者，"}, {"f": "audio/6a/L1-sh-49__5.mp3", "t": "旋覆代赭汤主之。"}], "L1-sh-50": [{"f": "audio/29/L1-sh-50__0.mp3", "t": "太阳病，"}, {"f": "audio/29/L1-sh-50__1.mp3", "t": "外证未除，"}, {"f": "audio/29/L1-sh-50__2.mp3", "t": "而数下之，"}, {"f": "audio/29/L1-sh-50__3.mp3", "t": "遂协热而利，"}, {"f": "audio/29/L1-sh-50__4.mp3", "t": "利下不止，"}, {"f": "audio/29/L1-sh-50__5.mp3", "t": "心下痞硬，"}, {"f": "audio/29/L1-sh-50__6.mp3", "t": "表里不解者，"}, {"f": "audio/29/L1-sh-50__7.mp3", "t": "桂枝人参汤主之。"}], "L1-sh-51": [{"f": "audio/a4/L1-sh-51__0.mp3", "t": "伤寒若吐若下后，"}, {"f": "audio/a4/L1-sh-51__1.mp3", "t": "七八日不解，"}, {"f": "audio/a4/L1-sh-51__2.mp3", "t": "热结在里，"}, {"f": "audio/a4/L1-sh-51__3.mp3", "t": "表里俱热，"}, {"f": "audio/a4/L1-sh-51__4.mp3", "t": "时时恶风，"}, {"f": "audio/a4/L1-sh-51__5.mp3", "t": "大渴，"}, {"f": "audio/a4/L1-sh-51__6.mp3", "t": "舌上干燥而烦，"}, {"f": "audio/a4/L1-sh-51__7.mp3", "t": "欲饮水数升者，"}, {"f": "audio/a4/L1-sh-51__8.mp3", "t": "白虎加人参汤主之。"}], "L1-sh-52": [{"f": "audio/f5/L1-sh-52__0.mp3", "t": "太阳与少阳合病，"}, {"f": "audio/f5/L1-sh-52__1.mp3", "t": "自下利者，"}, {"f": "audio/f5/L1-sh-52__2.mp3", "t": "与黄芩汤；"}, {"f": "audio/f5/L1-sh-52__3.mp3", "t": "若呕者，"}, {"f": "audio/f5/L1-sh-52__4.mp3", "t": "黄芩加半夏生姜汤主之。"}], "L1-sh-53": [{"f": "audio/9c/L1-sh-53__0.mp3", "t": "伤寒胸中有热，"}, {"f": "audio/9c/L1-sh-53__1.mp3", "t": "胃中有邪气，"}, {"f": "audio/9c/L1-sh-53__2.mp3", "t": "腹中痛，"}, {"f": "audio/9c/L1-sh-53__3.mp3", "t": "欲呕吐者，"}, {"f": "audio/9c/L1-sh-53__4.mp3", "t": "黄连汤主之。"}], "L1-sh-54": [{"f": "audio/c3/L1-sh-54__0.mp3", "t": "伤寒脉结代，"}, {"f": "audio/c3/L1-sh-54__1.mp3", "t": "心动悸，"}, {"f": "audio/c3/L1-sh-54__2.mp3", "t": "炙甘草汤主之。"}], "L1-sh-55": [{"f": "audio/bc/L1-sh-55__0.mp3", "t": "阳明之为病，"}, {"f": "audio/bc/L1-sh-55__1.mp3", "t": "胃家实是也。"}], "L1-sh-56": [{"f": "audio/f9/L1-sh-56__0.mp3", "t": "问曰："}, {"f": "audio/f9/L1-sh-56__1.mp3", "t": "阳明病外证云何？"}, {"f": "audio/f9/L1-sh-56__2.mp3", "t": "答曰："}, {"f": "audio/f9/L1-sh-56__3.mp3", "t": "身热，"}, {"f": "audio/f9/L1-sh-56__4.mp3", "t": "汗自出，"}, {"f": "audio/f9/L1-sh-56__5.mp3", "t": "不恶寒，"}, {"f": "audio/f9/L1-sh-56__6.mp3", "t": "反恶热也。"}], "L1-sh-57": [{"f": "audio/74/L1-sh-57__0.mp3", "t": "阳明病，"}, {"f": "audio/74/L1-sh-57__1.mp3", "t": "脉迟，"}, {"f": "audio/74/L1-sh-57__2.mp3", "t": "虽汗出不恶寒者，"}, {"f": "audio/74/L1-sh-57__3.mp3", "t": "其身必重，"}, {"f": "audio/74/L1-sh-57__4.mp3", "t": "短气腹满而喘，"}, {"f": "audio/74/L1-sh-57__5.mp3", "t": "有潮热者，"}, {"f": "audio/74/L1-sh-57__6.mp3", "t": "此外欲解，"}, {"f": "audio/74/L1-sh-57__7.mp3", "t": "可攻里也。"}, {"f": "audio/74/L1-sh-57__8.mp3", "t": "手足濈然汗出者，"}, {"f": "audio/74/L1-sh-57__9.mp3", "t": "此大便已硬也，"}, {"f": "audio/74/L1-sh-57__10.mp3", "t": "大承气汤主之；"}, {"f": "audio/74/L1-sh-57__11.mp3", "t": "若汗多，"}, {"f": "audio/74/L1-sh-57__12.mp3", "t": "微发热恶寒者，"}, {"f": "audio/74/L1-sh-57__13.mp3", "t": "外未解也，"}, {"f": "audio/74/L1-sh-57__14.mp3", "t": "其热不潮，"}, {"f": "audio/74/L1-sh-57__15.mp3", "t": "未可与承气汤；"}, {"f": "audio/74/L1-sh-57__16.mp3", "t": "若腹大满不通者，"}, {"f": "audio/74/L1-sh-57__17.mp3", "t": "可与小承气汤，"}, {"f": "audio/74/L1-sh-57__18.mp3", "t": "微和胃气，"}, {"f": "audio/74/L1-sh-57__19.mp3", "t": "勿令至大泄下。"}], "L1-sh-58": [{"f": "audio/c4/L1-sh-58__0.mp3", "t": "阳明病，"}, {"f": "audio/c4/L1-sh-58__1.mp3", "t": "其人多汗，"}, {"f": "audio/c4/L1-sh-58__2.mp3", "t": "以津液外出，"}, {"f": "audio/c4/L1-sh-58__3.mp3", "t": "胃中燥，"}, {"f": "audio/c4/L1-sh-58__4.mp3", "t": "大便必硬，"}, {"f": "audio/c4/L1-sh-58__5.mp3", "t": "硬则谵语，"}, {"f": "audio/c4/L1-sh-58__6.mp3", "t": "小承气汤主之。"}], "L1-sh-59": [{"f": "audio/00/L1-sh-59__0.mp3", "t": "三阳合病，"}, {"f": "audio/00/L1-sh-59__1.mp3", "t": "腹满身重，"}, {"f": "audio/00/L1-sh-59__2.mp3", "t": "难以转侧，"}, {"f": "audio/00/L1-sh-59__3.mp3", "t": "口不仁，"}, {"f": "audio/00/L1-sh-59__4.mp3", "t": "面垢，"}, {"f": "audio/00/L1-sh-59__5.mp3", "t": "谵语遗尿。"}, {"f": "audio/00/L1-sh-59__6.mp3", "t": "发汗则谵语。"}, {"f": "audio/00/L1-sh-59__7.mp3", "t": "下之则额上生汗，"}, {"f": "audio/00/L1-sh-59__8.mp3", "t": "手足逆冷。"}, {"f": "audio/00/L1-sh-59__9.mp3", "t": "若自汗出者，"}, {"f": "audio/00/L1-sh-59__10.mp3", "t": "白虎汤主之。"}], "L1-sh-60": [{"f": "audio/2b/L1-sh-60__0.mp3", "t": "若脉浮发热，"}, {"f": "audio/2b/L1-sh-60__1.mp3", "t": "渴欲饮水，"}, {"f": "audio/2b/L1-sh-60__2.mp3", "t": "小便不利者，"}, {"f": "audio/2b/L1-sh-60__3.mp3", "t": "猪苓汤主之。"}], "L1-sh-61": [{"f": "audio/54/L1-sh-61__0.mp3", "t": "阳明病，"}, {"f": "audio/54/L1-sh-61__1.mp3", "t": "胁下硬满，"}, {"f": "audio/54/L1-sh-61__2.mp3", "t": "不大便而呕，"}, {"f": "audio/54/L1-sh-61__3.mp3", "t": "舌上白苔者，"}, {"f": "audio/54/L1-sh-61__4.mp3", "t": "可与小柴胡汤。"}, {"f": "audio/54/L1-sh-61__5.mp3", "t": "上焦得通，"}, {"f": "audio/54/L1-sh-61__6.mp3", "t": "津液得下，"}, {"f": "audio/54/L1-sh-61__7.mp3", "t": "胃气因和，"}, {"f": "audio/54/L1-sh-61__8.mp3", "t": "身濈然汗出而解。"}], "L1-sh-62": [{"f": "audio/f5/L1-sh-62__0.mp3", "t": "阳明病，"}, {"f": "audio/f5/L1-sh-62__1.mp3", "t": "发热汗出者，"}, {"f": "audio/f5/L1-sh-62__2.mp3", "t": "此为热越，"}, {"f": "audio/f5/L1-sh-62__3.mp3", "t": "不能发黄也。"}, {"f": "audio/f5/L1-sh-62__4.mp3", "t": "但头汗出，"}, {"f": "audio/f5/L1-sh-62__5.mp3", "t": "身无汗，"}, {"f": "audio/f5/L1-sh-62__6.mp3", "t": "剂颈而还，"}, {"f": "audio/f5/L1-sh-62__7.mp3", "t": "小便不利，"}, {"f": "audio/f5/L1-sh-62__8.mp3", "t": "渴饮水浆者，"}, {"f": "audio/f5/L1-sh-62__9.mp3", "t": "此为瘀热在里，"}, {"f": "audio/f5/L1-sh-62__10.mp3", "t": "身必发黄，"}, {"f": "audio/f5/L1-sh-62__11.mp3", "t": "茵陈蒿汤主之。"}], "L1-sh-63": [{"f": "audio/4e/L1-sh-63__0.mp3", "t": "阳明证，"}, {"f": "audio/4e/L1-sh-63__1.mp3", "t": "其人喜忘者，"}, {"f": "audio/4e/L1-sh-63__2.mp3", "t": "必有蓄血。"}, {"f": "audio/4e/L1-sh-63__3.mp3", "t": "所以然者，"}, {"f": "audio/4e/L1-sh-63__4.mp3", "t": "本有久瘀血，"}, {"f": "audio/4e/L1-sh-63__5.mp3", "t": "故令喜忘。"}, {"f": "audio/4e/L1-sh-63__6.mp3", "t": "屎虽硬，"}, {"f": "audio/4e/L1-sh-63__7.mp3", "t": "大便反易，"}, {"f": "audio/4e/L1-sh-63__8.mp3", "t": "其色必黑者，"}, {"f": "audio/4e/L1-sh-63__9.mp3", "t": "宜抵当汤下之。"}], "L1-sh-64": [{"f": "audio/65/L1-sh-64__0.mp3", "t": "食谷欲呕，"}, {"f": "audio/65/L1-sh-64__1.mp3", "t": "属阳明也，"}, {"f": "audio/65/L1-sh-64__2.mp3", "t": "吴茱萸汤主之。"}, {"f": "audio/65/L1-sh-64__3.mp3", "t": "得汤反剧者，"}, {"f": "audio/65/L1-sh-64__4.mp3", "t": "属上焦也。"}], "L1-sh-65": [{"f": "audio/3b/L1-sh-65__0.mp3", "t": "趺阳脉浮而涩，"}, {"f": "audio/3b/L1-sh-65__1.mp3", "t": "浮则胃气强，"}, {"f": "audio/3b/L1-sh-65__2.mp3", "t": "涩则小便数，"}, {"f": "audio/3b/L1-sh-65__3.mp3", "t": "浮涩相搏，"}, {"f": "audio/3b/L1-sh-65__4.mp3", "t": "大便则硬，"}, {"f": "audio/3b/L1-sh-65__5.mp3", "t": "其脾为约，"}, {"f": "audio/3b/L1-sh-65__6.mp3", "t": "麻子仁丸主之。"}], "L1-sh-66": [{"f": "audio/3e/L1-sh-66__0.mp3", "t": "太阳病三日，"}, {"f": "audio/3e/L1-sh-66__1.mp3", "t": "发汗不解，"}, {"f": "audio/3e/L1-sh-66__2.mp3", "t": "蒸蒸发热者，"}, {"f": "audio/3e/L1-sh-66__3.mp3", "t": "属胃也，"}, {"f": "audio/3e/L1-sh-66__4.mp3", "t": "调胃承气汤主之。"}], "L1-sh-67": [{"f": "audio/ad/L1-sh-67__0.mp3", "t": "伤寒瘀热在里，"}, {"f": "audio/ad/L1-sh-67__1.mp3", "t": "身必黄，"}, {"f": "audio/ad/L1-sh-67__2.mp3", "t": "麻黄连轺赤小豆汤主之。"}], "L1-sh-68": [{"f": "audio/b7/L1-sh-68__0.mp3", "t": "少阳之为病，"}, {"f": "audio/b7/L1-sh-68__1.mp3", "t": "口苦，"}, {"f": "audio/b7/L1-sh-68__2.mp3", "t": "咽干，"}, {"f": "audio/b7/L1-sh-68__3.mp3", "t": "目眩也。"}], "L1-sh-69": [{"f": "audio/91/L1-sh-69__0.mp3", "t": "太阴之为病，"}, {"f": "audio/91/L1-sh-69__1.mp3", "t": "腹满而吐，"}, {"f": "audio/91/L1-sh-69__2.mp3", "t": "食不下，"}, {"f": "audio/91/L1-sh-69__3.mp3", "t": "自利益甚，"}, {"f": "audio/91/L1-sh-69__4.mp3", "t": "时腹自痛。"}, {"f": "audio/91/L1-sh-69__5.mp3", "t": "若下之，"}, {"f": "audio/91/L1-sh-69__6.mp3", "t": "必胸下结硬。"}], "L1-sh-70": [{"f": "audio/a4/L1-sh-70__0.mp3", "t": "自利不渴者，"}, {"f": "audio/a4/L1-sh-70__1.mp3", "t": "属太阴，"}, {"f": "audio/a4/L1-sh-70__2.mp3", "t": "以其脏有寒故也，"}, {"f": "audio/a4/L1-sh-70__3.mp3", "t": "当温之，"}, {"f": "audio/a4/L1-sh-70__4.mp3", "t": "宜服四逆辈。"}], "L1-sh-71": [{"f": "audio/6f/L1-sh-71__0.mp3", "t": "本太阳病，"}, {"f": "audio/6f/L1-sh-71__1.mp3", "t": "医反下之，"}, {"f": "audio/6f/L1-sh-71__2.mp3", "t": "因而腹满时痛者，"}, {"f": "audio/6f/L1-sh-71__3.mp3", "t": "属太阴也，"}, {"f": "audio/6f/L1-sh-71__4.mp3", "t": "桂枝加芍药汤主之；"}, {"f": "audio/6f/L1-sh-71__5.mp3", "t": "大实痛者，"}, {"f": "audio/6f/L1-sh-71__6.mp3", "t": "桂枝加大黄汤主之。"}], "L1-sh-72": [{"f": "audio/b2/L1-sh-72__0.mp3", "t": "少阴之为病，"}, {"f": "audio/b2/L1-sh-72__1.mp3", "t": "脉微细，"}, {"f": "audio/b2/L1-sh-72__2.mp3", "t": "但欲寐也。"}], "L1-sh-73": [{"f": "audio/12/L1-sh-73__0.mp3", "t": "少阴病，"}, {"f": "audio/12/L1-sh-73__1.mp3", "t": "欲吐不吐，"}, {"f": "audio/12/L1-sh-73__2.mp3", "t": "心烦，"}, {"f": "audio/12/L1-sh-73__3.mp3", "t": "但欲寐，"}, {"f": "audio/12/L1-sh-73__4.mp3", "t": "五六日自利而渴者，"}, {"f": "audio/12/L1-sh-73__5.mp3", "t": "属少阴也，"}, {"f": "audio/12/L1-sh-73__6.mp3", "t": "虚故引水自救。"}, {"f": "audio/12/L1-sh-73__7.mp3", "t": "若小便色白者，"}, {"f": "audio/12/L1-sh-73__8.mp3", "t": "少阴病形悉具。"}, {"f": "audio/12/L1-sh-73__9.mp3", "t": "小便白者，"}, {"f": "audio/12/L1-sh-73__10.mp3", "t": "以下焦虚有寒，"}, {"f": "audio/12/L1-sh-73__11.mp3", "t": "不能制水，"}, {"f": "audio/12/L1-sh-73__12.mp3", "t": "故令色白也。"}], "L1-sh-74": [{"f": "audio/55/L1-sh-74__0.mp3", "t": "少阴病，"}, {"f": "audio/55/L1-sh-74__1.mp3", "t": "始得之，"}, {"f": "audio/55/L1-sh-74__2.mp3", "t": "反发热，"}, {"f": "audio/55/L1-sh-74__3.mp3", "t": "脉沉者，"}, {"f": "audio/55/L1-sh-74__4.mp3", "t": "麻黄细辛附子汤主之。"}], "L1-sh-75": [{"f": "audio/d5/L1-sh-75__0.mp3", "t": "少阴病，"}, {"f": "audio/d5/L1-sh-75__1.mp3", "t": "得之二三日以上，"}, {"f": "audio/d5/L1-sh-75__2.mp3", "t": "心中烦，"}, {"f": "audio/d5/L1-sh-75__3.mp3", "t": "不得卧，"}, {"f": "audio/d5/L1-sh-75__4.mp3", "t": "黄连阿胶汤主之。"}], "L1-sh-76": [{"f": "audio/3a/L1-sh-76__0.mp3", "t": "少阴病，"}, {"f": "audio/3a/L1-sh-76__1.mp3", "t": "身体痛，"}, {"f": "audio/3a/L1-sh-76__2.mp3", "t": "手足寒，"}, {"f": "audio/3a/L1-sh-76__3.mp3", "t": "骨节痛，"}, {"f": "audio/3a/L1-sh-76__4.mp3", "t": "脉沉者，"}, {"f": "audio/3a/L1-sh-76__5.mp3", "t": "附子汤主之。"}], "L1-sh-77": [{"f": "audio/cd/L1-sh-77__0.mp3", "t": "少阴病，"}, {"f": "audio/cd/L1-sh-77__1.mp3", "t": "下利便脓血者，"}, {"f": "audio/cd/L1-sh-77__2.mp3", "t": "桃花汤主之。"}], "L1-sh-78": [{"f": "audio/cd/L1-sh-78__0.mp3", "t": "少阴病，"}, {"f": "audio/cd/L1-sh-78__1.mp3", "t": "二三日不已，"}, {"f": "audio/cd/L1-sh-78__2.mp3", "t": "至四五日，"}, {"f": "audio/cd/L1-sh-78__3.mp3", "t": "腹痛，"}, {"f": "audio/cd/L1-sh-78__4.mp3", "t": "小便不利，"}, {"f": "audio/cd/L1-sh-78__5.mp3", "t": "四肢沉重疼痛，"}, {"f": "audio/cd/L1-sh-78__6.mp3", "t": "自下利者，"}, {"f": "audio/cd/L1-sh-78__7.mp3", "t": "此为有水气，"}, {"f": "audio/cd/L1-sh-78__8.mp3", "t": "其人或咳，"}, {"f": "audio/cd/L1-sh-78__9.mp3", "t": "或小便利，"}, {"f": "audio/cd/L1-sh-78__10.mp3", "t": "或下利，"}, {"f": "audio/cd/L1-sh-78__11.mp3", "t": "或呕者，"}, {"f": "audio/cd/L1-sh-78__12.mp3", "t": "真武汤主之。"}], "L1-sh-79": [{"f": "audio/76/L1-sh-79__0.mp3", "t": "少阴病，"}, {"f": "audio/76/L1-sh-79__1.mp3", "t": "四逆，"}, {"f": "audio/76/L1-sh-79__2.mp3", "t": "其人或咳，"}, {"f": "audio/76/L1-sh-79__3.mp3", "t": "或悸，"}, {"f": "audio/76/L1-sh-79__4.mp3", "t": "或小便不利，"}, {"f": "audio/76/L1-sh-79__5.mp3", "t": "或腹中痛，"}, {"f": "audio/76/L1-sh-79__6.mp3", "t": "或泄利下重者，"}, {"f": "audio/76/L1-sh-79__7.mp3", "t": "四逆散主之。"}], "L1-sh-80": [{"f": "audio/07/L1-sh-80__0.mp3", "t": "少阴病，"}, {"f": "audio/07/L1-sh-80__1.mp3", "t": "下利六七日，"}, {"f": "audio/07/L1-sh-80__2.mp3", "t": "咳而呕渴，"}, {"f": "audio/07/L1-sh-80__3.mp3", "t": "心烦不得眠者，"}, {"f": "audio/07/L1-sh-80__4.mp3", "t": "猪苓汤主之。"}], "L1-sh-81": [{"f": "audio/23/L1-sh-81__0.mp3", "t": "厥阴之为病，"}, {"f": "audio/23/L1-sh-81__1.mp3", "t": "消渴，"}, {"f": "audio/23/L1-sh-81__2.mp3", "t": "气上撞心，"}, {"f": "audio/23/L1-sh-81__3.mp3", "t": "心中疼热，"}, {"f": "audio/23/L1-sh-81__4.mp3", "t": "饥而不欲食，"}, {"f": "audio/23/L1-sh-81__5.mp3", "t": "食则吐蛔，"}, {"f": "audio/23/L1-sh-81__6.mp3", "t": "下之利不止。"}], "L1-sh-82": [{"f": "audio/35/L1-sh-82__0.mp3", "t": "凡厥者，"}, {"f": "audio/35/L1-sh-82__1.mp3", "t": "阴阳气不相顺接，"}, {"f": "audio/35/L1-sh-82__2.mp3", "t": "便为厥。"}, {"f": "audio/35/L1-sh-82__3.mp3", "t": "厥者，"}, {"f": "audio/35/L1-sh-82__4.mp3", "t": "手足逆冷者是也。"}], "L1-sh-83": [{"f": "audio/ca/L1-sh-83__0.mp3", "t": "伤寒脉微而厥，"}, {"f": "audio/ca/L1-sh-83__1.mp3", "t": "至七八日，"}, {"f": "audio/ca/L1-sh-83__2.mp3", "t": "肤冷，"}, {"f": "audio/ca/L1-sh-83__3.mp3", "t": "其人躁无暂安时者，"}, {"f": "audio/ca/L1-sh-83__4.mp3", "t": "此为脏厥，"}, {"f": "audio/ca/L1-sh-83__5.mp3", "t": "非蛔厥也。"}, {"f": "audio/ca/L1-sh-83__6.mp3", "t": "蛔厥者，"}, {"f": "audio/ca/L1-sh-83__7.mp3", "t": "其人当吐蛔。"}, {"f": "audio/ca/L1-sh-83__8.mp3", "t": "今病者静，"}, {"f": "audio/ca/L1-sh-83__9.mp3", "t": "而复时烦者，"}, {"f": "audio/ca/L1-sh-83__10.mp3", "t": "此为脏寒。"}, {"f": "audio/ca/L1-sh-83__11.mp3", "t": "蛔上入其膈，"}, {"f": "audio/ca/L1-sh-83__12.mp3", "t": "故烦，"}, {"f": "audio/ca/L1-sh-83__13.mp3", "t": "须臾复止，"}, {"f": "audio/ca/L1-sh-83__14.mp3", "t": "得食而呕，"}, {"f": "audio/ca/L1-sh-83__15.mp3", "t": "又烦者，"}, {"f": "audio/ca/L1-sh-83__16.mp3", "t": "蛔闻食臭出，"}, {"f": "audio/ca/L1-sh-83__17.mp3", "t": "其人常自吐蛔。"}, {"f": "audio/ca/L1-sh-83__18.mp3", "t": "蛔厥者，"}, {"f": "audio/ca/L1-sh-83__19.mp3", "t": "乌梅丸主之。"}, {"f": "audio/ca/L1-sh-83__20.mp3", "t": "又主久利。"}], "L1-sh-84": [{"f": "audio/e8/L1-sh-84__0.mp3", "t": "伤寒脉滑而厥者，"}, {"f": "audio/e8/L1-sh-84__1.mp3", "t": "里有热，"}, {"f": "audio/e8/L1-sh-84__2.mp3", "t": "白虎汤主之。"}], "L1-sh-85": [{"f": "audio/ff/L1-sh-85__0.mp3", "t": "手足厥寒，"}, {"f": "audio/ff/L1-sh-85__1.mp3", "t": "脉细欲绝者，"}, {"f": "audio/ff/L1-sh-85__2.mp3", "t": "当归四逆汤主之。"}], "L1-sh-86": [{"f": "audio/a3/L1-sh-86__0.mp3", "t": "热利下重者，"}, {"f": "audio/a3/L1-sh-86__1.mp3", "t": "白头翁汤主之。"}], "L1-sh-87": [{"f": "audio/ba/L1-sh-87__0.mp3", "t": "干呕，"}, {"f": "audio/ba/L1-sh-87__1.mp3", "t": "吐涎沫，"}, {"f": "audio/ba/L1-sh-87__2.mp3", "t": "头痛者，"}, {"f": "audio/ba/L1-sh-87__3.mp3", "t": "吴茱萸汤主之。"}], "L1-sh-88": [{"f": "audio/7a/L1-sh-88__0.mp3", "t": "呕而发热者，"}, {"f": "audio/7a/L1-sh-88__1.mp3", "t": "小柴胡汤主之。"}], "L1-sh-89": [{"f": "audio/59/L1-sh-89__0.mp3", "t": "霍乱，"}, {"f": "audio/59/L1-sh-89__1.mp3", "t": "头痛发热，"}, {"f": "audio/59/L1-sh-89__2.mp3", "t": "身疼痛，"}, {"f": "audio/59/L1-sh-89__3.mp3", "t": "热多欲饮水者，"}, {"f": "audio/59/L1-sh-89__4.mp3", "t": "五苓散主之；"}, {"f": "audio/59/L1-sh-89__5.mp3", "t": "寒多不用水者，"}, {"f": "audio/59/L1-sh-89__6.mp3", "t": "理中丸主之。"}], "L1-sh-90": [{"f": "audio/61/L1-sh-90__0.mp3", "t": "伤寒解后，"}, {"f": "audio/61/L1-sh-90__1.mp3", "t": "虚羸少气，"}, {"f": "audio/61/L1-sh-90__2.mp3", "t": "气逆欲吐，"}, {"f": "audio/61/L1-sh-90__3.mp3", "t": "竹叶石膏汤主之。"}], "L1-jg-0": [{"f": "audio/3a/L1-jg-0__0.mp3", "t": "夫治未病者，"}, {"f": "audio/3a/L1-jg-0__1.mp3", "t": "见肝之病，"}, {"f": "audio/3a/L1-jg-0__2.mp3", "t": "知肝传脾，"}, {"f": "audio/3a/L1-jg-0__3.mp3", "t": "当先实脾，"}, {"f": "audio/3a/L1-jg-0__4.mp3", "t": "四季脾旺不受邪，"}, {"f": "audio/3a/L1-jg-0__5.mp3", "t": "即勿补之。"}, {"f": "audio/3a/L1-jg-0__6.mp3", "t": "中工不晓相传，"}, {"f": "audio/3a/L1-jg-0__7.mp3", "t": "见肝之病，"}, {"f": "audio/3a/L1-jg-0__8.mp3", "t": "不解实脾，"}, {"f": "audio/3a/L1-jg-0__9.mp3", "t": "惟治肝也。"}, {"f": "audio/3a/L1-jg-0__10.mp3", "t": "夫肝之病，"}, {"f": "audio/3a/L1-jg-0__11.mp3", "t": "补用酸，"}, {"f": "audio/3a/L1-jg-0__12.mp3", "t": "助用焦苦，"}, {"f": "audio/3a/L1-jg-0__
