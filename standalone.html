ch-nj-21__34.mp3", "t": "决渎之官，"}, {"f": "audio/25/school-sch-nj-21__35.mp3", "t": "水道出焉。"}, {"f": "audio/25/school-sch-nj-21__36.mp3", "t": "膀胱者，"}, {"f": "audio/25/school-sch-nj-21__37.mp3", "t": "州都之官，"}, {"f": "audio/25/school-sch-nj-21__38.mp3", "t": "津液藏焉，"}, {"f": "audio/25/school-sch-nj-21__39.mp3", "t": "气化则能出矣。"}, {"f": "audio/25/school-sch-nj-21__40.mp3", "t": "凡此十二官者，"}, {"f": "audio/25/school-sch-nj-21__41.mp3", "t": "不得相失也。"}, {"f": "audio/25/school-sch-nj-21__42.mp3", "t": "故主明则下安，"}, {"f": "audio/25/school-sch-nj-21__43.mp3", "t": "以此养生则寿，"}, {"f": "audio/25/school-sch-nj-21__44.mp3", "t": "没世不殆，"}, {"f": "audio/25/school-sch-nj-21__45.mp3", "t": "以为天下则大昌。"}, {"f": "audio/25/school-sch-nj-21__46.mp3", "t": "主不明则十二官危，"}, {"f": "audio/25/school-sch-nj-21__47.mp3", "t": "使道闭塞而不通，"}, {"f": "audio/25/school-sch-nj-21__48.mp3", "t": "形乃大伤，"}, {"f": "audio/25/school-sch-nj-21__49.mp3", "t": "以此养生则殃，"}, {"f": "audio/25/school-sch-nj-21__50.mp3", "t": "以为天下者，"}, {"f": "audio/25/school-sch-nj-21__51.mp3", "t": "其宗大危，"}, {"f": "audio/25/school-sch-nj-21__52.mp3", "t": "戒之戒之！"}], "school-sch-nj-22": [{"f": "audio/18/school-sch-nj-22__0.mp3", "t": "帝曰："}, {"f": "audio/18/school-sch-nj-22__1.mp3", "t": "藏象何如？"}, {"f": "audio/18/school-sch-nj-22__2.mp3", "t": "岐伯曰："}, {"f": "audio/18/school-sch-nj-22__3.mp3", "t": "心者，"}, {"f": "audio/18/school-sch-nj-22__4.mp3", "t": "生之本，"}, {"f": "audio/18/school-sch-nj-22__5.mp3", "t": "神之变也；"}, {"f": "audio/18/school-sch-nj-22__6.mp3", "t": "其华在面，"}, {"f": "audio/18/school-sch-nj-22__7.mp3", "t": "其充在血脉，"}, {"f": "audio/18/school-sch-nj-22__8.mp3", "t": "为阳中之太阳，"}, {"f": "audio/18/school-sch-nj-22__9.mp3", "t": "通于夏气。"}, {"f": "audio/18/school-sch-nj-22__10.mp3", "t": "肺者，"}, {"f": "audio/18/school-sch-nj-22__11.mp3", "t": "气之本，"}, {"f": "audio/18/school-sch-nj-22__12.mp3", "t": "魄之处也；"}, {"f": "audio/18/school-sch-nj-22__13.mp3", "t": "其华在毛，"}, {"f": "audio/18/school-sch-nj-22__14.mp3", "t": "其充在皮，"}, {"f": "audio/18/school-sch-nj-22__15.mp3", "t": "为阳中之太阴，"}, {"f": "audio/18/school-sch-nj-22__16.mp3", "t": "通于秋气。"}, {"f": "audio/18/school-sch-nj-22__17.mp3", "t": "肾者，"}, {"f": "audio/18/school-sch-nj-22__18.mp3", "t": "主蛰，"}, {"f": "audio/18/school-sch-nj-22__19.mp3", "t": "封藏之本，"}, {"f": "audio/18/school-sch-nj-22__20.mp3", "t": "精之处也；"}, {"f": "audio/18/school-sch-nj-22__21.mp3", "t": "其华在发，"}, {"f": "audio/18/school-sch-nj-22__22.mp3", "t": "其充在骨，"}, {"f": "audio/18/school-sch-nj-22__23.mp3", "t": "为阴中之少阴，"}, {"f": "audio/18/school-sch-nj-22__24.mp3", "t": "通于冬气。"}, {"f": "audio/18/school-sch-nj-22__25.mp3", "t": "肝者，"}, {"f": "audio/18/school-sch-nj-22__26.mp3", "t": "罢极之本，"}, {"f": "audio/18/school-sch-nj-22__27.mp3", "t": "魂之居也；"}, {"f": "audio/18/school-sch-nj-22__28.mp3", "t": "其华在爪，"}, {"f": "audio/18/school-sch-nj-22__29.mp3", "t": "其充在筋，"}, {"f": "audio/18/school-sch-nj-22__30.mp3", "t": "以生血气，"}, {"f": "audio/18/school-sch-nj-22__31.mp3", "t": "其味酸，"}, {"f": "audio/18/school-sch-nj-22__32.mp3", "t": "其色苍，"}, {"f": "audio/18/school-sch-nj-22__33.mp3", "t": "此为阳中之少阳，"}, {"f": "audio/18/school-sch-nj-22__34.mp3", "t": "通于春气。"}, {"f": "audio/18/school-sch-nj-22__35.mp3", "t": "脾、"}, {"f": "audio/18/school-sch-nj-22__36.mp3", "t": "胃、"}, {"f": "audio/18/school-sch-nj-22__37.mp3", "t": "大肠、"}, {"f": "audio/18/school-sch-nj-22__38.mp3", "t": "小肠、"}, {"f": "audio/18/school-sch-nj-22__39.mp3", "t": "三焦、"}, {"f": "audio/18/school-sch-nj-22__40.mp3", "t": "膀胱者，"}, {"f": "audio/18/school-sch-nj-22__41.mp3", "t": "仓廪之本，"}, {"f": "audio/18/school-sch-nj-22__42.mp3", "t": "营之居也。"}, {"f": "audio/18/school-sch-nj-22__43.mp3", "t": "名曰器，"}, {"f": "audio/18/school-sch-nj-22__44.mp3", "t": "能化糟粕，"}, {"f": "audio/18/school-sch-nj-22__45.mp3", "t": "转味而入出者也，"}, {"f": "audio/18/school-sch-nj-22__46.mp3", "t": "其华在唇四白，"}, {"f": "audio/18/school-sch-nj-22__47.mp3", "t": "其充在肌，"}, {"f": "audio/18/school-sch-nj-22__48.mp3", "t": "其味甘，"}, {"f": "audio/18/school-sch-nj-22__49.mp3", "t": "其色黄，"}, {"f": "audio/18/school-sch-nj-22__50.mp3", "t": "此至阴之类，"}, {"f": "audio/18/school-sch-nj-22__51.mp3", "t": "通于土气。"}, {"f": "audio/18/school-sch-nj-22__52.mp3", "t": "凡十一藏，"}, {"f": "audio/18/school-sch-nj-22__53.mp3", "t": "取决于胆也。"}], "school-sch-nj-23": [{"f": "audio/53/school-sch-nj-23__0.mp3", "t": "黄帝问曰："}, {"f": "audio/53/school-sch-nj-23__1.mp3", "t": "余闻方士，"}, {"f": "audio/53/school-sch-nj-23__2.mp3", "t": "或以脑髓为藏，"}, {"f": "audio/53/school-sch-nj-23__3.mp3", "t": "或以肠胃为藏，"}, {"f": "audio/53/school-sch-nj-23__4.mp3", "t": "或以为府，"}, {"f": "audio/53/school-sch-nj-23__5.mp3", "t": "敢问更相反，"}, {"f": "audio/53/school-sch-nj-23__6.mp3", "t": "皆自谓是，"}, {"f": "audio/53/school-sch-nj-23__7.mp3", "t": "不知其道，"}, {"f": "audio/53/school-sch-nj-23__8.mp3", "t": "愿闻其说。"}, {"f": "audio/53/school-sch-nj-23__9.mp3", "t": "岐伯对曰："}, {"f": "audio/53/school-sch-nj-23__10.mp3", "t": "脑、"}, {"f": "audio/53/school-sch-nj-23__11.mp3", "t": "髓、"}, {"f": "audio/53/school-sch-nj-23__12.mp3", "t": "骨、"}, {"f": "audio/53/school-sch-nj-23__13.mp3", "t": "脉、"}, {"f": "audio/53/school-sch-nj-23__14.mp3", "t": "胆、"}, {"f": "audio/53/school-sch-nj-23__15.mp3", "t": "女子胞，"}, {"f": "audio/53/school-sch-nj-23__16.mp3", "t": "此六者，"}, {"f": "audio/53/school-sch-nj-23__17.mp3", "t": "地气之所生也，"}, {"f": "audio/53/school-sch-nj-23__18.mp3", "t": "皆藏于阴而象于地，"}, {"f": "audio/53/school-sch-nj-23__19.mp3", "t": "故藏而不写，"}, {"f": "audio/53/school-sch-nj-23__20.mp3", "t": "名曰奇恒之府。"}, {"f": "audio/53/school-sch-nj-23__21.mp3", "t": "夫胃、"}, {"f": "audio/53/school-sch-nj-23__22.mp3", "t": "大肠、"}, {"f": "audio/53/school-sch-nj-23__23.mp3", "t": "小肠、"}, {"f": "audio/53/school-sch-nj-23__24.mp3", "t": "三焦、"}, {"f": "audio/53/school-sch-nj-23__25.mp3", "t": "膀胱，"}, {"f": "audio/53/school-sch-nj-23__26.mp3", "t": "此五者，"}, {"f": "audio/53/school-sch-nj-23__27.mp3", "t": "天气之所生也，"}, {"f": "audio/53/school-sch-nj-23__28.mp3", "t": "其气象天，"}, {"f": "audio/53/school-sch-nj-23__29.mp3", "t": "故写而不藏，"}, {"f": "audio/53/school-sch-nj-23__30.mp3", "t": "此受五藏浊气，"}, {"f": "audio/53/school-sch-nj-23__31.mp3", "t": "名曰传化之府，"}, {"f": "audio/53/school-sch-nj-23__32.mp3", "t": "此不能久留，"}, {"f": "audio/53/school-sch-nj-23__33.mp3", "t": "输写者也。"}, {"f": "audio/53/school-sch-nj-23__34.mp3", "t": "魄门亦为五藏使，"}, {"f": "audio/53/school-sch-nj-23__35.mp3", "t": "水谷不得久藏。"}], "school-sch-nj-24": [{"f": "audio/31/school-sch-nj-24__0.mp3", "t": "所谓五藏者，"}, {"f": "audio/31/school-sch-nj-24__1.mp3", "t": "藏精气而不写也，"}, {"f": "audio/31/school-sch-nj-24__2.mp3", "t": "故满而不能实；"}, {"f": "audio/31/school-sch-nj-24__3.mp3", "t": "六府者，"}, {"f": "audio/31/school-sch-nj-24__4.mp3", "t": "传化物而不藏，"}, {"f": "audio/31/school-sch-nj-24__5.mp3", "t": "故实而不能满也。"}, {"f": "audio/31/school-sch-nj-24__6.mp3", "t": "所以然者，"}, {"f": "audio/31/school-sch-nj-24__7.mp3", "t": "水谷入口，"}, {"f": "audio/31/school-sch-nj-24__8.mp3", "t": "则胃实而肠虚；"}, {"f": "audio/31/school-sch-nj-24__9.mp3", "t": "食下则肠实而胃虚。"}, {"f": "audio/31/school-sch-nj-24__10.mp3", "t": "故曰："}, {"f": "audio/31/school-sch-nj-24__11.mp3", "t": "实而不满，"}, {"f": "audio/31/school-sch-nj-24__12.mp3", "t": "满而不实也。"}], "school-sch-nj-25": [{"f": "audio/33/school-sch-nj-25__0.mp3", "t": "帝曰："}, {"f": "audio/33/school-sch-nj-25__1.mp3", "t": "气口何以独为五藏主？"}, {"f": "audio/33/school-sch-nj-25__2.mp3", "t": "岐伯曰："}, {"f": "audio/33/school-sch-nj-25__3.mp3", "t": "胃者，"}, {"f": "audio/33/school-sch-nj-25__4.mp3", "t": "水谷之海，"}, {"f": "audio/33/school-sch-nj-25__5.mp3", "t": "六府之大源也。"}, {"f": "audio/33/school-sch-nj-25__6.mp3", "t": "五味入口，"}, {"f": "audio/33/school-sch-nj-25__7.mp3", "t": "藏于胃，"}, {"f": "audio/33/school-sch-nj-25__8.mp3", "t": "以养五藏气。"}, {"f": "audio/33/school-sch-nj-25__9.mp3", "t": "气口亦太阴也。"}, {"f": "audio/33/school-sch-nj-25__10.mp3", "t": "是以五藏六府之气味，"}, {"f": "audio/33/school-sch-nj-25__11.mp3", "t": "皆出于胃，"}, {"f": "audio/33/school-sch-nj-25__12.mp3", "t": "变见于气口。"}, {"f": "audio/33/school-sch-nj-25__13.mp3", "t": "故五气入鼻，"}, {"f": "audio/33/school-sch-nj-25__14.mp3", "t": "藏于心肺，"}, {"f": "audio/33/school-sch-nj-25__15.mp3", "t": "心肺有病，"}, {"f": "audio/33/school-sch-nj-25__16.mp3", "t": "而鼻为之不利也。"}], "school-sch-nj-26": [{"f": "audio/e1/school-sch-nj-26__0.mp3", "t": "凡治病，"}, {"f": "audio/e1/school-sch-nj-26__1.mp3", "t": "必察其下，"}, {"f": "audio/e1/school-sch-nj-26__2.mp3", "t": "适其脉，"}, {"f": "audio/e1/school-sch-nj-26__3.mp3", "t": "观其志意，"}, {"f": "audio/e1/school-sch-nj-26__4.mp3", "t": "与其病也。"}, {"f": "audio/e1/school-sch-nj-26__5.mp3", "t": "拘于鬼神者，"}, {"f": "audio/e1/school-sch-nj-26__6.mp3", "t": "不可与言至德；"}, {"f": "audio/e1/school-sch-nj-26__7.mp3", "t": "恶于针石者，"}, {"f": "audio/e1/school-sch-nj-26__8.mp3", "t": "不可与言至巧；"}, {"f": "audio/e1/school-sch-nj-26__9.mp3", "t": "病不许治者，"}, {"f": "audio/e1/school-sch-nj-26__10.mp3", "t": "病必不治，"}, {"f": "audio/e1/school-sch-nj-26__11.mp3", "t": "治之无功矣。"}], "school-sch-nj-27": [{"f": "audio/ed/school-sch-nj-27__0.mp3", "t": "黄帝问曰："}, {"f": "audio/ed/school-sch-nj-27__1.mp3", "t": "人之居处动静勇怯，"}, {"f": "audio/ed/school-sch-nj-27__2.mp3", "t": "脉亦为之变乎？"}, {"f": "audio/ed/school-sch-nj-27__3.mp3", "t": "岐伯对曰："}, {"f": "audio/ed/school-sch-nj-27__4.mp3", "t": "凡人之惊恐恚劳动静，"}, {"f": "audio/ed/school-sch-nj-27__5.mp3", "t": "皆为变也。"}, {"f": "audio/ed/school-sch-nj-27__6.mp3", "t": "是以夜行则喘出于肾，"}, {"f": "audio/ed/school-sch-nj-27__7.mp3", "t": "淫气病肺。"}, {"f": "audio/ed/school-sch-nj-27__8.mp3", "t": "有所堕恐，"}, {"f": "audio/ed/school-sch-nj-27__9.mp3", "t": "喘出于肝，"}, {"f": "audio/ed/school-sch-nj-27__10.mp3", "t": "淫气害脾。"}, {"f": "audio/ed/school-sch-nj-27__11.mp3", "t": "有所惊恐，"}, {"f": "audio/ed/school-sch-nj-27__12.mp3", "t": "喘出于肺，"}, {"f": "audio/ed/school-sch-nj-27__13.mp3", "t": "淫气伤心。"}, {"f": "audio/ed/school-sch-nj-27__14.mp3", "t": "度水跌仆，"}, {"f": "audio/ed/school-sch-nj-27__15.mp3", "t": "喘出于肾与骨，"}, {"f": "audio/ed/school-sch-nj-27__16.mp3", "t": "当是之时，"}, {"f": "audio/ed/school-sch-nj-27__17.mp3", "t": "勇者气行则已；"}, {"f": "audio/ed/school-sch-nj-27__18.mp3", "t": "怯者则著而为病也。"}, {"f": "audio/ed/school-sch-nj-27__19.mp3", "t": "故曰："}, {"f": "audio/ed/school-sch-nj-27__20.mp3", "t": "诊病之道，"}, {"f": "audio/ed/school-sch-nj-27__21.mp3", "t": "观人勇怯，"}, {"f": "audio/ed/school-sch-nj-27__22.mp3", "t": "骨肉皮肤，"}, {"f": "audio/ed/school-sch-nj-27__23.mp3", "t": "能知其情，"}, {"f": "audio/ed/school-sch-nj-27__24.mp3", "t": "以为诊法也。"}], "school-sch-nj-28": [{"f": "audio/26/school-sch-nj-28__0.mp3", "t": "故饮食饱甚，"}, {"f": "audio/26/school-sch-nj-28__1.mp3", "t": "汗出于胃；"}, {"f": "audio/26/school-sch-nj-28__2.mp3", "t": "惊而夺精，"}, {"f": "audio/26/school-sch-nj-28__3.mp3", "t": "汗出于心；"}, {"f": "audio/26/school-sch-nj-28__4.mp3", "t": "持重远行，"}, {"f": "audio/26/school-sch-nj-28__5.mp3", "t": "汗出于肾；"}, {"f": "audio/26/school-sch-nj-28__6.mp3", "t": "疾走恐惧，"}, {"f": "audio/26/school-sch-nj-28__7.mp3", "t": "汗出于肝；"}, {"f": "audio/26/school-sch-nj-28__8.mp3", "t": "摇体劳苦，"}, {"f": "audio/26/school-sch-nj-28__9.mp3", "t": "汗出于脾。"}, {"f": "audio/26/school-sch-nj-28__10.mp3", "t": "故春秋冬夏，"}, {"f": "audio/26/school-sch-nj-28__11.mp3", "t": "四时阴阳，"}, {"f": "audio/26/school-sch-nj-28__12.mp3", "t": "生病起于过用，"}, {"f": "audio/26/school-sch-nj-28__13.mp3", "t": "此为常也。"}], "school-sch-nj-29": [{"f": "audio/72/school-sch-nj-29__0.mp3", "t": "食气入胃，"}, {"f": "audio/72/school-sch-nj-29__1.mp3", "t": "散精于肝，"}, {"f": "audio/72/school-sch-nj-29__2.mp3", "t": "淫气于筋。"}, {"f": "audio/72/school-sch-nj-29__3.mp3", "t": "食气入胃，"}, {"f": "audio/72/school-sch-nj-29__4.mp3", "t": "浊气归心，"}, {"f": "audio/72/school-sch-nj-29__5.mp3", "t": "淫精于脉。"}, {"f": "audio/72/school-sch-nj-29__6.mp3", "t": "脉气流经，"}, {"f": "audio/72/school-sch-nj-29__7.mp3", "t": "经气归于肺，"}, {"f": "audio/72/school-sch-nj-29__8.mp3", "t": "肺朝百脉，"}, {"f": "audio/72/school-sch-nj-29__9.mp3", "t": "输精于皮毛。"}, {"f": "audio/72/school-sch-nj-29__10.mp3", "t": "毛脉合精，"}, {"f": "audio/72/school-sch-nj-29__11.mp3", "t": "行气于府，"}, {"f": "audio/72/school-sch-nj-29__12.mp3", "t": "府精神明，"}, {"f": "audio/72/school-sch-nj-29__13.mp3", "t": "留于四藏，"}, {"f": "audio/72/school-sch-nj-29__14.mp3", "t": "气归于权衡。"}, {"f": "audio/72/school-sch-nj-29__15.mp3", "t": "权衡以平，"}, {"f": "audio/72/school-sch-nj-29__16.mp3", "t": "气口成寸，"}, {"f": "audio/72/school-sch-nj-29__17.mp3", "t": "以决死生。"}], "school-sch-nj-30": [{"f": "audio/0f/school-sch-nj-30__0.mp3", "t": "饮入于胃，"}, {"f": "audio/0f/school-sch-nj-30__1.mp3", "t": "游溢精气，"}, {"f": "audio/0f/school-sch-nj-30__2.mp3", "t": "上输于脾，"}, {"f": "audio/0f/school-sch-nj-30__3.mp3", "t": "脾气散精，"}, {"f": "audio/0f/school-sch-nj-30__4.mp3", "t": "上归于肺，"}, {"f": "audio/0f/school-sch-nj-30__5.mp3", "t": "通调水道，"}, {"f": "audio/0f/school-sch-nj-30__6.mp3", "t": "下输膀胱，"}, {"f": "audio/0f/school-sch-nj-30__7.mp3", "t": "水精四布，"}, {"f": "audio/0f/school-sch-nj-30__8.mp3", "t": "五经并行，"}, {"f": "audio/0f/school-sch-nj-30__9.mp3", "t": "合于四时五藏阴阳，"}, {"f": "audio/0f/school-sch-nj-30__10.mp3", "t": "揆度以为常也。"}], "school-sch-nj-31": [{"f": "audio/b5/school-sch-nj-31__0.mp3", "t": "黄帝问曰："}, {"f": "audio/b5/school-sch-nj-31__1.mp3", "t": "太阴阳明为表里，"}, {"f": "audio/b5/school-sch-nj-31__2.mp3", "t": "脾胃脉也，"}, {"f": "audio/b5/school-sch-nj-31__3.mp3", "t": "生病而异者，"}, {"f": "audio/b5/school-sch-nj-31__4.mp3", "t": "何也？"}, {"f": "audio/b5/school-sch-nj-31__5.mp3", "t": "岐伯对曰："}, {"f": "audio/b5/school-sch-nj-31__6.mp3", "t": "阴阳异位，"}, {"f": "audio/b5/school-sch-nj-31__7.mp3", "t": "更虚更实，"}, {"f": "audio/b5/school-sch-nj-31__8.mp3", "t": "更逆更从，"}, {"f": "audio/b5/school-sch-nj-31__9.mp3", "t": "或从内，"}, {"f": "audio/b5/school-sch-nj-31__10.mp3", "t": "或从外，"}, {"f": "audio/b5/school-sch-nj-31__11.mp3", "t": "所从不同，"}, {"f": "audio/b5/school-sch-nj-31__12.mp3", "t": "故病异名也。"}], "school-sch-nj-32": [{"f": "audio/f0/school-sch-nj-32__0.mp3", "t": "帝曰："}, {"f": "audio/f0/school-sch-nj-32__1.mp3", "t": "愿闻其异状也？"}, {"f": "audio/f0/school-sch-nj-32__2.mp3", "t": "岐伯曰："}, {"f": "audio/f0/school-sch-nj-32__3.mp3", "t": "阳者，"}, {"f": "audio/f0/school-sch-nj-32__4.mp3", "t": "天气也，"}, {"f": "audio/f0/school-sch-nj-32__5.mp3", "t": "主外；"}, {"f": "audio/f0/school-sch-nj-32__6.mp3", "t": "阴者，"}, {"f": "audio/f0/school-sch-nj-32__7.mp3", "t": "地气也，"}, {"f": "audio/f0/school-sch-nj-32__8.mp3", "t": "主内。"}, {"f": "audio/f0/school-sch-nj-32__9.mp3", "t": "故阳道实，"}, {"f": "audio/f0/school-sch-nj-32__10.mp3", "t": "阴道虚。"}, {"f": "audio/f0/school-sch-nj-32__11.mp3", "t": "故犯贼风虚邪者，"}, {"f": "audio/f0/school-sch-nj-32__12.mp3", "t": "阳受之；"}, {"f": "audio/f0/school-sch-nj-32__13.mp3", "t": "食饮不节，"}, {"f": "audio/f0/school-sch-nj-32__14.mp3", "t": "起居不时者，"}, {"f": "audio/f0/school-sch-nj-32__15.mp3", "t": "阴受之。"}, {"f": "audio/f0/school-sch-nj-32__16.mp3", "t": "阳受之则入六府，"}, {"f": "audio/f0/school-sch-nj-32__17.mp3", "t": "阴受之则入五藏。"}, {"f": "audio/f0/school-sch-nj-32__18.mp3", "t": "入六府则身热，"}, {"f": "audio/f0/school-sch-nj-32__19.mp3", "t": "不时卧，"}, {"f": "audio/f0/school-sch-nj-32__20.mp3", "t": "上为喘呼。"}, {"f": "audio/f0/school-sch-nj-32__21.mp3", "t": "入五藏则䐜满闭塞，"}, {"f": "audio/f0/school-sch-nj-32__22.mp3", "t": "下为飧泄，"}, {"f": "audio/f0/school-sch-nj-32__23.mp3", "t": "久为肠澼。"}, {"f": "audio/f0/school-sch-nj-32__24.mp3", "t": "故喉主天气，"}, {"f": "audio/f0/school-sch-nj-32__25.mp3", "t": "咽主地气。"}, {"f": "audio/f0/school-sch-nj-32__26.mp3", "t": "故阳受风气，"}, {"f": "audio/f0/school-sch-nj-32__27.mp3", "t": "阴受湿气。"}, {"f": "audio/f0/school-sch-nj-32__28.mp3", "t": "故阴气从足上行至头，"}, {"f": "audio/f0/school-sch-nj-32__29.mp3", "t": "而下行循臂至指端。"}, {"f": "audio/f0/school-sch-nj-32__30.mp3", "t": "阳气从手上行至头，"}, {"f": "audio/f0/school-sch-nj-32__31.mp3", "t": "而下行至足。"}, {"f": "audio/f0/school-sch-nj-32__32.mp3", "t": "故曰："}, {"f": "audio/f0/school-sch-nj-32__33.mp3", "t": "\"阳病者，"}, {"f": "audio/f0/school-sch-nj-32__34.mp3", "t": "上行极而下；"}, {"f": "audio/f0/school-sch-nj-32__35.mp3", "t": "阴病者，"}, {"f": "audio/f0/school-sch-nj-32__36.mp3", "t": "下行极而上。"}, {"f": "audio/f0/school-sch-nj-32__37.mp3", "t": "\"故伤于风者，"}, {"f": "audio/f0/school-sch-nj-32__38.mp3", "t": "上先受之；"}, {"f": "audio/f0/school-sch-nj-32__39.mp3", "t": "伤于湿者，"}, {"f": "audio/f0/school-sch-nj-32__40.mp3", "t": "下先受之。"}], "school-sch-nj-33": [{"f": "audio/08/school-sch-nj-33__0.mp3", "t": "帝曰："}, {"f": "audio/08/school-sch-nj-33__1.mp3", "t": "脾病而四支不用，"}, {"f": "audio/08/school-sch-nj-33__2.mp3", "t": "何也？"}, {"f": "audio/08/school-sch-nj-33__3.mp3", "t": "岐伯曰："}, {"f": "audio/08/school-sch-nj-33__4.mp3", "t": "四支皆禀气于胃，"}, {"f": "audio/08/school-sch-nj-33__5.mp3", "t": "而不得至经，"}, {"f": "audio/08/school-sch-nj-33__6.mp3", "t": "必因于脾，"}, {"f": "audio/08/school-sch-nj-33__7.mp3", "t": "乃得禀也。"}, {"f": "audio/08/school-sch-nj-33__8.mp3", "t": "今脾病不能为胃行其津液，"}, {"f": "audio/08/school-sch-nj-33__9.mp3", "t": "四支不得禀水谷气，"}, {"f": "audio/08/school-sch-nj-33__10.mp3", "t": "气日以衰，"}, {"f": "audio/08/school-sch-nj-33__11.mp3", "t": "脉道不利，"}, {"f": "audio/08/school-sch-nj-33__12.mp3", "t": "筋骨肌肉，"}, {"f": "audio/08/school-sch-nj-33__13.mp3", "t": "皆无气以生，"}, {"f": "audio/08/school-sch-nj-33__14.mp3", "t": "故不用焉。"}], "school-sch-nj-34": [{"f": "audio/ae/school-sch-nj-34__0.mp3", "t": "帝曰："}, {"f": "audio/ae/school-sch-nj-34__1.mp3", "t": "脾不主时，"}, {"f": "audio/ae/school-sch-nj-34__2.mp3", "t": "何也？"}, {"f": "audio/ae/school-sch-nj-34__3.mp3", "t": "岐伯曰："}, {"f": "audio/ae/school-sch-nj-34__4.mp3", "t": "脾者土也，"}, {"f": "audio/ae/school-sch-nj-34__5.mp3", "t": "治中央，"}, {"f": "audio/ae/school-sch-nj-34__6.mp3", "t": "常以四时长四藏，"}, {"f": "audio/ae/school-sch-nj-34__7.mp3", "t": "各十八日寄治，"}, {"f": "audio/ae/school-sch-nj-34__8.mp3", "t": "不得独主于时也。"}, {"f": "audio/ae/school-sch-nj-34__9.mp3", "t": "脾藏者，"}, {"f": "audio/ae/school-sch-nj-34__10.mp3", "t": "常著胃土之精也。"}, {"f": "audio/ae/school-sch-nj-34__11.mp3", "t": "土者生万物而法天地，"}, {"f": "audio/ae/school-sch-nj-34__12.mp3", "t": "故上下至头足，"}, {"f": "audio/ae/school-sch-nj-34__13.mp3", "t": "不得主时也。"}], "school-sch-nj-35": [{"f": "audio/27/school-sch-nj-35__0.mp3", "t": "帝曰："}, {"f": "audio/27/school-sch-nj-35__1.mp3", "t": "脾与胃以膜相连耳，"}, {"f": "audio/27/school-sch-nj-35__2.mp3", "t": "而能为之行其津液，"}, {"f": "audio/27/school-sch-nj-35__3.mp3", "t": "何也？"}, {"f": "audio/27/school-sch-nj-35__4.mp3", "t": "岐伯曰："}, {"f": "audio/27/school-sch-nj-35__5.mp3", "t": "足太阴者，"}, {"f": "audio/27/school-sch-nj-35__6.mp3", "t": "三阴也，"}, {"f": "audio/27/school-sch-nj-35__7.mp3", "t": "其脉贯胃属脾络嗌，"}, {"f": "audio/27/school-sch-nj-35__8.mp3", "t": "故太阴为之行气于三阴。"}, {"f": "audio/27/school-sch-nj-35__9.mp3", "t": "阳明者，"}, {"f": "audio/27/school-sch-nj-35__10.mp3", "t": "表也，"}, {"f": "audio/27/school-sch-nj-35__11.mp3", "t": "五藏六府之海也，"}, {"f": "audio/27/school-sch-nj-35__12.mp3", "t": "亦为之行气于三阳。"}, {"f": "audio/27/school-sch-nj-35__13.mp3", "t": "藏府各因其经而受气于阳明，"}, {"f": "audio/27/school-sch-nj-35__14.mp3", "t": "故为胃行其津液。"}, {"f": "audio/27/school-sch-nj-35__15.mp3", "t": "四支不得禀水谷气，"}, {"f": "audio/27/school-sch-nj-35__16.mp3", "t": "日以益衰，"}, {"f": "audio/27/school-sch-nj-35__17.mp3", "t": "阴道不利，"}, {"f": "audio/27/school-sch-nj-35__18.mp3", "t": "筋骨肌肉，"}, {"f": "audio/27/school-sch-nj-35__19.mp3", "t": "无气以生，"}, {"f": "audio/27/school-sch-nj-35__20.mp3", "t": "故不用焉。"}], "school-sch-nj-36": [{"f": "audio/34/school-sch-nj-36__0.mp3", "t": "黄帝问于岐伯曰："}, {"f": "audio/34/school-sch-nj-36__1.mp3", "t": "凡刺之法，"}, {"f": "audio/34/school-sch-nj-36__2.mp3", "t": "先必本于神。"}, {"f": "audio/34/school-sch-nj-36__3.mp3", "t": "血脉营气精神，"}, {"f": "audio/34/school-sch-nj-36__4.mp3", "t": "此五藏之所藏也。"}, {"f": "audio/34/school-sch-nj-36__5.mp3", "t": "至其淫泆离藏则精失，"}, {"f": "audio/34/school-sch-nj-36__6.mp3", "t": "魂魄飞扬，"}, {"f": "audio/34/school-sch-nj-36__7.mp3", "t": "志意恍乱，"}, {"f": "audio/34/school-sch-nj-36__8.mp3", "t": "智虑去身者，"}, {"f": "audio/34/school-sch-nj-36__9.mp3", "t": "何因而然乎？"}, {"f": "audio/34/school-sch-nj-36__10.mp3", "t": "天之罪与？"}, {"f": "audio/34/school-sch-nj-36__11.mp3", "t": "人之过乎？"}, {"f": "audio/34/school-sch-nj-36__12.mp3", "t": "何谓德、"}, {"f": "audio/34/school-sch-nj-36__13.mp3", "t": "气、"}, {"f": "audio/34/school-sch-nj-36__14.mp3", "t": "生、"}, {"f": "audio/34/school-sch-nj-36__15.mp3", "t": "精、"}, {"f": "audio/34/school-sch-nj-36__16.mp3", "t": "神、"}, {"f": "audio/34/school-sch-nj-36__17.mp3", "t": "魂、"}, {"f": "audio/34/school-sch-nj-36__18.mp3", "t": "魄、"}, {"f": "audio/34/school-sch-nj-36__19.mp3", "t": "心、"}, {"f": "audio/34/school-sch-nj-36__20.mp3", "t": "意、"}, {"f": "audio/34/school-sch-nj-36__21.mp3", "t": "志、"}, {"f": "audio/34/school-sch-nj-36__22.mp3", "t": "思、"}, {"f": "audio/34/school-sch-nj-36__23.mp3", "t": "智、"}, {"f": "audio/34/school-sch-nj-36__24.mp3", "t": "虑？"}, {"f": "audio/34/school-sch-nj-36__25.mp3", "t": "请问其故。"}], "school-sch-nj-37": [{"f": "audio/f1/school-sch-nj-37__0.mp3", "t": "岐伯答曰："}, {"f": "audio/f1/school-sch-nj-37__1.mp3", "t": "天之在我者德也，"}, {"f": "audio/f1/school-sch-nj-37__2.mp3", "t": "地之在我者气也。"}, {"f": "audio/f1/school-sch-nj-37__3.mp3", "t": "德流气薄而生者也。"}, {"f": "audio/f1/school-sch-nj-37__4.mp3", "t": "故生之来谓之精，"}, {"f": "audio/f1/school-sch-nj-37__5.mp3", "t": "两精相搏谓之神，"}, {"f": "audio/f1/school-sch-nj-37__6.mp3", "t": "随神往来者谓之魂，"}, {"f": "audio/f1/school-sch-nj-37__7.mp3", "t": "并精而出入者谓之魄。"}, {"f": "audio/f1/school-sch-nj-37__8.mp3", "t": "所以任物者谓之心，"}, {"f": "audio/f1/school-sch-nj-37__9.mp3", "t": "心有所忆谓之意，"}, {"f": "audio/f1/school-sch-nj-37__10.mp3", "t": "意之所存谓之志，"}, {"f": "audio/f1/school-sch-nj-37__11.mp3", "t": "因志而存变谓之思，"}, {"f": "audio/f1/school-sch-nj-37__12.mp3", "t": "因思而远慕谓之虑，"}, {"f": "audio/f1/school-sch-nj-37__13.mp3", "t": "因虑而处物谓之智。"}, {"f": "audio/f1/school-sch-nj-37__14.mp3", "t": "故智者之养生也，"}, {"f": "audio/f1/school-sch-nj-37__15.mp3", "t": "必顺四时而适寒暑，"}, {"f": "audio/f1/school-sch-nj-37__16.mp3", "t": "和喜怒而安居处，"}, {"f": "audio/f1/school-sch-nj-37__17.mp3", "t": "节阴阳而调刚柔。"}, {"f": "audio/f1/school-sch-nj-37__18.mp3", "t": "如是，"}, {"f": "audio/f1/school-sch-nj-37__19.mp3", "t": "则僻邪不至，"}, {"f": "audio/f1/school-sch-nj-37__20.mp3", "t": "长生久视。"}], "school-sch-nj-38": [{"f": "audio/53/school-sch-nj-38__0.mp3", "t": "是故怵惕思虑者则伤神，"}, {"f": "audio/53/school-sch-nj-38__1.mp3", "t": "神伤则恐惧，"}, {"f": "audio/53/school-sch-nj-38__2.mp3", "t": "流淫而不止。"}, {"f": "audio/53/school-sch-nj-38__3.mp3", "t": "因悲哀动中者，"}, {"f": "audio/53/school-sch-nj-38__4.mp3", "t": "竭绝而失生。"}, {"f": "audio/53/school-sch-nj-38__5.mp3", "t": "喜乐者，"}, {"f": "audio/53/school-sch-nj-38__6.mp3", "t": "神惮散而不藏。"}, {"f": "audio/53/school-sch-nj-38__7.mp3", "t": "愁忧者，"}, {"f": "audio/53/school-sch-nj-38__8.mp3", "t": "气闭塞而不行。"}, {"f": "audio/53/school-sch-nj-38__9.mp3", "t": "盛怒者，"}, {"f": "audio/53/school-sch-nj-38__10.mp3", "t": "迷惑而不治。"}, {"f": "audio/53/school-sch-nj-38__11.mp3", "t": "恐惧者，"}, {"f": "audio/53/school-sch-nj-38__12.mp3", "t": "神荡惮而不收。"}], "school-sch-nj-39": [{"f": "audio/c4/school-sch-nj-39__0.mp3", "t": "心，"}, {"f": "audio/c4/school-sch-nj-39__1.mp3", "t": "怵惕思虑则伤神，"}, {"f": "audio/c4/school-sch-nj-39__2.mp3", "t": "神伤则恐惧自失，"}, {"f": "audio/c4/school-sch-nj-39__3.mp3", "t": "破䐃脱肉；"}, {"f": "audio/c4/school-sch-nj-39__4.mp3", "t": "毛悴色夭，"}, {"f": "audio/c4/school-sch-nj-39__5.mp3", "t": "死于冬。"}, {"f": "audio/c4/school-sch-nj-39__6.mp3", "t": "脾愁忧而不解则伤意，"}, {"f": "audio/c4/school-sch-nj-39__7.mp3", "t": "意伤则悗乱，"}, {"f": "audio/c4/school-sch-nj-39__8.mp3", "t": "四肢不举，"}, {"f": "audio/c4/school-sch-nj-39__9.mp3", "t": "毛悴色夭，"}, {"f": "audio/c4/school-sch-nj-39__10.mp3", "t": "死于春。"}, {"f": "audio/c4/school-sch-nj-39__11.mp3", "t": "肝悲哀动中则伤魂，"}, {"f": "audio/c4/school-sch-nj-39__12.mp3", "t": "魂伤则狂忘不精，"}, {"f": "audio/c4/school-sch-nj-39__13.mp3", "t": "不精则不正，"}, {"f": "audio/c4/school-sch-nj-39__14.mp3", "t": "当人阴缩而挛筋，"}, {"f": "audio/c4/school-sch-nj-39__15.mp3", "t": "两胁骨不举；"}, {"f": "audio/c4/school-sch-nj-39__16.mp3", "t": "毛悴色夭，"}, {"f": "audio/c4/school-sch-nj-39__17.mp3", "t": "死于秋。"}, {"f": "audio/c4/school-sch-nj-39__18.mp3", "t": "肺喜乐无极则伤魄，"}, {"f": "audio/c4/school-sch-nj-39__19.mp3", "t": "魄伤则狂，"}, {"f": "audio/c4/school-sch-nj-39__20.mp3", "t": "狂者意不存人，"}, {"f": "audio/c4/school-sch-nj-39__21.mp3", "t": "皮革焦，"}, {"f": "audio/c4/school-sch-nj-39__22.mp3", "t": "毛悴色夭，"}, {"f": "audio/c4/school-sch-nj-39__23.mp3", "t": "死于夏。"}, {"f": "audio/c4/school-sch-nj-39__24.mp3", "t": "肾盛怒而不止则伤志，"}, {"f": "audio/c4/school-sch-nj-39__25.mp3", "t": "志伤则喜忘其前言，"}, {"f": "audio/c4/school-sch-nj-39__26.mp3", "t": "腰脊不可以俛仰屈伸，"}, {"f": "audio/c4/school-sch-nj-39__27.mp3", "t": "毛悴色夭，"}, {"f": "audio/c4/school-sch-nj-39__28.mp3", "t": "死于季夏。"}, {"f": "audio/c4/school-sch-nj-39__29.mp3", "t": "恐惧而不解则伤精，"}, {"f": "audio/c4/school-sch-nj-39__30.mp3", "t": "精伤则骨酸痿厥，"}, {"f": "audio/c4/school-sch-nj-39__31.mp3", "t": "精时自下。"}, {"f": "audio/c4/school-sch-nj-39__32.mp3", "t": "是故五藏主藏精者也，"}, {"f": "audio/c4/school-sch-nj-39__33.mp3", "t": "不可伤，"}, {"f": "audio/c4/school-sch-nj-39__34.mp3", "t": "伤则失守而阴虚，"}, {"f": "audio/c4/school-sch-nj-39__35.mp3", "t": "阴虚则无气，"}, {"f": "audio/c4/school-sch-nj-39__36.mp3", "t": "无气则死矣。"}, {"f": "audio/c4/school-sch-nj-39__37.mp3", "t": "是故用针者，"}, {"f": "audio/c4/school-sch-nj-39__38.mp3", "t": "察观病人之态，"}, {"f": "audio/c4/school-sch-nj-39__39.mp3", "t": "以知精神魂魄之存亡得失之意，"}, {"f": "audio/c4/school-sch-nj-39__40.mp3", "t": "五者以伤，"}, {"f": "audio/c4/school-sch-nj-39__41.mp3", "t": "针不可以治之也。"}], "school-sch-nj-40": [{"f": "audio/d0/school-sch-nj-40__0.mp3", "t": "肝藏血，"}, {"f": "audio/d0/school-sch-nj-40__1.mp3", "t": "血舍魂，"}, {"f": "audio/d0/school-sch-nj-40__2.mp3", "t": "肝气虚则恐，"}, {"f": "audio/d0/school-sch-nj-40__3.mp3", "t": "实则怒。"}, {"f": "audio/d0/school-sch-nj-40__4.mp3", "t": "脾藏营，"}, {"f": "audio/d0/school-sch-nj-40__5.mp3", "t": "营舍意，"}, {"f": "audio/d0/school-sch-nj-40__6.mp3", "t": "脾气虚则四肢不用，"}, {"f": "audio/d0/school-sch-nj-40__7.mp3", "t": "五藏不安，"}, {"f": "audio/d0/school-sch-nj-40__8.mp3", "t": "实则腹胀经溲不利。"}, {"f": "audio/d0/school-sch-nj-40__9.mp3", "t": "心藏脉，"}, {"f": "audio/d0/school-sch-nj-40__10.mp3", "t": "脉舍神，"}, {"f": "audio/d0/school-sch-nj-40__11.mp3", "t": "心气虚则悲，"}, {"f": "audio/d0/school-sch-nj-40__12.mp3", "t": "实则笑不休。"}, {"f": "audio/d0/school-sch-nj-40__13.mp3", "t": "肺藏气，"}, {"f": "audio/d0/school-sch-nj-40__14.mp3", "t": "气舍魄，"}, {"f": "audio/d0/school-sch-nj-40__15.mp3", "t": "肺气虚则鼻塞不利，"}, {"f": "audio/d0/school-sch-nj-40__16.mp3", "t": "少气，"}, {"f": "audio/d0/school-sch-nj-40__17.mp3", "t": "实则喘喝胸盈仰息。"}, {"f": "audio/d0/school-sch-nj-40__18.mp3", "t": "肾藏精，"}, {"f": "audio/d0/school-sch-nj-40__19.mp3", "t": "精舍志，"}, {"f": "audio/d0/school-sch-nj-40__20.mp3", "t": "肾气虚则厥，"}, {"f": "audio/d0/school-sch-nj-40__21.mp3", "t": "实则胀，"}, {"f": "audio/d0/school-sch-nj-40__22.mp3", "t": "五藏不安。"}, {"f": "audio/d0/school-sch-nj-40__23.mp3", "t": "必审五藏之病形，"}, {"f": "audio/d0/school-sch-nj-40__24.mp3", "t": "以知其气之虚实，"}, {"f": "audio/d0/school-sch-nj-40__25.mp3", "t": "谨而调之也。"}], "school-sch-nj-41": [{"f": "audio/34/school-sch-nj-41__0.mp3", "t": "黄帝问于岐伯曰："}, {"f": "audio/34/school-sch-nj-41__1.mp3", "t": "人焉受气？"}, {"f": "audio/34/school-sch-nj-41__2.mp3", "t": "阴阳焉会？"}, {"f": "audio/34/school-sch-nj-41__3.mp3", "t": "何气为营？"}, {"f": "audio/34/school-sch-nj-41__4.mp3", "t": "何气为卫？"}, {"f": "audio/34/school-sch-nj-41__5.mp3", "t": "营安从生？"}, {"f": "audio/34/school-sch-nj-41__6.mp3", "t": "卫于焉会？"}, {"f": "audio/34/school-sch-nj-41__7.mp3", "t": "老壮不同气，"}, {"f": "audio/34/school-sch-nj-41__8.mp3", "t": "阴阳异位，"}, {"f": "audio/34/school-sch-nj-41__9.mp3", "t": "愿闻其会。"}, {"f": "audio/34/school-sch-nj-41__10.mp3", "t": "岐伯答曰："}, {"f": "audio/34/school-sch-nj-41__11.mp3", "t": "人受气于谷，"}, {"f": "audio/34/school-sch-nj-41__12.mp3", "t": "谷入于胃，"}, {"f": "audio/34/school-sch-nj-41__13.mp3", "t": "以传与肺，"}, {"f": "audio/34/school-sch-nj-41__14.mp3", "t": "五藏六府，"}, {"f": "audio/34/school-sch-nj-41__15.mp3", "t": "皆以受气，"}, {"f": "audio/34/school-sch-nj-41__16.mp3", "t": "其清者为营，"}, {"f": "audio/34/school-sch-nj-41__17.mp3", "t": "浊者为卫，"}, {"f": "audio/34/school-sch-nj-41__18.mp3", "t": "营在脉中，"}, {"f": "audio/34/school-sch-nj-41__19.mp3", "t": "卫在脉外，"}, {"f": "audio/34/school-sch-nj-41__20.mp3", "t": "营周不休，"}, {"f": "audio/34/school-sch-nj-41__21.mp3", "t": "五十度而复大会。"}, {"f": "audio/34/school-sch-nj-41__22.mp3", "t": "阴阳相贯，"}, {"f": "audio/34/school-sch-nj-41__23.mp3", "t": "如环无端。"}, {"f": "audio/34/school-sch-nj-41__24.mp3", "t": "卫气行于阴二十五度，"}, {"f": "audio/34/school-sch-nj-41__25.mp3", "t": "行于阳二十五度，"}, {"f": "audio/34/school-sch-nj-41__26.mp3", "t": "分为昼夜，"}, {"f": "audio/34/school-sch-nj-41__27.mp3", "t": "故气至阳而起，"}, {"f": "audio/34/school-sch-nj-41__28.mp3", "t": "至阴而止。"}, {"f": "audio/34/school-sch-nj-41__29.mp3", "t": "故曰："}, {"f": "audio/34/school-sch-nj-41__30.mp3", "t": "日中而阳陇为重阳，"}, {"f": "audio/34/school-sch-nj-41__31.mp3", "t": "夜半而阴陇为重阴。"}, {"f": "audio/34/school-sch-nj-41__32.mp3", "t": "故太阴主内，"}, {"f": "audio/34/school-sch-nj-41__33.mp3", "t": "太阳主外，"}, {"f": "audio/34/school-sch-nj-41__34.mp3", "t": "各行二十五度，"}, {"f": "audio/34/school-sch-nj-41__35.mp3", "t": "分为昼夜。"}, {"f": "audio/34/school-sch-nj-41__36.mp3", "t": "夜半为阴陇，"}, {"f": "audio/34/school-sch-nj-41__37.mp3", "t": "夜半后而阴衰，"}, {"f": "audio/34/school-sch-nj-41__38.mp3", "t": "平旦阴尽而阳受气矣。"}, {"f": "audio/34/school-sch-nj-41__39.mp3", "t": "日中为阳陇，"}, {"f": "audio/34/school-sch-nj-41__40.mp3", "t": "日西为阳衰，"}, {"f": "audio/34/school-sch-nj-41__41.mp3", "t": "日入阳尽而阴受气矣。"}, {"f": "audio/34/school-sch-nj-41__42.mp3", "t": "夜半而大会，"}, {"f": "audio/34/school-sch-nj-41__43.mp3", "t": "万民皆卧，"}, {"f": "audio/34/school-sch-nj-41__44.mp3", "t": "命曰合阴。"}, {"f": "audio/34/school-sch-nj-41__45.mp3", "t": "平旦阴尽而阳受气，"}, {"f": "audio/34/school-sch-nj-41__46.mp3", "t": "如是无已，"}, {"f": "audio/34/school-sch-nj-41__47.mp3", "t": "与天地同纪。"}], "school-sch-nj-42": [{"f": "audio/9e/school-sch-nj-42__0.mp3", "t": "黄帝曰："}, {"f": "audio/9e/school-sch-nj-42__1.mp3", "t": "老人之不夜瞑者，"}, {"f": "audio/9e/school-sch-nj-42__2.mp3", "t": "何气使然？"}, {"f": "audio/9e/school-sch-nj-42__3.mp3", "t": "少壮之人不昼瞑者，"}, {"f": "audio/9e/school-sch-nj-42__4.mp3", "t": "何气使然？"}, {"f": "audio/9e/school-sch-nj-42__5.mp3", "t": "岐伯答曰："}, {"f": "audio/9e/school-sch-nj-42__6.mp3", "t": "壮者之气血盛，"}, {"f": "audio/9e/school-sch-nj-42__7.mp3", "t": "其肌肉滑，"}, {"f": "audio/9e/school-sch-nj-42__8.mp3", "t": "气道通，"}, {"f": "audio/9e/school-sch-nj-42__9.mp3", "t": "营卫之行，"}, {"f": "audio/9e/school-sch-nj-42__10.mp3", "t": "不失其常，"}, {"f": "audio/9e/school-sch-nj-42__11.mp3", "t": "故昼精而夜瞑。"}, {"f": "audio/9e/school-sch-nj-42__12.mp3", "t": "老者之气血衰，"}, {"f": "audio/9e/school-sch-nj-42__13.mp3", "t": "其肌肉枯，"}, {"f": "audio/9e/school-sch-nj-42__14.mp3", "t": "气道涩，"}, {"f": "audio/9e/school-sch-nj-42__15.mp3", "t": "五藏之气相搏，"}, {"f": "audio/9e/school-sch-nj-42__16.mp3", "t": "其营气衰少而卫气内伐，"}, {"f": "audio/9e/school-sch-nj-42__17.mp3", "t": "故昼不精，"}, {"f": "audio/9e/school-sch-nj-42__18.mp3", "t": "夜不瞑。"}], "school-sch-nj-43": [{"f": "audio/bc/school-sch-nj-43__0.mp3", "t": "黄帝曰："}, {"f": "audio/bc/school-sch-nj-43__1.mp3", "t": "愿闻营卫之所行，"}, {"f": "audio/bc/school-sch-nj-43__2.mp3", "t": "皆何道从来？"}, {"f": "audio/bc/school-sch-nj-43__3.mp3", "t": "岐伯答曰："}, {"f": "audio/bc/school-sch-nj-43__4.mp3", "t": "营出于中焦，"}, {"f": "audio/bc/school-sch-nj-43__5.mp3", "t": "卫出于下焦。"}, {"f": "audio/bc/school-sch-nj-43__6.mp3", "t": "黄帝曰："}, {"f": "audio/bc/school-sch-nj-43__7.mp3", "t": "愿闻三焦之所出。"}, {"f": "audio/bc/school-sch-nj-43__8.mp3", "t": "岐伯答曰："}, {"f": "audio/bc/school-sch-nj-43__9.mp3", "t": "上焦出于胃上口，"}, {"f": "audio/bc/school-sch-nj-43__10.mp3", "t": "并咽以上，"}, {"f": "audio/bc/school-sch-nj-43__11.mp3", "t": "贯膈而布胸中，"}, {"f": "audio/bc/school-sch-nj-43__12.mp3", "t": "走腋，"}, {"f": "audio/bc/school-sch-nj-43__13.mp3", "t": "循太阴之分而行，"}, {"f": "audio/bc/school-sch-nj-43__14.mp3", "t": "还至阳明，"}, {"f": "audio/bc/school-sch-nj-43__15.mp3", "t": "上至舌，"}, {"f": "audio/bc/school-sch-nj-43__16.mp3", "t": "下足阳明，"}, {"f": "audio/bc/school-sch-nj-43__17.mp3", "t": "常与营俱行于阳二十五度，"}, {"f": "audio/bc/school-sch-nj-43__18.mp3", "t": "行于阴亦二十五度，"}, {"f": "audio/bc/school-sch-nj-43__19.mp3", "t": "一周也。"}, {"f": "audio/bc/school-sch-nj-43__20.mp3", "t": "故五十度而复大会于手太阴矣。"}], "school-sch-nj-44": [{"f": "audio/1c/school-sch-nj-44__0.mp3", "t": "黄帝曰："}, {"f": "audio/1c/school-sch-nj-44__1.mp3", "t": "人有热饮食下胃，"}, {"f": "audio/1c/school-sch-nj-44__2.mp3", "t": "其气未定，"}, {"f": "audio/1c/school-sch-nj-44__3.mp3", "t": "汗则出，"}, {"f": "audio/1c/school-sch-nj-44__4.mp3", "t": "或出于面，"}, {"f": "audio/1c/school-sch-nj-44__5.mp3", "t": "或出于背，"}, {"f": "audio/1c/school-sch-nj-44__6.mp3", "t": "或出于身半，"}, {"f": "audio/1c/school-sch-nj-44__7.mp3", "t": "其不循卫气之道而出，"}, {"f": "audio/1c/school-sch-nj-44__8.mp3", "t": "何也？"}, {"f": "audio/1c/school-sch-nj-44__9.mp3", "t": "岐伯曰："}, {"f": "audio/1c/school-sch-nj-44__10.mp3", "t": "此外伤于风，"}, {"f": "audio/1c/school-sch-nj-44__11.mp3", "t": "内开腠理，"}, {"f": "audio/1c/school-sch-nj-44__12.mp3", "t": "毛蒸理泄，"}, {"f": "audio/1c/school-sch-nj-44__13.mp3", "t": "卫气走之，"}, {"f": "audio/1c/school-sch-nj-44__14.mp3", "t": "固不得循其道，"}, {"f": "audio/1c/school-sch-nj-44__15.mp3", "t": "此气慓悍滑疾，"}, {"f": "audio/1c/school-sch-nj-44__16.mp3", "t": "见开而出，"}, {"f": "audio/1c/school-sch-nj-44__17.mp3", "t": "故不得从其道，"}, {"f": "audio/1c/school-sch-nj-44__18.mp3", "t": "故命曰漏泄。"}], "school-sch-nj-45": [{"f": "audio/20/school-sch-nj-45__0.mp3", "t": "黄帝曰："}, {"f": "audio/20/school-sch-nj-45__1.mp3", "t": "愿闻中焦之所出。"}, {"f": "audio/20/school-sch-nj-45__2.mp3", "t": "岐伯答曰："}, {"f": "audio/20/school-sch-nj-45__3.mp3", "t": "中焦亦并胃中，"}, {"f": "audio/20/school-sch-nj-45__4.mp3", "t": "出上焦之后，"}, {"f": "audio/20/school-sch-nj-45__5.mp3", "t": "此所受气者，"}, {"f": "audio/20/school-sch-nj-45__6.mp3", "t": "泌糟粕，"}, {"f": "audio/20/school-sch-nj-45__7.mp3", "t": "蒸津液，"}, {"f": "audio/20/school-sch-nj-45__8.mp3", "t": "化其精微，"}, {"f": "audio/20/school-sch-nj-45__9.mp3", "t": "上注于肺脉，"}, {"f": "audio/20/school-sch-nj-45__10.mp3", "t": "乃化而为血，"}, {"f": "audio/20/school-sch-nj-45__11.mp3", "t": "以奉生身，"}, {"f": "audio/20/school-sch-nj-45__12.mp3", "t": "莫贵于此，"}, {"f": "audio/20/school-sch-nj-45__13.mp3", "t": "故独得行于经隧，"}, {"f": "audio/20/school-sch-nj-45__14.mp3", "t": "命曰营气。"}], "school-sch-nj-46": [{"f": "audio/04/school-sch-nj-46__0.mp3", "t": "黄帝曰："}, {"f": "audio/04/school-sch-nj-46__1.mp3", "t": "夫血之与气，"}, {"f": "audio/04/school-sch-nj-46__2.mp3", "t": "异名同类，"}, {"f": "audio/04/school-sch-nj-46__3.mp3", "t": "何谓也？"}, {"f": "audio/04/school-sch-nj-46__4.mp3", "t": "岐伯答曰："}, {"f": "audio/04/school-sch-nj-46__5.mp3", "t": "营卫者，"}, {"f": "audio/04/school-sch-nj-46__6.mp3", "t": "精气也，"}, {"f": "audio/04/school-sch-nj-46__7.mp3", "t": "血者，"}, {"f": "audio/04/school-sch-nj-46__8.mp3", "t": "神气也。"}, {"f": "audio/04/school-sch-nj-46__9.mp3", "t": "故血之与气，"}, {"f": "audio/04/school-sch-nj-46__10.mp3", "t": "异名同类焉。"}, {"f": "audio/04/school-sch-nj-46__11.mp3", "t": "故夺血者无汗，"}, {"f": "audio/04/school-sch-nj-46__12.mp3", "t": "夺汗者无血，"}, {"f": "audio/04/school-sch-nj-46__13.mp3", "t": "故人生有两死，"}, {"f": "audio/04/school-sch-nj-46__14.mp3", "t": "而无两生。"}], "school-sch-nj-47": [{"f": "audio/08/school-sch-nj-47__0.mp3", "t": "黄帝曰："}, {"f": "audio/08/school-sch-nj-47__1.mp3", "t": "愿闻下焦之所出。"}, {"f": "audio/08/school-sch-nj-47__2.mp3", "t": "岐伯答曰："}, {"f": "audio/08/school-sch-nj-47__3.mp3", "t": "下焦者，"}, {"f": "audio/08/school-sch-nj-47__4.mp3", "t": "别回肠，"}, {"f": "audio/08/school-sch-nj-47__5.mp3", "t": "注于膀胱，"}, {"f": "audio/08/school-sch-nj-47__6.mp3", "t": "而渗入焉。"}, {"f": "audio/08/school-sch-nj-47__7.mp3", "t": "故水谷者，"}, {"f": "audio/08/school-sch-nj-47__8.mp3", "t": "常并居于胃中，"}, {"f": "audio/08/school-sch-nj-47__9.mp3", "t": "成糟粕而俱下于大肠，"}, {"f": "audio/08/school-sch-nj-47__10.mp3", "t": "而成下焦，"}, {"f": "audio/08/school-sch-nj-47__11.mp3", "t": "渗而俱下，"}, {"f": "audio/08/school-sch-nj-47__12.mp3", "t": "济泌别汁，"}, {"f": "audio/08/school-sch-nj-47__13.mp3", "t": "循下焦而渗入膀胱焉。"}], "school-sch-nj-48": [{"f": "audio/93/school-sch-nj-48__0.mp3", "t": "黄帝曰："}, {"f": "audio/93/school-sch-nj-48__1.mp3", "t": "人饮酒，"}, {"f": "audio/93/school-sch-nj-48__2.mp3", "t": "酒亦入胃，"}, {"f": "audio/93/school-sch-nj-48__3.mp3", "t": "谷未熟而小便独先下，"}, {"f": "audio/93/school-sch-nj-48__4.mp3", "t": "何也？"}, {"f": "audio/93/school-sch-nj-48__5.mp3", "t": "岐伯答曰："}, {"f": "audio/93/school-sch-nj-48__6.mp3", "t": "酒者熟谷之液也。"}, {"f": "audio/93/school-sch-nj-48__7.mp3", "t": "其气悍以清，"}, {"f": "audio/93/school-sch-nj-48__8.mp3", "t": "故后谷而入，"}, {"f": "audio/93/school-sch-nj-48__9.mp3", "t": "先谷而液出焉。"}], "school-sch-nj-49": [{"f": "audio/ff/school-sch-nj-49__0.mp3", "t": "黄帝曰："}, {"f": "audio/ff/school-sch-nj-49__1.mp3", "t": "善。"}, {"f": "audio/ff/school-sch-nj-49__2.mp3", "t": "余闻上焦如雾，"}, {"f": "audio/ff/school-sch-nj-49__3.mp3", "t": "中焦如沤，"}, {"f": "audio/ff/school-sch-nj-49__4.mp3", "t": "下焦如渎，"}, {"f": "audio/ff/school-sch-nj-49__5.mp3", "t": "此之谓也。"}], "school-sch-nj-50": [{"f": "audio/f9/school-sch-nj-50__0.mp3", "t": "黄帝曰："}, {"f": "audio/f9/school-sch-nj-50__1.mp3", "t": "余闻人有精、"}, {"f": "audio/f9/school-sch-nj-50__2.mp3", "t": "气、"}, {"f": "audio/f9/school-sch-nj-50__3.mp3", "t": "津、"}, {"f": "audio/f9/school-sch-nj-50__4.mp3", "t": "液、"}, {"f": "audio/f9/school-sch-nj-50__5.mp3", "t": "血、"}, {"f": "audio/f9/school-sch-nj-50__6.mp3", "t": "脉，"}, {"f": "audio/f9/school-sch-nj-50__7.mp3", "t": "余意以为一气耳，"}, {"f": "audio/f9/school-sch-nj-50__8.mp3", "t": "今乃辨为六名，"}, {"f": "audio/f9/school-sch-nj-50__9.mp3", "t": "余不知其所以然。"}, {"f": "audio/f9/school-sch-nj-50__10.mp3", "t": "岐伯曰："}, {"f": "audio/f9/school-sch-nj-50__11.mp3", "t": "两神相搏，"}, {"f": "audio/f9/school-sch-nj-50__12.mp3", "t": "合而成形，"}, {"f": "audio/f9/school-sch-nj-50__13.mp3", "t": "常先身生，"}, {"f": "audio/f9/school-sch-nj-50__14.mp3", "t": "是谓精。"}, {"f": "audio/f9/school-sch-nj-50__15.mp3", "t": "何谓气？"}, {"f": "audio/f9/school-sch-nj-50__16.mp3", "t": "岐伯曰："}, {"f": "audio/f9/school-sch-nj-50__17.mp3", "t": "上焦开发，"}, {"f": "audio/f9/school-sch-nj-50__18.mp3", "t": "宣五谷味，"}, {"f": "audio/f9/school-sch-nj-50__19.mp3", "t": "熏肤充身泽毛，"}, {"f": "audio/f9/school-sch-nj-50__20.mp3", "t": "若雾露之溉，"}, {"f": "audio/f9/school-sch-nj-50__21.mp3", "t": "是谓气。"}, {"f": "audio/f9/school-sch-nj-50__22.mp3", "t": "何谓津？"}, {"f": "audio/f9/school-sch-nj-50__23.mp3", "t": "岐伯曰："}, {"f": "audio/f9/school-sch-nj-50__24.mp3", "t": "腠理发泄，"}, {"f": "audio/f9/school-sch-nj-50__25.mp3", "t": "汗出溱溱，"}, {"f": "audio/f9/school-sch-nj-50__26.mp3", "t": "是谓津。"}, {"f": "audio/f9/school-sch-nj-50__27.mp3", "t": "何谓液？"}, {"f": "audio/f9/school-sch-nj-50__28.mp3", "t": "岐伯曰："}, {"f": "audio/f9/school-sch-nj-50__29.mp3", "t": "谷入气满，"}, {"f": "audio/f9/school-sch-nj-50__30.mp3", "t": "淖泽注于骨，"}, {"f": "audio/f9/school-sch-nj-50__31.mp3", "t": "骨属屈伸，"}, {"f": "audio/f9/school-sch-nj-50__32.mp3", "t": "泄泽补益脑髓，"}, {"f": "audio/f9/school-sch-nj-50__33.mp3", "t": "皮肤润泽，"}, {"f": "audio/f9/school-sch-nj-50__34.mp3", "t": "是谓液。"}, {"f": "audio/f9/school-sch-nj-50__35.mp3", "t": "何谓血？"}, {"f": "audio/f9/school-sch-nj-50__36.mp3", "t": "岐伯曰："}, {"f": "audio/f9/school-sch-nj-50__37.mp3", "t": "中焦受气取汁，"}, {"f": "audio/f9/school-sch-nj-50__38.mp3", "t": "变化而赤，"}, {"f": "audio/f9/school-sch-nj-50__39.mp3", "t": "是谓血。"}, {"f": "audio/f9/school-sch-nj-50__40.mp3", "t": "何谓脉？"}, {"f": "audio/f9/school-sch-nj-50__41.mp3", "t": "岐伯曰："}, {"f": "audio/f9/school-sch-nj-50__42.mp3", "t": "壅遏营气，"}, {"f": "audio/f9/school-sch-nj-50__43.mp3", "t": "令无所避，"}, {"f": "audio/f9/school-sch-nj-50__44.mp3", "t": "是谓脉。"}], "school-sch-nj-51": [{"f": "audio/0a/school-sch-nj-51__0.mp3", "t": "黄帝曰："}, {"f": "audio/0a/school-sch-nj-51__1.mp3", "t": "六气者，"}, {"f": "audio/0a/school-sch-nj-51__2.mp3", "t": "有余不足，"}, {"f": "audio/0a/school-sch-nj-51__3.mp3", "t": "气之多少，"}, {"f": "audio/0a/school-sch-nj-51__4.mp3", "t": "脑髓之虚实，"}, {"f": "audio/0a/school-sch-nj-51__5.mp3", "t": "血脉之清浊，"}, {"f": "audio/0a/school-sch-nj-51__6.mp3", "t": "何以知之？"}, {"f": "audio/0a/school-sch-nj-51__7.mp3", "t": "岐伯曰："}, {"f": "audio/0a/school-sch-nj-51__8.mp3", "t": "精脱者，"}, {"f": "audio/0a/school-sch-nj-51__9.mp3", "t": "耳聋。"}, {"f": "audio/0a/school-sch-nj-51__10.mp3", "t": "气脱者，"}, {"f": "audio/0a/school-sch-nj-51__11.mp3", "t": "目不明；"}, {"f": "audio/0a/school-sch-nj-51__12.mp3", "t": "津脱者，"}, {"f": "audio/0a/school-sch-nj-51__13.mp3", "t": "腠理开，"}, {"f": "audio/0a/school-sch-nj-51__14.mp3", "t": "汗大泄；"}, {"f": "audio/0a/school-sch-nj-51__15.mp3", "t": "液脱者，"}, {"f": "audio/0a/school-sch-nj-51__16.mp3", "t": "骨属屈伸不利，"}, {"f": "audio/0a/school-sch-nj-51__17.mp3", "t": "色夭，"}, {"f": "audio/0a/school-sch-nj-51__18.mp3", "t": "脑髓消，"}, {"f": "audio/0a/school-sch-nj-51__19.mp3", "t": "胫酸，"}, {"f": "audio/0a/school-sch-nj-51__20.mp3", "t": "耳数鸣；"}, {"f": "audio/0a/school-sch-nj-51__21.mp3", "t": "血脱者，"}, {"f": "audio/0a/school-sch-nj-51__22.mp3", "t": "色白，"}, {"f": "audio/0a/school-sch-nj-51__23.mp3", "t": "夭然不泽，"}, {"f": "audio/0a/school-sch-nj-51__24.mp3", "t": "其脉空虚，"}, {"f": "audio/0a/school-sch-nj-51__25.mp3", "t": "此其候也。"}], "school-sch-nj-52": [{"f": "audio/13/school-sch-nj-52__0.mp3", "t": "黄帝问于岐伯曰："}, {"f": "audio/13/school-sch-nj-52__1.mp3", "t": "夫百病之始生也，"}, {"f": "audio/13/school-sch-nj-52__2.mp3", "t": "皆生于风雨寒暑，"}, {"f": "audio/13/school-sch-nj-52__3.mp3", "t": "清湿喜怒。"}, {"f": "audio/13/school-sch-nj-52__4.mp3", "t": "喜怒不节则伤藏，"}, {"f": "audio/13/school-sch-nj-52__5.mp3", "t": "风雨则伤上，"}, {"f": "audio/13/school-sch-nj-52__6.mp3", "t": "清湿则伤下。"}, {"f": "audio/13/school-sch-nj-52__7.mp3", "t": "三部之气，"}, {"f": "audio/13/school-sch-nj-52__8.mp3", "t": "所伤异类，"}, {"f": "audio/13/school-sch-nj-52__9.mp3", "t": "愿闻其会。"}, {"f": "audio/13/school-sch-nj-52__10.mp3", "t": "岐伯曰："}, {"f": "audio/13/school-sch-nj-52__11.mp3", "t": "三部之气各不同，"}, {"f": "audio/13/school-sch-nj-52__12.mp3", "t": "或起于阴，"}, {"f": "audio/13/school-sch-nj-52__13.mp3", "t": "或起于阳，"}, {"f": "audio/13/school-sch-nj-52__14.mp3", "t": "请言其方。"}, {"f": "audio/13/school-sch-nj-52__15.mp3", "t": "喜怒不节则伤藏，"}, {"f": "audio/13/school-sch-nj-52__16.mp3", "t": "藏伤则病起于阴也；"}, {"f": "audio/13/school-sch-nj-52__17.mp3", "t": "清湿袭虚，"}, {"f": "audio/13/school-sch-nj-52__18.mp3", "t": "则病起于下；"}, {"f": "audio/13/school-sch-nj-52__19.mp3", "t": "风雨袭虚，"}, {"f": "audio/13/school-sch-nj-52__20.mp3", "t": "则病起于上，"}, {"f": "audio/13/school-sch-nj-52__21.mp3", "t": "是谓三部。"}, {"f": "audio/13/school-sch-nj-52__22.mp3", "t": "至于其淫泆，"}, {"f": "audio/13/school-sch-nj-52__23.mp3", "t": "不可胜数。"}], "school-sch-nj-53": [{"f": "audio/e5/school-sch-nj-53__0.mp3", "t": "黄帝曰："}, {"f": "audio/e5/school-sch-nj-53__1.mp3", "t": "余固不能数，"}, {"f": "audio/e5/school-sch-nj-53__2.mp3", "t": "故问先师，"}, {"f": "audio/e5/school-sch-nj-53__3.mp3", "t": "愿卒闻其道。"}, {"f": "audio/e5/school-sch-nj-53__4.mp3", "t": "岐伯曰："}, {"f": "audio/e5/school-sch-nj-53__5.mp3", "t": "风雨寒热，"}, {"f": "audio/e5/school-sch-nj-53__6.mp3", "t": "不得虚，"}, {"f": "audio/e5/school-sch-nj-53__7.mp3", "t": "邪不能独伤人，"}, {"f": "audio/e5/school-sch-nj-53__8.mp3", "t": "卒然逢疾风暴雨而不病者，"}, {"f": "audio/e5/school-sch-nj-53__9.mp3", "t": "盖无虚，"}, {"f": "audio/e5/school-sch-nj-53__10.mp3", "t": "故邪不能独伤人。"}, {"f": "audio/e5/school-sch-nj-53__11.mp3", "t": "此必因虚邪之风，"}, {"f": "audio/e5/school-sch-nj-53__12.mp3", "t": "与其身形，"}, {"f": "audio/e5/school-sch-nj-53__13.mp3", "t": "两虚相得，"}, {"f": "audio/e5/school-sch-nj-53__14.mp3", "t": "乃客其形。"}, {"f": "audio/e5/school-sch-nj-53__15.mp3", "t": "两实相逢，"}, {"f": "audio/e5/school-sch-nj-53__16.mp3", "t": "众人肉坚。"}, {"f": "audio/e5/school-sch-nj-53__17.mp3", "t": "其中于虚邪也，"}, {"f": "audio/e5/school-sch-nj-53__18.mp3", "t": "因于天时，"}, {"f": "audio/e5/school-sch-nj-53__19.mp3", "t": "与其身形，"}, {"f": "audio/e5/school-sch-nj-53__20.mp3", "t": "参以虚实，"}, {"f": "audio/e5/school-sch-nj-53__21.mp3", "t": "大病乃成。"}, {"f": "audio/e5/school-sch-nj-53__22.mp3", "t": "气有定舍，"}, {"f": "audio/e5/school-sch-nj-53__23.mp3", "t": "因处为名。"}, {"f": "audio/e5/school-sch-nj-53__24.mp3", "t": "上下中外，"}, {"f": "audio/e5/school-sch-nj-53__25.mp3", "t": "分为三员。"}], "school-sch-nj-54": [{"f": "audio/b4/school-sch-nj-54__0.mp3", "t": "是故虚邪之中人也，"}, {"f": "audio/b4/school-sch-nj-54__1.mp3", "t": "始于皮肤，"}, {"f": "audio/b4/school-sch-nj-54__2.mp3", "t": "皮肤缓则腠理开，"}, {"f": "audio/b4/school-sch-nj-54__3.mp3", "t": "开则邪从毛发入，"}, {"f": "audio/b4/school-sch-nj-54__4.mp3", "t": "入则抵深，"}, {"f": "audio/b4/school-sch-nj-54__5.mp3", "t": "深则毛发立，"}, {"f": "audio/b4/school-sch-nj-54__6.mp3", "t": "毛发立则淅然，"}, {"f": "audio/b4/school-sch-nj-54__7.mp3", "t": "故皮肤痛。"}, {"f": "audio/b4/school-sch-nj-54__8.mp3", "t": "留而不去，"}, {"f": "audio/b4/school-sch-nj-54__9.mp3", "t": "则传舍于络脉，"}, {"f": "audio/b4/school-sch-nj-54__10.mp3", "t": "在络之时，"}, {"f": "audio/b4/school-sch-nj-54__11.mp3", "t": "痛于肌肉，"}, {"f": "audio/b4/school-sch-nj-54__12.mp3", "t": "故痛之时息，"}, {"f": "audio/b4/school-sch-nj-54__13.mp3", "t": "大经乃代。"}, {"f": "audio/b4/school-sch-nj-54__14.mp3", "t": "留而不去，"}, {"f": "audio/b4/school-sch-nj-54__15.mp3", "t": "传舍于经，"}, {"f": "audio/b4/school-sch-nj-54__16.mp3", "t": "在经之时，"}, {"f": "audio/b4/school-sch-nj-54__17.mp3", "t": "洒淅喜惊。"}, {"f": "audio/b4/school-sch-nj-54__18.mp3", "t": "留而不去，"}, {"f": "audio/b4/school-sch-nj-54__19.mp3", "t": "传舍于输，"}, {"f": "audio/b4/school-sch-nj-54__20.mp3", "t": "在输之时，"}, {"f": "audio/b4/school-sch-nj-54__21.mp3", "t": "六经不通四肢，"}, {"f": "audio/b4/school-sch-nj-54__22.mp3", "t": "则肢节痛，"}, {"f": "audio/b4/school-sch-nj-54__23.mp3", "t": "腰脊乃强。"}, {"f": "audio/b4/school-sch-nj-54__24.mp3", "t": "留而不去，"}, {"f": "audio/b4/school-sch-nj-54__25.mp3", "t": "传舍于伏冲之脉，"}, {"f": "audio/b4/school-sch-nj-54__26.mp3", "t": "在伏冲之时，"}, {"f": "audio/b4/school-sch-nj-54__27.mp3", "t": "体重身痛。"}, {"f": "audio/b4/school-sch-nj-54__28.mp3", "t": "留而不去，"}, {"f": "audio/b4/school-sch-nj-54__29.mp3", "t": "传舍于肠胃，"}, {"f": "audio/b4/school-sch-nj-54__30.mp3", "t": "在肠胃之时，"}, {"f": "audio/b4/school-sch-nj-54__31.mp3", "t": "贲响腹胀，"}, {"f": "audio/b4/school-sch-nj-54__32.mp3", "t": "多寒则肠鸣飧泄，"}, {"f": "audio/b4/school-sch-nj-54__33.mp3", "t": "食不化；"}, {"f": "audio/b4/school-sch-nj-54__34.mp3", "t": "多热则溏出糜。"}, {"f": "audio/b4/school-sch-nj-54__35.mp3", "t": "留而不去，"}, {"f": "audio/b4/school-sch-nj-54__36.mp3", "t": "传舍于肠胃之外，"}, {"f": "audio/b4/school-sch-nj-54__37.mp3", "t": "募原之间，"}, {"f": "audio/b4/school-sch-nj-54__38.mp3", "t": "留著于脉，"}, {"f": "audio/b4/school-sch-nj-54__39.mp3", "t": "稽留而不去，"}, {"f": "audio/b4/school-sch-nj-54__40.mp3", "t": "息而成积。"}, {"f": "audio/b4/school-sch-nj-54__41.mp3", "t": "或著孙脉，"}, {"f": "audio/b4/school-sch-nj-54__42.mp3", "t": "或著络脉，"}, {"f": "audio/b4/school-sch-nj-54__43.mp3", "t": "或著经脉，"}, {"f": "audio/b4/school-sch-nj-54__44.mp3", "t": "或著输脉，"}, {"f": "audio/b4/school-sch-nj-54__45.mp3", "t": "或著于伏冲之脉，"}, {"f": "audio/b4/school-sch-nj-54__46.mp3", "t": "或著于膂筋，"}, {"f": "audio/b4/school-sch-nj-54__47.mp3", "t": "或著于肠胃之募原，"}, {"f": "audio/b4/school-sch-nj-54__48.mp3", "t": "上连于缓筋，"}, {"f": "audio/b4/school-sch-nj-54__49.mp3", "t": "邪气淫泆，"}, {"f": "audio/b4/school-sch-nj-54__50.mp3", "t": "不可胜论。"}], "school-sch-nj-55": [{"f": "audio/03/school-sch-nj-55__0.mp3", "t": "黄帝曰："}, {"f": "audio/03/school-sch-nj-55__1.mp3", "t": "愿尽闻其所由然。"}, {"f": "audio/03/school-sch-nj-55__2.mp3", "t": "岐伯曰："}, {"f": "audio/03/school-sch-nj-55__3.mp3", "t": "其著孙络之脉而成积者，"}, {"f": "audio/03/school-sch-nj-55__4.mp3", "t": "其积往来上下，"}, {"f": "audio/03/school-sch-nj-55__5.mp3", "t": "臂手孙络之居也，"}, {"f": "audio/03/school-sch-nj-55__6.mp3", "t": "浮而缓，"}, {"f": "audio/03/school-sch-nj-55__7.mp3", "t": "不能句积而止之，"}, {"f": "audio/03/school-sch-nj-55__8.mp3", "t": "故往来移行肠胃之间，"}, {"f": "audio/03/school-sch-nj-55__9.mp3", "t": "水凑渗注灌，"}, {"f": "audio/03/school-sch-nj-55__10.mp3", "t": "濯濯有音；"}, {"f": "audio/03/school-sch-nj-55__11.mp3", "t": "有寒则䐜满雷引，"}, {"f": "audio/03/school-sch-nj-55__12.mp3", "t": "故时切痛。"}, {"f": "audio/03/school-sch-nj-55__13.mp3", "t": "其著于阳明之经，"}, {"f": "audio/03/school-sch-nj-55__14.mp3", "t": "则挟脐而居，"}, {"f": "audio/03/school-sch-nj-55__15.mp3", "t": "饱食则益大，"}, {"f": "audio/03/school-sch-nj-55__16.mp3", "t": "饥则益小。"}, {"f": "audio/03/school-sch-nj-55__17.mp3", "t": "其著于缓筋也，"}, {"f": "audio/03/school-sch-nj-55__18.mp3", "t": "似阳明之积，"}, {"f": "audio/03/school-sch-nj-55__19.mp3", "t": "饱食则痛，"}, {"f": "audio/03/school-sch-nj-55__20.mp3", "t": "饥则安。"}, {"f": "audio/03/school-sch-nj-55__21.mp3", "t": "其著于肠胃之募原也，"}, {"f": "audio/03/school-sch-nj-55__22.mp3", "t": "痛而外连于缓筋，"}, {"f": "audio/03/school-sch-nj-55__23.mp3", "t": "饱食则安，"}, {"f": "audio/03/school-sch-nj-55__24.mp3", "t": "饥则痛。"}, {"f": "audio/03/school-sch-nj-55__25.mp3", "t": "其著于伏冲之脉者，"}, {"f": "audio/03/school-sch-nj-55__26.mp3", "t": "揣之应手而动，"}, {"f": "audio/03/school-sch-nj-55__27.mp3", "t": "发手，"}, {"f": "audio/03/school-sch-nj-55__28.mp3", "t": "则热气下于两股，"}, {"f": "audio/03/school-sch-nj-55__29.mp3", "t": "如汤沃之状。"}, {"f": "audio/03/school-sch-nj-55__30.mp3", "t": "其著于膂筋，"}, {"f": "audio/03/school-sch-nj-55__31.mp3", "t": "在肠后者，"}, {"f": "audio/03/school-sch-nj-55__32.mp3", "t": "饥则积见，"}, {"f": "audio/03/school-sch-nj-55__33.mp3", "t": "饱则积不见，"}, {"f": "audio/03/school-sch-nj-55__34.mp3", "t": "按之不得。"}, {"f": "audio/03/school-sch-nj-55__35.mp3", "t": "其著于输之脉者，"}, {"f": "audio/03/school-sch-nj-55__36.mp3", "t": "闭塞不通，"}, {"f": "audio/03/school-sch-nj-55__37.mp3", "t": "津液不下，"}, {"f": "audio/03/school-sch-nj-55__38.mp3", "t": "孔窍干壅。"}, {"f": "audio/03/school-sch-nj-55__39.mp3", "t": "此邪气之从外入内，"}, {"f": "audio/03/school-sch-nj-55__40.mp3", "t": "从上下也。"}], "school-sch-nj-56": [{"f": "audio/74/school-sch-nj-56__0.mp3", "t": "黄帝曰："}, {"f": "audio/74/school-sch-nj-56__1.mp3", "t": "积之始生，"}, {"f": "audio/74/school-sch-nj-56__2.mp3", "t": "至其已成，"}, {"f": "audio/74/school-sch-nj-56__3.mp3", "t": "奈何？"}, {"f": "audio/74/school-sch-nj-56__4.mp3", "t": "岐伯曰："}, {"f": "audio/74/school-sch-nj-56__5.mp3", "t": "积之始生，"}, {"f": "audio/74/school-sch-nj-56__6.mp3", "t": "得寒乃生，"}, {"f": "audio/74/school-sch-nj-56__7.mp3", "t": "厥乃成积也。"}, {"f": "audio/74/school-sch-nj-56__8.mp3", "t": "黄帝曰："}, {"f": "audio/74/school-sch-nj-56__9.mp3", "t": "其成积奈何？"}, {"f": "audio/74/school-sch-nj-56__10.mp3", "t": "岐伯曰："}, {"f": "audio/74/school-sch-nj-56__11.mp3", "t": "厥气生足悗，"}, {"f": "audio/74/school-sch-nj-56__12.mp3", "t": "悗生胫寒，"}, {"f": "audio/74/school-sch-nj-56__13.mp3", "t": "胫寒则血脉凝涩，"}, {"f": "audio/74/school-sch-nj-56__14.mp3", "t": "血脉凝涩则寒气上入于肠胃，"}, {"f": "audio/74/school-sch-nj-56__15.mp3", "t": "入于肠胃则䐜胀，"}, {"f": "audio/74/school-sch-nj-56__16.mp3", "t": "䐜胀则肠外之汁沫迫聚不得散，"}, {"f": "audio/74/school-sch-nj-56__17.mp3", "t": "日以成积。"}, {"f": "audio/74/school-sch-nj-56__18.mp3", "t": "卒然多食饮，"}, {"f": "audio/74/school-sch-nj-56__19.mp3", "t": "则肠满。"}, {"f": "audio/74/school-sch-nj-56__20.mp3", "t": "起居不节，"}, {"f": "audio/74/school-sch-nj-56__21.mp3", "t": "用力过度，"}, {"f": "audio/74/school-sch-nj-56__22.mp3", "t": "则络脉伤。"}, {"f": "audio/74/school-sch-nj-56__23.mp3", "t": "阳络伤则血外溢，"}, {"f": "audio/74/school-sch-nj-56__24.mp3", "t": "血外溢则衄血；"}, {"f": "audio/74/school-sch-nj-56__25.mp3", "t": "阴络伤则血内溢，"}, {"f": "audio/74/school-sch-nj-56__26.mp3", "t": "血内溢则后血。"}, {"f": "audio/74/school-sch-nj-56__27.mp3", "t": "肠胃之络伤，"}, {"f": "audio/74/school-sch-nj-56__28.mp3", "t": "则血溢于肠外，"}, {"f": "audio/74/school-sch-nj-56__29.mp3", "t": "肠外有寒，"}, {"f": "audio/74/school-sch-nj-56__30.mp3", "t": "汁沫与血相搏，"}, {"f": "audio/74/school-sch-nj-56__31.mp3", "t": "则并合凝聚不得散，"}, {"f": "audio/74/school-sch-nj-56__32.mp3", "t": "而积成矣。"}, {"f": "audio/74/school-sch-nj-56__33.mp3", "t": "卒然中外于寒，"}, {"f": "audio/74/school-sch-nj-56__34.mp3", "t": "若内伤于忧愁，"}, {"f": "audio/74/school-sch-nj-56__35.mp3", "t": "则气上逆，"}, {"f": "audio/74/school-sch-nj-56__36.mp3", "t": "气上逆则六输不通，"}, {"f": "audio/74/school-sch-nj-56__37.mp3", "t": "温气不行，"}, {"f": "audio/74/school-sch-nj-56__38.mp3", "t": "凝血蕴裹而不散，"}, {"f": "audio/74/school-sch-nj-56__39.mp3", "t": "津液涩渗，"}, {"f": "audio/74/school-sch-nj-56__40.mp3", "t": "著而不去，"}, {"f": "audio/74/school-sch-nj-56__41.mp3", "t": "而积皆成矣。"}], "school-sch-nj-57": [{"f": "audio/fa/school-sch-nj-57__0.mp3", "t": "黄帝曰："}, {"f": "audio/fa/school-sch-nj-57__1.mp3", "t": "其生于阴者，"}, {"f": "audio/fa/school-sch-nj-57__2.mp3", "t": "奈何？"}, {"f": "audio/fa/school-sch-nj-57__3.mp3", "t": "岐伯曰："}, {"f": "audio/fa/school-sch-nj-57__4.mp3", "t": "忧思伤心；"}, {"f": "audio/fa/school-sch-nj-57__5.mp3", "t": "重寒伤肺；"}, {"f": "audio/fa/school-sch-nj-57__6.mp3", "t": "忿怒伤肝；"}, {"f": "audio/fa/school-sch-nj-57__7.mp3", "t": "醉以入房，"}, {"f": "audio/fa/school-sch-nj-57__8.mp3", "t": "汗出当风伤脾；"}, {"f": "audio/fa/school-sch-nj-57__9.mp3", "t": "用力过度，"}, {"f": "audio/fa/school-sch-nj-57__10.mp3", "t": "若入房汗出浴，"}, {"f": "audio/fa/school-sch-nj-57__11.mp3", "t": "则伤肾，"}, {"f": "audio/fa/school-sch-nj-57__12.mp3", "t": "此内外三部之所生病者也。"}], "school-sch-nj-58": [{"f": "audio/b0/school-sch-nj-58__0.mp3", "t": "黄帝曰："}, {"f": "audio/b0/school-sch-nj-58__1.mp3", "t": "善。"}, {"f": "audio/b0/school-sch-nj-58__2.mp3", "t": "治之奈何？"}, {"f": "audio/b0/school-sch-nj-58__3.mp3", "t": "岐伯答曰："}, {"f": "audio/b0/school-sch-nj-58__4.mp3", "t": "察其所痛，"}, {"f": "audio/b0/school-sch-nj-58__5.mp3", "t": "以知其应，"}, {"f": "audio/b0/school-sch-nj-58__6.mp3", "t": "有余不足，"}, {"f": "audio/b0/school-sch-nj-58__7.mp3", "t": "当补则补，"}, {"f": "audio/b0/school-sch-nj-58__8.mp3", "t": "当写则写，"}, {"f": "audio/b0/school-sch-nj-58__9.mp3", "t": "毋逆天时，"}, {"f": "audio/b0/school-sch-nj-58__10.mp3", "t": "是谓至治。"}], "school-sch-nj-59": [{"f": "audio/bb/school-sch-nj-59__0.mp3", "t": "黄帝问曰："}, {"f": "audio/bb/school-sch-nj-59__1.mp3", "t": "余闻善言天者，"}, {"f": "audio/bb/school-sch-nj-59__2.mp3", "t": "必有验于人；"}, {"f": "audio/bb/school-sch-nj-59__3.mp3", "t": "善言古者，"}, {"f": "audio/bb/school-sch-nj-59__4.mp3", "t": "必有合于今；"}, {"f": "audio/bb/school-sch-nj-59__5.mp3", "t": "善言人者，"}, {"f": "audio/bb/school-sch-nj-59__6.mp3", "t": "必有厌于己。"}, {"f": "audio/bb/school-sch-nj-59__7.mp3", "t": "如此，"}, {"f": "audio/bb/school-sch-nj-59__8.mp3", "t": "则道不惑而要数极，"}, {"f": "audio/bb/school-sch-nj-59__9.mp3", "t": "所谓明也。"}, {"f": "audio/bb/school-sch-nj-59__10.mp3", "t": "今余问于夫子，"}, {"f": "audio/bb/school-sch-nj-59__11.mp3", "t": "令言而可知，"}, {"f": "audio/bb/school-sch-nj-59__12.mp3", "t": "视而可见，"}, {"f": "audio/bb/school-sch-nj-59__13.mp3", "t": "扪而可得，"}, {"f": "audio/bb/school-sch-nj-59__14.mp3", "t": "令验于己，"}, {"f": "audio/bb/school-sch-nj-59__15.mp3", "t": "而发蒙解惑，"}, {"f": "audio/bb/school-sch-nj-59__16.mp3", "t": "可得而闻乎？"}], "school-sch-nj-60": [{"f": "audio/2b/school-sch-nj-60__0.mp3", "t": "岐伯再拜稽首对曰："}, {"f": "audio/2b/school-sch-nj-60__1.mp3", "t": "何道之问也？"}, {"f": "audio/2b/school-sch-nj-60__2.mp3", "t": "帝曰："}, {"f": "audio/2b/school-sch-nj-60__3.mp3", "t": "愿闻人之五藏卒痛，"}, {"f": "audio/2b/school-sch-nj-60__4.mp3", "t": "何气使然？"}, {"f": "audio/2b/school-sch-nj-60__5.mp3", "t": "岐伯对曰："}, {"f": "audio/2b/school-sch-nj-60__6.mp3", "t": "经脉流行不止，"}, {"f": "audio/2b/school-sch-nj-60__7.mp3", "t": "环周不休。"}, {"f": "audio/2b/school-sch-nj-60__8.mp3", "t": "寒气入经而稽迟，"}, {"f": "audio/2b/school-sch-nj-60__9.mp3", "t": "泣而不行，"}, {"f": "audio/2b/school-sch-nj-60__10.mp3", "t": "客于脉外则血少，"}, {"f": "audio/2b/school-sch-nj-60__11.mp3", "t": "客于脉中则气不通，"}, {"f": "audio/2b/school-sch-nj-60__12.mp3", "t": "故卒然而痛。"}], "school-sch-nj-61": [{"f": "audio/22/school-sch-nj-61__0.mp3", "t": "帝曰："}, {"f": "audio/22/school-sch-nj-61__1.mp3", "t": "其痛或卒然而止者，"}, {"f": "audio/22/school-sch-nj-61__2.mp3", "t": "或痛甚不休者，"}, {"f": "audio/22/school-sch-nj-61__3.mp3", "t": "或痛甚不可按者，"}, {"f": "audio/22/school-sch-nj-61__4.mp3", "t": "或按之而痛止者，"}, {"f": "audio/22/school-sch-nj-61__5.mp3", "t": "或按之无益者，"}, {"f": "audio/22/school-sch-nj-61__6.mp3", "t": "或喘动应手者，"}, {"f": "audio/22/school-sch-nj-61__7.mp3", "t": "或心与背相引而痛者，"}, {"f": "audio/22/school-sch-nj-61__8.mp3", "t": "或胁肋与少腹相引而痛者，"}, {"f": "audio/22/school-sch-nj-61__9.mp3", "t": "或腹痛引阴股者，"}, {"f": "audio/22/school-sch-nj-61__10.mp3", "t": "或痛宿昔而成积者，"}, {"f": "audio/22/school-sch-nj-61__11.mp3", "t": "或卒然痛死不知人，"}, {"f": "audio/22/school-sch-nj-61__12.mp3", "t": "有少间复生者，"}, {"f": "audio/22/school-sch-nj-61__13.mp3", "t": "或痛而呕者，"}, {"f": "audio/22/school-sch-nj-61__14.mp3", "t": "或腹痛而后泄者，"}, {"f": "audio/22/school-sch-nj-61__15.mp3", "t": "或痛而闭不通者。"}, {"f": "audio/22/school-sch-nj-61__16.mp3", "t": "凡此诸痛，"}, {"f": "audio/22/school-sch-nj-61__17.mp3", "t": "各不同形，"}, {"f": "audio/22/school-sch-nj-61__18.mp3", "t": "别之奈何？"}], "school-sch-nj-62": [{"f": "audio/f1/school-sch-nj-62__0.mp3", "t": "岐伯曰："}, {"f": "audio/f1/school-sch-nj-62__1.mp3", "t": "寒气客于脉外则脉寒，"}, {"f": "audio/f1/school-sch-nj-62__2.mp3", "t": "脉寒则缩蜷，"}, {"f": "audio/f1/school-sch-nj-62__3.mp3", "t": "缩蜷则脉绌急，"}, {"f": "audio/f1/school-sch-nj-62__4.mp3", "t": "则外引小络，"}, {"f": "audio/f1/school-sch-nj-62__5.mp3", "t": "故卒然而痛。"}, {"f": "audio/f1/school-sch-nj-62__6.mp3", "t": "得炅则痛立止，"}, {"f": "audio/f1/school-sch-nj-62__7.mp3", "t": "因重中于寒，"}, {"f": "audio/f1/school-sch-nj-62__8.mp3", "t": "则痛久矣。"}, {"f": "audio/f1/school-sch-nj-62__9.mp3", "t": "寒气客于经脉之中，"}, {"f": "audio/f1/school-sch-nj-62__10.mp3", "t": "与炅气相薄则脉满，"}, {"f": "audio/f1/school-sch-nj-62__11.mp3", "t": "满则痛而不可按也。"}, {"f": "audio/f1/school-sch-nj-62__12.mp3", "t": "寒气稽留，"}, {"f": "audio/f1/school-sch-nj-62__13.mp3", "t": "炅气从上，"}, {"f": "audio/f1/school-sch-nj-62__14.mp3", "t": "则脉充大而血气乱，"}, {"f": "audio/f1/school-sch-nj-62__15.mp3", "t": "故痛甚不可按也。"}, {"f": "audio/f1/school-sch-nj-62__16.mp3", "t": "寒气客于肠胃之间，"}, {"f": "audio/f1/school-sch-nj-62__17.mp3", "t": "膜原之下，"}, {"f": "audio/f1/school-sch-nj-62__18.mp3", "t": "血不得散，"}, {"f": "audio/f1/school-sch-nj-62__19.mp3", "t": "小络急引故痛，"}, {"f": "audio/f1/school-sch-nj-62__20.mp3", "t": "按之则血气散，"}, {"f": "audio/f1/school-sch-nj-62__21.mp3", "t": "故按之痛止。"}, {"f": "audio/f1/school-sch-nj-62__22.mp3", "t": "寒气客于侠脊之脉，"}, {"f": "audio/f1/school-sch-nj-62__23.mp3", "t": "则深按之不能及，"}, {"f": "audio/f1/school-sch-nj-62__24.mp3", "t": "故按之无益也。"}, {"f": "audio/f1/school-sch-nj-62__25.mp3", "t": "寒气客于冲脉，"}, {"f": "audio/f1/school-sch-nj-62__26.mp3", "t": "冲脉起于关元，"}, {"f": "audio/f1/school-sch-nj-62__27.mp3", "t": "随腹直上，"}, {"f": "audio/f1/school-sch-nj-62__28.mp3", "t": "寒气客则脉不通，"}, {"f": "audio/f1/school-sch-nj-62__29.mp3", "t": "脉不通则气因之，"}, {"f": "audio/f1/school-sch-nj-62__30.mp3", "t": "故喘动应手矣。"}, {"f": "audio/f1/school-sch-nj-62__31.mp3", "t": "寒气客于背俞之脉则脉泣，"}, {"f": "audio/f1/school-sch-nj-62__32.mp3", "t": "脉泣则血虚，"}, {"f": "audio/f1/school-sch-nj-62__33.mp3", "t": "血虚则痛。"}, {"f": "audio/f1/school-sch-nj-62__34.mp3", "t": "其俞注于心，"}, {"f": "audio/f1/school-sch-nj-62__35.mp3", "t": "故相引而痛。"}, {"f": "audio/f1/school-sch-nj-62__36.mp3", "t": "按之则热气至，"}, {"f": "audio/f1/school-sch-nj-62__37.mp3", "t": "热气至则痛止矣。"}, {"f": "audio/f1/school-sch-nj-62__38.mp3", "t": "寒气客于厥阴之脉，"}, {"f": "audio/f1/school-sch-nj-62__39.mp3", "t": "厥阴之脉者，"}, {"f": "audio/f1/school-sch-nj-62__40.mp3", "t": "络阴器，"}, {"f": "audio/f1/school-sch-nj-62__41.mp3", "t": "系于肝，"}, {"f": "audio/f1/school-sch-nj-62__42.mp3", "t": "寒气客于脉中，"}, {"f": "audio/f1/school-sch-nj-62__43.mp3", "t": "则血泣脉急，"}, {"f": "audio/f1/school-sch-nj-62__44.mp3", "t": "故胁肋与少腹相引痛矣。"}, {"f": "audio/f1/school-sch-nj-62__45.mp3", "t": "厥气客于阴股，"}, {"f": "audio/f1/school-sch-nj-62__46.mp3", "t": "寒气上及少腹，"}, {"f": "audio/f1/school-sch-nj-62__47.mp3", "t": "血泣在下相引，"}, {"f": "audio/f1/school-sch-nj-62__48.mp3", "t": "故腹痛引阴股。"}, {"f": "audio/f1/school-sch-nj-62__49.mp3", "t": "寒气客于小肠膜原之间，"}, {"f": "audio/f1/school-sch-nj-62__50.mp3", "t": "络血之中，"}, {"f": "audio/f1/school-sch-nj-62__51.mp3", "t": "血泣不得注于大经，"}, {"f": "audio/f1/school-sch-nj-62__52.mp3", "t": "血气稽留不得行，"}, {"f": "audio/f1/school-sch-nj-62__53.mp3", "t": "故宿昔而成积矣。"}, {"f": "audio/f1/school-sch-nj-62__54.mp3", "t": "寒气客于五藏，"}, {"f": "audio/f1/school-sch-nj-62__55.mp3", "t": "厥逆上泄，"}, {"f": "audio/f1/school-sch-nj-62__56.mp3", "t": "阴气竭，"}, {"f": "audio/f1/school-sch-nj-62__57.mp3", "t": "阳气未入，"}, {"f": "audio/f1/school-sch-nj-62__58.mp3", "t": "故卒然痛死不知人，"}, {"f": "audio/f1/school-sch-nj-62__59.mp3", "t": "气复反则生矣。"}, {"f": "audio/f1/school-sch-nj-62__60.mp3", "t": "寒气客于肠胃，"}, {"f": "audio/f1/school-sch-nj-62__61.mp3", "t": "厥逆上出，"}, {"f": "audio/f1/school-sch-nj-62__62.mp3", "t": "故痛而呕也。"}, {"f": "audio/f1/school-sch-nj-62__63.mp3", "t": "寒气客于小肠，"}, {"f": "audio/f1/school-sch-nj-62__64.mp3", "t": "小肠不得成聚，"}, {"f": "audio/f1/school-sch-nj-62__65.mp3", "t": "故后泄腹痛矣。"}, {"f": "audio/f1/school-sch-nj-62__66.mp3", "t": "热气留于小肠，"}, {"f": "audio/f1/school-sch-nj-62__67.mp3", "t": "肠中痛、"}, {"f": "audio/f1/school-sch-nj-62__68.mp3", "t": "瘅热焦渴，"}, {"f": "audio/f1/school-sch-nj-62__69.mp3", "t": "则坚干不得出，"}, {"f": "audio/f1/school-sch-nj-62__70.mp3", "t": "故痛而闭不通矣。"}], "school-sch-nj-63": [{"f": "audio/c7/school-sch-nj-63__0.mp3", "t": "帝曰："}, {"f": "audio/c7/school-sch-nj-63__1.mp3", "t": "所谓言而可知者也，"}, {"f": "audio/c7/school-sch-nj-63__2.mp3", "t": "视而可见，"}, {"f": "audio/c7/school-sch-nj-63__3.mp3", "t": "奈何？"}, {"f": "audio/c7/school-sch-nj-63__4.mp3", "t": "岐伯曰："}, {"f": "audio/c7/school-sch-nj-63__5.mp3", "t": "五藏六府，"}, {"f": "audio/c7/school-sch-nj-63__6.mp3", "t": "固尽有部，"}, {"f": "audio/c7/school-sch-nj-63__7.mp3", "t": "视其五色，"}, {"f": "audio/c7/school-sch-nj-63__8.mp3", "t": "黄赤为热，"}, {"f": "audio/c7/school-sch-nj-63__9.mp3", "t": "白为寒，"}, {"f": "audio/c7/school-sch-nj-63__10.mp3", "t": "青黑为痛，"}, {"f": "audio/c7/school-sch-nj-63__11.mp3", "t": "此所谓视而可见者也。"}, {"f": "audio/c7/school-sch-nj-63__12.mp3", "t": "帝曰："}, {"f": "audio/c7/school-sch-nj-63__13.mp3", "t": "扪而可得奈何？"}, {"f": "audio/c7/school-sch-nj-63__14.mp3", "t": "岐伯曰："}, {"f": "audio/c7/school-sch-nj-63__15.mp3", "t": "视其主病之脉，"}, {"f": "audio/c7/school-sch-nj-63__16.mp3", "t": "坚而血及陷下者，"}, {"f": "audio/c7/school-sch-nj-63__17.mp3", "t": "皆可扪而得也。"}], "school-sch-nj-64": [{"f": "audio/f6/school-sch-nj-64__0.mp3", "t": "帝曰："}, {"f": "audio/f6/school-sch-nj-64__1.mp3", "t": "善。"}, {"f": "audio/f6/school-sch-nj-64__2.mp3", "t": "余知百病生于气也，"}, {"f": "audio/f6/school-sch-nj-64__3.mp3", "t": "怒则气上，"}, {"f": "audio/f6/school-sch-nj-64__4.mp3", "t": "喜则气缓，"}, {"f": "audio/f6/school-sch-nj-64__5.mp3", "t": "悲则气消，"}, {"f": "audio/f6/school-sch-nj-64__6.mp3", "t": "恐则气下，"}, {"f": "audio/f6/school-sch-nj-64__7.mp3", "t": "寒则气收，"}, {"f": "audio/f6/school-sch-nj-64__8.mp3", "t": "炅则气泄，"}, {"f": "audio/f6/school-sch-nj-64__9.mp3", "t": "惊则气乱，"}, {"f": "audio/f6/school-sch-nj-64__10.mp3", "t": "劳则气耗，"}, {"f": "audio/f6/school-sch-nj-64__11.mp3", "t": "思则气结，"}, {"f": "audio/f6/school-sch-nj-64__12.mp3", "t": "九气不同，"}, {"f": "audio/f6/school-sch-nj-64__13.mp3", "t": "何病之生？"}, {"f": "audio/f6/school-sch-nj-64__14.mp3", "t": "岐伯曰："}, {"f": "audio/f6/school-sch-nj-64__15.mp3", "t": "怒则气逆，"}, {"f": "audio/f6/school-sch-nj-64__16.mp3", "t": "甚则呕血及飧泄，"}, {"f": "audio/f6/school-sch-nj-64__17.mp3", "t": "故气上矣。"}, {"f": "audio/f6/school-sch-nj-64__18.mp3", "t": "喜则气和志达，"}, {"f": "audio/f6/school-sch-nj-64__19.mp3", "t": "荣卫通利，"}, {"f": "audio/f6/school-sch-nj-64__20.mp3", "t": "故气缓矣。"}, {"f": "audio/f6/school-sch-nj-64__21.mp3", "t": "悲则心系急，"}, {"f": "audio/f6/school-sch-nj-64__22.mp3", "t": "肺布叶举，"}, {"f": "audio/f6/school-sch-nj-64__23.mp3", "t": "而上焦不通，"}, {"f": "audio/f6/school-sch-nj-64__24.mp3", "t": "荣卫不散，"}, {"f": "audio/f6/school-sch-nj-64__25.mp3", "t": "热气在中，"}, {"f": "audio/f6/school-sch-nj-64__26.mp3", "t": "故气消矣。"}, {"f": "audio/f6/school-sch-nj-64__27.mp3", "t": "恐则精却，"}, {"f": "audio/f6/school-sch-nj-64__28.mp3", "t": "却则上焦闭，"}, {"f": "audio/f6/school-sch-nj-64__29.mp3", "t": "闭则气还，"}, {"f": "audio/f6/school-sch-nj-64__30.mp3", "t": "还则下焦胀，"}, {"f": "audio/f6/school-sch-nj-64__31.mp3", "t": "故气不行矣。"}, {"f": "audio/f6/school-sch-nj-64__32.mp3", "t": "寒则腠理闭，"}, {"f": "audio/f6/school-sch-nj-64__33.mp3", "t": "气不行，"}, {"f": "audio/f6/school-sch-nj-64__34.mp3", "t": "故气收矣。"}, {"f": "audio/f6/school-sch-nj-64__35.mp3", "t": "炅则腠理开，"}, {"f": "audio/f6/school-sch-nj-64__36.mp3", "t": "荣卫通，"}, {"f": "audio/f6/school-sch-nj-64__37.mp3", "t": "汗大泄，"}, {"f": "audio/f6/school-sch-nj-64__38.mp3", "t": "故气泄。"}, {"f": "audio/f6/school-sch-nj-64__39.mp3", "t": "惊则心无所倚，"}, {"f": "audio/f6/school-sch-nj-64__40.mp3", "t": "神无所归，"}, {"f": "audio/f6/school-sch-nj-64__41.mp3", "t": "虑无所定，"}, {"f": "audio/f6/school-sch-nj-64__42.mp3", "t": "故气乱矣。"}, {"f": "audio/f6/school-sch-nj-64__43.mp3", "t": "劳则喘息汗出，"}, {"f": "audio/f6/school-sch-nj-64__44.mp3", "t": "外内皆越，"}, {"f": "audio/f6/school-sch-nj-64__45.mp3", "t": "故气耗矣。"}, {"f": "audio/f6/school-sch-nj-64__46.mp3", "t": "思则心有所存，"}, {"f": "audio/f6/school-sch-nj-64__47.mp3", "t": "神有所归，"}, {"f": "audio/f6/school-sch-nj-64__48.mp3", "t": "正气留而不行，"}, {"f": "audio/f6/school-sch-nj-64__49.mp3", "t": "故气结矣。"}], "school-sch-nj-65": [{"f": "audio/2f/school-sch-nj-65__0.mp3", "t": "岐伯曰："}, {"f": "audio/2f/school-sch-nj-65__1.mp3", "t": "审察病机，"}, {"f": "audio/2f/school-sch-nj-65__2.mp3", "t": "无失气宜，"}, {"f": "audio/2f/school-sch-nj-65__3.mp3", "t": "此之谓也。"}], "school-sch-nj-66": [{"f": "audio/d8/school-sch-nj-66__0.mp3", "t": "帝曰："}, {"f": "audio/d8/school-sch-nj-66__1.mp3", "t": "愿闻病机何如？"}, {"f": "audio/d8/school-sch-nj-66__2.mp3", "t": "岐伯曰："}, {"f": "audio/d8/school-sch-nj-66__3.mp3", "t": "诸风掉眩，"}, {"f": "audio/d8/school-sch-nj-66__4.mp3", "t": "皆属于肝；"}, {"f": "audio/d8/school-sch-nj-66__5.mp3", "t": "诸寒收引，"}, {"f": "audio/d8/school-sch-nj-66__6.mp3", "t": "皆属于肾；"}, {"f": "audio/d8/school-sch-nj-66__7.mp3", "t": "诸气膹郁，"}, {"f": "audio/d8/school-sch-nj-66__8.mp3", "t": "皆属于肺；"}, {"f": "audio/d8/school-sch-nj-66__9.mp3", "t": "诸湿肿满，"}, {"f": "audio/d8/school-sch-nj-66__10.mp3", "t": "皆属于脾；"}, {"f": "audio/d8/school-sch-nj-66__11.mp3", "t": "诸热瞀瘛，"}, {"f": "audio/d8/school-sch-nj-66__12.mp3", "t": "皆属于火；"}, {"f": "audio/d8/school-sch-nj-66__13.mp3", "t": "诸痛痒疮，"}, {"f": "audio/d8/school-sch-nj-66__14.mp3", "t": "皆属于心；"}, {"f": "audio/d8/school-sch-nj-66__15.mp3", "t": "诸厥固泄，"}, {"f": "audio/d8/school-sch-nj-66__16.mp3", "t": "皆属于下；"}, {"f": "audio/d8/school-sch-nj-66__17.mp3", "t": "诸痿喘呕，"}, {"f": "audio/d8/school-sch-nj-66__18.mp3", "t": "皆属于上；"}, {"f": "audio/d8/school-sch-nj-66__19.mp3", "t": "诸禁鼓栗，"}, {"f": "audio/d8/school-sch-nj-66__20.mp3", "t": "如丧神守，"}, {"f": "audio/d8/school-sch-nj-66__21.mp3", "t": "皆属于火；"}, {"f": "audio/d8/school-sch-nj-66__22.mp3", "t": "诸痉项强，"}, {"f": "audio/d8/school-sch-nj-66__23.mp3", "t": "皆属于湿；"}, {"f": "audio/d8/school-sch-nj-66__24.mp3", "t": "诸逆冲上，"}, {"f": "audio/d8/school-sch-nj-66__25.mp3", "t": "皆属于火；"}, {"f": "audio/d8/school-sch-nj-66__26.mp3", "t": "诸胀腹大，"}, {"f": "audio/d8/school-sch-nj-66__27.mp3", "t": "皆属于热；"}, {"f": "audio/d8/school-sch-nj-66__28.mp3", "t": "诸躁狂越，"}, {"f": "audio/d8/school-sch-nj-66__29.mp3", "t": "皆属于火；"}, {"f": "audio/d8/school-sch-nj-66__30.mp3", "t": "诸暴强直，"}, {"f": "audio/d8/school-sch-nj-66__31.mp3", "t": "皆属于风；"}, {"f": "audio/d8/school-sch-nj-66__32.mp3", "t": "诸病有声，"}, {"f": "audio/d8/school-sch-nj-66__33.mp3", "t": "鼓之如鼓，"}, {"f": "audio/d8/school-sch-nj-66__34.mp3", "t": "皆属于热；"}, {"f": "audio/d8/school-sch-nj-66__35.mp3", "t": "诸病胕肿，"}, {"f": "audio/d8/school-sch-nj-66__36.mp3", "t": "疼酸惊骇，"}, {"f": "audio/d8/school-sch-nj-66__37.mp3", "t": "皆属于火；"}, {"f": "audio/d8/school-sch-nj-66__38.mp3", "t": "诸转反戾，"}, {"f": "audio/d8/school-sch-nj-66__39.mp3", "t": "水液浑浊，"}, {"f": "audio/d8/school-sch-nj-66__40.mp3", "t": "皆属于热；"}, {"f": "audio/d8/school-sch-nj-66__41.mp3", "t": "诸病水液，"}, {"f": "audio/d8/school-sch-nj-66__42.mp3", "t": "澄澈清冷，"}, {"f": "audio/d8/school-sch-nj-66__43.mp3", "t": "皆属于寒；"}, {"f": "audio/d8/school-sch-nj-66__44.mp3", "t": "诸呕吐酸，"}, {"f": "audio/d8/school-sch-nj-66__45.mp3", "t": "暴注下迫，"}, {"f": "audio/d8/school-sch-nj-66__46.mp3", "t": "皆属于热。"}, {"f": "audio/d8/school-sch-nj-66__47.mp3", "t": "故《大要》曰："}, {"f": "audio/d8/school-sch-nj-66__48.mp3", "t": "谨守病机，"}, {"f": "audio/d8/school-sch-nj-66__49.mp3", "t": "各司其属，"}, {"f": "audio/d8/school-sch-nj-66__50.mp3", "t": "有者求之，"}, {"f": "audio/d8/school-sch-nj-66__51.mp3", "t": "无者求之，"}, {"f": "audio/d8/school-sch-nj-66__52.mp3", "t": "盛者责之，"}, {"f": "audio/d8/school-sch-nj-66__53.mp3", "t": "虚者责之，"}, {"f": "audio/d8/school-sch-nj-66__54.mp3", "t": "必先五藏，"}, {"f": "audio/d8/school-sch-nj-66__55.mp3", "t": "疏其血气，"}, {"f": "audio/d8/school-sch-nj-66__56.mp3", "t": "令其调达，"}, {"f": "audio/d8/school-sch-nj-66__57.mp3", "t": "而致和平，"}, {"f": "audio/d8/school-sch-nj-66__58.mp3", "t": "此之谓也。"}], "school-sch-nj-67": [{"f": "audio/4c/school-sch-nj-67__0.mp3", "t": "帝曰："}, {"f": "audio/4c/school-sch-nj-67__1.mp3", "t": "何谓逆从？"}, {"f": "audio/4c/school-sch-nj-67__2.mp3", "t": "岐伯曰："}, {"f": "audio/4c/school-sch-nj-67__3.mp3", "t": "逆者正治，"}, {"f": "audio/4c/school-sch-nj-67__4.mp3", "t": "从者反治，"}, {"f": "audio/4c/school-sch-nj-67__5.mp3", "t": "从少从多，"}, {"f": "audio/4c/school-sch-nj-67__6.mp3", "t": "观其事也。"}, {"f": "audio/4c/school-sch-nj-67__7.mp3", "t": "帝曰："}, {"f": "audio/4c/school-sch-nj-67__8.mp3", "t": "反治何谓？"}, {"f": "audio/4c/school-sch-nj-67__9.mp3", "t": "岐伯曰："}, {"f": "audio/4c/school-sch-nj-67__10.mp3", "t": "热因寒用，"}, {"f": "audio/4c/school-sch-nj-67__11.mp3", "t": "寒因热用，"}, {"f": "audio/4c/school-sch-nj-67__12.mp3", "t": "塞因塞用，"}, {"f": "audio/4c/school-sch-nj-67__13.mp3", "t": "通因通用，"}, {"f": "audio/4c/school-sch-nj-67__14.mp3", "t": "必伏其所主，"}, {"f": "audio/4c/school-sch-nj-67__15.mp3", "t": "而先其所因，"}, {"f": "audio/4c/school-sch-nj-67__16.mp3", "t": "其始则同，"}, {"f": "audio/4c/school-sch-nj-67__17.mp3", "t": "其终则异，"}, {"f": "audio/4c/school-sch-nj-67__18.mp3", "t": "可使破积，"}, {"f": "audio/4c/school-sch-nj-67__19.mp3", "t": "可使气和，"}, {"f": "audio/4c/school-sch-nj-67__20.mp3", "t": "可使必已。"}, {"f": "audio/4c/school-sch-nj-67__21.mp3", "t": "帝曰："}, {"f": "audio/4c/school-sch-nj-67__22.mp3", "t": "善。"}, {"f": "audio/4c/school-sch-nj-67__23.mp3", "t": "气调而得者，"}, {"f": "audio/4c/school-sch-nj-67__24.mp3", "t": "何如？"}, {"f": "audio/4c/school-sch-nj-67__25.mp3", "t": "岐伯曰："}, {"f": "audio/4c/school-sch-nj-67__26.mp3", "t": "逆之，"}, {"f": "audio/4c/school-sch-nj-67__27.mp3", "t": "从之，"}, {"f": "audio/4c/school-sch-nj-67__28.mp3", "t": "逆而从之，"}, {"f": "audio/4c/school-sch-nj-67__29.mp3", "t": "从而逆之，"}, {"f": "audio/4c/school-sch-nj-67__30.mp3", "t": "疏气令调，"}, {"f": "audio/4c/school-sch-nj-67__31.mp3", "t": "则其道也。"}], "school-sch-nj-68": [{"f": "audio/3e/school-sch-nj-68__0.mp3", "t": "帝曰："}, {"f": "audio/3e/school-sch-nj-68__1.mp3", "t": "论言治寒以热，"}, {"f": "audio/3e/school-sch-nj-68__2.mp3", "t": "治热以寒，"}, {"f": "audio/3e/school-sch-nj-68__3.mp3", "t": "而方士不能废绳墨而更其道也。"}, {"f": "audio/3e/school-sch-nj-68__4.mp3", "t": "有病热者，"}, {"f": "audio/3e/school-sch-nj-68__5.mp3", "t": "寒之而热；"}, {"f": "audio/3e/school-sch-nj-68__6.mp3", "t": "有病寒者，"}, {"f": "audio/3e/school-sch-nj-68__7.mp3", "t": "热之而寒。"}, {"f": "audio/3e/school-sch-nj-68__8.mp3", "t": "二者皆在，"}, {"f": "audio/3e/school-sch-nj-68__9.mp3", "t": "新病复起，"}, {"f": "audio/3e/school-sch-nj-68__10.mp3", "t": "奈何治？"}, {"f": "audio/3e/school-sch-nj-68__11.mp3", "t": "岐伯曰："}, {"f": "audio/3e/school-sch-nj-68__12.mp3", "t": "诸寒之而热者取之阴，"}, {"f": "audio/3e/school-sch-nj-68__13.mp3", "t": "热之而寒者取之阳，"}, {"f": "audio/3e/school-sch-nj-68__14.mp3", "t": "所谓求其属也。"}], "school-sch-nj-69": [{"f": "audio/e8/school-sch-nj-69__0.mp3", "t": "黄帝问曰："}, {"f": "audio/e8/school-sch-nj-69__1.mp3", "t": "余闻《刺法》言，"}, {"f": "audio/e8/school-sch-nj-69__2.mp3", "t": "有余泻之，"}, {"f": "audio/e8/school-sch-nj-69__3.mp3", "t": "不足补之。"}, {"f": "audio/e8/school-sch-nj-69__4.mp3", "t": "何谓有余，"}, {"f": "audio/e8/school-sch-nj-69__5.mp3", "t": "何谓不足？"}, {"f": "audio/e8/school-sch-nj-69__6.mp3", "t": "岐伯对曰："}, {"f": "audio/e8/school-sch-nj-69__7.mp3", "t": "有余有五，"}, {"f": "audio/e8/school-sch-nj-69__8.mp3", "t": "不足亦有五。"}, {"f": "audio/e8/school-sch-nj-69__9.mp3", "t": "帝欲何问？"}, {"f": "audio/e8/school-sch-nj-69__10.mp3", "t": "帝曰："}, {"f": "audio/e8/school-sch-nj-69__11.mp3", "t": "愿尽闻之。"}, {"f": "audio/e8/school-sch-nj-69__12.mp3", "t": "岐伯曰："}, {"f": "audio/e8/school-sch-nj-69__13.mp3", "t": "神有余有不足；"}, {"f": "audio/e8/school-sch-nj-69__14.mp3", "t": "气有余有不足，"}, {"f": "audio/e8/school-sch-nj-69__15.mp3", "t": "血有余有不足，"}, {"f": "audio/e8/school-sch-nj-69__16.mp3", "t": "形有余有不足，"}, {"f": "audio/e8/school-sch-nj-69__17.mp3", "t": "志有余有不足。"}, {"f": "audio/e8/school-sch-nj-69__18.mp3", "t": "凡此十者，"}, {"f": "audio/e8/school-sch-nj-69__19.mp3", "t": "其气不等也。"}, {"f": "audio/e8/school-sch-nj-69__20.mp3", "t": "帝曰："}, {"f": "audio/e8/school-sch-nj-69__21.mp3", "t": "人有精气、"}, {"f": "audio/e8/school-sch-nj-69__22.mp3", "t": "津液，"}, {"f": "audio/e8/school-sch-nj-69__23.mp3", "t": "四支、"}, {"f": "audio/e8/school-sch-nj-69__24.mp3", "t": "九窍、"}, {"f": "audio/e8/school-sch-nj-69__25.mp3", "t": "五藏、"}, {"f": "audio/e8/school-sch-nj-69__26.mp3", "t": "十六部、"}, {"f": "audio/e8/school-sch-nj-69__27.mp3", "t": "三百六十五节，"}, {"f": "audio/e8/school-sch-nj-69__28.mp3", "t": "乃生百病。"}, {"f": "audio/e8/school-sch-nj-69__29.mp3", "t": "百病之生，"}, {"f": "audio/e8/school-sch-nj-69__30.mp3", "t": "皆有虚实。"}, {"f": "audio/e8/school-sch-nj-69__31.mp3", "t": "今夫子乃言有余有五，"}, {"f": "audio/e8/school-sch-nj-69__32.mp3", "t": "不足亦有五，"}, {"f": "audio/e8/school-sch-nj-69__33.mp3", "t": "何以生之乎？"}, {"f": "audio/e8/school-sch-nj-69__34.mp3", "t": "岐伯曰："}, {"f": "audio/e8/school-sch-nj-69__35.mp3", "t": "皆生于五藏也。"}, {"f": "audio/e8/school-sch-nj-69__36.mp3", "t": "夫心藏神，"}, {"f": "audio/e8/school-sch-nj-69__37.mp3", "t": "肺藏气，"}, {"f": "audio/e8/school-sch-nj-69__38.mp3", "t": "肝藏血，"}, {"f": "audio/e8/school-sch-nj-69__39.mp3", "t": "脾藏肉，"}, {"f": "audio/e8/school-sch-nj-69__40.mp3", "t": "肾藏志，"}, {"f": "audio/e8/school-sch-nj-69__41.mp3", "t": "而此成形。"}, {"f": "audio/e8/school-sch-nj-69__42.mp3", "t": "志意通，"}, {"f": "audio/e8/school-sch-nj-69__43.mp3", "t": "内连骨髓，"}, {"f": "audio/e8/school-sch-nj-69__44.mp3", "t": "而成身形五藏。"}, {"f": "audio/e8/school-sch-nj-69__45.mp3", "t": "五藏之道，"}, {"f": "audio/e8/school-sch-nj-69__46.mp3", "t": "皆出于经隧，"}, {"f": "audio/e8/school-sch-nj-69__47.mp3", "t": "以行血气，"}, {"f": "audio/e8/school-sch-nj-69__48.mp3", "t": "血气不和，"}, {"f": "audio/e8/school-sch-nj-69__49.mp3", "t": "百病乃变化而生，"}, {"f": "audio/e8/school-sch-nj-69__50.mp3", "t": "是故守经隧焉。"}], "school-sch-nj-70": [{"f": "audio/2f/school-sch-nj-70__0.mp3", "t": "帝曰："}, {"f": "audio/2f/school-sch-nj-70__1.mp3", "t": "经言阳虚则外寒，"}, {"f": "audio/2f/school-sch-nj-70__2.mp3", "t": "阴虚则内热，"}, {"f": "audio/2f/school-sch-nj-70__3.mp3", "t": "阳盛则外热，"}, {"f": "audio/2f/school-sch-nj-70__4.mp3", "t": "阴盛则内寒，"}, {"f": "audio/2f/school-sch-nj-70__5.mp3", "t": "余已闻之矣，"}, {"f": "audio/2f/school-sch-nj-70__6.mp3", "t": "不知其所由然也。"}, {"f": "audio/2f/school-sch-nj-70__7.mp3", "t": "岐伯曰："}, {"f": "audio/2f/school-sch-nj-70__8.mp3", "t": "阳受气于上焦，"}, {"f": "audio/2f/school-sch-nj-70__9.mp3", "t": "以温皮肤分肉之间。"}, {"f": "audio/2f/school-sch-nj-70__10.mp3", "t": "令寒气在外，"}, {"f": "audio/2f/school-sch-nj-70__11.mp3", "t": "则上焦不通，"}, {"f": "audio/2f/school-sch-nj-70__12.mp3", "t": "上焦不通，"}, {"f": "audio/2f/school-sch-nj-70__13.mp3", "t": "则寒气独留于外，"}, {"f": "audio/2f/school-sch-nj-70__14.mp3", "t": "故寒栗。"}, {"f": "audio/2f/school-sch-nj-70__15.mp3", "t": "帝曰："}, {"f": "audio/2f/school-sch-nj-70__16.mp3", "t": "阴虚生内热奈何？"}, {"f": "audio/2f/school-sch-nj-70__17.mp3", "t": "岐伯曰："}, {"f": "audio/2f/school-sch-nj-70__18.mp3", "t": "有所劳倦，"}, {"f": "audio/2f/school-sch-nj-70__19.mp3", "t": "形气衰少，"}, {"f": "audio/2f/school-sch-nj-70__20.mp3", "t": "谷气不盛，"}, {"f": "audio/2f/school-sch-nj-70__21.mp3", "t": "上焦不行，"}, {"f": "audio/2f/school-sch-nj-70__22.mp3", "t": "下脘不通，"}, {"f": "audio/2f/school-sch-nj-70__23.mp3", "t": "胃气热，"}, {"f": "audio/2f/school-sch-nj-70__24.mp3", "t": "热气熏胸中，"}, {"f": "audio/2f/school-sch-nj-70__25.mp3", "t": "故内热。"}, {"f": "audio/2f/school-sch-nj-70__26.mp3", "t": "帝曰："}, {"f": "audio/2f/school-sch-nj-70__27.mp3", "t": "阳盛生外热奈何？"}, {"f": "audio/2f/school-sch-nj-70__28.mp3", "t": "岐伯曰："}, {"f": "audio/2f/school-sch-nj-70__29.mp3", "t": "上焦不通利，"}, {"f": "audio/2f/school-sch-nj-70__30.mp3", "t": "则皮肤致密，"}, {"f": "audio/2f/school-sch-nj-70__31.mp3", "t": "腠理闭塞，"}, {"f": "audio/2f/school-sch-nj-70__32.mp3", "t": "玄府不通，"}, {"f": "audio/2f/school-sch-nj-70__33.mp3", "t": "卫气不得泄越，"}, {"f": "audio/2f/school-sch-nj-70__34.mp3", "t": "故外热。"}, {"f": "audio/2f/school-sch-nj-70__35.mp3", "t": "帝曰："}, {"f": "audio/2f/school-sch-nj-70__36.mp3", "t": "阴盛生内寒奈何？"}, {"f": "audio/2f/school-sch-nj-70__37.mp3", "t": "岐伯曰："}, {"f": "audio/2f/school-sch-nj-70__38.mp3", "t": "厥气上逆，"}, {"f": "audio/2f/school-sch-nj-70__39.mp3", "t": "寒气积于胃中而不写，"}, {"f": "audio/2f/school-sch-nj-70__40.mp3", "t": "不写则温气去，"}, {"f": "audio/2f/school-sch-nj-70__41.mp3", "t": "寒独留，"}, {"f": "audio/2f/school-sch-nj-70__42.mp3", "t": "则血凝泣，"}, {"f": "audio/2f/school-sch-nj-70__43.mp3", "t": "凝则脉不通，"}, {"f": "audio/2f/school-sch-nj-70__44.mp3", "t": "其脉盛大以涩，"}, {"f": "audio/2f/school-sch-nj-70__45.mp3", "t": "故中寒。"}], "school-sch-nj-71": [{"f": "audio/a8/school-sch-nj-71__0.mp3", "t": "黄帝问曰："}, {"f": "audio/a8/school-sch-nj-71__1.mp3", "t": "今夫热病者，"}, {"f": "audio/a8/school-sch-nj-71__2.mp3", "t": "皆伤寒之类也，"}, {"f": "audio/a8/school-sch-nj-71__3.mp3", "t": "或愈或死，"}, {"f": "audio/a8/school-sch-nj-71__4.mp3", "t": "其死皆以六七日之间，"}, {"f": "audio/a8/school-sch-nj-71__5.mp3", "t": "其愈皆以十日以上者，"}, {"f": "audio/a8/school-sch-nj-71__6.mp3", "t": "何也？"}, {"f": "audio/a8/school-sch-nj-71__7.mp3", "t": "不知其解，"}, {"f": "audio/a8/school-sch-nj-71__8.mp3", "t": "愿闻其故。"}], "school-sch-nj-72": [{"f": "audio/0d/school-sch-nj-72__0.mp3", "t": "岐伯对曰："}, {"f": "audio/0d/school-sch-nj-72__1.mp3", "t": "巨阳者，"}, {"f": "audio/0d/school-sch-nj-72__2.mp3", "t": "诸阳之属也。"}, {"f": "audio/0d/school-sch-nj-72__3.mp3", "t": "其脉连于风府，"}, {"f": "audio/0d/school-sch-nj-72__4.mp3", "t": "故为诸阳主气也。"}, {"f": "audio/0d/school-sch-nj-72__5.mp3", "t": "人之伤于寒也，"}, {"f": "audio/0d/school-sch-nj-72__6.mp3", "t": "则为病热，"}, {"f": "audio/0d/school-sch-nj-72__7.mp3", "t": "热虽甚不死，"}, {"f": "audio/0d/school-sch-nj-72__8.mp3", "t": "其两感于寒而病者，"}, {"f": "audio/0d/school-sch-nj-72__9.mp3", "t": "必不免于死。"}], "school-sch-nj-73": [{"f": "audio/56/school-sch-nj-73__0.mp3", "t": "帝曰："}, {"f": "audio/56/school-sch-nj-73__1.mp3", "t": "愿闻其状。"}, {"f": "audio/56/school-sch-nj-73__2.mp3", "t": "岐伯曰："}, {"f": "audio/56/school-sch-nj-73__3.mp3", "t": "伤寒一日，"}, {"f": "audio/56/school-sch-nj-73__4.mp3", "t": "巨阳受之，"}, {"f": "audio/56/school-sch-nj-73__5.mp3", "t": "故头项痛，"}, {"f": "audio/56/school-sch-nj-73__6.mp3", "t": "腰脊强。"}, {"f": "audio/56/school-sch-nj-73__7.mp3", "t": "二日，"}, {"f": "audio/56/school-sch-nj-73__8.mp3", "t": "阳明受之，"}, {"f": "audio/56/school-sch-nj-73__9.mp3", "t": "阳明主肉，"}, {"f": "audio/56/school-sch-nj-73__10.mp3", "t": "其脉挟鼻络于目，"}, {"f": "audio/56/school-sch-nj-73__11.mp3", "t": "故身热目疼而鼻干，"}, {"f": "audio/56/school-sch-nj-73__12.mp3", "t": "不得卧也。"}, {"f": "audio/56/school-sch-nj-73__13.mp3", "t": "三日，"}, {"f": "audio/56/school-sch-nj-73__14.mp3", "t": "少阳受之，"}, {"f": "audio/56/school-sch-nj-73__15.mp3", "t": "少阳主胆，"}, {"f": "audio/56/school-sch-nj-73__16.mp3", "t": "其脉循胁络于耳，"}, {"f": "audio/56/school-sch-nj-73__17.mp3", "t": "故胸胁痛而耳聋。"}, {"f": "audio/56/school-sch-nj-73__18.mp3", "t": "三阳经络皆受其病，"}, {"f": "audio/56/school-sch-nj-73__19.mp3", "t": "而未入于藏者，"}, {"f": "audio/56/school-sch-nj-73__20.mp3", "t": "故可汗而已。"}, {"f": "audio/56/school-sch-nj-73__21.mp3", "t": "四日，"}, {"f": "audio/56/school-sch-nj-73__22.mp3", "t": "太阴受之，"}, {"f": "audio/56/school-sch-nj-73__23.mp3", "t": "太阴脉布胃中络于嗌，"}, {"f": "audio/56/school-sch-nj-73__24.mp3", "t": "故腹满而嗌干。"}, {"f": "audio/56/school-sch-nj-73__25.mp3", "t": "五日，"}, {"f": "audio/56/school-sch-nj-73__26.mp3", "t": "少阴受之，"}, {"f": "audio/56/school-sch-nj-73__27.mp3", "t": "少阴脉贯脊络于肺，"}, {"f": "audio/56/school-sch-nj-73__28.mp3", "t": "系舌本，"}, {"f": "audio/56/school-sch-nj-73__29.mp3", "t": "故口燥舌干而渴。"}, {"f": "audio/56/school-sch-nj-73__30.mp3", "t": "六日，"}, {"f": "audio/56/school-sch-nj-73__31.mp3", "t": "厥阴受之，"}, {"f": "audio/56/school-sch-nj-73__32.mp3", "t": "厥阴脉循阴器而络于肝，"}, {"f": "audio/56/school-sch-nj-73__33.mp3", "t": "故烦满而囊缩。"}, {"f": "audio/56/school-sch-nj-73__34.mp3", "t": "三阴三阳，"}, {"f": "audio/56/school-sch-nj-73__35.mp3", "t": "五藏六府皆受病，"}, {"f": "audio/56/school-sch-nj-73__36.mp3", "t": "营卫不行，"}, {"f": "audio/56/school-sch-nj-73__37.mp3", "t": "五藏不通，"}, {"f": "audio/56/school-sch-nj-73__38.mp3", "t": "则死矣。"}], "school-sch-nj-74": [{"f": "audio/72/school-sch-nj-74__0.mp3", "t": "其不两感于寒者，"}, {"f": "audio/72/school-sch-nj-74__1.mp3", "t": "七日，"}, {"f": "audio/72/school-sch-nj-74__2.mp3",
